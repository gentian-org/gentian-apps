version: 2
# One grouped pull request per ecosystem and week. The version comment
# beside each pinned Action or base image is what Dependabot reads and
# rewrites. Security updates are opened as they appear, outside the groups.
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/image
      - /.github/actions/chart
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /apps/_template/backend
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /images/nextcloud-mcp
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - /apps/_template/frontend
      - /images/gentian-sidecar-sso-saml
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Base images, pinned by digest. Nextcloud's and XWiki's final stages take
  # the upstream version as a build argument and stay on tags; their build
  # stages are pinned.
  - package-ecosystem: docker
    directories:
      - /apps/_template/backend
      - /apps/_template/frontend
      - /images/gentian-sidecar-git-modules
      - /images/gentian-sidecar-sso-saml
      - /images/nextcloud-mcp
      - /images/xwiki
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
