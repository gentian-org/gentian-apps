name: Container image
description: >
  Builds one image with Buildx and, when asked to publish, pushes it to the
  registry under every ref given. A job passes the directory and the refs;
  the registry comes from the workflow's REGISTRY.
inputs:
  dir:
    description: Directory holding the Dockerfile; also the build context.
    required: true
  refs:
    description: Full image references, one per line.
    required: true
  args:
    description: Build arguments, one NAME=value per line.
    required: false
    default: ""
  platforms:
    description: Target platforms, comma-separated.
    required: false
    default: linux/amd64
  emulate:
    description: >
      Architectures to emulate with QEMU, comma-separated. Empty builds on the
      runner's own architecture only, which is all an amd64 image needs.
    required: false
    default: ""
  develop-tag:
    description: >
      Set on a develop build, to `develop-<sha7>`. Every ref given is then
      published under that one tag instead of its own: `refs` are the names a
      RELEASE goes out under (a version, `latest`), and a build of the branch
      work lands on must never write to one of them. Empty publishes `refs`
      as given.
    required: false
    default: ""
  publish:
    description: '"true" pushes the image; anything else only builds it.'
    required: true
runs:
  using: composite
  steps:
    - name: Emulation
      if: inputs.emulate != ''
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      with:
        platforms: ${{ inputs.emulate }}

    - name: Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

    - name: Registry login
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Refs
      id: refs
      shell: bash
      env:
        REFS: ${{ inputs.refs }}
        DEVELOP_TAG: ${{ inputs.develop-tag }}
      run: |
        # A ref is <repository>:<tag>; the tag is what follows the last colon.
        # On a develop build each repository keeps one ref, at the develop tag.
        {
          echo "refs<<__REFS__"
          if [ -n "${DEVELOP_TAG}" ]; then
            printf '%s\n' "${REFS}" | sed -E '/^[[:space:]]*$/d; s/^[[:space:]]+//; s/:[^:/]+[[:space:]]*$//' \
              | sort -u | sed "s|\$|:${DEVELOP_TAG}|"
          else
            printf '%s\n' "${REFS}"
          fi
          echo "__REFS__"
        } >> "$GITHUB_OUTPUT"

    - name: Build
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        # An SBOM and a SLSA provenance attestation travel with the image
        # (certification plan C5).
        sbom: true
        provenance: mode=max
        context: ${{ inputs.dir }}
        tags: ${{ steps.refs.outputs.refs }}
        build-args: ${{ inputs.args }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.publish == 'true' }}

    # The published image, signed with the calling workflow's identity and
    # scanned (certification plan C5). Only where the build pushed. One
    # signature per repository name the digest went out under. The scan is
    # advisory until the backlog it finds is triaged; dropping
    # continue-on-error makes it block.
    - name: Names
      if: inputs.publish == 'true'
      id: names
      shell: bash
      env:
        REFS: ${{ steps.refs.outputs.refs }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        repos="$(printf '%s\n' "${REFS}" | sed -E '/^[[:space:]]*$/d; s/^[[:space:]]+//; s/:[^:/]+[[:space:]]*$//' | sort -u)"
        {
          echo "repos<<__REPOS__"; printf '%s\n' "${repos}"; echo "__REPOS__"
          echo "first=$(printf '%s\n' "${repos}" | head -n1)@${DIGEST}"
        } >> "$GITHUB_OUTPUT"
    - name: Install cosign
      if: inputs.publish == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
    # --new-bundle-format=false: cosign 3 stores a signature as a Sigstore bundle
    # behind the OCI referrers API by default; the cluster's Kyverno 1.13 verifies
    # the legacy form, a sha256-<digest>.sig tag, with its default verifier. The
    # bundle form returns with the Kyverno upgrade (certification plan C5).
    # --use-signing-config=false goes with it: the TUF signing config is only
    # for the bundle form, and cosign refuses the legacy form while it is on.
    - name: Sign
      if: inputs.publish == 'true'
      shell: bash
      env:
        REPOS: ${{ steps.names.outputs.repos }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        printf '%s\n' "${REPOS}" | while read -r repo; do
          [ -n "${repo}" ] && cosign sign --yes --new-bundle-format=false --use-signing-config=false "${repo}@${DIGEST}"
        done
    - name: Scan
      if: inputs.publish == 'true'
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        image-ref: ${{ steps.names.outputs.first }}
        severity: HIGH,CRITICAL
        exit-code: "1"
        ignore-unfixed: true
