name: Container image
description: >
  Builds one image with Buildx and, when asked to publish, pushes it to the
  registry under every ref given. A job passes the directory and the refs;
  the registry comes from the workflow's REGISTRY.
inputs:
  dir:
    description: Directory holding the Dockerfile; also the build context.
    required: true
  refs:
    description: Full image references, one per line.
    required: true
  args:
    description: Build arguments, one NAME=value per line.
    required: false
    default: ""
  platforms:
    description: Target platforms, comma-separated.
    required: false
    default: linux/amd64
  emulate:
    description: >
      Architectures to emulate with QEMU, comma-separated. Empty builds on the
      runner's own architecture only, which is all an amd64 image needs.
    required: false
    default: ""
  publish:
    description: '"true" pushes the image; anything else only builds it.'
    required: true
runs:
  using: composite
  steps:
    - name: Emulation
      if: inputs.emulate != ''
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ inputs.emulate }}

    - name: Buildx
      uses: docker/setup-buildx-action@v3

    - name: Registry login
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.dir }}
        tags: ${{ inputs.refs }}
        build-args: ${{ inputs.args }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.publish == 'true' }}
