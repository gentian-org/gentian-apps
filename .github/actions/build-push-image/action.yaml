name: Build and push image
description: >
  GHCR login + Buildx (+ optional QEMU) + docker/build-push-action, so each
  app job only has to supply what actually differs between apps: context,
  tags, build-args, and — for an interpreted-language image like a Python or
  Node one — the extra emulated arch when it needs one.
inputs:
  context:
    required: true
  image-tags:
    description: Newline-separated list of full image refs to tag/push.
    required: true
  build-args:
    required: false
    default: ""
  platforms:
    description: >
      Comma-separated platform list for docker/build-push-action. Leave at
      the default for a single-arch (amd64) build.
    required: false
    default: linux/amd64
  qemu-arch:
    description: >
      Extra QEMU-emulated arch to register (e.g. arm64). Leave empty to skip
      the QEMU step — only set this when platforms names a foreign arch the
      runner can't build natively (a compiled-binary image that cross-compiles
      via TARGETARCH, like gentian-os's, never needs this).
    required: false
    default: ""
  push:
    required: true
runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set up QEMU
      if: inputs.qemu-arch != ''
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ inputs.qemu-arch }}

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        platforms: ${{ inputs.platforms }}
        build-args: ${{ inputs.build-args }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.image-tags }}
