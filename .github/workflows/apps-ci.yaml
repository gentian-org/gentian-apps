name: Apps CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "profiles/**"
      - "images/**"
      - ".github/workflows/apps-ci.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "profiles/**"
      - "images/**"

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: gentian-org

jobs:
  build-app-store:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app-store release versions
        id: versions
        run: |
          IMAGE_TAG=$(grep 'tag:' apps/app-store/chart/values.yaml | head -1 | awk '{print $2}' | tr -d '"')
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/app-store/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/app-store-api:${{ steps.versions.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/app-store-api:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/app-store/frontend
          build-args: |
            VITE_AUTH_DISABLED=true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/app-store-web:${{ steps.versions.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/app-store-web:${{ github.sha }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push chart
        if: github.event_name != 'pull_request'
        run: |
          CHART_VERSION=$(grep '^version:' apps/app-store/chart/Chart.yaml | awk '{print $2}')
          helm package apps/app-store/chart -d /tmp
          helm push "/tmp/app-store-${CHART_VERSION}.tgz" oci://${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/charts

  build-nextcloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read nextcloud bundle versions
        id: versions
        run: |
          # shellcheck disable=SC1091
          source images/nextcloud/versions.env
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "nextcloud_version=${NEXTCLOUD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "richdocuments_version=${RICHDOCUMENTS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "user_oidc_version=${USER_OIDC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Nextcloud bundle image
        uses: docker/build-push-action@v6
        with:
          context: images/nextcloud
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXTCLOUD_VERSION=${{ steps.versions.outputs.nextcloud_version }}
            RICHDOCUMENTS_VERSION=${{ steps.versions.outputs.richdocuments_version }}
            USER_OIDC_VERSION=${{ steps.versions.outputs.user_oidc_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/nextcloud:${{ steps.versions.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/nextcloud:${{ github.sha }}

  build-xwiki:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read xwiki bundle versions
        id: versions
        run: |
          # shellcheck disable=SC1091
          source images/xwiki/versions.env
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "xwiki_version=${XWIKI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "flavor_xip_sha256=${FLAVOR_XIP_SHA256}" >> "$GITHUB_OUTPUT"
          echo "oidc_version=${OIDC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push XWiki bundle image
        uses: docker/build-push-action@v6
        with:
          context: images/xwiki
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            XWIKI_VERSION=${{ steps.versions.outputs.xwiki_version }}
            FLAVOR_XIP_SHA256=${{ steps.versions.outputs.flavor_xip_sha256 }}
            OIDC_VERSION=${{ steps.versions.outputs.oidc_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/xwiki:${{ steps.versions.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/xwiki:${{ github.sha }}

  validate-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate profile bundles
        run: |
          for d in profiles/*/; do
            name="$(basename "$d")"
            echo "Checking profiles/${name}"
            test -f "${d}kustomization.yaml"
            if test -f "${d}profile.yaml"; then
              python3 -c "import yaml; yaml.safe_load(open('${d}profile.yaml'))"
            elif test -f "${d}catalog.yaml"; then
              python3 -c "import yaml; yaml.safe_load(open('${d}catalog.yaml'))"
            else
              echo "profiles/${name}: expected profile.yaml (AppProfile) or catalog.yaml (platform catalogue CR)" >&2
              exit 1
            fi
            kubectl kustomize "$d" >/dev/null
          done
      - name: Validate profile tile specs
        run: python3 scripts/validate-profile-tiles.py
