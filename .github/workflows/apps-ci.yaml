name: Apps CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "profiles/**"
      - "images/**"
      - "charts/odoo/**"
      - "charts/gentian-sidecar-git-modules/**"
      - "charts/activepieces/**"
      - ".github/workflows/apps-ci.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "profiles/**"
      - "images/**"
      - "charts/odoo/**"
      - "charts/gentian-sidecar-git-modules/**"
      - "charts/activepieces/**"

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: gentian-org

jobs:
  build-app-store:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app-store release versions
        id: versions
        run: |
          IMAGE_TAG=$(grep 'tag:' apps/app-store/chart/values.yaml | head -1 | awk '{print $2}' | tr -d '"')
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/app-store/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/app-store-api:${{ steps.versions.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/app-store-api:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/app-store/frontend
          build-args: |
            VITE_AUTH_DISABLED=true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/app-store-web:${{ steps.versions.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/app-store-web:${{ github.sha }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push chart
        if: github.event_name != 'pull_request'
        run: |
          CHART_VERSION=$(grep '^version:' apps/app-store/chart/Chart.yaml | awk '{print $2}')
          helm package apps/app-store/chart -d /tmp
          helm push "/tmp/app-store-${CHART_VERSION}.tgz" oci://${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/charts

  build-nextcloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [base, office, officeplus, suite]
    steps:
      - uses: actions/checkout@v4

      - name: Read nextcloud bundle versions
        id: versions
        run: |
          # shellcheck disable=SC1091
          source images/nextcloud/versions.env
          # Parse version and gentian suffix
          V_PART="${IMAGE_TAG%%-*}"
          G_PART="${IMAGE_TAG#*-}"
          echo "image_tag=${V_PART}-${{ matrix.target }}-${G_PART}" >> "$GITHUB_OUTPUT"
          echo "nextcloud_version=${NEXTCLOUD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "user_oidc_version=${USER_OIDC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "richdocuments_version=${RICHDOCUMENTS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "forms_version=${FORMS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mail_version=${MAIL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "calendar_version=${CALENDAR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "contacts_version=${CONTACTS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tasks_version=${TASKS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "deck_version=${DECK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "collectives_version=${COLLECTIVES_VERSION}" >> "$GITHUB_OUTPUT"
          echo "spreed_version=${SPREED_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Nextcloud bundle image
        uses: docker/build-push-action@v6
        with:
          context: images/nextcloud
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXTCLOUD_VERSION=${{ steps.versions.outputs.nextcloud_version }}
            USER_OIDC_VERSION=${{ steps.versions.outputs.user_oidc_version }}
            RICHDOCUMENTS_VERSION=${{ steps.versions.outputs.richdocuments_version }}
            FORMS_VERSION=${{ steps.versions.outputs.forms_version }}
            MAIL_VERSION=${{ steps.versions.outputs.mail_version }}
            CALENDAR_VERSION=${{ steps.versions.outputs.calendar_version }}
            CONTACTS_VERSION=${{ steps.versions.outputs.contacts_version }}
            TASKS_VERSION=${{ steps.versions.outputs.tasks_version }}
            DECK_VERSION=${{ steps.versions.outputs.deck_version }}
            COLLECTIVES_VERSION=${{ steps.versions.outputs.collectives_version }}
            SPREED_VERSION=${{ steps.versions.outputs.spreed_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/nextcloud:${{ steps.versions.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/nextcloud:${{ github.sha }}-${{ matrix.target }}

  build-nextcloud-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read chart version
        id: version
        run: |
          CHART_VERSION=$(grep '^version:' images/nextcloud-mcp/chart/Chart.yaml | awk '{print $2}')
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: images/nextcloud-mcp
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/nextcloud-mcp:${{ steps.version.outputs.chart_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/nextcloud-mcp:${{ github.sha }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push chart
        if: github.event_name != 'pull_request'
        run: |
          helm package images/nextcloud-mcp/chart -d /tmp
          helm push "/tmp/nextcloud-mcp-${{ steps.version.outputs.chart_version }}.tgz" oci://${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/charts

  build-xwiki:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read xwiki bundle versions
        id: versions
        run: |
          # shellcheck disable=SC1091
          source images/xwiki/versions.env
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "xwiki_version=${XWIKI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "flavor_xip_sha256=${FLAVOR_XIP_SHA256}" >> "$GITHUB_OUTPUT"
          echo "oidc_version=${OIDC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push XWiki bundle image
        uses: docker/build-push-action@v6
        with:
          context: images/xwiki
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            XWIKI_VERSION=${{ steps.versions.outputs.xwiki_version }}
            FLAVOR_XIP_SHA256=${{ steps.versions.outputs.flavor_xip_sha256 }}
            OIDC_VERSION=${{ steps.versions.outputs.oidc_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/xwiki:${{ steps.versions.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/xwiki:${{ github.sha }}

  validate-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate profile bundles
        run: |
          # Bundles are discovered by kustomization.yaml at any depth, matching the
          # gentian-catalogue ApplicationSet's files generator. Singletons live at
          # profiles/<name>/, multi-profile families at profiles/<family>/<name>/.
          found=0
          while IFS= read -r k; do
            d="$(dirname "$k")"
            name="$(basename "$d")"
            found=$((found + 1))
            echo "Checking ${d}"
            if test -f "${d}/profile.yaml"; then
              python3 -c "import yaml; yaml.safe_load(open('${d}/profile.yaml'))"
              # The ApplicationSet names each Application after the bundle's leaf
              # directory, so that name must equal the AppProfile it contains.
              # AppProfile is cluster-scoped, which makes leaf names globally
              # unique — but only while this invariant holds.
              cr="$(python3 -c "import yaml; print((yaml.safe_load(open('${d}/profile.yaml')).get('metadata') or {}).get('name',''))")"
              if [ "$cr" != "$name" ]; then
                echo "${d}: directory name '${name}' does not match AppProfile metadata.name '${cr}'" >&2
                echo "  The catalogue ApplicationSet derives Application names from the leaf" >&2
                echo "  directory; a mismatch silently decouples the Application from its CR." >&2
                exit 1
              fi
            elif test -f "${d}/catalog.yaml"; then
              python3 -c "import yaml; yaml.safe_load(open('${d}/catalog.yaml'))"
            else
              echo "${d}: expected profile.yaml (AppProfile) or catalog.yaml (platform catalogue CR)" >&2
              exit 1
            fi
            kubectl kustomize "$d" >/dev/null
          done < <(find profiles -name kustomization.yaml | sort)
          echo "Validated ${found} profile bundle(s)"

          # A profile.yaml with no kustomization.yaml beside it is invisible to the
          # ApplicationSet — it would silently never sync. Catch that here.
          orphans=0
          while IFS= read -r p; do
            d="$(dirname "$p")"
            if [ ! -f "${d}/kustomization.yaml" ]; then
              echo "${d}: profile.yaml without kustomization.yaml — this bundle would never be synced" >&2
              orphans=1
            fi
          done < <(find profiles -name profile.yaml | sort)
          exit "$orphans"
      - name: Validate profile tile specs
        run: python3 scripts/validate-profile-tiles.py
      - name: Validate customization ladder declarations and records
        run: python3 scripts/validate-customizations.py
      - name: Customization debt report
        run: python3 scripts/customization-debt-report.py >> "$GITHUB_STEP_SUMMARY"

  build-odoo-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push chart
        if: github.event_name != 'pull_request'
        run: |
          CHART_VERSION=$(grep '^version:' charts/odoo/Chart.yaml | awk '{print $2}')
          helm package charts/odoo -d /tmp
          helm push "/tmp/odoo-${CHART_VERSION}.tgz" oci://${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/charts

  build-activepieces-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      # The chart is not vendored: upstream is fetched at the pinned version and
      # the local patch series is applied on top. This step runs on pull requests
      # too — a series that no longer applies must fail review, not merge.
      - name: Build chart from pinned upstream + patch series
        id: build
        run: scripts/build-activepieces-chart.sh --out /tmp/ap-dist

      - name: Push chart
        if: github.event_name != 'pull_request'
        run: |
          # shellcheck source=/dev/null
          source charts/activepieces/UPSTREAM
          helm push "/tmp/ap-dist/activepieces-${CHART_VERSION}.tgz" \
            oci://${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/charts

  build-sso-saml-sidecar-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push chart
        if: github.event_name != 'pull_request'
        run: |
          CHART_VERSION=$(grep '^version:' charts/gentian-sidecar-sso-saml/Chart.yaml | awk '{print $2}')
          helm package charts/gentian-sidecar-sso-saml -d /tmp
          helm push "/tmp/gentian-sidecar-sso-saml-${CHART_VERSION}.tgz" oci://${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/charts

  build-git-modules-sidecar-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push chart
        if: github.event_name != 'pull_request'
        run: |
          CHART_VERSION=$(grep '^version:' charts/gentian-sidecar-git-modules/Chart.yaml | awk '{print $2}')
          helm package charts/gentian-sidecar-git-modules -d /tmp
          helm push "/tmp/gentian-sidecar-git-modules-${CHART_VERSION}.tgz" oci://${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/charts

  build-git-modules-sidecar-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: images/gentian-sidecar-git-modules
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/gentian-sidecar-git-modules:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/gentian-sidecar-git-modules:${{ github.sha }}

  build-sso-saml-sidecar-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: images/gentian-sidecar-sso-saml
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/sidecar-sso-saml:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/sidecar-sso-saml:${{ github.sha }}
