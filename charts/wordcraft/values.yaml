nameOverride: wordcraft
fullnameOverride: wordcraft-ce

replicaCount: 1

image:
  # Built by this repository from upstream's released web build (images/wordcraft):
  # upstream publishes no image. A develop build of this chart names the
  # same commit's develop-<sha7> image instead (pin-image-tag in CI).
  repository: ghcr.io/gentian-org/wordcraft
  tag: "0.18.1"
  pullPolicy: IfNotPresent

port: 8080

# The tenant's home for files (the platform's file-store contract). With an
# address and a scope, which the platform fills in once the tenant's
# administrator grants the contract, the app opens and saves there as the
# signed-in person. Without, files stay on the person's device.
home:
  # Where the home answers WebDAV. The platform fills it in.
  url: ""
  # The scope the app asks the tenant's realm a person's token for the home
  # with. The platform fills it in.
  scope: ""
  # The platform's Secret for this app: the client it asks the tenant's realm
  # with. Mounted as files; it may not exist yet.
  vouchingSecret: vouching-wordcraft-ce

# One small server for the app's files, the framing page and the file calls;
# the app runs in the browser.
resources:
  requests:
    cpu: "5m"
    memory: "16Mi"
  limits:
    cpu: "100m"
    memory: "64Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podLabels: {}
podAnnotations: {}

# The operator routes from the profile's spec.expose; the chart has no Ingress.
ingress:
  enabled: false
