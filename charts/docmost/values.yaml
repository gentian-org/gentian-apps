nameOverride: docmost
fullnameOverride: docmost-ce

replicaCount: 1

image:
  # Official image. No official Helm chart exists upstream (docker-compose /
  # raw-manifest only), so this is a first-party Gentian chart wrapping the
  # unmodified image — see profiles/docmost/docmost-ce/profile.yaml header.
  repository: docker.io/docmost/docmost
  tag: "0.95.0"
  pullPolicy: IfNotPresent

appUrl: ""
port: 3000

# Delivered as literal Helm values via valueMapping (profile.yaml) rather than
# secretKeyRef, matching the openproject-ce/activepieces-me convention — see
# docs/app-profile-guide.md §3. DATABASE_URL/REDIS_URL are single connection
# strings (Docmost has no discrete-field option), so they must be assembled at
# render time from these pieces; secretKeyRef can't do that composition.
database:
  host: ""
  port: 5432
  name: ""
  user: ""
  password: ""

# Dedicated in-pod Redis, NOT the shared kernel Redis.
#
# Docmost cannot use the kernel's per-app Redis ACL user: parseRedisUrl
# (apps/server/src/common/helpers/utils.ts) destructures only
# {hostname, port, password, ...} and drops the username entirely, so it always
# sends a bare AUTH <password>, authenticates as `default`, and dies with
# WRONGPASS. There is no REDIS_USERNAME env var and no config option anywhere in
# the codebase -- every consumer (BullMQ queues, ws adapter, throttler) goes
# through that same parser. Upstream ships a dedicated Redis per install in its
# own docker-compose, which is the assumption the code is written against, so
# this matches how Docmost is actually built and tested.
#
# REDIS_URL is a hard boot requirement (environment.validation.ts -- the only
# connection var without @IsOptional), so it cannot simply be omitted.
#
# Bound to 127.0.0.1 inside the pod's network namespace: unreachable from any
# other pod even in the same namespace, so it needs no password, no Service and
# no NetworkPolicy rule. Data is entirely ephemeral (job queues, sessions,
# cache) -- no PVC, nothing to back up.
redis:
  enabled: true
  port: 6379
  image:
    repository: docker.io/library/redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  # BullMQ stores job state here, so eviction would silently drop queued jobs.
  # noeviction makes memory pressure a visible error instead.
  maxmemory: "128mb"
  maxmemoryPolicy: noeviction
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "250m"
      memory: "192Mi"

s3:
  accessKeyId: ""
  secretAccessKey: ""
  region: us-east-1
  bucket: ""
  endpoint: ""
  forcePathStyle: true

smtp:
  host: ""
  port: 587
  username: ""
  password: ""
  secure: false
  fromAddress: ""

# Docmost's session-signing key (min. 32 chars). Must be pinned via
# secrets.generated: pods are ephemeral and an unpinned/regenerated value
# invalidates every session on restart (same rationale as Mathesar's
# SECRET_KEY — see charts/mathesar/values.yaml). The platform's sign-in
# sidecar signs sessions with the same key (see the profile's
# requires.services.identity.sidecar), which is how people get in: this
# chart runs nothing for sign-in itself.
appSecret: ""

telemetry:
  disabled: true

# Docmost defaults IFRAME_EMBED_ALLOWED to false, which makes it send
# X-Frame-Options: SAMEORIGIN on its own responses (see its
# common/helpers/security-headers.ts resolveFrameHeader). That header is
# incompatible with running inside the portal's WinBox iframe, and relying on
# the tenant gateway to strip it on every route is fragile.
#
# Setting this true with NO allowed origins is deliberate: resolveFrameHeader
# returns null in that case, so Docmost emits neither X-Frame-Options nor its
# own Content-Security-Policy, and the operator's single edge
# `frame-ancestors` policy stays authoritative. Listing origins here instead
# would make Docmost emit a second CSP header, and the browser enforces the
# intersection of both -- the double-CSP failure in
# docs/app-profile-guide.md §6b.
iframe:
  embedAllowed: true
  allowedOrigins: ""

resources:
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

podLabels: {}
podAnnotations: {}

# /app/data is only scratch space for import/export processing — actual file
# storage is S3 (kernelRequirements.storage.s3), so no PVC is needed by
# default; flip to true only if large imports need to survive a pod restart.
persistence:
  enabled: false
  size: "2Gi"
  storageClass: ""

# Chart never manages its own Ingress/HTTPRoute — the gentian-os operator
# creates the Gateway API route from AppProfile.spec.ingress.
ingress:
  enabled: false
