apiVersion: v1
kind: Service
metadata:
  name: {{ include "docmost.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "docmost.name" . }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "docmost.name" . }}
