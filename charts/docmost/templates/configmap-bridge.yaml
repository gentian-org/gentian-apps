{{- if .Values.bridge.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docmost.fullname" . }}-bridge
data:
  bridge.js: |
    // Internal-only companion for the gentian-sidecar-sso-saml sidecar.
    // Reachable only via the "docmost-ce" Service's "bridge" port (cluster
    // DNS, no public route) — POST /ensure-session {email, firstName,
    // lastName} -> {cookie}. Never touches Docmost's paid Enterprise SSO;
    // only Docmost's own free CE /api/auth/login + self-hosted invite API
    // (POST /api/workspace/invites/{create,link,accept}). See
    // profiles/docmost/docmost-ce/profile.yaml header for the full design.
    const http = require('http');
    const crypto = require('crypto');

    const DOCMOST_URL = process.env.DOCMOST_URL;
    const ADMIN_EMAIL = process.env.ADMIN_EMAIL;
    const ADMIN_PASSWORD = process.env.ADMIN_PASSWORD;
    const BRIDGE_SECRET = process.env.BRIDGE_SECRET;
    const WORKSPACE_NAME = process.env.WORKSPACE_NAME || 'Docmost';
    const TENANT_SPACE_NAME = process.env.TENANT_SPACE_NAME || WORKSPACE_NAME;
    const PORT = Number(process.env.PORT || 8090);
    const DATABASE_URL = process.env.DATABASE_URL;

    function stablePassword(email) {
      // Deterministic per-user password derived from BRIDGE_SECRET. Nobody
      // is ever shown this value; it only has to satisfy Docmost's own
      // >= 8 char rule (AcceptInviteDto/LoginDto).
      return crypto.createHmac('sha256', BRIDGE_SECRET)
        .update(`docmost-bridge:${email}`)
        .digest('hex')
        .slice(0, 32);
    }

    // Docmost wraps every JSON response as {data: …, success, status}. Reading
    // the payload fields directly off the top level silently yields undefined,
    // which surfaced as "no pending invitation found" for an invitation that
    // had in fact been created. Tolerates an unwrapped body too, so this does
    // not become a second thing to get wrong if the envelope ever changes.
    async function readJson(res) {
      const body = await res.json();
      return body && typeof body === 'object' && 'data' in body ? body.data : body;
    }

    // Returns the WHOLE Set-Cookie line, attributes included. Docmost issues
    // "authToken=…; Path=/; HttpOnly; Secure; SameSite=Lax", and this used to
    // keep only the name=value pair. A cookie set without an explicit Path
    // defaults to the directory of the request URI -- here /sso/ -- so the
    // session was never sent to /home: SSO appeared to succeed and Docmost
    // then rendered its login page. The sidecar relays this verbatim, and it
    // is same-origin with the app, so every attribute stays valid.
    function extractAuthCookie(res) {
      const raw = typeof res.headers.getSetCookie === 'function'
        ? res.headers.getSetCookie()
        : [res.headers.get('set-cookie')].filter(Boolean);
      return raw.find((c) => c.startsWith('authToken=')) || null;
    }

    // A Cookie: request header takes only name=value; the attributes above are
    // response-side and would be rejected here.
    function cookiePair(setCookie) {
      return setCookie.split(';')[0];
    }

    async function docmostLogin(email, password) {
      const r = await fetch(`${DOCMOST_URL}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      if (!r.ok) return null;
      return extractAuthCookie(r);
    }

    async function ensureWorkspaceSetUp() {
      // Idempotent: SetupGuard (apps/server/src/core/auth/guards/setup.guard.ts)
      // 403s once a workspace exists, so a 403 here means "already done", not
      // a failure. Run at startup (see bootstrap() below) so a human never
      // meets Docmost's "Create Workspace" wizard — every value it asks for is
      // already known to us.
      const r = await fetch(`${DOCMOST_URL}/api/auth/setup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: 'Gentian Bridge Admin',
          email: ADMIN_EMAIL,
          password: ADMIN_PASSWORD,
          workspaceName: WORKSPACE_NAME,
        }),
      });
      if (r.ok) {
        console.log(`workspace "${WORKSPACE_NAME}" created`);
        return;
      }
      if (r.status === 403) return;
      throw new Error(`workspace setup failed: ${r.status}`);
    }

    // Create the workspace as soon as Docmost is reachable, rather than
    // waiting for the first SSO login to trigger it. Docmost runs its
    // migrations on boot, so /api/auth/setup 500s for a few seconds after the
    // port opens -- hence retry rather than a single attempt. Runs in the
    // background: /ensure-session is served throughout, and it re-checks on
    // every pod restart, which is harmless because the call is idempotent.
    async function bootstrap() {
      const started = Date.now();
      const deadlineMs = 10 * 60 * 1000;
      let attempt = 0;
      while (Date.now() - started < deadlineMs) {
        attempt += 1;
        try {
          await ensureWorkspaceSetUp();
          // Space setup must never hold up logins: a failure here is logged
          // and retried on the next restart, not raised.
          try {
            await ensureTenantSpace(await adminLogin());
          } catch (err) {
            console.error(`tenant space setup failed (login still works): ${err.message}`);
          }
          console.log('workspace bootstrap complete');
          return;
        } catch (err) {
          // Expected while Docmost is still starting: connection refused
          // before it listens, 500 while migrations run.
          if (attempt === 1 || attempt % 10 === 0) {
            console.log(`waiting for Docmost to accept setup (attempt ${attempt}): ${err.message}`);
          }
          await new Promise((r) => setTimeout(r, 3000));
        }
      }
      console.error('workspace bootstrap gave up; first SSO login will retry');
    }

    // Recover from credential drift, for the admin and for ordinary users
    // alike.
    //
    // appSecrets are derived per install -- the seed includes the composite's
    // generated name -- while the app's database survives an uninstall. A
    // reinstall therefore mints new credentials for accounts whose stored
    // hashes still belong to the previous install. The ExternalSecret also
    // caches the old values for up to an hour, so this surfaces well after the
    // reinstall that caused it and looks like a spontaneous failure. Confirmed
    // by testing stored hashes against each install's derived seed: they
    // matched the *previous* install's, not the current one.
    //
    // Both credentials the bridge owns drift together. admin_password locks the
    // bridge out of its own admin account; bridge_secret changes the password
    // derived for every user, and that one cannot be recovered by
    // re-provisioning: Docmost's invite API deliberately skips addresses that
    // are already members, so no invitation is ever created and the flow fails
    // with "no pending invitation found" for a user who plainly exists.
    //
    // So the bridge re-syncs the stored hash to the value it now derives.
    // Scope stays narrow: one row, matched by email, only ever reached after a
    // normal login has already failed. Cost 12 matches what Docmost itself
    // uses, so the row stays consistent with one the app wrote. Returns false
    // when no such user exists, which is how the caller tells "drifted" apart
    // from "never provisioned".
    async function resyncCredential(email, plainPassword) {
      if (!DATABASE_URL) return false;
      const bcrypt = require('bcrypt');
      const postgres = require('postgres');
      const sql = postgres(DATABASE_URL);
      try {
        const hashed = await bcrypt.hash(plainPassword, 12);
        const rows = await sql`update users set password = ${hashed}, updated_at = now() where email = ${email} returning id`;
        if (rows.length > 0) {
          console.log(`re-synced credential for ${email} (stored hash had drifted from the current secret)`);
          return true;
        }
        return false;
      } finally {
        await sql.end({ timeout: 5 });
      }
    }

    async function adminLogin() {
      let cookie = await docmostLogin(ADMIN_EMAIL, ADMIN_PASSWORD);
      if (!cookie) {
        await ensureWorkspaceSetUp();
        cookie = await docmostLogin(ADMIN_EMAIL, ADMIN_PASSWORD);
      }
      if (!cookie && (await resyncCredential(ADMIN_EMAIL, ADMIN_PASSWORD))) {
        cookie = await docmostLogin(ADMIN_EMAIL, ADMIN_PASSWORD);
      }
      if (!cookie) {
        throw new Error('bridge admin login failed even after workspace setup and credential re-sync');
      }
      return cookie;
    }

    // ── Spaces ──────────────────────────────────────────────────────────
    // Two spaces are expected on a fresh install: one shared, named after the
    // tenant, and one personal, named after each user. Docmost's own setup
    // only creates "General", and createSpace makes the *creator* the sole
    // member -- so a space the bridge admin creates is invisible to everyone
    // else until it is shared explicitly.

    function slugify(input, fallback) {
      const slug = String(input || '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 100);
      // Docmost requires ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ and at least 2 chars.
      return slug.length >= 2 ? slug : fallback;
    }

    async function findSpaceBySlug(cookie, slug) {
      const res = await fetch(`${DOCMOST_URL}/api/spaces`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Cookie: cookiePair(cookie) },
        body: JSON.stringify({ limit: 100 }),
      });
      if (!res.ok) return null;
      const body = await readJson(res);
      return ((body && body.items) || []).find((s) => s.slug === slug) || null;
    }

    async function createSpace(cookie, name, slug) {
      const res = await fetch(`${DOCMOST_URL}/api/spaces/create`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Cookie: cookiePair(cookie) },
        body: JSON.stringify({ name, slug }),
      });
      if (!res.ok) {
        throw new Error(`create space "${slug}" failed: ${res.status}`);
      }
      return readJson(res);
    }

    async function defaultGroupId(adminCookie) {
      const res = await fetch(`${DOCMOST_URL}/api/groups`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Cookie: cookiePair(adminCookie) },
        body: JSON.stringify({ limit: 100 }),
      });
      if (!res.ok) return null;
      const body = await readJson(res);
      const group = ((body && body.items) || []).find((g) => g.isDefault);
      return group ? group.id : null;
    }

    // Shared, tenant-named space. Granted to the default group ("Everyone")
    // rather than to each user in turn: Docmost adds every member to that
    // group on invite acceptance, so one grant covers everyone who will ever
    // log in, including users provisioned long after this runs.
    async function ensureTenantSpace(adminCookie) {
      const slug = slugify(TENANT_SPACE_NAME, 'tenant');
      const existing = await findSpaceBySlug(adminCookie, slug);
      if (existing) return existing;

      const space = await createSpace(adminCookie, TENANT_SPACE_NAME, slug);
      const groupId = await defaultGroupId(adminCookie);
      if (groupId && space && space.id) {
        const res = await fetch(`${DOCMOST_URL}/api/spaces/members/add`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Cookie: cookiePair(adminCookie) },
          // Both arrays are required by AddSpaceMembersDto, so userIds is sent
          // empty rather than omitted.
          body: JSON.stringify({ spaceId: space.id, role: 'writer', userIds: [], groupIds: [groupId] }),
        });
        if (!res.ok) {
          console.error(`could not share "${slug}" with the default group: ${res.status}`);
        }
      }
      console.log(`tenant space "${TENANT_SPACE_NAME}" created`);
      return space;
    }

    async function currentUserId(cookie) {
      const res = await fetch(`${DOCMOST_URL}/api/users/me`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Cookie: cookiePair(cookie) },
        body: JSON.stringify({}),
      });
      if (!res.ok) return null;
      const body = await readJson(res);
      const user = (body && body.user) || body;
      return (user && user.id) || null;
    }

    // Personal space, named after the user. Created by the admin rather than
    // by the user themselves: creating a space needs the workspace-level
    // Manage Space ability, which invited members do not have, so doing this
    // with the user's own session fails with 403. The user is then added as
    // space admin, which is what makes it actually theirs.
    async function ensureUserSpace(adminCookie, userCookie, email, displayName) {
      const slug = slugify(email.split('@')[0], 'personal');
      const existing = await findSpaceBySlug(adminCookie, slug);
      if (existing) return existing;

      const space = await createSpace(adminCookie, displayName, slug);
      const userId = await currentUserId(userCookie);
      if (userId && space && space.id) {
        const res = await fetch(`${DOCMOST_URL}/api/spaces/members/add`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Cookie: cookiePair(adminCookie) },
          body: JSON.stringify({ spaceId: space.id, role: 'admin', userIds: [userId], groupIds: [] }),
        });
        if (!res.ok) {
          console.error(`could not give ${email} access to "${slug}": ${res.status}`);
        }
      }
      console.log(`personal space "${displayName}" created`);
      return space;
    }

    async function provisionAndLogin(email, name, password) {
      const adminCookie = await adminLogin();
      const authHeaders = { 'Content-Type': 'application/json', Cookie: cookiePair(adminCookie) };

      // 1. Create a plain CE workspace invite (member role).
      await fetch(`${DOCMOST_URL}/api/workspace/invites/create`, {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify({ emails: [email], role: 'member' }),
      });

      // 2. invites/create returns void — look the invitation back up by email.
      const listRes = await fetch(`${DOCMOST_URL}/api/workspace/invites`, {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify({ query: email, limit: 1 }),
      });
      const listBody = await readJson(listRes);
      const invitation = ((listBody && listBody.items) || [])[0];
      if (!invitation) {
        throw new Error(`no pending invitation found for ${email}`);
      }

      // 3. Self-hosted-only CE endpoint: raw invite link, no email needed.
      const linkRes = await fetch(`${DOCMOST_URL}/api/workspace/invites/link`, {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify({ invitationId: invitation.id }),
      });
      const { inviteLink } = await readJson(linkRes);
      const token = new URL(inviteLink).searchParams.get('token');
      if (!token) {
        throw new Error('could not parse invite token from inviteLink');
      }

      // 4. Public CE endpoint — accepting the invite creates the local user
      //    with our deterministic password and returns a session directly.
      const acceptRes = await fetch(`${DOCMOST_URL}/api/workspace/invites/accept`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ invitationId: invitation.id, token, name, password }),
      });
      if (!acceptRes.ok) {
        throw new Error(`invites/accept failed: ${acceptRes.status}`);
      }
      const cookie = extractAuthCookie(acceptRes);
      if (!cookie) {
        throw new Error('invites/accept did not return a session cookie');
      }

      // Same rule as above: a space that could not be created must not cost
      // the user their login. Runs only here, so it is once per user, on the
      // first SSO login that provisions them.
      try {
        await ensureUserSpace(await adminLogin(), cookie, email, name);
      } catch (err) {
        console.error(`personal space setup failed for ${email} (login still works): ${err.message}`);
      }

      return cookie;
    }

    const server = http.createServer((req, res) => {
      if (req.method !== 'POST' || req.url !== '/ensure-session') {
        res.writeHead(404, { 'Content-Type': 'text/plain' });
        res.end('not found');
        return;
      }
      let body = '';
      req.on('data', (chunk) => { body += chunk; });
      req.on('end', async () => {
        try {
          const { email: rawEmail, firstName, lastName } = JSON.parse(body || '{}');
          const email = String(rawEmail || '').trim().toLowerCase();
          if (!email) {
            res.writeHead(400, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ error: 'missing email' }));
            return;
          }
          const name = `${firstName || ''} ${lastName || ''}`.trim() || email.split('@')[0];
          const password = stablePassword(email);

          let cookie = await docmostLogin(email, password);
          if (!cookie) {
            // An existing user whose derived password drifted cannot be fixed
            // by provisioning: the invite API skips addresses that are already
            // members. Re-sync first, and only fall through to provisioning
            // when there is genuinely no such user yet.
            if (await resyncCredential(email, password)) {
              cookie = await docmostLogin(email, password);
            }
          }
          if (!cookie) {
            cookie = await provisionAndLogin(email, name, password);
          }

          res.writeHead(200, { 'Content-Type': 'application/json' });
          res.end(JSON.stringify({ cookie }));
        } catch (err) {
          console.error('docmost bridge ensure-session failed:', err);
          res.writeHead(502, { 'Content-Type': 'application/json' });
          res.end(JSON.stringify({ error: String(err && err.message || err) }));
        }
      });
    });

    server.listen(PORT, () => {
      console.log(`docmost bridge listening on :${PORT}`);
      // Not awaited: serving /ensure-session must not wait on Docmost booting.
      bootstrap().catch((err) => console.error('bootstrap error:', err));
    });
{{- end }}
