apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-git-modules
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-git-modules
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-git-modules
        {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: git-modules
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GIT_REPO_URL
              value: {{ .Values.git.repoUrl | quote }}
            - name: GIT_BRANCH
              value: {{ .Values.git.branch | quote }}
            - name: SYNC_INTERVAL
              value: {{ .Values.git.syncInterval | quote }}
            - name: SYNC_DIR
              value: {{ .Values.syncDir | quote }}
            {{- if .Values.git.auth.existingSecret }}
            {{- if .Values.git.auth.tokenKey }}
            - name: GIT_TOKEN_FILE
              value: /etc/git-auth/{{ .Values.git.auth.tokenKey }}
            - name: GIT_USERNAME
              value: {{ .Values.git.auth.username | quote }}
            {{- end }}
            {{- if .Values.git.auth.sshKeyKey }}
            - name: GIT_SSH_KEY_FILE
              value: /etc/git-auth/{{ .Values.git.auth.sshKeyKey }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: sync-volume
              mountPath: {{ .Values.syncDir }}
            - name: scripts-volume
              mountPath: /scripts
            {{- if .Values.git.auth.existingSecret }}
            - name: git-auth
              mountPath: /etc/git-auth
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: sync-volume
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-pvc" .Release.Name) .Values.persistence.pvcName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: scripts-volume
          configMap:
            name: {{ .Release.Name }}-git-modules-scripts
        {{- if .Values.git.auth.existingSecret }}
        - name: git-auth
          secret:
            secretName: {{ .Values.git.auth.existingSecret }}
            defaultMode: 0400
        {{- end }}
