# Default values for gentian-sidecar-git-modules

image:
  repository: gentian/sidecar-git-modules
  tag: latest
  pullPolicy: IfNotPresent

git:
  repoUrl: ""
  branch: "main"
  syncInterval: 60
  sshKey: ""

syncDir: "/usr/src/app/modules"

postSyncScript: |
  # Add any custom post-sync logic here
  # echo "Sync complete!"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 50m
    memory: 128Mi

persistence:
  enabled: false
  size: 1Gi
  storageClass: "nfs-csi"
  accessMode: "ReadWriteMany"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

