# Default values for gentian-sidecar-git-modules

image:
  repository: ghcr.io/gentian-org/gentian-sidecar-git-modules
  tag: latest
  pullPolicy: Always

git:
  repoUrl: ""
  branch: "main"
  syncInterval: 60

  # Credentials for a private repository. Leave existingSecret empty for public
  # repos — the sidecar then clones anonymously. The Secret is mounted as files,
  # never injected as environment values, so the token does not appear in
  # `kubectl describe pod`.
  auth:
    existingSecret: ""
    # Key holding a Personal Access Token, for https:// remotes.
    tokenKey: "token"
    # HTTPS username. GitHub accepts x-access-token for classic and fine-grained
    # tokens alike, so the token itself carries the identity.
    username: "x-access-token"
    # Key holding an SSH private key, for ssh:// or git@host: remotes. Mutually
    # exclusive with tokenKey in practice; whichever key exists is used.
    sshKeyKey: ""

syncDir: "/usr/src/app/modules"

postSyncScript: |
  # Add any custom post-sync logic here
  # echo "Sync complete!"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 50m
    memory: 128Mi

persistence:
  enabled: false
  size: 1Gi
  storageClass: "nfs-csi"
  accessMode: "ReadWriteMany"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

