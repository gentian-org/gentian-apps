apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cadcraft.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "cadcraft.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cadcraft.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cadcraft.name" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - {name: CRAFT_LISTEN, value: ":{{ .Values.port }}"}
            - {name: CRAFT_HOME_URL, value: {{ .Values.home.url | quote }}}
            - {name: CRAFT_HOME_SCOPE, value: {{ .Values.home.scope | quote }}}
            - {name: CRAFT_VOUCHING_DIR, value: /var/run/gentian/vouching}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Read when a person's token is asked for, never kept.
            - {name: vouching, mountPath: /var/run/gentian/vouching, readOnly: true}
      volumes:
        - name: vouching
          secret:
            secretName: {{ .Values.home.vouchingSecret }}
            optional: true
