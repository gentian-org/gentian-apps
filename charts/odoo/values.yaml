nameOverride: odoo
fullnameOverride: odoo

tenantId: ""

image:
  repository: ghcr.io/gentian-org/ocb
  tag: latest
  pullPolicy: IfNotPresent

existingSecret:
  name: odoo-secrets

database:
  host: ""
  port: "5432"
  name: ""
  user: ""
  password: ""

oidc:
  issuer: ""
  clientId: ""
  clientSecret: ""

gentian:
  # Where the pod validates OIDC tokens, when that must differ from where the
  # browser is sent. Empty means "the same as OIDC_ISSUER".
  oidc:
    internalIssuer: ""
  configPath: /etc/gentian/config.json
  bindingsPath: /etc/gentian/bindings.json
  modulesPath: /opt/odoo/custom-addons
  initModules: "base,web,gentian_os"
  git:
    enabled: true
    repo: "https://github.com/gentian-org/odoo-modules.git"
    branch: "main"
    syncInterval: 60
    secretName: ""
    # recursive, because odoo-modules carries its addons in submodules --
    # stoodio, bpmn, camoonda and hide_enterprise_modules. git-sync defaults to
    # off, so with the flag hardcoded off the clone landed without four of the
    # addon trees and Odoo simply did not see those modules.
    submodules: recursive
    # Opt-in, and off by default so upgrading this chart changes nothing for a
    # tenant that has not asked for it.
    #
    # A commit landing on the tracked branch reaches the pod's disk (git-sync
    # keeps syncing) but never reaches the RUNNING process: Odoo resolves
    # every addons_path entry through realpath() once, at startup, and a
    # symlink flip afterwards is invisible to it. The only way to make new
    # code visible is the same thing a human does by hand today --
    # `kubectl rollout restart` -- so this does that automatically instead of
    # silently doing nothing until someone notices and remembers to run it.
    #
    # Turning this on restarts the odoo container -- not the whole Deployment,
    # one container, via the liveness probe -- within roughly periodSeconds *
    # failureThreshold of a new commit landing. On a tenant whose profile
    # points multiple gitSources at the SAME shared repo/branch as other
    # tenants (this chart's default profile tracks one repo's develop branch
    # for every Odoo tenant on the platform), that means every commit to that
    # branch restarts every tenant with this flag on, at whatever moment the
    # commit happens to land -- not scoped to which tenant's installed
    # modules the commit actually touches. Enable per tenant with that in
    # mind; it is not a platform-wide switch.
    autoReload:
      enabled: false
      # How often the liveness probe re-checks for a newer commit than the one
      # this container booted with.
      periodSeconds: 30
      # Consecutive failed checks before Kubernetes restarts the container.
      # More than 1 so a single slow readlink under load cannot restart Odoo
      # on its own; the real signal is "still different next time too".
      failureThreshold: 3
  gitSources: []

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

ingress:
  enabled: false

service:
  port: 8069

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

# Customization ladder rung L1 (see gentian-apps/profiles/odoo/base/odoo-base-ce/customization.md
# and gentian-os/docs/app-customization.md §2.2). Off by default so a plain install
# has no extra init container or volumes.
#
# odoo.conf has no native conf.d support — fragments are merged into the rendered
# base config by an init container before Odoo starts, so the *effect* is a drop-in
# directory even though Odoo itself only understands a single file.
dropIns:
  odooConf:
    enabled: false
    configMaps: []   # INI fragments, applied in the order listed (platform, then profile, then tenant)
  branding:
    enabled: false
    configMaps: []   # static assets, mounted read-only at /opt/odoo/custom-branding
