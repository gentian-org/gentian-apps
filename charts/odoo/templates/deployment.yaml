apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odoo.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "odoo.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "odoo.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "odoo.name" . }}
        {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"; do
                echo "waiting for postgres..."
                sleep 2
              done
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-password
        {{- $gitSources := list -}}
        {{- if .Values.gentian.gitSources -}}
          {{- $gitSources = .Values.gentian.gitSources -}}
        {{- end -}}
        {{- if and .Values.gentian.git.enabled (eq (len $gitSources) 0) -}}
          {{- $gitSources = list (dict "name" "default" "repo" .Values.gentian.git.repo "branch" .Values.gentian.git.branch "syncInterval" (int .Values.gentian.git.syncInterval) "secretName" .Values.gentian.git.secretName) -}}
        {{- end -}}
        {{- if .Values.dropIns.odooConf.enabled }}
        # Customization ladder rung L1 (docs/app-customization.md §2.2). Odoo has no
        # native conf.d — merge platform/profile/tenant fragments into the rendered
        # base config before Odoo starts, so the effect is a drop-in directory even
        # though Odoo itself only understands a single file. Fragments apply in
        # lexicographic order (00-49 platform, 50-89 profile, 90-99 tenant); later
        # keys win via configparser's read-order semantics.
        - name: merge-conf-d
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command:
            - python3
            - -c
            - |
              import configparser, glob, os
              cp = configparser.ConfigParser()
              cp.read("/etc/odoo-base/odoo.conf")
              fragments = sorted(
                  glob.glob("/etc/odoo-conf-fragments/*.ini")
                  + glob.glob("/etc/odoo-conf-fragments/*.conf")
              )
              for f in fragments:
                  cp.read(f)
              os.makedirs("/etc/odoo", exist_ok=True)
              with open("/etc/odoo/odoo.conf", "w") as fh:
                  cp.write(fh)
              print(f"merged odoo.conf from base + {len(fragments)} fragment(s)")
          volumeMounts:
            - name: odoo-config-base
              mountPath: /etc/odoo-base
              readOnly: true
            - name: conf-dropins
              mountPath: /etc/odoo-conf-fragments
              readOnly: true
            - name: odoo-config
              mountPath: /etc/odoo
        {{- end }}
        {{- range $gitSources }}
        - name: git-sync-init-{{ .name }}
          image: registry.k8s.io/git-sync/git-sync:v4.2.3
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - --repo={{ .repo }}
            - --branch={{ .branch }}
            - --root={{ $.Values.gentian.modulesPath }}
            - --dest={{ .name }}/current
            - --submodules=off
            - --one-time
            {{- if .secretName }}
            - --ssh-key-file=/etc/git-secret/ssh
            {{- end }}
          volumeMounts:
            - name: extra-addons
              mountPath: {{ $.Values.gentian.modulesPath }}
            {{- if .secretName }}
            - name: git-secret-{{ .name }}
              mountPath: /etc/git-secret
              readOnly: true
            {{- end }}
        {{- end }}
      containers:
        - name: odoo
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              python3 /opt/odoo/src/odoo/odoo-bin \
                -d "${DB_NAME}" \
                --db_host="${DB_HOST}" \
                --db_port="${DB_PORT}" \
                --db_user="${DB_USER}" \
                --db_password="${DB_PASSWORD}" \
                --config=/etc/odoo/odoo.conf \
                -i {{ .Values.gentian.initModules }} \
                --without-demo=all \
                --stop-after-init || true
              exec python3 /opt/odoo/src/odoo/odoo-bin \
                -d "${DB_NAME}" \
                --db_host="${DB_HOST}" \
                --db_port="${DB_PORT}" \
                --db_user="${DB_USER}" \
                --db_password="${DB_PASSWORD}" \
                --config=/etc/odoo/odoo.conf
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-name
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: oidc-client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: oidc-client-secret
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: oidc-issuer
            - name: GENTIAN_TENANT_ID
              value: {{ .Values.tenantId | quote }}
            - name: GENTIAN_CONFIG_PATH
              value: {{ .Values.gentian.configPath | quote }}
            - name: GENTIAN_BINDINGS_SECRET
              value: {{ .Values.gentian.bindingsPath | quote }}
          volumeMounts:
            - name: odoo-data
              mountPath: /opt/odoo/data
            {{- if not .Values.extraVolumeMounts }}
            - name: extra-addons
              mountPath: {{ .Values.gentian.modulesPath }}
            {{- end }}
            - name: odoo-config
              mountPath: /etc/odoo
              {{- if .Values.dropIns.odooConf.enabled }}
              readOnly: false
              {{- end }}
            - name: gentian-config
              mountPath: /etc/gentian
            - name: tmp
              mountPath: /tmp
            {{- if .Values.dropIns.branding.enabled }}
            - name: branding-dropins
              mountPath: /opt/odoo/custom-branding
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /web/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /web/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- range $gitSources }}
        - name: git-sync-{{ .name }}
          image: registry.k8s.io/git-sync/git-sync:v4.2.3
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - --repo={{ .repo }}
            - --branch={{ .branch }}
            - --root={{ $.Values.gentian.modulesPath }}
            - --dest={{ .name }}/current
            - --submodules=off
            - --wait={{ .syncInterval }}
            - --stale-worktree-timeout=24h
            {{- if .secretName }}
            - --ssh-key-file=/etc/git-secret/ssh
            {{- end }}
          volumeMounts:
            - name: extra-addons
              mountPath: {{ $.Values.gentian.modulesPath }}
            {{- if .secretName }}
            - name: git-secret-{{ .name }}
              mountPath: /etc/git-secret
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: odoo-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "odoo.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if not .Values.extraVolumes }}
        - name: extra-addons
          emptyDir: {}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
        {{- if .Values.dropIns.odooConf.enabled }}
        # Written by the merge-conf-d init container; the raw rendered config lives
        # at odoo-config-base instead of being mounted directly at /etc/odoo.
        - name: odoo-config
          emptyDir: {}
        - name: odoo-config-base
          configMap:
            name: {{ include "odoo.fullname" . }}-config
            items:
              - key: odoo.conf
                path: odoo.conf
        - name: conf-dropins
          projected:
            sources:
              {{- range .Values.dropIns.odooConf.configMaps }}
              - configMap:
                  name: {{ . }}
                  optional: true
              {{- end }}
        {{- else }}
        - name: odoo-config
          configMap:
            name: {{ include "odoo.fullname" . }}-config
        {{- end }}
        {{- if .Values.dropIns.branding.enabled }}
        - name: branding-dropins
          projected:
            sources:
              {{- range .Values.dropIns.branding.configMaps }}
              - configMap:
                  name: {{ . }}
                  optional: true
              {{- end }}
        {{- end }}
        - name: gentian-config
          configMap:
            name: {{ include "odoo.fullname" . }}-config
            items:
              - key: config.json
                path: config.json
        - name: tmp
          emptyDir: {}
        {{- range $gitSources }}
        {{- if .secretName }}
        - name: git-secret-{{ .name }}
          secret:
            secretName: {{ .secretName }}
            defaultMode: 288
        {{- end }}
        {{- end }}
