apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erpnext.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "erpnext.name" . }}
spec:
  # One pod: every process of the bench writes the one ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "erpnext.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "erpnext.name" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # configure runs at start, so a changed value takes effect by a new pod.
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/files: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        {{- if kindIs "string" . }}
        - name: {{ . }}
        {{- else }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
        {{- end }}
      {{- end }}
      # The site may take minutes to stop a long job; Frappe finishes it on SIGTERM.
      terminationGracePeriodSeconds: 120
      initContainers:
        # The two Redis are sidecars (init containers that keep running), so
        # they are up before configure, which needs both, and stay up beside
        # the bench.
        - name: redis-cache
          image: {{ include "erpnext.redisImage" . | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          restartPolicy: Always
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["valkey-server"]
          args:
            - --bind
            - 127.0.0.1
            - --port
            - {{ .Values.redis.cache.port | quote }}
            - --save
            - ""
            - --appendonly
            - "no"
            - --dir
            - /tmp
            - --maxmemory
            - {{ .Values.redis.cache.maxmemory | quote }}
            - --maxmemory-policy
            - {{ .Values.redis.cache.maxmemoryPolicy | quote }}
          startupProbe:
            exec:
              command: ["valkey-cli", "-h", "127.0.0.1", "-p", {{ .Values.redis.cache.port | quote }}, "ping"]
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: redis-cache-tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.redis.cache.resources | nindent 12 }}
        - name: redis-queue
          image: {{ include "erpnext.redisImage" . | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          restartPolicy: Always
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["valkey-server"]
          args:
            - --bind
            - 127.0.0.1
            - --port
            - {{ .Values.redis.queue.port | quote }}
            - --save
            - ""
            - --appendonly
            - "no"
            - --dir
            - /tmp
            - --maxmemory
            - {{ .Values.redis.queue.maxmemory | quote }}
            - --maxmemory-policy
            - {{ .Values.redis.queue.maxmemoryPolicy | quote }}
          startupProbe:
            exec:
              command: ["valkey-cli", "-h", "127.0.0.1", "-p", {{ .Values.redis.queue.port | quote }}, "ping"]
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: redis-queue-tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.redis.queue.resources | nindent 12 }}
        # Creates the site on the first start, migrates it after an upgrade, and
        # writes its configuration and sign-in on every start (files/configure.sh).
        - name: configure
          image: {{ include "erpnext.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/bin/bash", "/gentian/configure.sh"]
          env:
            {{- include "erpnext.env" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "erpnext.fullname" . }}-config
          volumeMounts:
            {{- include "erpnext.mounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.configure | nindent 12 }}
      containers:
        - name: backend
          image: {{ include "erpnext.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - /home/frappe/frappe-bench/env/bin/gunicorn
            - --chdir=/home/frappe/frappe-bench/sites
            - --bind=127.0.0.1:8000
            - --threads={{ .Values.gunicorn.threads }}
            - --workers={{ .Values.gunicorn.workers }}
            - --worker-class=gthread
            - --worker-tmp-dir=/dev/shm
            - --timeout={{ .Values.gunicorn.timeout }}
            - --preload
            - frappe.app:application
          env:
            {{- include "erpnext.env" . | nindent 12 }}
          volumeMounts:
            {{- include "erpnext.mounts" . | nindent 12 }}
          # gunicorn listens on the pod's loopback only; a tcpSocket probe with
          # host 127.0.0.1 would dial the node, so connect from inside.
          livenessProbe:
            exec:
              command:
                - /home/frappe/frappe-bench/env/bin/python
                - -c
                - import socket; socket.create_connection(("127.0.0.1", 8000), 3).close()
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
        - name: nginx
          image: {{ include "erpnext.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
              readOnly: true
            - name: scripts
              mountPath: /etc/nginx/conf.d/frappe.conf
              subPath: frappe.conf
              readOnly: true
            - name: nginx-run
              mountPath: /run
            - name: nginx-lib
              mountPath: /var/lib/nginx
          readinessProbe:
            # nginx, gunicorn and the site's database, by Frappe's own ping.
            httpGet:
              path: /api/method/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
        - name: socketio
          image: {{ include "erpnext.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          workingDir: /home/frappe/frappe-bench
          command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
          env:
            {{- include "erpnext.env" . | nindent 12 }}
          volumeMounts:
            {{- include "erpnext.mounts" . | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.socketio | nindent 12 }}
        # One worker for the three queues, in Frappe's order of urgency.
        - name: worker
          image: {{ include "erpnext.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          workingDir: /home/frappe/frappe-bench
          command: ["bench", "worker", "--queue", "short,default,long"]
          env:
            {{- include "erpnext.env" . | nindent 12 }}
          volumeMounts:
            {{- include "erpnext.mounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
        - name: scheduler
          image: {{ include "erpnext.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          workingDir: /home/frappe/frappe-bench
          command: ["bench", "schedule"]
          env:
            {{- include "erpnext.env" . | nindent 12 }}
          volumeMounts:
            {{- include "erpnext.mounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.scheduler | nindent 12 }}
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: {{ include "erpnext.fullname" . }}-sites
        - name: logs
          emptyDir: {}
        - name: scripts
          configMap:
            name: {{ include "erpnext.fullname" . }}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-lib
          emptyDir: {}
        - name: redis-cache-tmp
          emptyDir: {}
        - name: redis-queue-tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
