{{- $site := include "erpnext.siteName" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "erpnext.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "erpnext.name" . }}
data:
  configure.sh: |-
{{ .Files.Get "files/configure.sh" | indent 4 }}
  configure.py: |-
{{ .Files.Get "files/configure.py" | indent 4 }}
  # The image's mariadb client (11.8) asks for TLS by default and refuses a
  # server that offers none, which the platform's does not; Frappe's Python
  # connection never asked for it.
  my.cnf: |-
    [client]
    {{- if not .Values.database.tls }}
    skip-ssl
    {{- end }}
  # The image's nginx template with the site named once and for all: every
  # request is for this site, whatever Host it arrives with (the platform's own
  # calls come by the Service's name). No X-Frame-Options here: whether the page
  # may be framed is the gateway's to say.
  frappe.conf: |-
    upstream backend-server {
      server 127.0.0.1:8000 fail_timeout=0;
    }

    upstream socketio-server {
      server 127.0.0.1:9000 fail_timeout=0;
    }

    server {
      listen 8080;
      server_name _;
      absolute_redirect off;
      root /home/frappe/frappe-bench/sites;

      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;

      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin" always;

      {{- range .Values.nginx.trustedProxies }}
      set_real_ip_from {{ . }};
      {{- end }}
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;

      location /assets {
        try_files $uri =404;
      }

      location ~ ^/protected/(.*) {
        internal;
        try_files /{{ $site }}/$1 =404;
      }

      # The realtime server checks that a socket's Origin names the host it
      # connected to, and then asks the backend, at that Origin, who the
      # socket's session is. That second call would leave the pod for the
      # gateway. So the Origin is checked here, against the site, and the
      # realtime server is told the pod's own nginx instead.
      location /socket.io {
        if ($http_origin != "https://{{ $site }}") {
          return 403;
        }
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Frappe-Site-Name {{ $site }};
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Origin http://127.0.0.1:8080;
        proxy_pass http://socketio-server;
      }

      location / {
        rewrite ^(.+)/$ $1 permanent;
        rewrite ^(.+)/index\.html$ $1 permanent;
        rewrite ^(.+)\.html$ $1 permanent;

        location ~ ^/files/.*.(htm|html|svg|xml) {
          add_header Content-disposition "attachment";
          add_header X-Content-Type-Options nosniff always;
          try_files /{{ $site }}/public/$uri @webserver;
        }

        try_files /{{ $site }}/public/$uri @webserver;
      }

      {{- if and .Values.oidc.enabled (not .Values.signIn.passwordLogin) }}

      # Straight on to the realm. Frappe has no setting that skips its login
      # page, and the page is the only place that makes the realm's address: it
      # carries a state Frappe keeps for the callback, and the page to return
      # to. So the page is served as Frappe renders it, and a script at its end
      # follows its own Keycloak link. Frappe sends a signed-in person past this
      # page before it renders.
      location = /login {
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</body>' '<script>(function(){var a=document.querySelector("a.btn-keycloak");if(a)location.replace(a.href)})()</script></body>';
        {{- include "erpnext.backendProxy" . | nindent 8 }}
      }
      {{- end }}

      location @webserver {
        {{- include "erpnext.backendProxy" . | nindent 8 }}
      }

      sendfile on;
      keepalive_timeout 15;
      client_max_body_size {{ .Values.nginx.clientMaxBodySize }};
      client_body_buffer_size 16K;
      client_header_buffer_size 1k;

      gzip on;
      gzip_http_version 1.1;
      gzip_comp_level 5;
      gzip_min_length 256;
      gzip_proxied any;
      gzip_vary on;
      gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/font-woff
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;
    }
