apiVersion: v1
kind: Secret
metadata:
  name: {{ include "erpnext.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "erpnext.name" . }}
type: Opaque
stringData:
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
  ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
  ADMIN_API_KEY: {{ .Values.admin.apiKey | quote }}
  ADMIN_API_SECRET: {{ .Values.admin.apiSecret | quote }}
  OIDC_ENABLED: {{ .Values.oidc.enabled | quote }}
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  OIDC_USER_ID_CLAIM: {{ .Values.oidc.userIdClaim | quote }}
  OIDC_SCOPE: {{ .Values.oidc.scope | quote }}
  SIGN_IN_PASSWORD_LOGIN: {{ .Values.signIn.passwordLogin | quote }}
  SIGN_IN_DEFAULT_ROLE: {{ .Values.signIn.defaultRole | quote }}
  CHART_OF_ACCOUNTS: {{ .Values.setup.chartOfAccounts | quote }}
  SMTP_HOST: {{ .Values.smtp.host | quote }}
  SMTP_PORT: {{ .Values.smtp.port | quote }}
  SMTP_USER: {{ .Values.smtp.user | quote }}
  SMTP_PASSWORD: {{ .Values.smtp.password | quote }}
  SMTP_USE_TLS: {{ .Values.smtp.useTls | quote }}
  SMTP_FROM: {{ .Values.smtp.fromAddress | quote }}
  SMTP_SENDER_NAME: {{ .Values.smtp.senderName | quote }}
