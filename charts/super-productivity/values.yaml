nameOverride: super-productivity
fullnameOverride: super-productivity-ce

image:
  # The official image, unmodified: the web build of Super Productivity as
  # static files behind nginx. No upstream chart exists. Started as nginx's
  # own unprivileged user (uid 101) on a port above 1024 with a read-only
  # root filesystem; the paths nginx writes to are emptyDirs.
  repository: docker.io/johannesjo/super-productivity
  tag: "v20.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1
port: 8080
workerProcesses: 1
accessLog: false

resources:
  requests:
    cpu: "10m"
    memory: "16Mi"
  limits:
    cpu: "250m"
    memory: "64Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

podLabels: {}
podAnnotations: {}

# The conventional names the platform writes into. Nothing in the pod makes
# an outbound call, so the trust anchor it may add is unused here.
extraEnvVars: []
extraVolumes: []
extraVolumeMounts: []

# The chart never makes its own Ingress or HTTPRoute: the operator routes
# from the profile's expose entries.
ingress:
  enabled: false
