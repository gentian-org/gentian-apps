nameOverride: mathesar
fullnameOverride: mathesar-ce

replicaCount: 1

image:
  # "minimal" production target from the upstream Dockerfile — runs against an
  # external Postgres only (no bundled db, no Caddy). See BUNDLE notes in
  # profiles/mathesar/mathesar-ce/profile.yaml.
  repository: mathesar/mathesar
  tag: "0.12.0"
  pullPolicy: IfNotPresent

# Name of the Kubernetes Secret (created by the gentian-os operator from
# AppProfile valueMapping/appSecrets) holding db-host/db-port/db-name/db-user/
# db-password and internal-secret_key. Must match
# "<AppProfile metadata.name>-sensitive-values".
existingSecret:
  name: mathesar-ce-sensitive-values

# Internal Postgres database name Mathesar uses for its own metadata/users
# (not a namespace for tenant data — users connect additional Postgres
# databases from inside the Mathesar UI after login).
database:
  name: mathesar_django

# Leading-dot Django ALLOWED_HOSTS entry, e.g. ".demo.desk.gentian.org".
allowedHosts: ""

instanceName: "Mathesar"

webConcurrency: 3

django:
  debug: false
  # Mathesar's own /administration/ pages cover day-to-day admin; the Django
  # /admin/ backend stays off unless explicitly needed for troubleshooting.
  adminEnabled: false

# SSO_CONFIG_DICT (version 2 schema, single OIDC provider). clientSecret is
# injected as a literal Helm value by the Crossplane composition
# (valueMapping.oidc.clientSecretKey) because it must be embedded inline in a
# JSON env var rather than mounted as its own file/env var.
oidc:
  enabled: false
  providerKey: keycloak
  clientId: ""
  clientSecret: ""
  serverUrl: ""

service:
  port: 8000

# Backs /code/.media (user-uploaded .csv/.tsv datafiles). Everything else the
# minimal image needs (collected static assets, SECRET_KEY) is either baked
# into the image at build time or supplied via env var, so no other volumes
# are persistent.
persistence:
  enabled: true
  size: "5Gi"
  storageClass: ""

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1536Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

podLabels: {}
podAnnotations: {}

# Chart never manages its own Ingress/HTTPRoute — the gentian-os operator
# creates the Gateway API route from AppProfile.spec.ingress.
ingress:
  enabled: false
