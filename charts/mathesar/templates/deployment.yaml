apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mathesar.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "mathesar.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mathesar.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mathesar.name" . }}
        {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
      {{- if .Values.podAnnotations }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: mathesar
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # Upstream's default CMD is `run -fnse`. Dropping -f
          # (--fallback-to-inbuilt-db) is deliberate: with it, a missing or
          # empty POSTGRES_* value makes Mathesar silently start the Postgres
          # bundled in the image and write tenant data to container-local
          # storage that vanishes on restart. Without it the pod fails loudly
          # instead, which is the correct behaviour for a tenant app whose
          # database is provisioned by the kernel.
          #   -n  use the system gunicorn, not a venv
          #   -s  run migrations + collectstatic before serving
          #   -e  prefer exported env vars over an .env file
          command:
            - bash
            - ./bin/mathesar
            - run
            - -nse
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            # The image already defaults to this, but Mathesar's entrypoint
            # only sets it via os.environ.setdefault — pin it so the settings
            # module can never be inherited from something else.
            - name: DJANGO_SETTINGS_MODULE
              value: "config.settings.production"
            # Must cover the in-cluster Service DNS as well as the public tenant
            # host. The operator reaches this app over
            # http://<svc>.<ns>.svc.cluster.local to reconcile app-admins into
            # is_superuser (PrivilegedRoleSpec "mathesar-rpc"), per the
            # server-to-server rule in app-profile-guide.md §2 — and Django
            # answers any Host outside this list with a bare 400 DisallowedHost,
            # which reads like a malformed request rather than a config problem.
            # A leading dot matches subdomains, so ".svc.cluster.local" stays
            # correct no matter which namespace the tenant lands in. These names
            # are not routable from outside the cluster.
            - name: ALLOWED_HOSTS
              value: "{{ .Values.allowedHosts }},{{ include "mathesar.fullname" . }},.svc.cluster.local"
            - name: DEBUG
              value: {{ .Values.django.debug | quote }}
            - name: MATHESAR_DJANGO_ADMIN_ENABLED
              value: {{ .Values.django.adminEnabled | quote }}
            - name: WEB_CONCURRENCY
              value: {{ .Values.webConcurrency | quote }}
            - name: MATHESAR_INSTANCE_NAME
              value: {{ .Values.instanceName | quote }}
            # Password login stays available alongside SSO: Mathesar links an SSO
            # login to an *existing* local user matched by email rather than
            # auto-provisioning admins, so the first tenant admin still needs the
            # password-based first-run wizard to create that initial account.
            - name: REQUIRE_SSO_LOGIN
              value: "false"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-name
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: db-password
            # Pods are ephemeral — must be pinned explicitly, otherwise Mathesar
            # generates a new one on every restart and invalidates all sessions.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: internal-secret_key
            {{- if .Values.oidc.enabled }}
            # clientSecret must be embedded inline in this JSON blob (Mathesar has
            # no separate "client secret file" option), so it arrives as a literal
            # Helm value via valueMapping.oidc.clientSecretKey rather than a
            # secretKeyRef — see profile.yaml valueMapping comment.
            - name: SSO_CONFIG_DICT
              value: >-
                {{ dict "version" 2 "providers" (dict .Values.oidc.providerKey (dict
                  "type" "oidc"
                  "provider_name" .Values.oidc.providerKey
                  "client_id" .Values.oidc.clientId
                  "secret" .Values.oidc.clientSecret
                  "server_url" .Values.oidc.serverUrl
                )) | toJson }}
            {{- end }}
          volumeMounts:
            - name: media
              mountPath: /code/.media
            # STATIC_ROOT. Writable because the published image collects static
            # at startup rather than at build time (see values.yaml image
            # comment) — whitenoise serves these with
            # CompressedManifestStaticFilesStorage, which needs the generated
            # manifest, so a read-only path here crashes the pod on boot.
            # emptyDir, not a PVC: the contents are rebuilt from the image on
            # every start and identical across replicas.
            - name: static
              mountPath: /code/static
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz/ready/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: media
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mathesar.fullname" . }}-media
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: static
          emptyDir: {}
        - name: tmp
          emptyDir: {}
