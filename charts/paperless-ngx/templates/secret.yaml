{{- /*
Everything the pod is told, secret or not, in one Secret the container reads
with envFrom. The values that are secrets (the database password, Django's
key, the two technical passwords, the realm client's secret inside the
allauth JSON, the mail password) never appear in the Deployment's manifest;
the rest sits beside them so there is one place to read what the app was
given. The profile's post-install Job reads the same Secret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperless-ngx.fullname" . }}-env
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
type: Opaque
stringData:
  PAPERLESS_URL: {{ .Values.appUrl | quote }}
  PAPERLESS_ALLOWED_HOSTS: {{ include "paperless-ngx.allowedHosts" . | quote }}
  # The edge terminates TLS and forwards X-Forwarded-Proto; without this
  # Django builds http:// callback addresses and allauth's state check fails.
  PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
  PAPERLESS_USE_X_FORWARD_HOST: "true"
  PAPERLESS_PORT: {{ .Values.port | quote }}
  PAPERLESS_SECRET_KEY: {{ .Values.secretKey | quote }}
  PAPERLESS_DBENGINE: "postgresql"
  PAPERLESS_DBHOST: {{ .Values.database.host | quote }}
  PAPERLESS_DBPORT: {{ .Values.database.port | quote }}
  PAPERLESS_DBNAME: {{ .Values.database.name | quote }}
  PAPERLESS_DBUSER: {{ .Values.database.user | quote }}
  PAPERLESS_DBPASS: {{ .Values.database.password | quote }}
  PAPERLESS_REDIS: "redis://127.0.0.1:{{ .Values.redis.port }}"
  PAPERLESS_ADMIN_USER: {{ .Values.admin.user | quote }}
  PAPERLESS_ADMIN_MAIL: {{ .Values.admin.mail | quote }}
  PAPERLESS_ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
  # Read by the profile's post-install Job, not by Paperless.
  PAPERLESS_MCP_USER: {{ .Values.mcp.user | quote }}
  PAPERLESS_MCP_PASSWORD: {{ .Values.mcp.servicePassword | quote }}
  PAPERLESS_OCR_LANGUAGE: {{ .Values.ocr.language | quote }}
  PAPERLESS_OCR_MODE: {{ .Values.ocr.mode | quote }}
  PAPERLESS_OCR_OUTPUT_TYPE: {{ .Values.ocr.outputType | quote }}
  PAPERLESS_TIME_ZONE: {{ .Values.timeZone | quote }}
  PAPERLESS_CONSUMER_POLLING_INTERVAL: {{ .Values.consumerPollingInterval | quote }}
  PAPERLESS_WEBSERVER_WORKERS: {{ .Values.webserverWorkers | quote }}
  PAPERLESS_TASK_WORKERS: {{ .Values.taskWorkers | quote }}
  PAPERLESS_THREADS_PER_WORKER: {{ .Values.threadsPerWorker | quote }}
  {{- if .Values.oidc.enabled }}
  PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
  PAPERLESS_SOCIALACCOUNT_PROVIDERS: {{ include "paperless-ngx.socialaccountProviders" . | quote }}
  # An account is made at a person's first sign-in, from the realm's claims,
  # with no form in between; nobody signs up with a password.
  PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
  PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
  PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
  PAPERLESS_ACCOUNT_EMAIL_VERIFICATION: "none"
  PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: "https"
  PAPERLESS_DISABLE_REGULAR_LOGIN: {{ .Values.oidc.disableRegularLogin | quote }}
  PAPERLESS_REDIRECT_LOGIN_TO_SSO: {{ .Values.oidc.redirectLoginToSso | quote }}
  {{- end }}
  {{- if .Values.smtp.host }}
  PAPERLESS_EMAIL_HOST: {{ .Values.smtp.host | quote }}
  PAPERLESS_EMAIL_PORT: {{ .Values.smtp.port | quote }}
  PAPERLESS_EMAIL_HOST_USER: {{ .Values.smtp.user | quote }}
  PAPERLESS_EMAIL_HOST_PASSWORD: {{ .Values.smtp.password | quote }}
  PAPERLESS_EMAIL_FROM: {{ .Values.smtp.fromAddress | quote }}
  PAPERLESS_EMAIL_USE_TLS: {{ .Values.smtp.useTls | quote }}
  {{- end }}
  {{- if .Values.ai.enabled }}
  PAPERLESS_AI_ENABLED: "true"
  PAPERLESS_AI_LLM_BACKEND: "openai-like"
  PAPERLESS_AI_LLM_MODEL: {{ .Values.ai.model | quote }}
  PAPERLESS_AI_LLM_ENDPOINT: {{ .Values.llm.baseUrl | quote }}
  PAPERLESS_AI_LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  PAPERLESS_AI_LLM_EMBEDDING_BACKEND: {{ .Values.ai.embeddingBackend | quote }}
  {{- if .Values.ai.embeddingModel }}
  PAPERLESS_AI_LLM_EMBEDDING_MODEL: {{ .Values.ai.embeddingModel | quote }}
  {{- end }}
  {{- end }}
