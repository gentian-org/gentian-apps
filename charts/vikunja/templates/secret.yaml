{{- /*
The configuration file, in a Secret: it holds the database password, the S3
secret key, the realm client's secret, the mail password and the key Vikunja
signs its tokens with. Nothing of it is in the Deployment's manifest.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vikunja.fullname" . }}-config
  labels:
    {{- include "vikunja.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yml: |
    {{- include "vikunja.config" . | nindent 4 }}
