# Default values for gentian-sidecar-sso-saml

image:
  repository: ghcr.io/gentian-org/sidecar-sso-saml
  tag: latest
  pullPolicy: IfNotPresent

sso:
  tenantId: "demo"
  kernelDomain: "gentian.org"
  issuer: "GentianSidecar"
  # Path the IdP posts the assertion to, advertised in the AuthnRequest. Leave
  # empty to keep the image default (/api/v1/authn/saml/acs), which is what
  # Activepieces needs because its own nginx fronts this sidecar there. An app
  # whose tenant gateway routes straight to this Service has no such rewrite
  # and should set this to a path it actually routes here, e.g. /sso/acs.
  acsPath: ""

handlerScript: |
  module.exports = {
      onLogin: async (profile, req, res) => {
          // Default behavior
          res.writeHead(200, { 'Content-Type': 'application/json' });
          res.end(JSON.stringify({ profile }));
      }
  };

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
