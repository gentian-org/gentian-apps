apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sso-saml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-sso-saml
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-sso-saml
        # Standard Helm instance label. Required by the generic
        # AppProfile.spec.sidecars[].stableServiceName mechanism: app-default's
        # stable ClusterIP alias selects pods on
        # `app.kubernetes.io/instance: <release>` (gentian-os
        # crossplane/compositions/app-default.yaml, "Emit sidecars"), so without
        # this the alias Service selects nothing and the route 503s. Additive to
        # the pod template only — .spec.selector below is unchanged, so this is
        # not an immutable-field update for existing releases.
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        # The handler is require()d once at process start, so a ConfigMap-only change
        # leaves the old code running indefinitely — the pod never restarts and the
        # mounted file is re-read by nobody. Rolling on the ConfigMap's checksum is
        # what makes a handlerScript edit actually take effect.
        checksum/handler: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sso-saml
          securityContext:
            allowPrivilegeEscalation: false
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8081
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          env:
            - name: SSO_TENANT_ID
              value: {{ .Values.sso.tenantId | quote }}
            - name: SSO_KERNEL_DOMAIN
              value: {{ .Values.sso.kernelDomain | quote }}
            - name: SSO_ISSUER
              value: {{ .Values.sso.issuer | quote }}
            {{- if .Values.sso.acsPath }}
            - name: SSO_ACS_PATH
              value: {{ .Values.sso.acsPath | quote }}
            {{- end }}
            - name: APP_HANDLER_SCRIPT
              value: "/usr/src/app/custom/handler.js"
            {{- if .Values.extraEnvVars }}
            {{- range .Values.extraEnvVars }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: handler-script
              mountPath: /usr/src/app/custom
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: handler-script
          configMap:
            name: {{ .Release.Name }}-sso-handler
