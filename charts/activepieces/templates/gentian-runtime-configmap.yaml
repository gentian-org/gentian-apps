{{- if .Values.gentian.enabled }}
{{- /*
Gentian runtime: the nginx config and the entrypoint that starts it.

Both are real files under files/ rather than strings in a template, so they stay
reviewable, diffable and shellcheck-able. This ConfigMap is the single source for
the nginx config — profiles pass values, never a rendered config or a command.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "activepieces.fullname" . }}-gentian-runtime
  labels:
    {{- include "activepieces.labels" . | nindent 4 }}
data:
  nginx.conf: |
{{ .Files.Get "files/nginx.conf" | indent 4 }}
  entrypoint.sh: |
{{ .Files.Get "files/entrypoint.sh" | indent 4 }}
{{- end }}
