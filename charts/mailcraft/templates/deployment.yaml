apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mailcraft.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "mailcraft.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mailcraft.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mailcraft.name" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - {name: CRAFT_LISTEN, value: ":{{ .Values.port }}"}
            - {name: CRAFT_JMAP_SESSION, value: {{ .Values.jmap.session | quote }}}
            - {name: CRAFT_JMAP_IMAP_HOST, value: {{ .Values.mail.imapHost | quote }}}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
