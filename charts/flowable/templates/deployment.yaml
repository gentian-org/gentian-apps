apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowable.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "flowable.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flowable.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flowable.name" . }}
        {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        # A changed credential is a new pod: the engine reads both at start.
        checksum/credentials: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: flowable
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.service.port | quote }}
            - name: JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}
            - name: SPRING_DATASOURCE_DRIVER-CLASS-NAME
              value: org.postgresql.Driver
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowable.fullname" . }}-credentials
                  key: database-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowable.fullname" . }}-credentials
                  key: database-password
            - name: FLOWABLE_REST_APP_ADMIN_USER-ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowable.fullname" . }}-credentials
                  key: admin-user
            - name: FLOWABLE_REST_APP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowable.fullname" . }}-credentials
                  key: admin-password
            - name: FLOWABLE_REST_APP_ADMIN_FIRST-NAME
              value: "Contract"
            - name: FLOWABLE_REST_APP_ADMIN_LAST-NAME
              value: "Account"
            - name: FLOWABLE_ASYNC-EXECUTOR-ACTIVATE
              value: {{ .Values.asyncExecutor | quote }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # The port, not a page: every path of the REST application asks
          # for the administrator's account, its health page included, and a
          # probe holds none. The port opens once the engines have started.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
