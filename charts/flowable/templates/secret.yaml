apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowable.fullname" . }}-credentials
  labels:
    app.kubernetes.io/name: {{ include "flowable.name" . }}
type: Opaque
stringData:
  database-user: {{ .Values.database.user | quote }}
  database-password: {{ .Values.database.password | quote }}
  admin-user: {{ required "admin.user: the REST API's account is supplied by the platform" .Values.admin.user | quote }}
  admin-password: {{ required "admin.password: the REST API's account is supplied by the platform" .Values.admin.password | quote }}
