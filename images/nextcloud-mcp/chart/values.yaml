image:
  repository: ghcr.io/gentian-org/nextcloud-mcp
  tag: "0.1.0"
  pullPolicy: IfNotPresent

port: 8765

# Where this sidecar's own Nextcloud account lives -- set by the AppProfile
# (spec.sidecars[].extraValues), not a sensible chart-level default.
nextcloudBaseUrl: "http://nextcloud"
nextcloudMcpUser: "mcp-service"
# nextcloudMcpPassword is populated by the AppProfile's appSecrets ->
# Release set[] mechanism (Crossplane resolves the OpenBao-seeded Secret
# to a plain value at release time -- same pattern nextcloud-base-ce's own
# admin_password/OIDC secrets already use). Never set this directly.

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# Extra labels for the pod template. The platform injects gentianos.io/app and
# gentianos.io/tenant here so the sidecar is selected by the tenant's
# kernel-egress NetworkPolicy and counted against the app that owns it.
podLabels: {}
