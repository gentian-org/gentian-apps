apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextcloud-mcp.fullname" . }}
  labels:
    {{- include "nextcloud-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nextcloud-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nextcloud-mcp.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nextcloud-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: mcp
              containerPort: {{ .Values.port }}
          env:
            - name: NEXTCLOUD_BASE_URL
              value: {{ .Values.nextcloudBaseUrl | quote }}
            - name: MCP_PORT
              value: {{ .Values.port | quote }}
            - name: NEXTCLOUD_MCP_USER
              value: {{ .Values.nextcloudMcpUser | quote }}
            {{- if .Values.nextcloudMcpPassword }}
            - name: NEXTCLOUD_MCP_PASSWORD
              value: {{ .Values.nextcloudMcpPassword | quote }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
