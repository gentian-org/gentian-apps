apiVersion: v1
kind: Service
metadata:
  name: {{ include "odoo-adapter.fullname" . }}
  labels:
    {{- include "odoo-adapter.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "odoo-adapter.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.port }}
      targetPort: mcp
