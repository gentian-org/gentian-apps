{{- /* The tool packs, reviewed with this chart: the adapter offers what is
       here and nothing else. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "odoo-adapter.fullname" . }}-packs
  labels:
    {{- include "odoo-adapter.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "packs/*.yaml" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
