apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odoo-adapter.fullname" . }}
  labels:
    {{- include "odoo-adapter.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "odoo-adapter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "odoo-adapter.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A changed pack restarts the adapter, which reads packs at start.
        checksum/packs: {{ include (print $.Template.BasePath "/packs.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: odoo-adapter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: mcp
              containerPort: {{ .Values.port }}
          env:
            - name: ODOO_URL
              value: {{ .Values.odooUrl | quote }}
            - name: ODOO_DATABASE
              value: {{ .Values.odooDatabase | quote }}
            - name: MCP_PORT
              value: {{ .Values.port | quote }}
            - name: ODOO_ADAPTER_PACKS
              value: /etc/odoo-adapter/packs
            {{- if kindIs "slice" .Values.activeModules }}
            - name: ODOO_ADAPTER_MODULES
              value: {{ join " " .Values.activeModules | quote }}
            {{- end }}
          volumeMounts:
            - name: packs
              mountPath: /etc/odoo-adapter/packs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: packs
          configMap:
            name: {{ include "odoo-adapter.fullname" . }}-packs
