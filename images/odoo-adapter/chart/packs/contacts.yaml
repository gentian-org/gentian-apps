# Tool pack: Odoo Contacts (module contacts, model res.partner).
# The format is in images/odoo-adapter/odoo_tools.py. A change to what a tool
# does, needs or is classed as is a new version of that tool.
module: contacts
tools:
  - name: search-contacts
    version: 1
    class: read
    description: >-
      Find contacts, people and companies, by part of their name, e-mail or
      phone. Answers the newest first.
    model: res.partner
    operation: search
    fields: [id, name, is_company, parent_id, email, phone, city, country_id]
    inputs:
      query:
        description: Part of a name, an e-mail address or a phone number.
        match: [name, email, phone]
      companies_only:
        type: boolean
        description: true for companies only, false for people only. Leave out for both.
        equals: is_company
      limit:
        description: How many contacts to answer at most.
        limit: true
        default: 20
        maximum: 100

  - name: get-contact
    version: 1
    class: read
    description: One contact with its address and notes, by its id.
    model: res.partner
    operation: read
    fields: [id, name, is_company, parent_id, function, email, phone, website, street, street2, zip, city, country_id, comment]
    inputs:
      contact_id:
        description: The contact's id, as search-contacts answers it.
        target: true

  - name: create-contact
    version: 1
    class: change
    description: >-
      Create a contact, a person or a company. A person can belong to a
      company by its id.
    model: res.partner
    operation: create
    inputs:
      name:
        description: The person's full name or the company's name.
        field: name
        required: true
      is_company:
        type: boolean
        description: true for a company, false or left out for a person.
        field: is_company
      company_id:
        description: For a person, the id of the company contact they belong to.
        type: integer
        field: parent_id
      function:
        description: The person's job title.
        field: function
      email:
        description: E-mail address.
        field: email
      phone:
        description: Phone number.
        field: phone
      website:
        description: Website address.
        field: website
      street:
        description: Street and number.
        field: street
      zip:
        description: Postal code.
        field: zip
      city:
        description: City.
        field: city

  - name: update-contact
    version: 1
    class: change
    description: Change a contact's name, job title, e-mail, phone, website or address.
    model: res.partner
    operation: write
    inputs:
      contact_id:
        description: The contact's id.
        target: true
      name:
        description: New name.
        field: name
      function:
        description: New job title.
        field: function
      email:
        description: New e-mail address.
        field: email
      phone:
        description: New phone number.
        field: phone
      website:
        description: New website address.
        field: website
      street:
        description: New street and number.
        field: street
      zip:
        description: New postal code.
        field: zip
      city:
        description: New city.
        field: city
