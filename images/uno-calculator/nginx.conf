# Static files only. No frame or CSP header here: the platform's gateway
# owns them (docs/app-profile-guide.md §7.1).
server {
    listen 8080;
    root /usr/share/nginx/html;
    gzip_static on;
    types { application/wasm wasm; }
    include /etc/nginx/mime.types;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Content-addressed package folders never change.
    location /package_ { add_header Cache-Control "public, immutable, max-age=31536000"; }

    location / {
        add_header Cache-Control "must-revalidate, max-age=3600";
        try_files $uri $uri/ /index.html;
    }
}
