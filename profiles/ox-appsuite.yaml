# AppProfile — OX App Suite Public Sector Edition
#
# Source chart: oci://registry.opencode.de/bmi/opendesk/components/supplier/open-xchange/charts-mirror
#   appsuite-public-sector v2.26.32
# Companion charts (deployed separately or via app-ox Composition):
#   opendesk-open-xchange-bootstrap v4.0.2  — one-time DB/context migration job
#   ox-connector v0.34.0                    — ongoing LDAP→OX user provisioning
# Value paths verified against: opendesk/helmfile/apps/openxchange/values.yaml.gotmpl
# Chart versions from: opendesk/helmfile/environments/default/charts.yaml.gotmpl
#
# Composition selector:
#   Tenants must specify variant: ox in their spec.apps entry:
#     spec:
#       apps:
#         - profile: ox-appsuite
#           variant: ox
#   This selects the app-ox Composition (label gentianos.io/app-variant: ox-appsuite)
#   which additionally emits the appsuite.properties ExternalSecret for OX-specific
#   Java property keys that cannot be expressed as standard Helm --set flags.
#
# Secret inventory:
#   Kernel-provided:
#     database/mariadb  → host, name, user, password  (per-tenant MariaDB DB)
#     smtp              → host, port, user, password  (Postfix submission)
#     oidc              → issuer, client_id, secret   (Keycloak OIDC client)
#     ldap              → host, port, bind_dn,        (nubus LDAP service account)
#                         bind_password
#   App-internal (4):
#     cookie_hash_salt          → session cookie signing key (random)
#     share_crypt_key           → file sharing encryption key (random)
#     sessiond_encryption_key   → sessiond encryption key (random)
#     admin_password            → OX context admin password (random)
#
# Design notes:
#   OX App Suite is a multi-component groupware suite. The main chart
#   (appsuite-public-sector) requires MariaDB for context/user storage,
#   Postfix for SMTP submission, Keycloak for OIDC SSO, and nubus LDAP for
#   directory lookups.
#
#   The bootstrap chart (opendesk-open-xchange-bootstrap) must be deployed
#   BEFORE the main chart on first install — it runs the DB migration job
#   and creates the initial OX admin context. It is idempotent and safe to
#   re-run. Use the gentian CLI:
#     kubectl gentian apps install ox-bootstrap --tenant <tenant>
#
#   The connector chart (ox-connector) syncs users and groups from the
#   nubus LDAP directory into OX contexts. Deploy it AFTER the main chart.
#
#   OX uses com.openexchange.* Java property keys for many settings. These
#   are passed via appsuite.properties (rendered by the app-ox Composition's
#   second ExternalSecret). Standard Helm value paths cover database and SMTP.
#
#   MAIL_SERVICE_MODE=kernel (Dovecot + Postfix): OX reads mail via IMAP from
#   Dovecot. No additional chart config is needed — Dovecot runs as a kernel
#   service and is always accessible at dovecot-dev.gentian-dev.svc.cluster.local.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: ox-appsuite
spec:
  displayName: "OX App Suite"
  description: "Groupware suite with email, contacts, calendar and tasks via Open-Xchange."

  kernelRequirements:
    database:
      engine: mariadb
      databasePerTenant: true
    identity:
      oidc: true
      ldap:
        sync: true
        interval: "1h"
    mail:
      smtp:
        auth: plain
        port: 587

  chart:
    repository: "oci://registry.opencode.de/bmi/opendesk/components/supplier/open-xchange/charts-mirror"
    name: "appsuite-public-sector"
    version: "2.26.32"

  # Value mapping — kernel credential → Helm value path (used for --set entries).
  # Database uses global.mysql.* (opendesk chart convention).
  # SMTP uses the appsuite.properties mechanism via the app-ox Composition.
  # OIDC and LDAP passwords also go through appsuite.properties.
  # The *Key fields double as Java property names in appsuite.properties for
  # the app-ox Composition's secondary ExternalSecret.
  valueMapping:
    database:
      hostKey: "global.mysql.host"
      nameKey: "global.mysql.database"
      userKey: "global.mysql.auth.user"
      passwordKey: "global.mysql.auth.password"
    smtp:
      hostKey: "global.mail.smtpServer"
      portKey: "global.mail.smtpPort"
      userKey: "global.mail.smtpUser"
      passwordKey: "global.mail.smtpPassword"
    oidc:
      issuerKey: "com.openexchange.oidc.html.issuer"
      clientIdKey: "com.openexchange.oidc.clientId"
      clientSecretKey: "com.openexchange.oidc.clientSecret"
    ldap:
      hostKey: "global.ldap.host"
      portKey: "global.ldap.port"
      baseDnKey: "global.ldap.baseDn"
      bindDnKey: "global.ldap.bindDn"
      bindPasswordKey: "global.ldap.bindPassword"

  appSecrets:
    - name: cookie_hash_salt
      valuePath: "global.appsuite.cookieHashSalt"
    - name: share_crypt_key
      valuePath: "global.appsuite.shareCryptKey"
    - name: sessiond_encryption_key
      valuePath: "global.appsuite.sessiondEncryptionKey"
    - name: admin_password
      valuePath: "global.appsuite.adminPassword"

  # Non-secret defaults. ${TENANT_DOMAIN} and ${TENANT_NAMESPACE} are
  # substituted at render time by the app-ox Composition.
  # LDAP host/port are cluster-internal and hardcoded to the dev environment.
  # TODO: make LDAP host env-agnostic via a cluster-scoped ConfigMap lookup.
  extraValues:
    raw: |
      {
        "global": {
          "hostname": "ox.${TENANT_DOMAIN}",
          "ldap": {
            "host": "nubus-dev-ldap-server.gentian-dev.svc.cluster.local",
            "port": 389,
            "baseDn": "dc=swp-ldap,dc=internal",
            "bindDn": "uid=ldapsearch_ox,cn=users,dc=swp-ldap,dc=internal"
          }
        },
        "openXchange": {
          "contextAdminUser": "oxadmin"
        }
      }
