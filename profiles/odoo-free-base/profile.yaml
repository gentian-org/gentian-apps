# AppProfile — Odoo Community base runtime (odoo-free-base)
#
# Deploys one Odoo OCB instance per tenant. Module profiles (odoo-crm, …) install
# Odoo CE modules via app-odoo Jobs in a later phase. OIDC uses app-default Client MR.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-free-base
  labels:
    gentianos.io/profile-name: odoo-free-base
  annotations:
    gentianos.io/platform-app: "true"
spec:
  displayName: "Odoo Platform"
  description: "Odoo Community ERP runtime — required base for Odoo module apps."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: full
  trustTier: platform
  license: LGPL-3.0
  logo: "data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjNzE0QjdGIiByb2xlPSJpbWciIHZpZXdCb3g9IjAgMCAyNCAyNCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBkPSJNMTIgMkM2LjQ4IDIgMiA2LjQ4IDIgMTJzNC40OCAxMCAxMCAxMCAxMC00LjQ4IDEwLTEwUzE3LjUyIDIgMTIgMnptLTEgMTVINXYtMmg2djJ6bTAtNEg1di0yaDZ2MnoiLz48L3N2Zz4="

  deploymentRole: base

  kernelRequirements:
    identity:
      oidc:
        clientId: odoo
        name: Odoo
        accessType: CONFIDENTIAL
        redirectUris:
          - "https://erp.${TENANT_DOMAIN}/auth_oauth/signin"
      ldap:
        sync: true
        interval: 1h
    database:
      engine: postgresql
      databasePerTenant: true
    mail:
      smtp:
        auth: plain
        port: 587

  optionalIntegrations:
    - contract: file-store
      provider: nextcloud
      capabilities: [webdav:read, webdav:write]
    - contract: central-navigation
      provider: portal
      capabilities: [navigation:register]

  provides:
    - name: erp-core
      protocol: http-json

  portalTiles:
    - name: odoo-admin
      displayName:
        en_US: "Odoo Settings"
        de_DE: "Odoo Einstellungen"
      linkSuffix: "/web"
      linkTarget: newwindow
      allowedGroup: "Tenant Admins"

  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.0"

  deploymentMethod: crossplane

  valueMapping:
    oidc:
      issuerKey: "oidc.issuer"
      clientIdKey: "oidc.clientId"
      clientSecretKey: "oidc.clientSecret"
    database:
      hostKey: "database.host"
      portKey: "database.port"
      nameKey: "database.name"
      userKey: "database.user"
      passwordKey: "database.password"
    ldap:
      hostKey: "ldap.host"
      portKey: "ldap.port"
      baseDnKey: "ldap.baseDn"
      bindDnKey: "ldap.bindDn"
      bindPasswordKey: "ldap.bindPassword"
    smtp:
      passwordKey: "smtp.password"

  appSecrets:
    - name: admin_password
      valuePath: "odoo.adminPassword"

  extraValues:
    fullnameOverride: odoo
    tenantId: "${TENANT_ID}"
    ingress:
      enabled: false
    gentian:
      initModules: "base,web,gentian_os"
      modulesPath: /opt/odoo/custom-addons

  ingress:
    subDomain: erp
    serviceName: odoo
    servicePort: 8069
    tlsEnabled: true
