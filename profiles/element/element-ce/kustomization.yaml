apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - profile.yaml
  - composition.yaml
  - oidc-catalog.yaml
configMapGenerator:
  - name: gentian-jitsi-oidc-overlays
    # Beside gentian-cluster-config, where the app composition reads it from:
    # the provisioning namespace of the v5 layout (crossplane-system in v4).
    namespace: kernel-provisioning
    files:
      - gentian-portal-sso.html=assets/gentian-portal-sso.html
generatorOptions:
  disableNameSuffixHash: true
  labels:
    gentianos.io/config-type: jitsi-oidc-overlays
    app.kubernetes.io/managed-by: gentian-os
