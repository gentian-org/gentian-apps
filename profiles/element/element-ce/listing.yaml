profile: element-ce
displayName: "Element"
summary: "Secure team chat, rooms and calls on the open Matrix network, with end-to-end encryption and federation."
description: |
  Element is a messaging and collaboration app built on Matrix, an open, decentralised communication standard; this profile pairs it with the Synapse homeserver. Teams use it for direct messages, group rooms and voice and video calls, including with people on other organisations' servers. Messages and calls are end-to-end encrypted, and federation lets separate servers talk to each other.
categories: [communication, collaboration]
