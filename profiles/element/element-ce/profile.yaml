apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: element-ce
  labels:
    gentianos.io/profile-name: element-ce
  annotations:
    gentianos.io/kernel-egress-namespaces: envoy-gateway-system
    gentianos.io/portal-auth-mode: matrix-bridge
spec:
  displayName: "Element"
  family: element
  edition: ce
  compositionRef: app-element
  description: "Federated team chat and collaboration based on the Matrix protocol, with Synapse homeserver."
  license: Apache-2.0
  author: Element
  tile:
    icon: chat

  portalTiles:
    - name: element-ce
      displayName:
        de_DE: "Chat"
        en_US: "Chat"
      linkTarget: embedded
      allowedGroup: "App Users"

  kernelRequirements:
    identity:
      oidc:
        clientId: "gentian-synapse"
        name: "Element (Synapse)"
        accessType: CONFIDENTIAL
        redirectUris:
          - "https://matrix.${TENANT_DOMAIN}/_synapse/client/oidc/callback"
        postLogoutRedirectUris:
          - "https://chat.${TENANT_DOMAIN}/*"
          - "https://portal.${KERNEL_DOMAIN}/*"
    database:
      engine: postgresql
      databasePerTenant: true
    mail:
      smtp: {}

  provides:
    - name: chat
      protocol: matrix

  chart:
    repository: "https://ananace.gitlab.io/charts"
    name: "matrix-synapse"
    version: "3.12.30"

  valueMapping:
    oidc:
      issuerKey: "extraConfig.oidc_issuer"
      clientIdKey: "extraConfig.oidc_client_id"
      clientSecretKey: "extraConfig.oidc_client_secret"
    database:
      hostKey: "externalPostgresql.host"
      portKey: "externalPostgresql.port"
      nameKey: "externalPostgresql.database"
      userKey: "externalPostgresql.username"
      passwordKey: "externalPostgresql.password"
    smtp:
      passwordKey: "extraConfig.email.smtp_pass"

  appSecrets:
    - name: registration_shared_secret
      valuePath: "config.registrationSharedSecret"

  extraValues:
    serverName: "${TENANT_DOMAIN}"
    publicServerName: "matrix.${TENANT_DOMAIN}"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 512Mi
    wellknown:
      enabled: false
    postgresql:
      enabled: false
    redis:
      enabled: false
    externalPostgresql:
      existingSecret: "element-ce-sensitive-values"
      existingSecretPasswordKey: "db-password"
    extraConfig:
      email:
        enable_notifs: true
        require_transport_security: true
        notif_from: "matrix@${TENANT_DOMAIN}"
        smtp_host: "smtp.${KERNEL_DOMAIN}"
        smtp_port: 587
        smtp_user: "matrix@${TENANT_DOMAIN}"

  deploymentMethod: crossplane

  ingress:
    subDomain: "chat"
    serviceName: "element-ce"
    servicePort: 8080
    tlsEnabled: true
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "100M"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

  additionalIngresses:
    - subDomain: matrix
      serviceName: synapse-web
      servicePort: 8008
      tlsEnabled: true
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "100M"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

  browserProxy:
    - path: matrix
      target: "http://synapse-web.{namespace}.svc/_matrix/"
      authMode: forward-bearer
      stripPrefix: true

  # Customization ladder — see customization.md
  customization:
    grade: B
    rubricScore: 6
    supportedRungs: [L0, L1, L3, L4]   # L3 is Synapse-side only; Element Web has no plugin API
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/element-ce/customization.md
    configure:
      hotReload: false
    dropIns:
      - name: synapse-config
        path: /data/conf.d
        format: yaml
        source: configMap
        maxBytes: 262144
        upstreamDocumented: true
        tenantEditable: false
      - name: element-config
        path: /app/config.d
        format: json
        source: configMap
        upstreamDocumented: true
        tenantEditable: true
        maxBytes: 65536
    extension:
      mechanism: synapse-module
      delivery: [image-layer]
      apiStability: evolving
      apiDocs: https://element-hq.github.io/synapse/latest/modules/index.html
      perTenantAddons: false
      testMatrix: ["1.121"]
    publishes:
      apis:
        - contract: chat
          protocol: matrix
          path: /_matrix/client
          auth: oidc-token-exchange
    repackage:
      chartOwnership: upstream
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
