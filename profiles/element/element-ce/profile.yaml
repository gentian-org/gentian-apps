# SPDX-License-Identifier: AGPL-3.0-only
# ComponentProfile — Element (Matrix chat in the browser)
#
# Source: the upstream chart ananace/element-web, installed unmodified.
#
# Element Web is a page and nothing else: the browser loads it from
# element.<tenant domain>, behind the platform's sign-in, and from then on
# talks to the homeserver itself, at matrix.<tenant domain>, with a token the
# homeserver issued. The homeserver is Synapse (synapse-ce), installed with
# Element and removed with it; it is an app of its own, with its own way in,
# sign-in, data and approvals. Nothing of it is reached from this pod, so
# there is no contract between the two.
#
# Secret inventory: none.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: element-ce
  labels:
    gentianos.io/profile-name: element-ce
    gentianos.io/profile-family: element
    gentianos.io/profile-edition: ce
  annotations:
    gentianos.io/portal-auth-mode: oidc
    # The element-web chart writes imagePullSecrets into the pod spec as it
    # is, so it is given `name:` entries, not plain names.
    gentianos.io/standard-image-pull-secrets: "true"
spec:
  classes:
    - app
  trustTier: experimental
  version: "0.5.4-dev"
  launch: tile
  package:
    chart:
      repository: "https://ananace.gitlab.io/charts"
      name: "element-web"
      version: "1.4.48"

    extraValues:
      # The Service the web entry routes to: element-ce:8080.
      fullnameOverride: "element-ce"
      service:
        port: 8080
      defaultServer:
        url: "https://matrix.${TENANT_DOMAIN}"
        name: "${TENANT_DOMAIN}"
      config:
        brand: "Element"
        # Synapse signs people in through the workspace's sign-in only: the
        # page goes there at once instead of showing Element's welcome page,
        # and offers no account creation of its own.
        sso_redirect_options:
          immediate: true
        setting_defaults:
          UIFeature.registration: false
        jitsi:
          preferred_domain: "meet.jit.si"
      serviceAccount:
        create: false
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # nginx writes its configuration from a template at start, and its
      # cache, pid and temporary files: each on a volume of its own, the
      # root filesystem stays read-only.
      extraVolumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: confd
          emptyDir: {}
      extraVolumeMounts:
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
        - name: tmp
          mountPath: /tmp
        - name: confd
          mountPath: /etc/nginx/conf.d
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi

  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"

  # Installed together with Element where the tenant does not have it, and
  # removed with it: the homeserver every Element page talks to.
  comesWith:
    - synapse-ce

  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: "element"
      backend:
        service: "element-ce"
        port: 8080
      tile:
        displayName: "Chat"
        logo: data:image/png;base64,
        image: assets/tile.png
        relation: can_launch
  customization:
    grade: C
    rubricScore: 3
    supportedRungs: [L0, L1, L4]   # Element Web has no plugin API
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/element/element-ce/customization.md
    configure:
      hotReload: false
    dropIns:
      - name: element-config
        path: /app/config.d
        format: json
        source: configMap
        upstreamDocumented: true
        tenantEditable: true
        maxBytes: 65536
    repackage:
      chartOwnership: upstream
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
