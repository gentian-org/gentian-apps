apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app-element
  labels:
    gentianos.io/composition: app
    gentianos.io/profile: element
    gentianos.io/app-variant: element
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XApp
  mode: Pipeline
  pipeline:

    # ── Step 1: Fetch AppProfile + kernel/cluster ConfigMaps ──────────────────
    - step: fetch-extra-resources
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: AppProfile
              into: appProfile
              apiVersion: gentianos.io/v1alpha1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 1
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name
            - kind: ConfigMap
              into: kernelServices
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: kernel-services
            - kind: ConfigMap
              into: clusterConfig
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: cluster-config
            - kind: OIDCPackCatalog
              into: oidcPackCatalog
              apiVersion: gentianos.io/v1alpha1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name
            - kind: ConfigMap
              into: jitsiOidcOverlays
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: jitsi-oidc-overlays
            - kind: ConfigMap
              into: platformSecurity
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: platform-security

    # ── Step 2: Render composed resources ─────────────────────────────────────
    - step: render-app-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr     := .observed.composite.resource }}
            {{- $spec   := $xr.spec }}
            {{- $xrName := $xr.metadata.name }}
            {{- $app    := $spec.claimRef.name }}
            {{- $ns     := $spec.tenantNamespace }}
            {{- $tenant := trimPrefix "tenant-" $ns }}

            {{- $extraRes  := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{- $profiles  := dig "appProfile" list $extraRes }}
            {{- if eq (len $profiles) 0 }}
              {{- fail (printf "AppProfile %q not found in cluster" $spec.profileRef.name) }}
            {{- end }}
            {{- $profile   := index $profiles 0 }}
            {{- $pSpec     := dig "spec" dict $profile }}
            {{- $vm        := default dict $pSpec.valueMapping }}
            {{- $appSecrets := default list $pSpec.appSecrets }}
            {{- $chart     := $pSpec.chart }}

            {{- $ccRes      := dig "clusterConfig" list $extraRes }}
            {{- $ccCM       := default dict (index $ccRes 0) }}
            {{- $ccData     := dig "data" dict $ccCM }}
            {{- $jitsiOidcOverlaysRes := dig "jitsiOidcOverlays" list $extraRes }}
            {{- $jitsiOverlayCM := default dict (index $jitsiOidcOverlaysRes 0) }}
            {{- $jitsiOverlayData := dig "data" dict $jitsiOverlayCM }}
            {{- $secretMode    := dig "secretMode"     "derived" $ccData }}
            {{- $cnpgHost      := dig "cnpg.host"      "" $ccData }}
            {{- $nodeIP        := dig "node.ip"        "" $ccData }}
            {{- $appInitImage  := dig "appInit.image"  "ghcr.io/gentian-org/gentian-app-init:develop" $ccData }}
            {{- $kr            := default dict $pSpec.kernelRequirements }}
            {{- $identity      := default dict $kr.identity }}
            {{- $oidcPackDefaultScopes := dict }}
            {{- $oidcPackFullScopeAllowed := dict }}
            {{- $catalogRes := dig "oidcPackCatalog" list $extraRes }}
            {{- if gt (len $catalogRes) 0 }}
            {{- $catSpec := dig "spec" dict (index $catalogRes 0) }}
            {{- $catPacks := default dict $catSpec.packs }}
            {{- range $clientId, $pack := $catPacks }}
            {{- $scopes := default list $pack.defaultScopes }}
            {{- if $pack.scopeName }}
            {{- $scopes = append $scopes $pack.scopeName }}
            {{- end }}
            {{- $_ := set $oidcPackDefaultScopes $clientId $scopes }}
            {{- $_ := set $oidcPackFullScopeAllowed $clientId (default false $pack.fullScopeAllowed) }}
            {{- end }}
            {{- end }}

            {{- $domain := $xr.spec.domain }}
            {{- $ksRes  := dig "kernelServices" list $extraRes }}
            {{- $ksCM   := default dict (index $ksRes 0) }}
            {{- $ksCMData := dig "data" dict $ksCM }}
            {{- $kernelDomain := dig "KERNEL_DOMAIN" "" $ksCMData }}
            {{- $keycloakInternal := dig "KEYCLOAK_INTERNAL_URL" "" $ksCMData }}

            {{- /* ── Build ExternalSecret data[] entries ── */}}
            {{- $esData := list }}

            {{- if $vm.oidc }}
            {{- $oidcPath := printf "gentian-os/tenants/%s/apps/%s/oidc" $tenant $app }}
            {{- if $vm.oidc.issuerKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-issuer"        "remoteRef" (dict "key" $oidcPath "property" "issuer")) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-id"     "remoteRef" (dict "key" $oidcPath "property" "client-id")) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- $csPath := default $oidcPath $vm.oidc.clientSecretOpenbaoPath }}
            {{- $csProp := default "client-secret" $vm.oidc.clientSecretOpenbaoProperty }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-secret" "remoteRef" (dict "key" $csPath "property" $csProp)) }}
            {{- end }}
            {{- end }}

            {{- if $vm.database }}
            {{- $dbPath := printf "gentian-os/tenants/%s/apps/%s/database" $tenant $app }}
            {{- if $vm.database.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "db-host"     "remoteRef" (dict "key" $dbPath "property" "host")) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $esData = append $esData (dict "secretKey" "db-port"     "remoteRef" (dict "key" $dbPath "property" "port")) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $esData = append $esData (dict "secretKey" "db-name"     "remoteRef" (dict "key" $dbPath "property" "name")) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $esData = append $esData (dict "secretKey" "db-user"     "remoteRef" (dict "key" $dbPath "property" "user")) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "db-password" "remoteRef" (dict "key" $dbPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- if $vm.smtp }}
            {{- $smtpPath := printf "gentian-os/tenants/%s/apps/%s/smtp" $tenant $app }}
            {{- if $vm.smtp.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-host"     "remoteRef" (dict "key" $smtpPath "property" "host")) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-port"     "remoteRef" (dict "key" $smtpPath "property" "port")) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-user"     "remoteRef" (dict "key" $smtpPath "property" "user")) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-password" "remoteRef" (dict "key" $smtpPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $internalPath := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $esData = append $esData (dict "secretKey" (printf "internal-%s" $s.name)
                "remoteRef" (dict "key" $internalPath "property" "value")) }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit OpenBao KV seeders for app-internal secrets ────────── */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $safeName := $s.name | replace "_" "-" }}
            {{- $seedName := printf "%s-%s-seed" $xrName $safeName }}
            {{- $kvPath   := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $seedVal  := sha256sum (printf "%s:%s:%s" $xrName $app $s.name) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-seed-secret
              name: {{ $seedName }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $seedName }}
                    namespace: crossplane-system
                  type: Opaque
                  stringData:
                    data.json: '{"value":"{{ $seedVal }}"}'
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kv.vault.upbound.io/v1alpha1
            kind: SecretV2
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-kv
              name: {{ $seedName }}-kv
            spec:
              deletionPolicy: Orphan
              managementPolicies:
                - Observe
                - Create
              forProvider:
                mount: secret
                name: {{ $kvPath }}
                dataJsonSecretRef:
                  name: {{ $seedName }}
                  namespace: crossplane-system
                  key: data.json
              providerConfigRef:
                name: openbao
            {{- end }}
            {{- end }}

            {{- /* ── Set up Helm Release / Deployment values mapping ── */}}
            {{- $extraVals    := default dict $spec.parameters.extraValues }}
            {{- $imagePull    := list (dict "name" "registry-credentials") }}

            {{- $secretName := printf "%s-sensitive-values" $app }}
            {{- $relSet := list }}

            {{- if $vm.oidc }}
            {{- if $vm.oidc.issuerKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.issuerKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-issuer"))) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientIdKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-id"))) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientSecretKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-secret"))) }}
            {{- end }}
            {{- $relSet = append $relSet (dict "name" "extraSecrets.oidc_providers[0].client_secret"
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-secret"))) }}
            {{- end }}

            {{- if $vm.database }}
            {{- if $vm.database.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-host"))) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-port"))) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.nameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.smtp }}
            {{- if $vm.smtp.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-password"))) }}
            {{- end }}
            {{- end }}

            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $relSet = append $relSet (dict "name" $s.valuePath
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- end }}
            {{- end }}

            {{- $elementOverlayCM := printf "%s-sso-overlay" $xrName }}

            {{- /* ── Emit ExternalSecret ──────────────────────────────────────── */}}
            {{- if gt (len $esData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-externalsecret
              name: {{ $xrName }}-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $secretName }}
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $secretName }}
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      {{ toYaml $esData | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-sso-overlay-cm
              name: {{ $xrName }}-sso-overlay-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $elementOverlayCM }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/app: {{ $app }}
                      gentianos.io/tenant: {{ $tenant }}
                  data:
                    config.json: |
                      {
                        "default_server_config": {
                          "m.homeserver": {
                            "base_url": "https://matrix.{{ $domain }}",
                            "server_name": "{{ $domain }}"
                          }
                        },
                        "brand": "Element",
                        "jitsi": {
                          "preferred_domain": "meet.jit.si"
                        }
                      }
                  binaryData:
                    gentian-portal-sso.html: {{ index $jitsiOverlayData "gentian-portal-sso.html" | default "" | b64enc | quote }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Element Deployment ────────────────────────────────────────── */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-deployment
              name: {{ $xrName }}-element-deployment
            spec:
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: element
                    namespace: {{ $ns }}
                    labels:
                      app: element
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/app: {{ $app }}
                      gentianos.io/tenant: {{ $tenant }}
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app: element
                    template:
                      metadata:
                        labels:
                          app: element
                          gentianos.io/app: {{ $app }}
                          gentianos.io/tenant: {{ $tenant }}
                      spec:
                        containers:
                          - name: element
                            image: docker.io/vectorim/element-web:v1.11.90
                            imagePullPolicy: IfNotPresent
                            ports:
                              - containerPort: 8080
                                name: http
                            env:
                              - name: ELEMENT_WEB_PORT
                                value: "8080"
                            securityContext:
                              runAsNonRoot: true
                              runAsUser: 101
                              runAsGroup: 101
                              allowPrivilegeEscalation: false
                              capabilities:
                                drop: ["ALL"]
                              privileged: false
                              readOnlyRootFilesystem: true
                              seccompProfile:
                                type: RuntimeDefault
                            volumeMounts:
                              - name: config
                                mountPath: /app/config.json
                                subPath: config.json
                              - name: config
                                mountPath: /app/gentian-portal-sso.html
                                subPath: gentian-portal-sso.html
                              - name: cache
                                mountPath: /var/cache/nginx
                              - name: run
                                mountPath: /var/run
                              - name: tmp
                                mountPath: /tmp
                              - name: confd
                                mountPath: /etc/nginx/conf.d
                        volumes:
                          - name: config
                            configMap:
                              name: {{ $elementOverlayCM }}
                          - name: cache
                            emptyDir: {}
                          - name: run
                            emptyDir: {}
                          - name: tmp
                            emptyDir: {}
                          - name: confd
                            emptyDir: {}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Element Service ───────────────────────────────────────────── */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-service
              name: {{ $xrName }}-element-service
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: element
                    namespace: {{ $ns }}
                    labels:
                      app: element
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/app: {{ $app }}
                      gentianos.io/tenant: {{ $tenant }}
                  spec:
                    selector:
                      app: element
                    ports:
                      - port: 8080
                        targetPort: http
                        protocol: TCP
                    type: ClusterIP
              providerConfigRef:
                name: kubernetes

            {{- /* ── Release 2: Synapse (matrix-synapse) ─────────────────────── */}}
            {{- $synapseVals := dict
                "fullnameOverride" "synapse-web"
                "image" (dict
                  "repository" "ghcr.io/element-hq/synapse"
                  "tag" "v1.115.0"
                  "pullPolicy" "IfNotPresent"
                )
                "serverName" $domain
                "publicServerName" (printf "matrix.%s" $domain)
                "wellknown" (dict "enabled" false)
                "postgresql" (dict "enabled" false)
                "redis" (dict "enabled" true)
                "externalPostgresql" (dict
                  "existingSecret" $secretName
                  "existingSecretPasswordKey" "db-password"
                )
                "synapse" (dict
                  "labels" (dict
                    "gentianos.io/app" $app
                    "gentianos.io/tenant" $tenant
                  )
                  "podSecurityContext" (dict
                    "fsGroup" 666
                    "runAsGroup" 666
                    "runAsUser" 666
                    "seccompProfile" (dict "type" "RuntimeDefault")
                  )
                  "securityContext" (dict
                    "allowPrivilegeEscalation" false
                    "capabilities" (dict "drop" (list "ALL"))
                    "privileged" false
                    "readOnlyRootFilesystem" true
                    "runAsNonRoot" true
                    "runAsUser" 666
                    "seccompProfile" (dict "type" "RuntimeDefault")
                  )
                  "extraEnv" (list
                    (dict "name" "OIDC_CLIENT_SECRET" "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "key" "oidc-client-secret")))
                    (dict "name" "AUTHLIB_INSECURE_TRANSPORT" "value" "1")
                    (dict "name" "OAUTHLIB_INSECURE_TRANSPORT" "value" "1")
                  )
                  "extraCommands" (list
                    (printf "(python -c \"import socket, time; any(socket.socket(socket.AF_INET, socket.SOCK_STREAM).connect_ex(('127.0.0.1', 8008)) == 0 or time.sleep(1) for _ in range(300))\" && register_new_matrix_user -c /synapse/config/homeserver.yaml -c /synapse/config/conf.d/secrets.yaml -u gentian-portal-bridge -p \"portal-bridge-not-used-for-login\" -a || true) &")
                  )
                  "resources" (dict
                    "limits" (dict "cpu" "1" "memory" "2Gi")
                    "requests" (dict "cpu" "250m" "memory" "512Mi")
                  )
                )
                "signingkey" (dict
                  "job" (dict
                    "enabled" true
                    "podSecurityContext" (dict
                      "allowPrivilegeEscalation" false
                      "capabilities" (dict "drop" (list "ALL"))
                      "privileged" false
                      "readOnlyRootFilesystem" false
                      "runAsNonRoot" true
                      "runAsUser" 666
                      "seccompProfile" (dict "type" "RuntimeDefault")
                    )
                    "securityContext" (dict
                      "fsGroup" 666
                      "runAsGroup" 666
                      "runAsUser" 666
                      "seccompProfile" (dict "type" "RuntimeDefault")
                    )
                  )
                )
                "extraConfig" (dict
                  "email" (dict
                    "enable_notifs" true
                    "require_transport_security" true
                    "notif_from" (printf "matrix@%s" $domain)
                    "smtp_host" (printf "smtp.%s" $kernelDomain)
                    "smtp_port" 587
                    "smtp_user" (printf "matrix@%s" $domain)
                  )
                )
                "extraSecrets" (dict
                  "oidc_providers" (list (dict
                    "idp_id" "keycloak"
                    "idp_name" "Keycloak"
                    "discover" false
                    "issuer" (printf "https://id.%s/auth/realms/%s" $kernelDomain $tenant)
                    "client_id" "gentian-synapse"
                    "client_secret" "@@OIDC_CLIENT_SECRET@@"
                    "scopes" (list "openid" "profile" "email")
                    "use_insecure_ssl_client_just_for_testing_do_not_use" true
                    "authorization_endpoint" (printf "https://id.%s/auth/realms/%s/protocol/openid-connect/auth" $kernelDomain $tenant)
                    "token_endpoint" (printf "%s/realms/%s/protocol/openid-connect/token" $keycloakInternal $tenant)
                    "userinfo_endpoint" (printf "%s/realms/%s/protocol/openid-connect/userinfo" $keycloakInternal $tenant)
                    "jwks_uri" (printf "%s/realms/%s/protocol/openid-connect/certs" $keycloakInternal $tenant)
                    "user_mapping_provider" (dict
                      "config" (dict
                        "subject_claim" "sub"
                        "localpart_template" `{{ user.preferred_username }}`
                      )
                    )
                  ))
                )
            }}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-synapse-release
              name: {{ $xrName }}-synapse-release
            spec:
              forProvider:
                chart:
                  repository: "https://ananace.gitlab.io/charts"
                  name: "matrix-synapse"
                  version: "3.12.30"
                namespace: {{ $ns }}
                wait: false
                values:
                  {{ toYaml $synapseVals | nindent 18 }}
                {{- if gt (len $relSet) 0 }}
                set:
                  {{ toYaml $relSet | nindent 18 }}
                {{- end }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Emit database-init resources (when AppProfile requires database.databasePerTenant ── */}}
            {{- $dbRequirements := default dict $kr.database }}
            {{- if and $dbRequirements.databasePerTenant (eq (default "" $dbRequirements.engine) "postgresql") $cnpgHost }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-sa
              name: {{ $xrName }}-db-init-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: app-init
                    namespace: {{ $ns }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-cm
              name: {{ $xrName }}-db-init-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-db-init
                    namespace: {{ $ns }}
                  data:
                    init.sh: |
                      #!/bin/sh
                      set -eu
                      JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                      BAO_TOKEN=$(curl -k -sf "${BAO_ADDR}/v1/auth/kubernetes/login" \
                        -H 'Content-Type: application/json' \
                        -d "{\"role\":\"app-init\",\"jwt\":\"${JWT}\"}" \
                        | jq -r '.auth.client_token')
                      EXISTING=$(curl -k -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/database" \
                        2>/dev/null || echo '{}')
                      CNPG=$(curl -k -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/database/cnpg")
                      SU_USER=$(echo "${CNPG}" | jq -r '.data.data.superuser_username')
                      SU_PASS=$(echo "${CNPG}" | jq -r '.data.data.superuser_password')
                      ROLE=$(printf '%s_%s' "${TENANT}" "${APP}" | tr '-' '_')
                      DBNAME="${ROLE}"
                      export PGPASSWORD="${SU_PASS}"
                      SKIP_BAO_WRITE=false
                      if echo "${EXISTING}" | jq -e '.data.data.password' >/dev/null 2>&1; then
                        PASSWORD=$(echo "${EXISTING}" | jq -r '.data.data.password')
                        ROLE_EXISTS=$(psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '${ROLE}'" 2>/dev/null || echo "")
                        if [ "${ROLE_EXISTS}" = "1" ]; then
                          echo "[db-init] credential and Postgres role present for ${TENANT}/${APP} — skipping"
                          exit 0
                        fi
                        echo "[db-init] OpenBao credential present but Postgres role missing — reconciling"
                        SKIP_BAO_WRITE=true
                      elif [ "${SECRET_MODE}" = "random" ]; then
                        PASSWORD=$(openssl rand -hex 32)
                      else
                        MASTER=$(curl -k -sf \
                          -H "X-Vault-Token: ${BAO_TOKEN}" \
                          "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/internal/master-password" \
                          | jq -r '.data.data.value')
                        PASSWORD=$(printf '%s:%s:database' "${TENANT}" "${APP}" \
                          | openssl dgst -sha256 -hmac "${MASTER}" | awk '{print $2}')
                      fi
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 <<SQL
                      DO \$\$
                      BEGIN
                        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${ROLE}') THEN
                          CREATE ROLE "${ROLE}" WITH LOGIN PASSWORD '${PASSWORD}';
                        ELSE
                          ALTER ROLE "${ROLE}" WITH PASSWORD '${PASSWORD}';
                        END IF;
                      END \$\$;
                      SQL
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 \
                        -c "SELECT 'CREATE DATABASE \"${DBNAME}\" OWNER \"${ROLE}\"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${DBNAME}')" \
                        | grep -q 'CREATE DATABASE' \
                        && psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres \
                             -c "CREATE DATABASE \"${DBNAME}\" OWNER \"${ROLE}\"" || true
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d "${DBNAME}" -v ON_ERROR_STOP=1 \
                        -c "CREATE SCHEMA IF NOT EXISTS \"${DBNAME}\" AUTHORIZATION \"${ROLE}\";"
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d "${DBNAME}" -v ON_ERROR_STOP=1 \
                        -c "GRANT ALL ON SCHEMA \"${DBNAME}\" TO \"${ROLE}\";"
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 \
                        -c "ALTER ROLE \"${ROLE}\" SET search_path TO \"${DBNAME}\", public;"
                      echo "[db-init] role ${ROLE}, database ${DBNAME}, and schema ${DBNAME} ensured"
                      if [ "${SKIP_BAO_WRITE}" != "true" ]; then
                        curl -k -sf \
                          -H "X-Vault-Token: ${BAO_TOKEN}" \
                          -H 'Content-Type: application/json' \
                          -X POST \
                          -d "{\"data\":{\"host\":\"${CNPG_HOST}\",\"port\":\"5432\",\"name\":\"${DBNAME}\",\"user\":\"${ROLE}\",\"password\":\"${PASSWORD}\"}}" \
                          "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/database"
                        echo "[db-init] OpenBao credential written for ${TENANT}/${APP}"
                      fi
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-job
              name: {{ $xrName }}-db-init-job
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $app }}-db-init
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                  spec:
                    ttlSecondsAfterFinished: 600
                    backoffLimit: 10
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/managed-by: gentian-os
                          gentianos.io/tenant: {{ $tenant }}
                          gentianos.io/app: {{ $app }}
                          gentianos.io/component: app-init
                      spec:
                        serviceAccountName: app-init
                        restartPolicy: OnFailure
                        securityContext:
                          seccompProfile:
                            type: RuntimeDefault
                        volumes:
                          - name: scripts
                            configMap:
                              name: {{ $app }}-db-init
                        containers:
                          - name: database-init
                            image: {{ $appInitImage | quote }}
                            securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                drop:
                                  - ALL
                              seccompProfile:
                                type: RuntimeDefault
                            command:
                              - /bin/sh
                              - /scripts/init.sh
                            volumeMounts:
                              - name: scripts
                                mountPath: /scripts
                            env:
                              - name: TENANT
                                value: {{ $tenant }}
                              - name: APP
                                value: {{ $app }}
                              - name: BAO_ADDR
                                value: "https://openbao.openbao.svc.cluster.local:8200"
                              - name: CNPG_HOST
                                value: {{ $cnpgHost | quote }}
                              - name: SECRET_MODE
                                value: {{ $secretMode | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

    # ── Step 3: Mark XR Ready when all composed resources are Ready ───────────
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready

    # ── Step 4: Gate Helm releases until OIDC pack scopes are attached ─────────
    - step: sequence-element-oidc-scopes
      functionRef:
        name: function-sequencer
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        resetCompositeReadiness: true
        rules:
          - sequence:
            - .*-keycloak-client
            - .*-keycloak-default-scopes
          - sequence:
            - .*-keycloak-default-scopes
            - .*-synapse-release
