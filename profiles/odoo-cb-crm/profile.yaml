apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-cb-crm
  labels:
    gentianos.io/profile-name: odoo-cb-crm
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: module
    gentianos.io/requires-profile: odoo-cb-base
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["crm"],"gentianOdooGroupRoles":["sales_team.group_sale_salesman"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo CRM"
  description: "Customer Relationship Management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: standard
  trustTier: platform
  license: LGPL-3.0
  tile:
    icon: crm

  portalTiles:
    - name: odoo-crm
      displayName:
        en_US: "Odoo CRM"
        de_DE: "Odoo CRM"
      linkSuffix: "/web?gentian_embed=1&action=crm.crm_lead_action_pipeline"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: http://192.168.0.100:8089
    name: odoo
    version: "0.1.3"
  extraValues:
    odoo:
      module: crm
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
