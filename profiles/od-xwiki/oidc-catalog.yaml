# OIDC pack for XWiki (clientId: opendesk-xwiki).
apiVersion: gentianos.io/v1alpha1
kind: OIDCPackCatalog
metadata:
  name: xwiki-oidc
  labels:
    gentianos.io/oidc-catalog: xwiki
    gentianos.io/profile-name: od-xwiki
spec:
  mapperTemplates:
    opendesk_useruuid:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: entryUUID
        claim.name: opendesk_useruuid
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    opendesk_username:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: uid
        claim.name: opendesk_username
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    email:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: email
        claim.name: email
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    full_name:
      keycloakName: "full name"
      protocolMapper: oidc-full-name-mapper
      config:
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
  packs:
    opendesk-xwiki:
      scopeName: opendesk-xwiki-scope
      scopeDescription: "Scope for XWiki OIDC clients."
      clientRole: opendesk-xwiki-access-control
      entitlementGroup: managed-by-attribute-Knowledgemanagement
      publicClient: false
      fullScopeAllowed: false
      defaultScopes:
        - profile
        - email
        - roles
        - web-origins
        - acr
      mappers:
        - opendesk_useruuid
        - opendesk_username
        - full_name
        - email
