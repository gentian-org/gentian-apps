author: Docmost
  # Docmost's own "D" mark rather than a catalogue glyph, so the tile is
  # recognisable as the product. Traced from the app icon Docmost ships
  # (apps/client/public/icons/app-icon-512x512.png — they publish no SVG) and
  # redrawn in the design system's frame and glyph colour, so it still sits
  # with the other tiles instead of importing a second visual language.
  #
  # tile.logo is the inlined asset: regenerate with
  # scripts/sync-profile-tile.py after editing assets/tile.svg.
license: AGPL-3.0-only
