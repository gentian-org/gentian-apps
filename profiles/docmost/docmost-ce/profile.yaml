# AppProfile — Docmost (self-hosted collaborative wiki & docs)
#
# Source: no upstream Helm chart exists for Docmost (docker-compose only), so
#   this profile is backed by a first-party Gentian chart: charts/docmost/
#   (same pattern as charts/mathesar and charts/odoo — see
#   docs/app-profile-guide.md §0 Consequence 3). The chart wraps the official
#   docker.io/docmost/docmost image unmodified.
#
# ── SSO: why there is no kernelRequirements.identity.oidc ───────────────────
# Docmost is dual-licensed (AGPL-3.0 core + a separate Enterprise/"ee" tree).
# Verified directly against the docmost/docmost source (2026-08-11):
#   - ALL SSO — SAML 2.0, OIDC, *and* LDAP — lives under apps/server/src/ee/
#     and only activates with a paid Business/Enterprise subscription; the
#     pricing page lists "SSO (SAML 2.0 / OIDC / LDAP)" as a Business-tier
#     feature. There is no free/CE OIDC path the way there is for OpenProject
#     or XWiki — declaring kernelRequirements.identity.oidc here and wiring a
#     Keycloak client into Docmost's own OIDC settings would require an
#     AP_LICENSE_KEY-equivalent Enterprise subscription, which the "no
#     licensing bypass" prohibition above forbids us from working around.
#   - What CE *does* ship, unlicensed, in apps/server/src/core/: a plain
#     email+password AuthController (POST /api/auth/login), a workspace
#     bootstrap endpoint (POST /api/auth/setup), and a self-hosted-only
#     invite flow (POST /api/workspace/invites/{create,link,accept}) that
#     lets an admin mint an invite *link* without sending an email
#     (invites/link explicitly 403s on Docmost Cloud — it exists for exactly
#     this self-hosted use case).
#
# The SSO answer used here: real Keycloak authentication happens once, same
# as every other app, but it is terminated by the existing generic
# **gentian-sidecar-sso-saml** sidecar (charts/gentian-sidecar-sso-saml —
# already shipped for activepieces-me's own Enterprise-gated SSO, see that
# profile's header comment) instead of by Docmost's own SSO code. Keycloak
# sees a SAML Service Provider (kernelRequirements.identity.saml below).
#
# Where the SSO-→-CE-session translation actually happens is *not* inside
# the sso-saml sidecar itself, deliberately:
#
#   1. The sidecar's onLogin handler (spec.sidecars[0].extraValues.handler
#      Script) is a thin relay — it POSTs the SAML profile to an internal
#      /ensure-session endpoint and forwards whatever Set-Cookie comes back.
#      It holds no Docmost secret at all.
#   2. That endpoint is a small companion container ("bridge") baked into
#      this profile's *own* first-party chart (charts/docmost/templates/
#      deployment.yaml + configmap-bridge.yaml), running in the same pod as
#      Docmost itself, reachable only via the docmost-ce Service's internal
#      "bridge" port — never exposed publicly. It holds the admin/HMAC
#      secrets and does the actual work: log the target user into Docmost's
#      own free CE POST /api/auth/login with a deterministic per-user
#      password, and on first use only, provision the account via the
#      self-hosted-only invite flow (POST /api/workspace/invites/
#      {create,link,accept} — invites/link explicitly 403s on Docmost Cloud;
#      it exists for exactly this kind of self-hosted, no-SMTP-needed use).
#
# Why split it this way rather than putting the provisioning logic straight
# in the sidecar (simpler on paper): the sidecar is a *separate* Helm
# release/pod from Docmost, so it needs its own way to reach the admin_
# password/bridge_secret appSecrets. Kubernetes envFrom cannot deliver them —
# gentian-os's own app-default composition documents that kubelet silently
# drops any envFrom-materialized key that isn't a valid C_IDENTIFIER, and the
# fixed "internal-<name>" flat-secret-key convention every appSecret gets is
# never one (crossplane/compositions/app-default.yaml, "Individual
# secretKeyRef env vars for postInstallJob" comment). The sso-saml chart's
# only other value-injection surface, extraEnvVars, takes literal values, not
# secretKeyRefs — and reaching for the one place literal secret injection
# *would* land (a Helm --set on a specific array index, appSecrets.valuePath
# = "extraEnvVars[N].value") turns out to be the same "values: + set: don't
# reliably merge onto one array element" gotcha gentian-pro's own
# od-element/composition.yaml has to explicitly filter *out* of its Synapse
# release for identical reasons. This profile's own chart doesn't have any
# of these constraints — it already delivers appSecret literally to
# APP_SECRET with no issue (see deployment.yaml) — so the bridge lives there
# instead, and the cross-release sidecar is kept deliberately secret-free.
#
# Session cookies are httpOnly + SameSite=Lax with no explicit cookie
# `domain` attribute (Docmost source: apps/server/src/core/auth/
# auth.controller.ts setAuthCookie) — they bind to whatever origin issues the
# Set-Cookie response, which is why the SAML ACS endpoint must be same-origin
# with the app (see the gateway-api-backends annotation below), not a
# separate kernel-side redirect. The bridge container mints the cookie by
# calling Docmost over localhost (same pod); the sidecar (different pod)
# relays that cookie in *its own* response to the browser, which is what
# actually makes it a same-origin cookie for docs.${TENANT_DOMAIN}.
#
# Secret inventory:
#   Kernel-provided:
#     pg_*        → database.host/port/name/user/password (valueMapping)
#     s3_secret_key → s3.secretAccessKey (valueMapping)
#     smtp_password  → smtp.password (valueMapping)
#   (no Redis credentials: Docmost runs its own pod-local Redis with no auth —
#    see kernelRequirements below and charts/docmost/values.yaml "redis")
#   App-internal (3) → appSecrets, all three delivered as literal Helm
#   values (same mechanism as OpenProject's admin_password / Mathesar's
#   SECRET_KEY) and consumed only by charts/docmost's own "bridge" container
#   — never by the "docmost" container itself except appSecret:
#     app_secret     → appSecret (Docmost JWT session-signing key, min 32
#                      chars — pinned so pod restarts don't invalidate every
#                      session; see charts/docmost/values.yaml). This one
#                      *is* consumed by the main "docmost" container.
#     admin_password → adminUser.password (bridge-only machine admin
#                      account; never signed in by a human).
#     bridge_secret  → bridge.secret. HMACed with each user's email inside
#                      the bridge container to derive a stable per-user
#                      Docmost password nobody ever sees or needs to know.
#                      If this secret is ever rotated, previously-
#                      provisioned users' deterministic password changes too
#                      and they cannot self-recover (Docmost CE has no admin
#                      "reset another user's password" endpoint, only self-
#                      service change-password/forgot-password) — treat it
#                      as stable infrastructure, same assumption the
#                      openproject-ce bridge already makes about its own
#                      shared secret.
#
# Known limitation: because Docmost links no identity to an OIDC/SAML claim
# (unlike Mathesar's SSO, which is CE and links by email — see
# profiles/mathesar/mathesar-ce/profile.yaml), the bridge is the *only* login
# path. A user who somehow reaches Docmost's native /login form has no way
# in — this is intentional (the deterministic bridge password is a secret,
# never displayed), not a bug.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: docmost-ce
  labels:
    gentianos.io/profile-name: docmost-ce
  annotations:
    # Routes the SAML ACS callback to the sso-saml sidecar's own Service on
    # the SAME public hostname as Docmost itself — required so the session
    # cookie the sidecar mints lands on the correct origin (see cookie note
    # above). serviceName/port match spec.sidecars[0].stableServiceName /
    # stableServicePort below — the gentian-os app-default composition's
    # sidecar-emission step (crossplane/compositions/app-default.yaml, "Emit
    # sidecars") gives the Helm-managed sidecar release an unpredictable
    # generated name ({xrName}-{sidecar}-release), so it additionally emits a
    # plain, predictably-named ClusterIP Service aliasing it whenever
    # stableServiceName is set — precisely for cases like this one, where
    # something outside the release (here, a Gateway route) needs to address
    # the sidecar by a fixed name. Confirmed against a real, current worked
    # example: profiles/nextcloud/base/base-ce/profile.yaml's "mcp" sidecar
    # sets stableServiceName: nextcloud-mcp / stableServicePort: 8765 for the
    # same reason (also gentian-pro/profiles/od-element/profile.yaml's
    # "jitsi" sidecar → stableServiceName: jitsi-web, referenced directly by
    # that profile's own additionalIngresses.serviceName).
    # /sso covers both endpoints the sidecar serves: /sso/login (starts the
    # SAML flow) and /sso/acs (consumes the assertion). These are the
    # sidecar's real paths — see images/gentian-sidecar-sso-saml/bridge.js.
    # There is no path rewrite available here, so the routed prefix and the
    # sidecar's own routes have to be the same strings.
    gentianos.io/gateway-api-backends: '[{"pathPrefix":"/sso","serviceName":"docmost-sso","port":8081}]'
    # Auto-login: opening the app lands on Docmost's own login form, which is
    # a dead end here because the per-user passwords are HMAC-derived secrets
    # nobody is shown. Redirecting GET / into the SAML flow makes the tile (and
    # the bare URL) authenticate instead of asking. This is safe from a
    # redirect loop only because the loop is broken deliberately: the bridge
    # handler finishes on /home rather than /, and this annotation matches
    # exactly / and nothing else. Docmost's own router treats / as a redirect
    # to /home anyway (apps/client/src/App.tsx), so nothing is lost.
    gentianos.io/gateway-root-redirect: /sso/login
spec:
  displayName: "Docmost"
  description: "Open-source collaborative wiki and documentation — a self-hosted Confluence/Notion alternative."
  family: docmost
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: certified
  license: AGPL-3.0-only
  author: Docmost
  tile:
    icon: documents

  kernelRequirements:
    identity:
      # SAML, not OIDC: see the header comment. Keycloak issues assertions to
      # the sso-saml sidecar, never to Docmost itself.
      saml:
        entityId: Docmost
        acsUrl: "https://docs.${TENANT_DOMAIN}/sso/acs"
    database:
      engine: postgresql
      databasePerTenant: true
    storage:
      s3:
        bucketPerTenant: true
    # No cache: requirement — Docmost runs its own dedicated in-pod Redis
    # (charts/docmost, values.yaml "redis"). It cannot use the shared kernel
    # Redis because parseRedisUrl drops the username and so can never
    # authenticate as the per-app ACL user the kernel provisions; see the
    # chart comment for the full reasoning. Requesting a cache here would
    # provision an ACL user that nothing can ever use.
    mail:
      smtp:
        auth: plain
        port: 587

  provides:
    - name: document-collaboration
      protocol: http-html

  optionalIntegrations:
    - contract: central-navigation
      provider: portal
      capabilities:
        - navigation:register

  portalTiles:
    - name: docmost-ce
      displayName:
        de_DE: "Docmost"
        en_US: "Docmost"
      # Not a Direct-OIDC-Flow app (§8a) — the operator must route the tile's
      # launch URL to the Keycloak SAML IdP-initiated SSO endpoint for the
      # `Docmost` SAML client, the same way it already does for
      # activepieces-me's identity.saml tile, not to the bare app hostname.
      linkTarget: embedded
      allowedGroup: "App Users"

  chart:
    repository: "oci://ghcr.io/gentian-org/charts"
    name: docmost
    version: "0.2.2"

  deploymentMethod: crossplane

  valueMapping:
    database:
      hostKey: "database.host"
      portKey: "database.port"
      nameKey: "database.name"
      userKey: "database.user"
      passwordKey: "database.password"
    s3:
      secretKeyKey: "s3.secretAccessKey"
    smtp:
      passwordKey: "smtp.password"

  appSecrets:
    - name: app_secret
      valuePath: "appSecret"
    - name: admin_password
      valuePath: "adminUser.password"
    - name: bridge_secret
      valuePath: "bridge.secret"

  ingress:
    subDomain: "docs"
    serviceName: "docmost-ce"
    servicePort: 3000
    tlsEnabled: true

  extraValues:
    appUrl: "https://docs.${TENANT_DOMAIN}"

    fullnameOverride: "docmost-ce"

    # database.* is deliberately absent here — all five fields come from
    # valueMapping above (the per-tenant Postgres the operator provisions),
    # not a static placeholder. Setting them here too would race the
    # composition's own injection at the same values paths — see
    # docs/app-profile-guide.md §3 and §12 checklist. Redis needs nothing at
    # all: it is pod-local on 127.0.0.1 with no credentials (see the chart).

    s3:
      accessKeyId: "${TENANT_ID}-docmost"
      region: "us-east-1"
      bucket: "${TENANT_ID}-docmost"
      endpoint: "${S3_ENDPOINT}"
      forcePathStyle: true

    smtp:
      host: "${SMTP_HOST}"
      port: 587
      username: "${TENANT_ID}-docmost"
      secure: false
      fromAddress: "docmost@${TENANT_DOMAIN}"

    # docs.docmost.com/self-hosting/environment-variables lists an anonymous
    # usage-telemetry ping and (separately) SAML_DISABLE_REQUESTED_AUTHN_CONTEXT
    # as an ee/-adjacent knob; DISABLE_TELEMETRY is the only outbound-call
    # toggle confirmed in CE — audit for others (avatar/gravatar fetches,
    # update checks) per docs/app-profile-guide.md §6g before going live.
    telemetry:
      disabled: true

    ingress:
      enabled: false

    podAnnotations:
      secret.reloader.stakater.com/reload: docmost-ce-sensitive-values

  # No postInstallJob: workspace bootstrap (POST /api/auth/setup) is done
  # lazily by the bridge container itself, the first time an admin login
  # attempt fails — see charts/docmost/templates/configmap-bridge.yaml
  # (ensureWorkspaceSetUp). A separate one-shot Job would need its own way
  # to reach the same admin_password value the bridge container uses, which
  # runs into the exact envFrom/C_IDENTIFIER problem explained in the header
  # comment; the bridge container already has it as a clean literal env var,
  # so it's simpler for it to own bootstrap too.

  sidecars:
    - name: sso
      chart:
        repository: "oci://ghcr.io/gentian-org/charts"
        name: gentian-sidecar-sso-saml
        # 0.1.6 adds the standard app.kubernetes.io/instance pod label that
        # stableServiceName's alias Service selects on — 0.1.5 (which
        # activepieces-me still pins, and does not need this since it reaches
        # the sidecar through its own nginx instead) would yield an alias
        # Service with no endpoints.
        version: "0.1.7"
      extraValues:
        podLabels:
          gentianos.io/app: docmost-ce
        # latest is the only tag this image publishes, and the node already has
        # it cached from activepieces-me, so IfNotPresent would keep serving a
        # stale build that predates the configurable-ACS-path fix.
        image:
          pullPolicy: Always
        sso:
          tenantId: ${TENANT_ID}
          kernelDomain: ${KERNEL_DOMAIN}
          issuer: Docmost
          # Must match kernelRequirements.identity.saml.acsUrl above and the
          # routed prefix in gateway-api-backends. Without this the sidecar
          # advertises Activepieces' /api/v1/authn/saml/acs to Keycloak, which
          # routes nowhere on this host.
          acsPath: /sso/acs
        # Only non-secret config: BRIDGE_URL is the docmost-ce Service's
        # internal-only "bridge" port (charts/docmost — see header comment
        # for why the provisioning logic and its secrets live there instead
        # of here). This sidecar never receives a Docmost secret.
        extraEnvVars:
          - name: BRIDGE_URL
            value: "http://docmost-ce.${TENANT_NAMESPACE}.svc.cluster.local:8090/ensure-session"
        # Deliberately thin: translates a Keycloak SAML assertion into a
        # single call to this profile's own bridge container (charts/docmost
        # /templates/configmap-bridge.yaml), which does the actual work
        # against Docmost's free CE local-auth API — never
        # apps/server/src/ee/. See header comment for the full design.
        handlerScript: |
          module.exports = {
            onLogin: async (profile, req, res) => {
              const email = String(profile.email || '').trim().toLowerCase();
              if (!email) {
                res.writeHead(400, { 'Content-Type': 'text/plain' });
                res.end('Docmost bridge: SAML assertion has no email attribute');
                return;
              }
              try {
                const bridgeRes = await fetch(process.env.BRIDGE_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    email,
                    firstName: profile.firstName || '',
                    lastName: profile.lastName || '',
                  }),
                });
                const body = await bridgeRes.json();
                if (!bridgeRes.ok || !body.cookie) {
                  throw new Error(body.error || `bridge returned ${bridgeRes.status}`);
                }
                // /home, not / — the tenant gateway redirects GET / into
                // /sso/login, so finishing on / would bounce the user straight
                // back into the SAML flow forever. /home is where Docmost's
                // own router sends / anyway.
                res.writeHead(302, { Location: '/home', 'Set-Cookie': body.cookie });
                res.end();
              } catch (err) {
                console.error('docmost sso bridge relay failed:', err);
                res.writeHead(502, { 'Content-Type': 'text/plain' });
                res.end('Docmost bridge: could not establish a session');
              }
            },
          };
      # Gives this sidecar's Service a fixed name the gateway-api-backends
      # annotation above can reference — the sidecar's own Helm Release gets
      # an unpredictable generated name ({xrName}-sso-release), same as any
      # sidecar; see app-default.yaml's "Emit sidecars" step. Same field
      # nextcloud/base/base-ce/profile.yaml's "mcp" sidecar and
      # gentian-pro's od-element "jitsi" sidecar both already use for
      # exactly this reason.
      stableServiceName: docmost-sso
      stableServicePort: 8081

  # Customization ladder — see customization.md
  customization:
    grade: D
    rubricScore: 2
    supportedRungs: [L0, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/docmost/docmost-ce/customization.md
    configure:
      hotReload: false
    # No "publishes.apis" entry: Docmost's REST API is session-cookie
    # authenticated for its own frontend, not a bearer-token surface other
    # profiles can integrate against — nothing to publish yet.
    repackage:
      chartOwnership: gentian-owned
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
