apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - profile.yaml
  - customizations/sign-in-sidecar.yaml
# The handler of the platform's sign-in sidecar. It is part of the bundle, so
# an install is pinned to it by the bundle's digest, and it is reviewed with
# the profile. See customization.md.
configMapGenerator:
  - name: docmost-ce.sign-in-handler
    files:
      - handler.js=assets/sign-in-handler.js
generatorOptions:
  disableNameSuffixHash: true
  labels:
    gentianos.io/profile-name: docmost-ce
    gentianos.io/asset: sign-in-handler
