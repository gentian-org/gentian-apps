# SPDX-License-Identifier: MIT
# ComponentProfile — Super Productivity (personal to-do list, time tracker and
# daily planner, in the browser)
#
# Source: upstream's web build of
#   https://github.com/super-productivity/super-productivity (MIT), taken by
#   digest from upstream's image johannesjo/super-productivity and served
#   unchanged. Upstream publishes no chart, so this repository builds both:
#   images/super-productivity serves the build with images/app-host (the
#   server the Crafting Apps run on, in relay mode), and
#   charts/super-productivity runs that one container. The chart names its
#   image; a develop build of the chart names the same commit's develop image.
#
# ── Where the data is ──
# In each person's browser (IndexedDB), and, once the person turns sync on,
# in the folder "Super Productivity" of their own files at the tenant's home
# for files (the file-store contract). The app syncs with a WebDAV server of
# its own accord; its default settings, which the server serves, name this
# address's relay at /webdav/ as that server, so turning sync on in the app
# is one save. The relay passes the app's WebDAV calls to that one folder and
# nowhere else, as the signed-in person: each call carries the token the
# edge hands this app, which the server exchanges at the tenant's realm for
# one valid at the home (present-only: integrations[].asPerson with
# vouching.exchange and no keys). The pod keeps no file and no token. The
# user name and password the app's sync form shows are placeholders: the
# edge replaces whatever the app sends, and the home never sees them.
#
# Which home that is, the app cannot tell and does not need to: the
# platform gives the server the home's address and the scope to ask for.
# Until the tenant's administrator grants the contract, and in a tenant with
# no home, the app is served as upstream ships it and keeps its data in the
# browser only.
#
# ── Outside calls ──
# None from the pod but to the tenant's realm and home, both in the cluster,
# so the profile asks for no egress. What the app reaches outside, it reaches
# from the person's browser, and only when the person sets it up: sync to
# Dropbox or the vendor's SuperSync service instead of the home, and its
# issue-tracker and calendar integrations. The platform does not stand
# between the browser and those.
#
# ── Sign-in ──
# None of its own. The app has no accounts and nothing to administer, so it
# declares no identity client, no provisioning hook and no App Admin role.
# The gateway entry below puts it behind the tenant's session: only people
# the tenant's administrator granted the app (can_launch) reach it.
#
# Secret inventory:
#   Platform-provided: vouching-super-productivity-ce (the client the server
#     asks the realm with), mounted as files. The home's address and scope
#     are chart values the platform sets while the contract is granted.
#   Generated: none.
#
# Backup: nothing to back up here; the app has no store and no volume. What
# is synced is in the home, and backed up with it.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: super-productivity-ce
  labels:
    gentianos.io/profile-name: super-productivity-ce
    gentianos.io/profile-family: super-productivity
    gentianos.io/profile-edition: ce
spec:
  classes:
    - app
  trustTier: certified
  version: "0.1.0-dev"
  launch: tile
  package:
    chart:
      repository: "oci://ghcr.io/gentian-org/charts"
      name: super-productivity
      # On develop a -develop.<sha7> build of the chart (docs/releasing.md).
      version: "0.1.0-develop.1180b4e"
    extraValues:
      fullnameOverride: "super-productivity-ce"
      ingress:
        enabled: false
      podAnnotations:
        reloader.stakater.com/auto: "true"
    valueMapping:
      integrations:
        file-store:
          endpointKey: home.url
          homeScopeKey: home.scope

  # The tenant's file home, called as the person and only while they are
  # present (see Where the data is, above).
  integrations:
    - contract: file-store
      asPerson: true
      capabilities: [webdav:read, webdav:write]

  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
    services:
      # No keys: the server signs nothing and nobody is linked to it. It
      # exchanges the token of the person at its page.
      vouching:
        exchange: true

  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: "super-productivity"
      # The realm issues the person's token for this app alone; the server
      # exchanges it for the home's.
      exchangeToken: true
      backend:
        service: "super-productivity-ce"
        port: 8080
      tile:
        displayName: "Super Productivity"
        description: "Personal to-do list, time tracker and planner"
        image: assets/tile.png
        logo: data:image/png;base64,
        relation: can_launch

  customization:
    grade: unknown
    supportedRungs: [L0, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/super-productivity/super-productivity-ce/customization.md
    repackage:
      chartOwnership: gentian-owned
