# OIDC pack for OpenDesk Nextcloud AIO (clientId: opendesk-nextcloud).
apiVersion: gentianos.io/v1alpha1
kind: OIDCPackCatalog
metadata:
  name: nextcloud-base-od-oidc
  labels:
    gentianos.io/oidc-catalog: nextcloud-base-od
    gentianos.io/profile-name: nextcloud-base-od
spec:
  extraManagedByAttributeGroups:
    - FileshareAdmin
  mapperTemplates:
    opendesk_useruuid:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: entryUUID
        claim.name: opendesk_useruuid
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    opendesk_username:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: uid
        claim.name: opendesk_username
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    email:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        # The USERNAME, not the email field. Keycloak's password reset mails the
        # email field and can be pointed at nothing else, so that field holds the
        # user's recovery address — a personal inbox they can still read when
        # locked out. The workspace address is the username
        # (christian@corp.example is the login and the mailbox), which is what
        # this app should receive as the user's identity. Reading the field here
        # handed the app a personal address instead.
        user.attribute: username
        claim.name: email
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
  packs:
    opendesk-nextcloud:
      scopeName: opendesk-nextcloud-scope
      scopeDescription: "Scope for OpenDesk Nextcloud AIO instances."
      clientRole: opendesk-nextcloud-access-control
      entitlementGroup: managed-by-attribute-Fileshare
      publicClient: false
      fullScopeAllowed: false
      defaultScopes:
        - profile
        - email
        - roles
        - web-origins
        - acr
      mappers:
        - opendesk_useruuid
        - opendesk_username
        - email
