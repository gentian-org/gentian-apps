apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# What this profile's published bundle holds beside profile.yaml
# (scripts/build-catalogue-source.py reads this file; docs/profile-bundles.md).
#
# The family's AppPackage presets (../../packages) are not here: nothing on a
# cluster reads a preset, so it is not a companion. They are published beside
# the bundles, under packages/, for the App Store.
resources:
  - profile.yaml
  - oidc-catalog.yaml
configMapGenerator:
  # The portal-bridge SSO page the app composition copies into the app's
  # namespace; it finds this by its two labels. Named <profile>.<asset>, and
  # without a namespace: a companion states none.
  - name: nextcloud-base-ce.portal-bridge-sso
    files:
      - nextcloud-portal-sso.html=assets/nextcloud-portal-sso.html
generatorOptions:
  disableNameSuffixHash: true
  labels:
    gentianos.io/profile-name: nextcloud-base-ce
    gentianos.io/asset: portal-bridge-sso
