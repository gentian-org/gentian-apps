apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - profile.yaml
  - oidc-catalog.yaml
  # AppPackage presets for this family. They sync with the base rather than as their
  # own Application because the catalogue ApplicationSet discovers bundles by
  # profile.yaml, and a preset is not an AppProfile.
  - ../../packages
configMapGenerator:
  - name: nextcloud-base-ce-portal-bridge-sso
    # Beside gentian-cluster-config, where the app composition reads it from:
    # the provisioning namespace of the v5 layout (crossplane-system in v4).
    namespace: kernel-provisioning
    files:
      - nextcloud-portal-sso.html=assets/nextcloud-portal-sso.html
generatorOptions:
  disableNameSuffixHash: true
  labels:
    gentianos.io/profile-name: nextcloud-base-ce
    gentianos.io/asset: portal-bridge-sso
    app.kubernetes.io/managed-by: gentian-os
