# OIDC pack for the public Nextcloud Base profile.
apiVersion: gentianos.io/v1alpha1
kind: OIDCPackCatalog
metadata:
  name: nextcloud-base-ce-oidc
  labels:
    gentianos.io/oidc-catalog: nextcloud-base-ce
    gentianos.io/profile-name: nextcloud-base-ce
spec:
  extraManagedByAttributeGroups:
    - FileshareBaseAdmin
  mapperTemplates:
    gentian_useruuid:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: entryUUID
        claim.name: gentian_useruuid
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    gentian_username:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: uid
        claim.name: gentian_username
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    email:
      protocolMapper: oidc-usermodel-property-mapper
      config:
        # The USERNAME, not the email field. Keycloak's password reset mails the
        # email field and can be pointed at nothing else, so that field holds the
        # user's recovery address — a personal inbox they can still read when
        # locked out. The workspace address is the username
        # (christian@corp.example is the login and the mailbox), which is what
        # this app should receive as the user's identity. Reading the field here
        # handed the app a personal address instead.
        user.attribute: username
        claim.name: email
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
  packs:
    gentian-nextcloud-base-ce:
      scopeName: gentian-nextcloud-base-ce-scope
      scopeDescription: "Scope for Gentian Nextcloud Base app instances."
      clientRole: gentian-nextcloud-base-ce-access-control
      entitlementGroup: managed-by-attribute-FileshareBase
      publicClient: false
      fullScopeAllowed: false
      defaultScopes:
        - profile
        - email
        - roles
        - web-origins
        - acr
      mappers:
        - gentian_useruuid
        - gentian_username
        - email
