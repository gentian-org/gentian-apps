<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Signing in to Files…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f5f7f6;
        color: #1a2e28;
      }
    </style>
  </head>
  <body>
    <p>Signing in to Files…</p>
    <script>
      (async () => {
        const ticket = new URLSearchParams(window.location.search).get("t");
        if (!ticket) {
          window.location.replace("/");
          return;
        }

        // Server-side session establishment avoids iframe third-party cookie /
        // CSRF failures from posting the login form in an embedded WinBox.
        window.location.replace(
          `/gentian-portal-bridge.php?t=${encodeURIComponent(ticket)}`,
        );
      })();
    </script>
  </body>
</html>
