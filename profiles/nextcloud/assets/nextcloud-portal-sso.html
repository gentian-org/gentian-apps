<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Signing in to Files…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f5f7f6;
        color: #1a2e28;
      }
    </style>
  </head>
  <body>
    <p>Signing in to Files…</p>
    <script>
      (async () => {
        const params = new URLSearchParams(window.location.search);
        const ticket = params.get("t");
        if (!ticket) {
          window.location.replace("/");
          return;
        }

        // Optional document-type intent from Document/Spreadsheet/Presentation tiles.
        const open = params.get("open");
        let target = `/gentian-portal-bridge.php?t=${encodeURIComponent(ticket)}`;
        if (open) {
          target += `&open=${encodeURIComponent(open)}`;
        }

        // Server-side session establishment avoids iframe third-party cookie /
        // CSRF failures from posting the login form in an embedded WinBox.
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
