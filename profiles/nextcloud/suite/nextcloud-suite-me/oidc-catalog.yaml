# OIDC pack for the public Nextcloud Suite profile.
apiVersion: gentianos.io/v1alpha1
kind: OIDCPackCatalog
metadata:
  name: nextcloud-suite-me-oidc
  labels:
    gentianos.io/oidc-catalog: nextcloud-suite-me
    gentianos.io/profile-name: nextcloud-suite-me
spec:
  extraManagedByAttributeGroups:
    - FileshareSuiteAdmin
  mapperTemplates:
    gentian_useruuid:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: entryUUID
        claim.name: gentian_useruuid
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    gentian_username:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: uid
        claim.name: gentian_username
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    email:
      protocolMapper: oidc-usermodel-property-mapper
      config:
        user.attribute: email
        claim.name: email
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
  packs:
    gentian-nextcloud-suite-me:
      scopeName: gentian-nextcloud-suite-me-scope
      scopeDescription: "Scope for Gentian Nextcloud Suite app instances."
      clientRole: gentian-nextcloud-suite-me-access-control
      entitlementGroup: managed-by-attribute-FileshareSuite
      publicClient: false
      fullScopeAllowed: false
      defaultScopes:
        - profile
        - email
        - roles
        - web-origins
        - acr
      mappers:
        - gentian_useruuid
        - gentian_username
        - email
