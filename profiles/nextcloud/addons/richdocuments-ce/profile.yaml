# AppProfile — Nextcloud Nextcloud Office (addon)
#
# Activated inside a Nextcloud base rather than deployed: the app ships disabled in
# the base image's custom_apps, and selecting this addon runs `occ app:enable richdocuments`.
# It therefore carries no chart of its own.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: nextcloud-richdocuments-ce
  labels:
    gentianos.io/profile-name: nextcloud-richdocuments-ce
  annotations:
    gentianos.io/deployment-role: addon
spec:
  displayName: "Nextcloud Office"
  description: "Collabora-backed document, spreadsheet and presentation editing."
  family: nextcloud
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: certified
  license: AGPL-3.0-only
  author: Nextcloud
  tile:
    icon: documents
  deploymentMethod: crossplane

  customization:
    addon:
      id: richdocuments
      of: nextcloud-base-ce
