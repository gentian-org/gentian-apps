# ComponentProfile — Nextcloud Nextcloud Office (addon)
#
# Activated inside a Nextcloud base rather than deployed: the app ships disabled in
# the base image's custom_apps, and selecting this addon runs `occ app:enable richdocuments`.
# It therefore carries no chart of its own.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: nextcloud-richdocuments-ce
  labels:
    gentianos.io/profile-name: nextcloud-richdocuments-ce
  annotations:
    gentianos.io/deployment-role: addon
spec:
  classes:
    - app
  trustTier: certified
  version: "1.0.0"
  package:
    addon:
      id: richdocuments
      of: nextcloud-base-ce
  expose:
    - name: document
      surface: gateway
      authMode: oidc
      subDomain: cloud
      backend:
        component: nextcloud-base-ce
        service: nextcloud
        port: 8080
      tile:
        displayName: "Document"
        displayNames:
          de_DE: "Dokument"
        logo: data:image/svg+xml;base64,
        image: assets/tile-document.svg
        path: /?open=document
        relation: can_launch
    - name: spreadsheet
      surface: gateway
      authMode: oidc
      subDomain: cloud
      backend:
        component: nextcloud-base-ce
        service: nextcloud
        port: 8080
      tile:
        displayName: "Spreadsheet"
        displayNames:
          de_DE: "Tabelle"
        logo: data:image/svg+xml;base64,
        image: assets/tile-spreadsheet.svg
        path: /?open=spreadsheet
        relation: can_launch
    - name: presentation
      surface: gateway
      authMode: oidc
      subDomain: cloud
      backend:
        component: nextcloud-base-ce
        service: nextcloud
        port: 8080
      tile:
        displayName: "Presentation"
        displayNames:
          de_DE: "Präsentation"
        logo: data:image/svg+xml;base64,
        image: assets/tile-presentation.svg
        path: /?open=presentation
        relation: can_launch
  launch: tile
