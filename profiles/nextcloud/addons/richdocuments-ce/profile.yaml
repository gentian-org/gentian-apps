# ComponentProfile — Nextcloud Nextcloud Office (addon)
#
# Activated inside a Nextcloud base rather than deployed: the app ships disabled in
# the base image's custom_apps, and selecting this addon runs `occ app:enable richdocuments`.
# It therefore carries no chart of its own.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: nextcloud-richdocuments-ce
  labels:
    gentianos.io/profile-name: nextcloud-richdocuments-ce
    gentianos.io/profile-family: nextcloud
    gentianos.io/profile-edition: ce
  annotations:
    gentianos.io/deployment-role: addon
spec:
  classes:
    - app
  trustTier: certified
  version: "0.5.1-dev"
  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
  package:
    addon:
      id: richdocuments
      of: nextcloud-base-ce
  expose:
    - name: document
      surface: gateway
      authMode: oidc
      subDomain: nextcloud
      backend:
        component: nextcloud-base-ce
        service: nextcloud
        port: 8080
      tile:
        displayName: "Document"
        displayNames:
          de_DE: "Dokument"
        logo: data:image/png;base64,
        image: assets/tile-document.png
        path: /?open=document
        relation: can_launch
    - name: spreadsheet
      surface: gateway
      authMode: oidc
      subDomain: nextcloud
      backend:
        component: nextcloud-base-ce
        service: nextcloud
        port: 8080
      tile:
        displayName: "Spreadsheet"
        displayNames:
          de_DE: "Tabelle"
        logo: data:image/png;base64,
        image: assets/tile-spreadsheet.png
        path: /?open=spreadsheet
        relation: can_launch
    - name: presentation
      surface: gateway
      authMode: oidc
      subDomain: nextcloud
      backend:
        component: nextcloud-base-ce
        service: nextcloud
        port: 8080
      tile:
        displayName: "Presentation"
        displayNames:
          de_DE: "Präsentation"
        logo: data:image/png;base64,
        image: assets/tile-presentation.png
        path: /?open=presentation
        relation: can_launch
  launch: tile
