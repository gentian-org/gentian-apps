tile:
  image: assets/tile-office.svg
  logo: data:image/svg+xml;base64,
  # Tile for the app menu / quick bar. The addon has no ingress of its own, so the
  # shell resolves the base URL from spec.customization.addon.of and appends this
  # suffix to deep-link into the feature inside Nextcloud.
  # Three tiles, not one. The portal bridge resolves ?open=<type> to the user's most
  # recently edited document of that kind, or creates one from a template if they have
  # none — see portal-bridge.php in gentian-ui. A single "Office" tile pointing at the
  # app root loses that entirely, which is what the office bundle used to provide.
