profile: nextcloud-spreed-ce
displayName: "Talk"
summary: "Team chat, audio and video calls and screen sharing, hosted on your own Nextcloud."
description: |
  Talk is Nextcloud's chat and video conferencing app. Teams use it for one-to-one and group chats with file sharing, private, group and public (link or password-protected) calls, and screen sharing. Chats can be federated with users on other Nextcloud servers, and there are mobile apps for Android and iOS as well as a desktop client.
categories: [communication, collaboration]
links:
  - rel: homepage
    url: https://nextcloud.com/talk/
  - rel: support
    label: "Support the project"
    url: https://nextcloud.com/contribute/
family: nextcloud
edition: ce
author: Nextcloud
license: AGPL-3.0-only
tile:
  image: assets/tile-talk.svg
  logo: data:image/svg+xml;base64,
  # Tile for the app menu / quick bar. The addon has no ingress of its own, so the
  # shell resolves the base URL from spec.customization.addon.of and appends this
  # suffix to deep-link into the feature inside Nextcloud.
