# AppProfile — Nextcloud Talk (addon)
#
# Activated inside a Nextcloud base rather than deployed: the app ships disabled in
# the base image's custom_apps, and selecting this addon runs `occ app:enable spreed`.
# It therefore carries no chart of its own.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: nextcloud-spreed-ce
  labels:
    gentianos.io/profile-name: nextcloud-spreed-ce
  annotations:
    gentianos.io/deployment-role: addon
spec:
  displayName: "Talk"
  description: "Audio/video calls, chat and screensharing."
  family: nextcloud
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: certified
  license: AGPL-3.0-only
  author: Nextcloud
  tile:
    icon: chat
  # Tile for the app menu / quick bar. The addon has no ingress of its own, so the
  # shell resolves the base URL from spec.customization.addon.of and appends this
  # suffix to deep-link into the feature inside Nextcloud.
  portalTiles:
    - name: spreed
      displayName:
        en_US: "Talk"
        de_DE: "Talk"
      linkSuffix: "?app=spreed"
      linkTarget: embedded
      allowedGroup: "Domain Users"

  deploymentMethod: crossplane

  customization:
    addon:
      id: spreed
      of: nextcloud-base-ce
