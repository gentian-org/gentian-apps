# AppProfile — Nextcloud Tasks (addon)
#
# Activated inside a Nextcloud base rather than deployed: the app ships disabled in
# the base image's custom_apps, and selecting this addon runs `occ app:enable tasks`.
# It therefore carries no chart of its own.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: nextcloud-tasks-ce
  labels:
    gentianos.io/profile-name: nextcloud-tasks-ce
  annotations:
    gentianos.io/deployment-role: addon
spec:
  displayName: "Tasks"
  description: "CalDAV task lists, shared with Calendar."
  family: nextcloud
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: certified
  license: AGPL-3.0-only
  author: Nextcloud
  tile:
    image: assets/tile-tasks.svg
    logo: data:image/svg+xml;base64,
  # Tile for the app menu / quick bar. The addon has no ingress of its own, so the
  # shell resolves the base URL from spec.customization.addon.of and appends this
  # suffix to deep-link into the feature inside Nextcloud.
  portalTiles:
    - name: tasks
      displayName:
        en_US: "Tasks"
        de_DE: "Aufgaben"
      linkSuffix: "?app=tasks"
      linkTarget: embedded
      allowedGroup: "Domain Users"

  deploymentMethod: crossplane

  customization:
    addon:
      id: tasks
      of: nextcloud-base-ce
