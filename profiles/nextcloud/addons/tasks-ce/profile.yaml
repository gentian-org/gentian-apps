# ComponentProfile — Nextcloud Tasks (addon)
#
# Activated inside a Nextcloud base rather than deployed: the app ships disabled in
# the base image's custom_apps, and selecting this addon runs `occ app:enable tasks`.
# It therefore carries no chart of its own.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: nextcloud-tasks-ce
  labels:
    gentianos.io/profile-name: nextcloud-tasks-ce
    gentianos.io/profile-family: nextcloud
    gentianos.io/profile-edition: ce
  annotations:
    gentianos.io/deployment-role: addon
spec:
  classes:
    - app
  trustTier: certified
  version: "0.5.1-dev.1"
  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
  package:
    addon:
      id: tasks
      of: nextcloud-base-ce
  expose:
    - name: tasks
      surface: gateway
      authMode: oidc
      subDomain: nextcloud
      backend:
        component: nextcloud-base-ce
        service: nextcloud
        port: 8080
      tile:
        displayName: "Tasks"
        displayNames:
          de_DE: "Aufgaben"
        logo: data:image/png;base64,
        image: assets/tile.png
        path: /apps/tasks/
        relation: can_launch
  launch: tile
