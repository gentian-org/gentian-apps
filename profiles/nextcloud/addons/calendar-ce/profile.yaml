# AppProfile — Nextcloud Calendar (addon)
#
# Activated inside a Nextcloud base rather than deployed: the app ships disabled in
# the base image's custom_apps, and selecting this addon runs `occ app:enable calendar`.
# It therefore carries no chart of its own.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: nextcloud-calendar-ce
  labels:
    gentianos.io/profile-name: nextcloud-calendar-ce
  annotations:
    gentianos.io/deployment-role: addon
spec:
  displayName: "Calendar"
  description: "CalDAV calendars with scheduling and free/busy."
  family: nextcloud
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: certified
  license: AGPL-3.0-only
  author: Nextcloud
  tile:
    icon: calendar
  deploymentMethod: crossplane

  customization:
    addon:
      id: calendar
      of: nextcloud-base-ce
