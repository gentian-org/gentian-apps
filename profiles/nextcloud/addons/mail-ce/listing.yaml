profile: nextcloud-mail-ce
displayName: "Mail"
summary: "Web mail client that connects your existing IMAP accounts in a unified inbox, linked to contacts and calendar."
description: |
  Mail is the Nextcloud mail client. It connects to existing IMAP/SMTP servers and does not include a mail server itself. Teams use it to read several accounts in a unified inbox, share mailboxes, and work with contacts, calendar invitations and file attachments from Nextcloud. It supports encrypted mail with OpenPGP and S/MIME.
categories: [communication, collaboration]
links:
  - rel: homepage
    url: https://nextcloud.com/groupware/
  - rel: support
    label: "Support the project"
    url: https://nextcloud.com/contribute/
family: nextcloud
edition: ce
author: Nextcloud
license: AGPL-3.0-only
tile:
  image: assets/tile-mail.svg
  logo: data:image/svg+xml;base64,
  # Tile for the app menu / quick bar. The addon has no ingress of its own, so the
  # shell resolves the base URL from spec.customization.addon.of and appends this
  # suffix to deep-link into the feature inside Nextcloud.
