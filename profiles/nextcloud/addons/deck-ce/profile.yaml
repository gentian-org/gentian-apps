# ComponentProfile — Nextcloud Deck (addon)
#
# Activated inside a Nextcloud base rather than deployed: the app ships disabled in
# the base image's custom_apps, and selecting this addon runs `occ app:enable deck`.
# It therefore carries no chart of its own.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: nextcloud-deck-ce
  labels:
    gentianos.io/profile-name: nextcloud-deck-ce
  annotations:
    gentianos.io/deployment-role: addon
spec:
  classes:
    - app
  trustTier: certified
  version: "1.0.0"
  package:
    addon:
      id: deck
      of: nextcloud-base-ce
  expose:
    - name: deck
      surface: gateway
      authMode: oidc
      subDomain: cloud
      backend:
        component: nextcloud-base-ce
        service: nextcloud
        port: 8080
      tile:
        displayName: "Deck"
        logo: data:image/svg+xml;base64,
        image: assets/tile-deck.svg
        path: /?app=deck
        relation: can_launch
  launch: tile
