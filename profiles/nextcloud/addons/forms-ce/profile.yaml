# ComponentProfile — Nextcloud Forms (addon)
#
# Activated inside a Nextcloud base rather than deployed: the app ships disabled in
# the base image's custom_apps, and selecting this addon runs `occ app:enable forms`.
# It therefore carries no chart of its own.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: nextcloud-forms-ce
  labels:
    gentianos.io/profile-name: nextcloud-forms-ce
  annotations:
    gentianos.io/deployment-role: addon
spec:
  classes:
    - app
  trustTier: certified
  version: "1.0.0"
  package:
    addon:
      id: forms
      of: nextcloud-base-ce
  expose:
    - name: forms
      surface: gateway
      authMode: oidc
      subDomain: cloud
      backend:
        component: nextcloud-base-ce
        service: nextcloud
        port: 8080
      tile:
        displayName: "Forms"
        displayNames:
          de_DE: "Formulare"
        logo: data:image/svg+xml;base64,
        image: assets/tile-forms.svg
        path: /?app=forms
        relation: can_launch
  launch: tile
