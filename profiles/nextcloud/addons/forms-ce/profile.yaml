# AppProfile — Nextcloud Forms (addon)
#
# Activated inside a Nextcloud base rather than deployed: the app ships disabled in
# the base image's custom_apps, and selecting this addon runs `occ app:enable forms`.
# It therefore carries no chart of its own.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: nextcloud-forms-ce
  labels:
    gentianos.io/profile-name: nextcloud-forms-ce
  annotations:
    gentianos.io/deployment-role: addon
spec:
  displayName: "Forms"
  description: "Surveys, polls and questionnaires."
  family: nextcloud
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: certified
  license: AGPL-3.0-only
  author: Nextcloud
  tile:
    icon: notes
  # Tile for the app menu / quick bar. The addon has no ingress of its own, so the
  # shell resolves the base URL from spec.customization.addon.of and appends this
  # suffix to deep-link into the feature inside Nextcloud.
  portalTiles:
    - name: forms
      displayName:
        en_US: "Forms"
        de_DE: "Formulare"
      linkSuffix: "?app=forms"
      linkTarget: embedded
      allowedGroup: "Domain Users"

  deploymentMethod: crossplane

  customization:
    addon:
      id: forms
      of: nextcloud-base-ce
