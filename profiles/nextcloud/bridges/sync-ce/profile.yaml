# SPDX-License-Identifier: AGPL-3.0-only
# ComponentProfile — Nextcloud Sync (bridge)
#
# Connects an installed Nextcloud to programs on a person's own devices: a
# file sync program, a calendar, an address book. Nothing is deployed for it.
# Nextcloud speaks WebDAV, CalDAV and CardDAV itself, so the platform routes
# the paths below to Nextcloud's own Service, at the tenant's door
# (sync.<the tenant's domain>).
#
# A program signs the person in at the tenant's realm and presents the token
# it is given, or presents the person's username and a device password made
# for it. The platform checks either on every request, asks whether the
# person may use Nextcloud, and hands Nextcloud a token of that person made
# out to Nextcloud alone. Nextcloud takes it as a sign-in (user_oidc,
# check-bearer, which nextcloud-base-ce switches on).
#
# A calendar or contact program set up with the door's name alone finds
# Nextcloud through the discovery addresses (/.well-known/caldav,
# /.well-known/carddav), which send it to the principals: Nextcloud tells it
# there who the person is and where their calendars and address books are.
#
# Each way is served once the tenant's perimeter approver has approved it.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: nextcloud-sync-ce
  labels:
    gentianos.io/profile-name: nextcloud-sync-ce
    gentianos.io/profile-family: nextcloud
    gentianos.io/profile-edition: ce
spec:
  classes:
    - bridge
  launch: none
  trustTier: certified
  version: "0.3.0"
  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
  bridge:
    app:
      profile: nextcloud-base-ce
    # Nextcloud's own DAV paths, each protocol's and no other: not the DAV
    # root, under which Nextcloud also answers for trash, versions, comments
    # and what else a sync program has no use for. Each way is approved on
    # its own: a tenant may allow files and not contacts.
    ways:
      - name: files
        caller: device
        callee: app
        protocol: webdav
        speaksAs: person
        paths:
          - /remote.php/dav/files/
          # Where a large file is uploaded in parts before it is put
          # together under files/.
          - /remote.php/dav/uploads/
      - name: calendars
        caller: device
        callee: app
        protocol: caldav
        speaksAs: person
        paths:
          - /remote.php/dav/calendars/
          - /remote.php/dav/principals/
        root: /remote.php/dav/principals/
      - name: contacts
        caller: device
        callee: app
        protocol: carddav
        speaksAs: person
        paths:
          - /remote.php/dav/addressbooks/
          - /remote.php/dav/principals/
        root: /remote.php/dav/principals/
  package:
    api:
      backend:
        service: nextcloud
        port: 8080
