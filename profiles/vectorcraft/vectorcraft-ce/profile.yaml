# SPDX-License-Identifier: MIT
# ComponentProfile — VectorCraft (vector illustration, in the browser)
#
# Source: https://github.com/storytold/vectorcraft (MIT OR Apache-2.0), one of the
#   Crafting Apps. Upstream publishes neither an image nor a chart, but every
#   release carries the browser build as static files, so this repository
#   builds both: images/vectorcraft serves the pinned release's web build
#   unchanged from unprivileged nginx, and charts/vectorcraft runs that one
#   container. The app is WebAssembly and runs in the browser; the pod only
#   serves files. The chart names its image; a develop build of the chart
#   names the same commit's develop image.
#
# Nothing differs from upstream: the release's files are served as they are.
#
# ── Files ──
# The app keeps nothing on a server. Open is the browser's file picker, Save
# and Export are downloads, preferences are the browser's localStorage. A
# document that was not saved is lost with the tab.
#
# ── Outside calls ──
# None at start: the page loads its own files and nothing else. The links in
# the app (upstream's website, source and community) open in a new tab when a
# person follows them. The pod makes no outbound call, so the profile asks for
# no egress.
#
# ── Browser ──
# The build needs WebAssembly SIMD (Chrome and Edge 91, Firefox 89, Safari
# 16.4). An older browser stays on the loading page.
#
# ── Sign-in ──
# None of its own. The app has no accounts and nothing to administer, so it
# declares no identity client, no provisioning hook and no App Admin role.
# The gateway entry below puts it behind the tenant's session: only people
# the tenant's administrator granted the app (can_launch) reach it.
#
# Secret inventory:
#   Platform-provided: none.
#   Generated: none.
#
# Backup: nothing to back up; the app has no store and no volume.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: vectorcraft-ce
  labels:
    gentianos.io/profile-name: vectorcraft-ce
    gentianos.io/profile-family: vectorcraft
    gentianos.io/profile-edition: ce
spec:
  classes:
    - app
  trustTier: certified
  version: "0.1.0-dev"
  launch: tile
  package:
    chart:
      repository: "oci://ghcr.io/gentian-org/charts"
      name: vectorcraft
      version: "0.1.0-develop.e052c3b"
    extraValues:
      fullnameOverride: "vectorcraft-ce"
      ingress:
        enabled: false
      podAnnotations:
        reloader.stakater.com/auto: "true"

  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
    # No services: no database, bucket, cache, mail or sign-in client.

  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: "vectorcraft"
      backend:
        service: "vectorcraft-ce"
        port: 8080
      tile:
        displayName: "VectorCraft"
        displayNames: {de_DE: "VectorCraft"}
        description: "Vector illustration and drawing"
        image: assets/tile.png
        logo: data:image/png;base64,
        relation: can_launch

  customization:
    grade: unknown
    supportedRungs: [L0, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/vectorcraft/vectorcraft-ce/customization.md
    repackage:
      chartOwnership: gentian-owned
