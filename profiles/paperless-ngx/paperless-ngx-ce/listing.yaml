summary: >-
  Scan, OCR and archive your paper: every letter, invoice and contract becomes searchable text and a PDF/A, filed by correspondent, type and tags, and readable by your AI assistant.
description: |-
  Paperless-ngx turns paper into a searchable archive. Scan a letter, photograph a receipt or drop a PDF into its inbox, and it is read, filed and found again in seconds.

  ## What it does

  - **Text recognition.** Every document is run through OCR in German, French, Italian or English. You can search the full text of a scan, not only its title.
  - **An archive that lasts.** Each document is kept as a PDF/A beside the original file, the format made for long-term archiving.
  - **Filing that learns.** Documents are filed by correspondent, document type, tags and custom fields. Paperless learns from what you file and suggests the same for the next one.
  - **Several ways in.** Upload in the browser, drop files into the inbox, let it fetch attachments from a mailbox, or scan from your phone with the Paperless mobile apps.
  - **Workflows.** Rules file, tag and share documents as they arrive, for example every invoice from one supplier.

  ## Built for automation

  The REST API and the bundled MCP server let an AI assistant or an automation read a document's text and metadata, upload new scans, set custom fields and tag what it has processed. A scanned letter can go from Paperless through a language model into your CRM or ERP without anyone typing it in.

  ## On Gentian OS

  People sign in with their Gentian account; nobody needs a separate password. Whoever holds the tenant's App Administrator role administers Paperless. Documents stay in your tenant, on your cluster.
