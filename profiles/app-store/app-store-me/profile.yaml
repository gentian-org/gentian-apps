# ComponentProfile — Gentian App Store (tenant admin UI)
#
# First-party app built from gentian-apps/apps/app-store-me/.
# Chart published to ghcr.io/gentian-org/charts/app-store-me.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: app-store-me
  labels:
    gentianos.io/profile-name: app-store-me
  annotations:
    gentianos.io/platform-app: "true"
    gentianos.io/kernel-egress-namespaces: gentian-system
    # app-default emits the stable API alias as "<profile>-api", so this must track
    # the profile name. It still said "app-store-api" from before the rename, which
    # left the HTTPRoute with BackendNotFound and every path returning 500.
    gentianos.io/gateway-api-backends: '[{"pathPrefix":"/api","serviceName":"app-store-me-api","port":8000},{"pathPrefix":"/oauth","serviceName":"app-store-me-api","port":8000}]'
spec:
  classes:
    - app
  trustTier: experimental
  version: 0.0.0
  package:
    chart:
      repository: oci://ghcr.io/gentian-org/charts
      name: app-store
      version: "0.3.17"

    valueMapping:
      oidc:
        issuerKey: "oidc.issuer"
        clientIdKey: "oidc.clientId"
        clientSecretKey: "oidc.clientSecret"
      database:
        hostKey: "database.host"
        portKey: "database.port"
        nameKey: "database.name"
        userKey: "database.user"
        passwordKey: "database.password"

    extraValues:
    # The composition names the ESO-managed Secret after this profile, so it must
    # be stated here — the chart's default still assumed the pre-rename name
    # "app-store", which left the API pod in CreateContainerConfigError.
      existingSecret:
        name: app-store-me-sensitive-values
      tenantId: "${TENANT_ID}"
      tenantNamespace: "${TENANT_NAMESPACE}"
      installMode: gitops
      gentian:
        deploymentsRepo: "https://github.com/gentian-org/gentian-deployments"
        appsRepo: "https://github.com/gentian-org/gentian-apps"
        appsBranch: main
        lifecycleUrl: "http://gentian-os-lifecycle.gentian-system.svc.cluster.local:8082"
      # Phase A commerce (optional; enable when gentian-corp is deployed)
        commerceEnabled: false
        corpApiUrl: ""
        corpCheckoutUrl: ""
      ingress:
        enabled: false
      auth:
        disabled: true
      gateway:
      # Kernel operator owns HTTPRoute via spec.ingress + browserProxy; chart route duplicates it.
        enabled: false
        subDomain: store
      tenantDomain: "${TENANT_DOMAIN}"

  requires:
    services:
      identity:
        oidc:
          clientId: "app-store-me"
          name: "App Store"
          accessType: CONFIDENTIAL
          redirectUris:
            - "https://store.${TENANT_DOMAIN}/oauth/callback"
        # No backchannelLogoutUrl: this is our own application and it implements
        # no endpoint for receiving a logout_token. Unlike the third-party entries
        # here, that is ours to change — a route validating the token and dropping
        # the session would let this one honour a portal sign-out.
      database:
        engine: postgresql
        databasePerTenant: true

  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: store
      backend:
        service: app-store-me-web
        port: 8080
      tile:
        displayName: "App Store"
        logo: data:image/svg+xml;base64,
        image: assets/tile.svg
        relation: can_launch
  customization:
    grade: B
    rubricScore: 5
    supportedRungs: [L0, L1, L4]    # L3 unlocks once the template extension loader is adopted
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/app-store-me/customization.md
    configure:
      valuesSchema: apps/app-store-me/chart/values.schema.json
      hotReload: false
    dropIns:
      - name: app-config
        path: /etc/gentian/app-store-me/conf.d
        format: yaml
        source: configMap
        maxBytes: 262144
        upstreamDocumented: true
        tenantEditable: false
    publishes:
      apis:
        - contract: app-catalogue
          protocol: http-json
          spec: openapi
          path: /api/v1
          auth: oidc-token-exchange
    repackage:
      chartOwnership: gentian-owned
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
  launch: tile
