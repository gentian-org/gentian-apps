profile: openproject-ce
displayName: "OpenProject"
summary: "Plan and track projects with work packages, Gantt charts, agile boards, time tracking and team planning."
description: |
  OpenProject is open-source project management software for classic, agile or hybrid methods, run on-premises or hosted. Teams use it for task and issue tracking, Gantt-chart scheduling, Scrum and Kanban boards, workload planning, meetings, and time and cost reporting. It is licensed under the GNU GPL v3 and emphasises data sovereignty through self-hosting.
