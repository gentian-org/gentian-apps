apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# What this profile's published bundle holds beside profile.yaml
# (scripts/build-catalogue-source.py reads this file; docs/profile-bundles.md).
resources:
  - profile.yaml
  - composition.yaml
  - oidc-catalog.yaml
configMapGenerator:
  # Read by this profile's composition, which finds it by its two labels.
  # Named <profile>.<asset>, and without a namespace: a companion states none.
  - name: openproject-ce.portal-bridge
    files:
      - bridge.py=assets/portal_bridge.py
      - openproject-portal-sso.html=assets/openproject-portal-sso.html
generatorOptions:
  disableNameSuffixHash: true
  labels:
    gentianos.io/profile-name: openproject-ce
    gentianos.io/asset: portal-bridge
