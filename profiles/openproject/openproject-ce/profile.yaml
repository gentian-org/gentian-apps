# SPDX-License-Identifier: GPL-3.0-only
# ComponentProfile — OpenProject, community edition (per-tenant project management)
#
# Source chart: https://charts.openproject.org/ openproject 12.0.0
#   The chart puts commonLabels on its pods and takes no podLabels, so the
#   platform's two labels are set as commonLabels below.
#   Image: docker.io/openproject/openproject, one fixed version.
#
# Secret inventory:
#   Platform-provided:
#     pg_*                → postgresql.auth.password / connection.*
#     s3_secret_key       → s3.auth.secretAccessKey
#     smtp_password       → environment.OPENPROJECT_SMTP__PASSWORD
#   App-internal (3) → secrets.generated:
#     admin_password      → openproject.admin_user.password
#     api_admin_password  → environment.OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_PASSWORD
#     secret_key_base     → environment.SECRET_KEY_BASE
#
# Sign-in: OpenProject's own single sign-on (OIDC, SAML) is part of its paid
# edition and is not configured here. People are signed in by the platform's
# sign-in sidecar with the handler in assets/sign-in-handler.js; see
# customizations/sign-in-sidecar.yaml and customization.md.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: openproject-ce
  labels:
    gentianos.io/profile-name: openproject-ce
    gentianos.io/profile-family: openproject
    gentianos.io/profile-edition: ce
spec:
  classes:
    - app
  trustTier: certified
  version: "0.5.1-dev.1"
  package:
    chart:
      repository: "https://charts.openproject.org/"
      name: openproject
      version: "12.0.0"

    valueMapping:
      database:
        hostKey: "postgresql.connection.host"
        portKey: "postgresql.connection.port"
        nameKey: "postgresql.auth.database"
        userKey: "postgresql.auth.username"
        passwordKey: "postgresql.auth.password"
      s3:
        endpointKey: "s3.endpoint"
        bucketKey: "s3.bucketName"
        accessKeyKey: "s3.auth.accessKeyId"
        regionKey: "s3.region"
        secretKeyKey: "s3.auth.secretAccessKey"
      smtp:
        hostKey: "environment.OPENPROJECT_SMTP__ADDRESS"
        portKey: "environment.OPENPROJECT_SMTP__PORT"
        userKey: "environment.OPENPROJECT_SMTP__USER__NAME"
        passwordKey: "environment.OPENPROJECT_SMTP__PASSWORD"
      platform:
        # The tenant's own language and time zone. Set by environment, so
        # OpenProject shows them as fixed; without a tenant zone the
        # Europe/Berlin below stands.
        defaultLanguageKey: "environment.OPENPROJECT_DEFAULT__LANGUAGE"
        timeZoneKey: "environment.OPENPROJECT_USER__DEFAULT__TIMEZONE"

    extraValues:
      fullnameOverride: "openproject-ce"

      # The chart labels its pods with commonLabels and with nothing else.
      # These two are how the platform finds an app's pods: its network paths
      # to the database, and the sign-in sidecar's path to the app.
      commonLabels:
        gentianos.io/app: "${APP_ID}"
        gentianos.io/tenant: "${TENANT_ID}"

      image:
        registry: "docker.io"
        repository: "openproject/openproject"
        # One version, not the moving 16-slim: the sign-in handler was run
        # against exactly this one (customizations/sign-in-sidecar.yaml).
        tag: "16.6.10-slim"
        imagePullPolicy: "IfNotPresent"

      dbInit:
        image:
          registry: "docker.io"
          repository: "library/postgres"
          tag: "16-alpine"

      postgresql:
        bundled: false

      memcached:
        bundled: false
        connection:
          host: "memcached"
          port: 11211

      s3:
        enabled: true
        pathStyle: true
        directUploads: false
        enableSignatureV4Streaming: false
      # endpoint, bucketName, region and auth.accessKeyId are supplied by the
      # platform through valueMapping.s3 — this app does not name a bucket or
      # an object store. The endpoint is all the chart needs: s3.host is not
      # set, and OpenProject's seeder, which writes the demo project's
      # pictures to the bucket and fails without one, runs against the
      # platform's object store with these values
      # (images/gentian-sidecar-sso-saml/e2e/openproject.e2e.js).

      persistence:
        enabled: false

      probes:
        liveness:
          initialDelaySeconds: 300
          failureThreshold: 30
        readiness:
          initialDelaySeconds: 150
          failureThreshold: 30

      appInit:
        resources:
          limits:
            cpu: "250m"
            memory: "1Gi"
          requests:
            cpu: "100m"
            memory: "768Mi"

      replicaCount: 1
      backgroundReplicaCount: 0

      resources:
        limits:
          cpu: "750m"
          memory: "2Gi"
        requests:
          cpu: "250m"
          memory: "1Gi"

      containerSecurityContext:
        enabled: true
        privileged: false
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - "ALL"
        seccompProfile:
          type: "RuntimeDefault"
        readOnlyRootFilesystem: true
        runAsNonRoot: true

      podAnnotations:
        secret.reloader.stakater.com/reload: openproject-ce-sensitive-values

      # The seeder is an ordinary Job of the release, as the chart has it, and
      # not a post-install hook: the platform's composition waits for the
      # release's pods, the web pod waits for the database the seeder makes,
      # and Helm runs a post-install hook only after that wait is over.
      seederJob:
        resources:
          limits:
            cpu: "250m"
            memory: "768Mi"
          requests:
            cpu: "100m"
            memory: "512Mi"

      serviceAccount:
        create: true

      openproject:
        seed_locale: "de"
        host: "projects.${TENANT_DOMAIN}"
        # The administrator OpenProject seeds on first start. Locked: nobody
        # signs in with a password here, and the sign-in sidecar signs nobody
        # in to a locked account, so no person at the platform becomes this
        # administrator by holding its address. Who administers OpenProject
        # is who holds the platform's App Admin role: customization.md.
        admin_user:
          name: "OpenProject Internal Admin"
          mail: "openproject-admin@${TENANT_DOMAIN}"
          password_reset: "false"
          locked: true
        useTmpVolumes: true

      ingress:
        enabled: false

      environment:
        OPENPROJECT_LOGIN__REQUIRED: "true"
      # Nobody signs in to OpenProject with a password: its own form answers
      # 404, and with it go registering and resetting a password. People come
      # in through the platform's sign-in sidecar.
        OPENPROJECT_DISABLE__PASSWORD__LOGIN: "true"
      # OpenProject's "stay signed in" token is what the sign-in handler
      # hands OpenProject to make a session; 0, the default, switches the
      # token off. The number is its lifetime in days for a token OpenProject
      # makes itself, which it does only from the password form that is off;
      # the handler's own tokens end within the hour.
        OPENPROJECT_AUTOLOGIN: "1"
        OPENPROJECT_EMAIL__DELIVERY__METHOD: "smtp"
      # ADDRESS, PORT and USER__NAME are supplied by the platform through
      # valueMapping.smtp — this app does not name a mail server.
        OPENPROJECT_SMTP__SSL: "false"
        OPENPROJECT_SMTP__AUTHENTICATION: "cram_md5"
        OPENPROJECT_SMTP__ENABLE__STARTTLS__AUTO: "true"
        OPENPROJECT_SMTP__OPENSSL__VERIFY__MODE: "none"
        OPENPROJECT_SMTP__DOMAIN: "${TENANT_DOMAIN}"
        OPENPROJECT_SMTP__USER__NAME: "gentian-system@${TENANT_DOMAIN}"
        OPENPROJECT_MAIL__FROM: "noreply@${TENANT_DOMAIN}"
        OPENPROJECT_HOME__URL: "https://projects.${TENANT_DOMAIN}/"
        OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_USER: "api_admin"
        OPENPROJECT_LOG__LEVEL: "info"
        OPENPROJECT_APP__TITLE: "Projekte"
        OPENPROJECT_USER__DEFAULT__TIMEZONE: "Europe/Berlin"
        OPENPROJECT_DEFAULT__COMMENT__SORT__ORDER: "desc"
        OPENPROJECT_PLUGIN__OPENPROJECT__AVATARS: '{enable_gravatars: false, enable_local_avatars: true}'

  # Customization ladder — see customization.md
  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
    services:
      identity:
      # OpenProject's own single sign-on needs its paid edition and is not
      # used. Its people are signed in by the platform's sidecar, with the
      # handler in assets/sign-in-handler.js. See
      # customizations/sign-in-sidecar.yaml for the review.
        sidecar:
        # Where OpenProject sends a browser that has no session. Not "/",
        # where the handler ends: OpenProject's front page stays its own.
          entryPaths: ["/login"]
        # The handler looks the person up and writes the one-time token
        # OpenProject turns into a session.
          database: true
        # secret_key_base: OpenProject stores a token as a hash made with it.
        # api_admin_password: OpenProject's own interface for making an
        # account and for making it an administrator's or an ordinary one,
        # called inside the cluster.
          secrets: [secret_key_base, api_admin_password]
        # That call, and the one that turns the token into a session.
          appPort: 8080
      database:
        engine: postgresql
        databasePerTenant: true
      storage:
        s3:
          bucketPerTenant: true
      cache:
        engine: memcached
      mail:
        smtp: {}

  provides:
    - name: project-management
      protocol: http-json

  integrations:
    - contract: central-navigation
      provider: portal
      capabilities:
        - navigation:register
    - contract: file-store
      capabilities:
        - webdav:read
        - webdav:write

  secrets:
    generated:
      - name: admin_password
        valuePath: "openproject.admin_user.password"
      - name: api_admin_password
        valuePath: "environment.OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_PASSWORD"
      # Rails' own key. The image ships a placeholder ("OVERWRITE_ME") and the
      # chart sets none, so without this every install shares a public one.
      - name: secret_key_base
        valuePath: "environment.SECRET_KEY_BASE"

  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: "projects"
      # What is left of OpenProject's own ways in with a password, refused at
      # the front door as well as switched off in OpenProject. Its form's own
      # address, /login, is not here: it is where the sign-in begins, and
      # OpenProject answers a password posted to it with 404.
      denyPaths:
        - /account/register
        - /account/lost_password
        - /account/change_password
      backend:
        service: "openproject-ce"
        port: 8080
      tile:
        displayName: "Projects"
        displayNames:
          de_DE: "Projekte"
        logo: data:image/png;base64,
        image: assets/tile.png
        relation: can_launch
  customization:
    grade: B
    rubricScore: 5
    supportedRungs: [L0, L1, L3, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/openproject-ce/customization.md
    configure:
      hotReload: false
    dropIns:
      - name: branding
        path: /app/public/gentian-branding
        format: files
        source: configMap
        upstreamDocumented: false   # no upstream drop-in dir — this mount is really L4
        tenantEditable: true
        maxBytes: 262144
    extension:
      mechanism: openproject-plugin
      delivery: [image-layer]       # plugins resolve at build time
      apiStability: undocumented
      apiDocs: https://www.openproject.org/docs/development/
      perTenantAddons: false
      testMatrix: ["15"]
    publishes:
      apis:
        - contract: project-management
          protocol: http-json
          spec: openapi
          path: /api/v3
          auth: oidc-token-exchange
    repackage:
      chartOwnership: upstream
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
  launch: tile
