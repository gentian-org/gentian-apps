# OIDC pack for the community OpenProject profile (clientId: gentian-openproject).
apiVersion: gentianos.io/v1alpha1
kind: OIDCPackCatalog
metadata:
  name: gentian-openproject-oidc
  labels:
    gentianos.io/oidc-catalog: openproject-ce
    gentianos.io/profile-name: openproject-ce
spec:
  mapperTemplates:
    gentian_useruuid:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: entryUUID
        claim.name: gentian_useruuid
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    gentian_username:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: uid
        claim.name: gentian_username
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    email:
      protocolMapper: oidc-usermodel-property-mapper
      config:
        user.attribute: email
        claim.name: email
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    given_name:
      protocolMapper: oidc-usermodel-property-mapper
      config:
        user.attribute: firstName
        claim.name: given_name
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    family_name:
      protocolMapper: oidc-usermodel-property-mapper
      config:
        user.attribute: lastName
        claim.name: family_name
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    openproject-ce_admin:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: openprojectAdmin
        claim.name: openproject-ce_admin
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
  packs:
    gentian-openproject:
      scopeName: gentian-openproject-scope
      scopeDescription: "Scope for Gentian OpenProject app instances."
      clientRole: gentian-openproject-access-control
      entitlementGroup: managed-by-attribute-Projectmanagement
      publicClient: false
      fullScopeAllowed: false
      defaultScopes:
        - profile
        - email
        - roles
        - web-origins
        - acr
      mappers:
        - gentian_useruuid
        - gentian_username
        - openproject-ce_admin
        - email
        - given_name
        - family_name
