# SPDX-License-Identifier: GPL-3.0-only
# ComponentProfile — ERPNext, Community Edition (erpnext-ce)
#
# ERPNext is GPL-3.0-only; the Frappe Framework it runs on is MIT. Both come
# unmodified in the official image docker.io/frappe/erpnext, which
# charts/erpnext runs. There is no other edition: everything ERPNext has is in
# this one.
#
# ── Why a chart of this repository ──────────────────────────────────────────
# Frappe publishes a chart (frappe/helm, chart erpnext 8.0.86 for v16.51.1).
# It does not fit the platform in four places, each in most of its templates:
#   - its site job runs bench new-site with the database server's root
#     account, which the platform hands no app;
#   - a root init container chowns the volume, and CAP_CHOWN is added to every
#     container, which the platform's pod policies refuse;
#   - every process is its own Deployment on one ReadWriteMany volume, and the
#     platform installs no ReadWriteMany storage;
#   - it brings its own MariaDB and Redis.
# What would remain of it after patching is the image and the commands, so
# charts/erpnext is the platform's own: one pod holding nginx, gunicorn, the
# realtime server, one worker for the three queues and the scheduler, on one
# ReadWriteOnce volume. The pod is one replica and cannot be more; a larger
# installation needs ReadWriteMany storage and the processes split, which this
# chart does not do.
#
# ── The site ────────────────────────────────────────────────────────────────
# One site, named after the host it is served at: erpnext.<tenant domain>. The
# chart's configure step creates it on the first start (bench new-site
# --no-setup-db --install-app erpnext, into the database the platform made),
# migrates it when the image's versions change, and writes its database,
# address, mail and sign-in from this pod's values on every start. A site
# restored from another domain is renamed to this host on the start after the
# restore. See charts/erpnext/files/configure.sh.
#
# ERPNext's setup wizard (company, country, currency, fiscal year) is left to
# the tenant: the first System Manager to open the desk is asked.
#
# ── Services ────────────────────────────────────────────────────────────────
# Database: the platform's MariaDB. Redis: two in the pod, not the platform's;
# Frappe takes a Redis to be its bench's alone (charts/erpnext/values.yaml,
# "redis", has the keys and channels it shares). Mail: the platform's SMTP, as
# Frappe's site-level outgoing account.
#
# ── Sign-in ─────────────────────────────────────────────────────────────────
# Through the tenant's realm, with Frappe's built-in Keycloak login: a Social
# Login Key the chart writes on every start (charts/erpnext/files/configure.py).
# A person's first sign-in creates their account, found by email first, with
# the role "Desk User", which opens the desk and grants nothing in it. Who holds
# System Manager is the platform's to say: hooks.provisioning below gives it to
# the tenant's app administrators and takes it from everyone else. Frappe's
# password form is switched off; nobody, Administrator included, signs in with
# a password, and Frappe's login page goes straight on to the realm.
#
# Secret inventory:
#   Platform-provided:
#     database host/port/name/user/password (valueMapping.database)
#     OIDC issuer and client secret (valueMapping.oidc)
#     SMTP host/port/user/password (valueMapping.smtp)
#   Generated (3):
#     admin_password   → admin.password   (Administrator, set at site creation)
#     admin_api_key    → admin.apiKey     (Administrator's API key, written on
#     admin_api_secret → admin.apiSecret   every start; the provisioning job's)
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: erpnext-ce
  labels:
    gentianos.io/profile-name: erpnext-ce
    gentianos.io/profile-family: erpnext
    gentianos.io/profile-edition: ce
spec:
  classes:
    - app
  trustTier: certified
  version: "0.5.1-dev.1"
  package:
    chart:
      repository: "oci://ghcr.io/gentian-org/charts"
      name: erpnext
      version: "0.1.0-develop.8254745"

    valueMapping:
      oidc:
        # The issuer the platform seeded for this tenant's realm, the string
        # the client is registered under. The browser goes to its authorization
        # endpoint; the token and userinfo calls go to it from the pod, which
        # requires.services.identity opens the path for.
        issuerKey: "oidc.issuer"
        clientSecretKey: "oidc.clientSecret"
      database:
        hostKey: "database.host"
        portKey: "database.port"
        nameKey: "database.name"
        userKey: "database.user"
        passwordKey: "database.password"
      smtp:
        hostKey: "smtp.host"
        portKey: "smtp.port"
        userKey: "smtp.user"
        passwordKey: "smtp.password"

    extraValues:
      fullnameOverride: "erpnext-ce"

      # The site's name and the host it is served at: spec.expose[web] below.
      siteName: "erpnext.${TENANT_DOMAIN}"

      oidc:
        enabled: true
        clientId: "gentian-erpnext"

      smtp:
        # host, port and user are supplied by the platform through
        # valueMapping.smtp; this app does not name a mail server.
        fromAddress: "erpnext@${TENANT_DOMAIN}"

      ingress:
        enabled: false

  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
    services:
      identity:
        oidc:
          clientId: "gentian-erpnext"
          name: "ERPNext"
          accessType: CONFIDENTIAL
          # Frappe's callback for its built-in Keycloak login.
          redirectUris:
            - "https://erpnext.${TENANT_DOMAIN}/api/method/frappe.integrations.oauth2_logins.login_via_keycloak"
          postLogoutRedirectUris:
            - "https://erpnext.${TENANT_DOMAIN}/"
        # No backchannelLogout: Frappe's social login is an OAuth2 client that
        # reads the userinfo endpoint once, not an OpenID Connect relying party,
        # and has no endpoint to take a logout_token at. Signing out of the
        # portal leaves this app's session running until it expires on its own.
        # Recorded rather than left blank, so the absence reads as a limit of
        # the app.
      database:
        engine: mariadb
        databasePerTenant: true
      # No cache: Frappe's Redis are in the pod (see the header).
      mail:
        smtp: {}

  provides:
    - name: erpnext-api
      protocol: http-json

  integrations:
    - contract: central-navigation
      provider: portal
      capabilities:
        - navigation:register

  secrets:
    generated:
      - name: admin_password
        valuePath: "admin.password"
      - name: admin_api_key
        valuePath: "admin.apiKey"
      - name: admin_api_secret
        valuePath: "admin.apiSecret"

  backup:
    # The default capture is right: the app scaled to zero, its database
    # dumped, its sites volume archived. The volume holds the site's
    # configuration, with the encryption key the passwords in the database
    # were encrypted with, so it is never left out.
    volumes:
      # Frappe's own backups of the site, which the platform's capture makes
      # redundant.
      excludePaths:
        - "**/private/backups"
    restore:
      # The pod's start before these runs puts the site under this host, points
      # it at the database and credentials it is given now, and migrates it if
      # the bundle was written by another version. What is left is Frappe's
      # cache of the old site.
      post:
        - - sh
          - -c
          - cd /home/frappe/frappe-bench && exec bench --site "$FRAPPE_SITE" clear-cache
      # The site opens its database as the configuration it now has says.
      verify:
        - sh
        - -c
        - cd /home/frappe/frappe-bench && exec bench --site "$FRAPPE_SITE" execute frappe.ping
    quiesce:
      container: backend

  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: "erpnext"
      backend:
        service: "erpnext-ce"
        port: 8080
      tile:
        displayName: "ERPNext"
        logo: data:image/png;base64,
        image: assets/tile.png
        # The desk. Unsigned, Frappe sends it to its login page, which goes on
        # to the realm's sign-in at once, and back to the desk after.
        path: /desk
        relation: can_launch

  hooks:
    provisioning:
      privilegedRole:
        kind: group
        # Frappe's administrator role.
        name: System Manager

      # How this app applies that role. The platform resolves the tenant's app
      # administrators and runs this job with them; the calls are Frappe's REST
      # API, made inside the cluster as Administrator with its API key.
      # Converges: every app administrator holds System Manager, nobody else
      # does. Administrator is never touched. An app administrator who has not
      # signed in yet gets an account by email, which their first sign-in
      # takes.
      syncJob:
        image: docker.io/frappe/erpnext:v16.51.1
        env:
          - name: ADMIN_API_KEY
            secretKeyRef:
              name: erpnext-ce-sensitive-values
              key: internal-admin_api_key
          - name: ADMIN_API_SECRET
            secretKeyRef:
              name: erpnext-ce-sensitive-values
              key: internal-admin_api_secret
        script: |
          #!/bin/sh
          set -eu
          exec python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          TOKEN = "token %s:%s" % (os.environ["ADMIN_API_KEY"], os.environ["ADMIN_API_SECRET"])
          BASE = "http://%s:8080" % os.environ["GENTIAN_APP"]
          ROLE = os.environ.get("GENTIAN_PRIVILEGED_ROLE") or "System Manager"
          KEEP = {"administrator", "guest"}

          def call(method, path, body=None):
              req = urllib.request.Request(
                  BASE + path, method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={"Authorization": TOKEN, "Content-Type": "application/json", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return json.load(resp).get("data")
              except urllib.error.HTTPError as e:
                  if e.code == 404 and method == "GET":
                      return None
                  raise SystemExit("%s %s answered %d: %s" % (method, path, e.code, e.read()[:500]))

          def user(name):
              return call("GET", "/api/resource/User/" + urllib.parse.quote(name, safe=""))

          def set_roles(doc, roles):
              call("PUT", "/api/resource/User/" + urllib.parse.quote(doc["name"], safe=""),
                   {"roles": [{"role": r} for r in roles]})

          # The site answers, and the key is Administrator's: a missing site
          # answers 404 too, which below would read as "no such user".
          req = urllib.request.Request(BASE + "/api/method/frappe.auth.get_logged_user",
                                       headers={"Authorization": TOKEN, "Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              if json.load(resp).get("message") != "Administrator":
                  raise SystemExit("the API key is not Administrator's")

          with open(os.environ["GENTIAN_APP_ADMINS_FILE"]) as fh:
              members = json.load(fh)
          want = {m["email"].lower(): m for m in members if m.get("email")}

          holders = call("GET", "/api/resource/User?limit_page_length=0"
                         + "&fields=" + urllib.parse.quote(json.dumps(["name"]))
                         + "&filters=" + urllib.parse.quote(json.dumps([["Has Role", "role", "=", ROLE]]))) or []

          for email, member in sorted(want.items()):
              doc = user(email)
              if doc is None:
                  call("POST", "/api/resource/User", {
                      "email": email,
                      "first_name": member.get("username") or email.split("@")[0],
                      "send_welcome_email": 0,
                      "user_type": "System User",
                      "roles": [{"role": ROLE}],
                  })
                  print("made %s, holding %s" % (email, ROLE))
                  continue
              roles = [r["role"] for r in doc.get("roles", [])]
              if ROLE not in roles:
                  set_roles(doc, roles + [ROLE])
                  print("gave %s %s" % (email, ROLE))

          for holder in sorted({h["name"].lower() for h in holders}):
              if holder in want or holder in KEEP:
                  continue
              doc = user(holder)
              if doc is None:
                  continue
              set_roles(doc, [r["role"] for r in doc.get("roles", []) if r["role"] != ROLE])
              print("took %s from %s" % (ROLE, holder))

          print("app administrators synchronised: %d" % len(want))
          PY

  # Customization ladder — see customization.md
  customization:
    grade: B
    rubricScore: 5
    supportedRungs: [L0, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/erpnext/erpnext-ce/customization.md
    configure:
      hotReload: false
    publishes:
      apis:
        - contract: erpnext-api
          protocol: http-json
          path: /api
          # Frappe's API keys (Authorization: token <key>:<secret>) or a
          # session; it takes no bearer token of the realm.
          auth: frappe-api-key
    repackage:
      chartOwnership: gentian-owned
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
  launch: tile
