# SPDX-License-Identifier: MIT
# ComponentProfile — MailCraft (mail in the browser, over JMAP)
#
# Source: https://github.com/UCS-Care-Group/mailcraft (MIT OR Apache-2.0).
#   Upstream publishes neither an image nor a chart, but every release
#   carries the browser build as static files, so this repository builds
#   both: images/mailcraft serves the pinned release's web build unchanged,
#   and charts/mailcraft runs that one container. The app is WebAssembly and
#   runs in the browser. The chart names its image; a develop build of the
#   chart names the same commit's develop image.
#
# ── Mail ──
# For a cluster whose mail is on a JMAP mail server outside it
# (mail.serviceMode external, such as Stalwart). The browser build speaks
# JMAP only. The server's address reaches the app from its IMAP record
# (requires.services.mail.imap, valueMapping.imap): the session is
# https://<IMAP host>/jmap/session unless the tenant's manifest sets
# jmap.session. The server in images/app-host (jmap mode) puts one script
# first in the app's page that names the person's account. The app asks the
# person for their password at the server, keeps it in the page's memory, and
# reads and sends mail with the server directly; nothing of the mail and no
# credential passes the pod. Signing in with the realm's token instead is
# gentian-os#1342.
#
# The mail server has to let this app's address in (CORS), set by its
# administrator.
#
# Only for a cluster whose mail is on a JMAP server outside it. Where the
# cluster runs its own mail (mail.serviceMode internal), the IMAP record
# names the cluster's Dovecot, which speaks no JMAP: the app finds no session
# there and cannot connect, so install it only where mail is external. Where
# the cluster only relays, the IMAP record names no server and the app starts
# as upstream ships it: an empty mailbox in the browser, nothing sent
# anywhere.
#
# ── Outside calls ──
# The page calls the mail server from the browser. The pod calls nobody and
# asks for no egress.
#
# ── Sign-in ──
# None of its own: the app has no accounts and nothing to administer, so it
# declares no identity client and no App Admin role. The gateway entry puts
# it behind the tenant's session: only people the tenant's administrator
# granted the app (can_launch) reach it.
#
# Secret inventory:
#   Platform-provided: none.
#   Generated: none.
#
# Backup: nothing to back up; the app has no store and no volume. The mail is
# the mail server's; what the app keeps is the person's browser's.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: mailcraft-ce
  labels:
    gentianos.io/profile-name: mailcraft-ce
    gentianos.io/profile-family: mailcraft
    gentianos.io/profile-edition: ce
spec:
  classes:
    - app
  trustTier: certified
  version: "0.1.1-dev"
  launch: tile
  package:
    chart:
      repository: "oci://ghcr.io/gentian-org/charts"
      name: mailcraft
      version: "0.1.0-develop.af7c021"
    extraValues:
      fullnameOverride: "mailcraft-ce"
      ingress:
        enabled: false
      podAnnotations:
        reloader.stakater.com/auto: "true"
    valueMapping:
      # Where mail is read: the mail server's IMAP host, from which the JMAP
      # session address is made. Optional on the platform: a cluster with no
      # mail server outside it has none, and the chart keeps its default.
      imap:
        hostKey: mail.imapHost

  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
    services:
      mail:
        imap: {}

  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: "mailcraft"
      backend:
        service: "mailcraft-ce"
        port: 8080
      tile:
        displayName: "MailCraft"
        displayNames: {de_DE: "MailCraft"}
        description: "Mail in the browser, at the workspace's mail server"
        image: assets/tile.png
        logo: data:image/png;base64,
        relation: can_launch

  customization:
    grade: unknown
    supportedRungs: [L0, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/mailcraft/mailcraft-ce/customization.md
    repackage:
      chartOwnership: gentian-owned
