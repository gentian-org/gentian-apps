# AppProfile — CryptPad (end-to-end encrypted collaborative editing)
#
# Source chart: oci://registry.opencode.de/bmi/opendesk/components/supplier/xwiki/charts-mirror
#   cryptpad v0.0.21  (same supplier mirror channel as xwiki)
# Value paths verified against:
#   opendesk/helmfile/apps/cryptpad/values.yaml.gotmpl
# Chart version from: opendesk/helmfile/environments/default/charts.yaml.gotmpl
# Image from:         opendesk/helmfile/environments/default/images.yaml.gotmpl
#
# Secret inventory:
#   None — CryptPad does not integrate with Keycloak (OIDC), LDAP, PostgreSQL,
#   MariaDB, or SMTP. All document content is encrypted client-side with keys
#   the server never sees. No secrets are provisioned from OpenBao.
#
# Design notes:
#   CryptPad differs fundamentally from the other opendesk apps:
#
#   No SSO/OIDC:
#     CryptPad manages its own user accounts. There is no Keycloak integration.
#     Users register directly on the CryptPad instance. Registration is closed
#     (restrictRegistration: true) to prevent public sign-up, but authentication
#     is internal to CryptPad — not federated via Keycloak.
#
#   No database:
#     CryptPad uses a flat key-value file store. All document content is
#     encrypted with keys known only to the client — the server stores opaque
#     blobs and cannot read document content.
#
#   No LDAP, no SMTP:
#     Group sync and email notification features are not used in this deployment.
#
#   No persistent volume (aligned with opendesk default):
#     persistence.enabled: false. If persistent storage is required, attach a PVC
#     by overriding persistence.enabled and persistence.size via App extraValues.
#
#   WebSocket (mandatory):
#     CryptPad uses persistent WebSocket connections for real-time multi-user
#     collaboration. The NGINX Ingress must carry the
#     `nginx.org/websocket-services: "cryptpad"` annotation; without it, live
#     editing will fail with connection-dropped errors.
#
#   Embedding:
#     enableEmbedding: true (root extraValues key, NOT under config:) writes the
#     ENABLE_EMBEDDING decree via the chart's init container, setting frame-ancestors
#     to 'self' https: vector: so the portal iframe can embed CryptPad.
#     IMPORTANT: workloadStateful: false is also required — otherwise the init container
#     writes the decree to an emptyDir that the main container never mounts.
#
#     CryptPad's info pages (home, about, login…) explicitly block iframe embedding
#     via a window.top check in template.js. The portalTile must use linkSuffix: "/drive/"
#     so the portal embeds /drive/ (application framework, no iframe guard) instead
#     of / (info page, blocked by template.js → permanent "Loading…" spinner).
#
#   Chart-managed ingress disabled:
#     ingress.enabled: false — the operator creates the Ingress CR (spec.ingress).
#     Leaving the chart ingress enabled causes duplicate resources and sync errors.
#
#   fullnameOverride: "cryptpad":
#     Ensures the chart Service is always named "cryptpad", matching the
#     `nginx.org/websocket-services` annotation and the operator's serviceName.
#
#   Deployment uses Pattern B (crossplane): an App claim drives the Composition
#   which renders the Helm Release. No ExternalSecret is needed (no secrets).
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: cryptpad
  labels:
    gentianos.io/profile-name: cryptpad
spec:
  displayName: "CryptPad"
  description: >-
    End-to-end encrypted real-time collaborative document editor.
    No SSO — users register directly on the instance.
    The server cannot read document content (client-side encryption).
  logo: "data:image/svg+xml;base64,"

  # CryptPad requires no kernel services — no OIDC client, no database,
  # no LDAP bind account, and no SMTP relay are needed.
  kernelRequirements: {}

  provides:
    - name: collaborative-editing
      protocol: https

  optionalIntegrations:
    # Register a tile in the Univention Portal (nubus) for this tenant.
    - contract: central-navigation
      provider: nubus
      capabilities:
        - navigation:register

  portalTiles:
    - name: cryptpad
      displayName:
        de_DE: "CryptPad"
        en_US: "CryptPad"
      linkTarget: newwindow
      # The portal opens apps in an embedded iframe window (when windows_enabled is true).
      # CryptPad's home page (/) blocks iframe embedding via template.js ("no valid reason
      # to load info pages in an iframe"). Point to /drive/ instead, which uses the full
      # application framework and loads correctly in an iframe.
      linkSuffix: "/drive/"
      allowedGroup: "Domain Users"

  chart:
    # Published via the opendesk XWiki supplier mirror (same channel as xwiki v1.4.4).
    repository: "oci://registry.opencode.de/bmi/opendesk/components/supplier/xwiki/charts-mirror"
    name: cryptpad
    version: "0.0.21"

  deploymentMethod: crossplane

  # No valueMapping block — no kernel-provisioned secrets to inject.

  ingress:
    # Subdomain from opendesk global.yaml.gotmpl: hosts.cryptpad = "pad"
    subDomain: "pad"
    # Service name matches fullnameOverride below.
    serviceName: "cryptpad"
    # The chart's Service exposes container port 3000 as Service port 80.
    servicePort: 80
    ingressClassName: "nginx"
    tlsEnabled: true
    clusterIssuer: "letsencrypt-http01"
    annotations:
      # WebSocket upgrade passthrough — required for real-time collaboration.
      nginx.org/websocket-services: "cryptpad"

  # CryptPad requires httpSafeOrigin to be a DIFFERENT subdomain from httpUnsafeOrigin.
  # The safe origin hosts sandboxed iframes for client-side encryption isolation.
  # Without this second ingress the browser loads the main page but immediately
  # fails to reach the sandbox subdomain (connection refused / white screen).
  # pad-sandbox is a flat subdomain (one level under effectiveDomain) so it is
  # covered by the wildcard cert *.<effectiveDomain>. A two-level subdomain like
  # sandbox.pad would not be covered by that wildcard.
  additionalIngresses:
    - subDomain: "pad-sandbox"
      serviceName: "cryptpad"
      servicePort: 80
      ingressClassName: "nginx"
      tlsEnabled: true
      clusterIssuer: "letsencrypt-http01"

  extraValues:
    image:
      repository: "registry.opencode.de/bmi/opendesk/components/supplier/xwiki/images-mirror/cryptpad"
      tag: "version-2025.9.0@sha256:484492964391231863b21e8735e5b168230dcc6906b58f320526a46c78dfa53b"

    # Predictable Service name — must match ingress.serviceName and the
    # nginx.org/websocket-services annotation above.
    fullnameOverride: "cryptpad"

    # Closed registration: users cannot self-register.
    # Access is controlled at the network / portal level.
    restrictRegistration: true

    # Allow the tenant portal to embed CryptPad in an iframe.
    # The init container writes an ENABLE_EMBEDDING admin decree to the data volume,
    # which CryptPad reads on startup to set frame-ancestors to 'self' https:.
    enableEmbedding: true

    # Use a Deployment (not StatefulSet) so the chart mounts the emptyDir data
    # volumes in the main container. With workloadStateful: true (the chart default)
    # and persistence.enabled: false, the chart's volumeMounts template skips the
    # data volumes for the main container entirely — meaning the init container's
    # decree file is written to an emptyDir the main container never sees.
    workloadStateful: false

    # Chart-managed ingress is disabled; the operator creates the Ingress CR.
    ingress:
      enabled: false

    # No persistent volume (opendesk default). Override in App extraValues if
    # persistent attachment storage is needed:
    #   persistence:
    #     enabled: true
    #     size: "10Gi"
    persistence:
      enabled: false

    # CryptPad requires more memory than the chart default (512Mi OOMKills on startup).
    # opendesk production sets 2Gi; 1.5Gi is sufficient for a tenant instance.
    resources:
      limits:
        cpu: "1"
        memory: "1536Mi"
      requests:
        cpu: "100m"
        memory: "512Mi"

    # Required by the chart (fsGroup must match runAsGroup 4001).
    podSecurityContext:
      fsGroup: 4001

    podAnnotations:
      # Trigger a rolling restart when any referenced ConfigMap or Secret changes.
      reloader.stakater.com/auto: "true"

    global:
      domain: "${TENANT_DOMAIN}"
      hosts:
        cryptpad: "pad"

    # When ingress.enabled=false the chart defaults httpUnsafeOrigin/httpSafeOrigin
    # to "http://localhost:3000", which causes the browser to be redirected there.
    # httpSafeOrigin MUST be a different subdomain from httpUnsafeOrigin — CryptPad
    # uses it for sandboxed iframes that provide client-side encryption isolation.
    config:
      httpUnsafeOrigin: "https://pad.${TENANT_DOMAIN}"
      httpSafeOrigin: "https://pad-sandbox.${TENANT_DOMAIN}"
