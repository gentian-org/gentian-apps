# OIDC pack for the XWiki profile (clientId: gentian-xwiki).
apiVersion: gentianos.io/v1alpha1
kind: OIDCPackCatalog
metadata:
  name: xwiki-ce-oidc
  labels:
    gentianos.io/profile-name: xwiki-ce
spec:
  mapperTemplates:
    gentian_useruuid:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: entryUUID
        claim.name: gentian_useruuid
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    gentian_username:
      # The Keycloak username, which people cannot change themselves. The realm
      # stores no "uid" attribute; reading one left the claim out of the token.
      # Keycloak lists the username among a user's attributes.
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: username
        claim.name: gentian_username
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    email:
      protocolMapper: oidc-usermodel-property-mapper
      config:
        # The USERNAME, not the email field. Keycloak's password reset mails the
        # email field and can be pointed at nothing else, so that field holds the
        # user's recovery address — a personal inbox they can still read when
        # locked out. The workspace address is the username
        # (christian@corp.example is the login and the mailbox), which is what
        # this app should receive as the user's identity. Reading the field here
        # handed the app a personal address instead.
        user.attribute: username
        claim.name: email
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    given_name:
      protocolMapper: oidc-usermodel-property-mapper
      config:
        user.attribute: firstName
        claim.name: given_name
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    family_name:
      protocolMapper: oidc-usermodel-property-mapper
      config:
        user.attribute: lastName
        claim.name: family_name
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
  packs:
    gentian-xwiki:
      scopeName: gentian-xwiki-scope
      scopeDescription: "Scope for Gentian XWiki app instances."
      clientRole: gentian-xwiki-access-control
      entitlementGroup: managed-by-attribute-Wiki
      publicClient: false
      fullScopeAllowed: false
      defaultScopes:
        - profile
        - email
        - roles
        - web-origins
        - acr
      mappers:
        - gentian_useruuid
        - gentian_username
        - email
        - given_name
        - family_name
