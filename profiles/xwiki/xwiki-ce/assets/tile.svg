<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 52 52" role="img"><rect width="52" height="52" rx="10" fill="#ECE8DF" /><rect width="52" height="52" rx="10" fill="none" stroke="rgba(20, 21, 46, 0.08)" stroke-width="1" /><svg class="xwiki-logo" x="12" y="12" width="28" height="28" viewBox="-57 -57 114 114" preserveAspectRatio="xMidYMid meet"><style type="text/css">
