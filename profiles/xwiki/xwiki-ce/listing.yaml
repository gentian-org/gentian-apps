profile: xwiki-ce
displayName: "XWiki"
summary: "A wiki for team knowledge, documentation and intranets, with structured data and add-on applications."
description: |
  XWiki is an open-source enterprise wiki and knowledge-management platform, positioned as an alternative to Confluence, Notion and SharePoint. Teams use it for documentation, knowledge bases and intranets, editing pages with a WYSIWYG editor. Its notable trait is the "structured wiki": pages can hold structured data and the platform can be extended with applications and extensions.
categories: [knowledge, collaboration]
