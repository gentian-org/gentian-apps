# ComponentProfile — Gentian Subscriptions
#
# A component that runs nothing: the service is hosted elsewhere and the
# cluster's part is the link to it. No workload, no route, no session of the
# cluster's -- the tile leads straight to the service, naming the tenant by
# its domain, and is shown to whoever administers the tenant.
#
# Installed by default on new tenants (opt-out).
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: gentian-subscriptions-me
  labels:
    gentianos.io/profile-name: gentian-subscriptions-me
  annotations:
    gentianos.io/platform-app: "true"
    gentianos.io/deployment-role: base
spec:
  classes:
    - app
  trustTier: experimental
  version: 0.0.0
  package:
    api:
      # redirect, not portal-proxy: the proxy runtime needs something in the
      # tenant's DMZ to hold a credential, which is not built, so the operator
      # refused this entry and the tenant never had the tile.
      runtime: redirect
      baseUrl: "https://corp.desk.gentian.org"
      tenantBinding: tenant-domain
      tile:
        displayName: "Subscriptions"
        displayNames:
          de_DE: "Abonnements"
        description: "Billing and entitlements for this tenant."
        logo: data:image/svg+xml;base64,
        relation: can_administer
        object: tenant

  customization:
    grade: B
    rubricScore: 5
    supportedRungs: [L0, L1, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/gentian-subscriptions-me/customization.md
    configure:
      hotReload: false
    dropIns:
      - name: app-config
        path: /etc/gentian/gentian-subscriptions-me/conf.d
        format: yaml
        source: configMap
        maxBytes: 262144
        upstreamDocumented: true
        tenantEditable: false
    publishes:
      apis:
        - contract: subscriptions
          protocol: http-json
          spec: openapi
          path: /api/v1
          auth: oidc-token-exchange
    repackage:
      chartOwnership: gentian-owned
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
  launch: tile
