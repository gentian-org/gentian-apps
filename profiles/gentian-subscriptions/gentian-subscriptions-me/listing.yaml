profile: gentian-subscriptions-me
displayName: "Gentian Subscriptions"
summary: "See and manage this tenant's Pro app subscriptions, billing and entitlements."
description: |
  Gentian Subscriptions is the platform's own link to its subscription service, shown to tenant administrators. Administrators use it to review and manage Pro app subscriptions, billing and entitlements for their tenant. It runs no workload in the cluster: the tile redirects to the hosted service, identifying the tenant by its domain.
categories: [commerce, operations]
family: gentian-subscriptions
edition: me
author: Gentian
license: Apache-2.0
