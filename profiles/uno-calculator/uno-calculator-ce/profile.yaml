# SPDX-License-Identifier: MIT
# ComponentProfile — Uno Calculator (standard, scientific, programmer and date
# calculator, and unit converter, in the browser)
#
# Source: Uno Platform's WebAssembly port of the Windows Calculator,
#   https://github.com/unoplatform/calculator (MIT), the same build that
#   https://calculator.platform.uno serves. Upstream publishes neither an
#   image nor a chart, so this repository builds both: images/uno-calculator
#   compiles the pinned commit into static files served by unprivileged
#   nginx, and charts/uno-calculator runs that one container. The calculation
#   happens in the browser; the pod only serves files. The chart names its
#   image; a develop build of the chart names the same commit's develop image.
#
# What differs from upstream (customizations/no-analytics.yaml): Google
# Analytics is never loaded. Upstream injects gtag.js at start and reports
# every mode switch to Google.
#
# Left as upstream ships it: the currency converter. It is the one mode that
# reaches outside, and only when a person opens it: their browser, not the
# pod, fetches the rates from aka.platform.uno (open.er-api.com and
# uno-assets.platform.uno behind it). Where the browser cannot reach them the
# converter says the rates are unavailable and every other mode works. The
# pod makes no outbound call, so the profile asks for no egress.
#
# Also left as upstream ships it: Uno's header banner. At every start the
# browser loads its four images from uno-assets.platform.uno, two of them with
# the app's name and run mode in the query. No cookie; where the host is
# unreachable the header shows no images and the app works.
#
# ── Sign-in ──
# None of its own. The app has no accounts, stores nothing on a server and
# has nothing to administer, so it declares no identity client, no
# provisioning hook and no App Admin role. The gateway entry below puts it
# behind the tenant's session: only people the tenant's administrator granted
# the app (can_launch) reach it.
#
# Secret inventory:
#   Platform-provided: none.
#   Generated: none.
#
# Backup: nothing to back up; the app has no store and no volume.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: uno-calculator-ce
  labels:
    gentianos.io/profile-name: uno-calculator-ce
    gentianos.io/profile-family: uno-calculator
    gentianos.io/profile-edition: ce
spec:
  classes:
    - app
  trustTier: certified
  version: "0.1.0"
  launch: tile
  package:
    chart:
      repository: "oci://ghcr.io/gentian-org/charts"
      name: uno-calculator
      version: "0.1.0"
    extraValues:
      fullnameOverride: "uno-calculator-ce"
      ingress:
        enabled: false
      podAnnotations:
        reloader.stakater.com/auto: "true"

  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
    # No services: no database, bucket, cache, mail or sign-in client.

  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: "calculator"
      backend:
        service: "uno-calculator-ce"
        port: 8080
      tile:
        displayName: "Uno Calculator"
        displayNames: {de_DE: "Uno Calculator"}
        description: "Standard, scientific and programmer calculator, unit converter"
        image: assets/tile.png
        logo: data:image/png;base64,
        relation: can_launch

  customization:
    grade: unknown
    supportedRungs: [L0, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/uno-calculator/uno-calculator-ce/customization.md
    repackage:
      chartOwnership: gentian-owned
