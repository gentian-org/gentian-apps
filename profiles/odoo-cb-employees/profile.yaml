apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-cb-employees
  labels:
    gentianos.io/profile-name: odoo-cb-employees
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: module
    gentianos.io/requires-profile: odoo-cb-base
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["employees"],"gentianOdooGroupRoles":["hr.group_hr_user"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Employees"
  description: "Employee directory and profile management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: standard
  trustTier: platform
  license: LGPL-3.0
  tile:
    icon: users

  portalTiles:
    - name: odoo-employees
      displayName:
        en_US: "Odoo Employees"
        de_DE: "Odoo Mitarbeiter"
      linkSuffix: "/web?gentian_embed=1&action=hr.open_view_employee_list_my"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.10"
  extraValues:
    odoo:
      module: hr
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
