apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: litellm-me
  labels:
    gentianos.io/profile-name: litellm-me
  annotations:
    # Tile shown only where the cluster serves LLM; the profile stays in the
    # catalogue either way, so an operator can discover it and enable it.
    gentianos.io/requires-capability: "llm"
    gentianos.io/platform-app: "true"
    gentianos.io/deployment-role: base
spec:
  displayName: "LLM Admin Panel"
  family: litellm
  edition: me
  description: "Manage LLM configurations, models, virtual keys, and track token usage."
  license: MIT
  author: Gentian
  tile:
    icon: settings

  deploymentMethod: api

  ingress:
    subDomain: llm-admin
    tlsEnabled: true

  apiIntegration:
    runtime: portal-proxy
    baseUrl: "http://litellm-proxy.platform-kernel.svc.cluster.local:4000"
    tenantBinding: none

  # No portalTiles, deliberately.
  #
  # This console configures the shared kernel LiteLLM: model routing, virtual
  # keys and the token budgets that apply to every tenant on the cluster. That
  # is not a tenant administrator's to open, and "Domain Admins" is a tenant
  # role -- so a tile here handed cluster-wide cost and routing control to
  # whoever administers any one workspace.
  #
  # It was invisible for a different reason until 2026-09: the tile is gated on
  # the cluster capability "llm", and nothing ever set GENTIAN_CAPABILITIES, so
  # it never rendered anywhere. Fixing that (gentian-os#200) turned it on for
  # every tenant at once, which is how the mis-scoping surfaced.
  #
  # The profile stays in the catalogue, so an operator can still see that LLM
  # administration exists. The way in is the platform-scope tile the portal
  # offers platform administrators (KERNEL_SHELL_APPS in gentian-ui), which
  # points at the same console and is withheld from tenant roles.
  #
  # linkTarget was "embedded", which would not have worked either: LiteLLM
  # answers with x-frame-options: DENY and frame-ancestors 'none', so the
  # iframe was blocked regardless of who opened it.

  # Customization ladder — see customization.md
  customization:
    grade: B
    rubricScore: 5
    supportedRungs: [L0, L1, L3, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/litellm-me/customization.md
    configure:
      hotReload: false
    dropIns:
      - name: litellm-config
        path: /app/config.d
        format: yaml
        source: configMap
        maxBytes: 262144
        upstreamDocumented: true
        tenantEditable: false    # model routing is a platform cost control
    extension:
      mechanism: litellm-callback
      delivery: [image-layer]
      apiStability: evolving
      apiDocs: https://docs.litellm-me.ai/docs/proxy/logging
      perTenantAddons: false
      testMatrix: ["1.55"]
    publishes:
      apis:
        - contract: llm-gateway
          protocol: http-json
          spec: openapi
          path: /v1
          auth: oidc-token-exchange
    # The artifact is not a chart: LiteLLM runs as a shared kernel singleton from
    # hand-written manifests in gentian-os/kernel/services/llm/. Gentian owns that
    # deployment outright — there is no upstream chart being consumed — so
    # 'upstream' understated it. Repackaging here means editing those manifests.
    repackage:
      chartOwnership: gentian-owned
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
