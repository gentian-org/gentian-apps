apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-cb-pos
  labels:
    gentianos.io/profile-name: odoo-cb-pos
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: module
    gentianos.io/requires-profile: odoo-cb-base
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["pos"],"gentianOdooGroupRoles":["point_of_sale.group_pos_user","stock.group_stock_user","account.group_account_invoice"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Point of Sale"
  description: "Point of Sale and Restaurant/Bar management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: standard
  trustTier: platform
  license: LGPL-3.0
  tile:
    icon: store

  portalTiles:
    - name: odoo-pos
      displayName:
        en_US: "Odoo Point of Sale"
        de_DE: "Odoo Point of Sale"
      linkSuffix: "/web?gentian_embed=1&action=point_of_sale.action_pos_config_kanban"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: http://192.168.0.100:8089
    name: odoo
    version: "0.1.3"
  extraValues:
    odoo:
      module: pos_restaurant
