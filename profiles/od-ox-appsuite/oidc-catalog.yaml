# OIDC pack for OX App Suite (clientId: opendesk-oxappsuite).
apiVersion: gentianos.io/v1alpha1
kind: OIDCPackCatalog
metadata:
  name: ox-appsuite-oidc
  labels:
    gentianos.io/oidc-catalog: ox-appsuite
    gentianos.io/profile-name: od-ox-appsuite
spec:
  mapperTemplates:
    opendesk_useruuid:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: entryUUID
        claim.name: opendesk_useruuid
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    opendesk_username:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: uid
        claim.name: opendesk_username
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    email:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: email
        claim.name: email
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    full_name:
      keycloakName: "full name"
      protocolMapper: oidc-full-name-mapper
      config:
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    ox_context:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: oxContextIDNum
        claim.name: context
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
  packs:
    opendesk-oxappsuite:
      scopeName: opendesk-oxappsuite-scope
      scopeDescription: "Scope for OX App Suite OIDC clients."
      clientRole: opendesk-oxappsuite-access-control
      entitlementGroup: managed-by-attribute-Groupware
      publicClient: false
      fullScopeAllowed: false
      defaultScopes:
        - profile
        - email
        - roles
        - web-origins
        - acr
      mappers:
        - ox_context
        - opendesk_useruuid
        - opendesk_username
        - full_name
        - email
