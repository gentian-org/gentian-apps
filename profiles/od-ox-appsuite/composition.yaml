apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app-od-ox
  labels:
    gentianos.io/composition: app
    gentianos.io/profile: od-ox-appsuite
    gentianos.io/app-variant: ox-appsuite
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XApp
  mode: Pipeline
  pipeline:

    # ── Step 1: Fetch the AppProfile and cluster-config ConfigMap ─────────────
    - step: fetch-profile
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: AppProfile
              into: appProfile
              apiVersion: gentianos.io/v1alpha1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 1
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name
            # gentian-cluster-config is created by install.sh (cluster metadata).
            - kind: ConfigMap
              into: clusterConfig
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 1
                matchLabels:
                  - key: app.kubernetes.io/managed-by
                    type: Value
                    value: gentian-os-install
            # gentian-kernel-services carries cluster infrastructure endpoints
            # (S3_ENDPOINT, MYSQL_HOST, REDIS_HOST) for extraValues substitution.
            - kind: ConfigMap
              into: kernelServices
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: kernel-services

    # ── Step 2: Render composed resources ─────────────────────────────────────
    # OX App Suite variant: emits the standard ExternalSecret + Release from
    # app-default, PLUS a second ExternalSecret that renders the OX
    # appsuite.properties file format required for com.openexchange.* property
    # keys that cannot be expressed as dot-notation --set flags.
    - step: render-app-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr     := .observed.composite.resource }}
            {{- $spec   := $xr.spec }}
            {{- $xrName := $xr.metadata.name }}
            {{- $app    := $spec.claimRef.name }}
            {{- $ns     := $spec.tenantNamespace }}
            {{- $tenant := trimPrefix "tenant-" $ns }}

            {{- $extraRes := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{- $profiles := dig "appProfile" list $extraRes }}
            {{- if eq (len $profiles) 0 }}
              {{- fail (printf "AppProfile %q not found in cluster" $spec.profileRef.name) }}
            {{- end }}
            {{- $profile   := index $profiles 0 }}
            {{- $pSpec     := dig "spec" dict $profile }}
            {{- $vm        := default dict $pSpec.valueMapping }}
            {{- $appSecrets := default list $pSpec.appSecrets }}
            {{- $chart     := $pSpec.chart }}

            {{- /* Tenant domain — used for Keycloak redirect URIs and extraValues. */}}
            {{- $domain := default (printf "%s.example.org" $tenant) $spec.domain }}

            {{- /* Load cluster-config ConfigMap for init Jobs. */}}
            {{- $ccRes      := dig "clusterConfig" list $extraRes }}
            {{- $ccCM       := default dict (index $ccRes 0) }}
            {{- $ccData     := dig "data" dict $ccCM }}
            {{- $clusterCfgs := $ccRes }}
            {{- $secretMode    := dig "secretMode"     "derived" $ccData }}
            {{- $minioEndpoint := dig "minio.endpoint" "" $ccData }}
            {{- $cnpgHost      := dig "cnpg.host"      "" $ccData }}
            {{- $appInitImage  := dig "appInit.image"  "ghcr.io/gentian-org/gentian-app-init:develop" $ccData }}
            {{- if gt (len $clusterCfgs) 0 }}
            {{- $cc := index $clusterCfgs 0 }}
            {{- end }}

            {{- /* Kernel service namespace + OX multi-chart wiring */}}
            {{- $servicesNs := dig "network.servicesNamespace" "gentian-dev" $ccData }}
            {{- $nubusRelease := "nubus-dev" }}
            {{- $releaseInstance := printf "%s-release" $xrName }}
            {{- $coreMwSelector := printf "app.kubernetes.io/instance=%s,app.kubernetes.io/name=core-mw" $releaseInstance }}
            {{- $oxSoapServer := printf "http://%s-core-mw-admin.%s.svc.cluster.local" $releaseInstance $ns }}
            {{- $provisioningApiBase := printf "http://%s-provisioning-api.%s.svc.cluster.local" $nubusRelease $servicesNs }}
            {{- $provisioningApiSubscriptions := printf "%s/v1/subscriptions" $provisioningApiBase }}
            {{- $provisioningAdminSecret := printf "%s-provisioning-api-admin" $nubusRelease }}
            {{- $ksResEarly := dig "kernelServices" list $extraRes }}
            {{- $ksCMEarly  := default dict (index $ksResEarly 0) }}
            {{- $ksDataEarly := dig "data" dict $ksCMEarly }}
            {{- $smtpHost := dig "mail.smtpHost" "" $ccData }}
            {{- if not $smtpHost }}{{- $smtpHost = dig "SMTP_HOST" "" $ksDataEarly }}{{- end }}
            {{- /* OX middleware runs in-cluster; public mail.<tenant> DNS is not */}}
            {{- /* reachable from pods (no IMAP on the HTTP gateway). Use kernel */}}
            {{- /* Dovecot like SMTP uses internal postfix (install-lib hairpin is */}}
            {{- /* only for mail.<kernel-domain>, not per-tenant subdomains). */}}
            {{- $imapHost := dig "mail.imapHost" "" $ccData }}
            {{- if not $imapHost }}{{- $imapHost = dig "IMAP_HOST" "" $ksDataEarly }}{{- end }}
            {{- if not $imapHost }}{{- $imapHost = printf "dovecot-dev.%s.svc.cluster.local" $servicesNs }}{{- end }}

            {{- /* ── ExternalSecret data[] entries (same logic as app-default) ─ */}}
            {{- $esData := list }}

            {{- if $vm.oidc }}
            {{- $oidcPath := printf "gentian-os/tenants/%s/apps/%s/oidc" $tenant $app }}
            {{- if $vm.oidc.issuerKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-issuer"        "remoteRef" (dict "key" $oidcPath "property" "issuer")) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-id"     "remoteRef" (dict "key" $oidcPath "property" "client-id")) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- $csPath := default $oidcPath $vm.oidc.clientSecretOpenbaoPath }}
            {{- $csProp := default "client-secret" $vm.oidc.clientSecretOpenbaoProperty }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-secret" "remoteRef" (dict "key" $csPath "property" $csProp)) }}
            {{- end }}
            {{- end }}

            {{- if $vm.database }}
            {{- $dbPath := printf "gentian-os/tenants/%s/apps/%s/database" $tenant $app }}
            {{- if $vm.database.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "db-host"     "remoteRef" (dict "key" $dbPath "property" "host")) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $esData = append $esData (dict "secretKey" "db-port"     "remoteRef" (dict "key" $dbPath "property" "port")) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $esData = append $esData (dict "secretKey" "db-name"     "remoteRef" (dict "key" $dbPath "property" "name")) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $esData = append $esData (dict "secretKey" "db-user"     "remoteRef" (dict "key" $dbPath "property" "user")) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "db-password" "remoteRef" (dict "key" $dbPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- if $vm.s3 }}
            {{- $s3Path := printf "gentian-os/tenants/%s/apps/%s/s3" $tenant $app }}
            {{- if $vm.s3.endpointKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-endpoint"   "remoteRef" (dict "key" $s3Path "property" "endpoint")) }}
            {{- end }}
            {{- if $vm.s3.bucketKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-bucket"     "remoteRef" (dict "key" $s3Path "property" "bucket")) }}
            {{- end }}
            {{- if $vm.s3.accessKeyKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-access-key" "remoteRef" (dict "key" $s3Path "property" "access-key")) }}
            {{- end }}
            {{- if $vm.s3.secretKeyKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-secret-key" "remoteRef" (dict "key" $s3Path "property" "secret-key")) }}
            {{- end }}
            {{- if $vm.s3.regionKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-region"     "remoteRef" (dict "key" $s3Path "property" "region")) }}
            {{- end }}
            {{- end }}

            {{- /* Cache — OX connects as the shared default Redis user (not a
            per-tenant ACL user) because OX does not prefix its Redis keys with
            a tenant-scoped namespace. The auth password therefore comes from
            the kernel Redis admin path, not the per-tenant cache path. */}}
            {{- if $vm.cache }}
            {{- $cachePath := printf "gentian-os/tenants/%s/apps/%s/cache" $tenant $app }}
            {{- if $vm.cache.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-host"     "remoteRef" (dict "key" $cachePath "property" "host")) }}
            {{- end }}
            {{- if $vm.cache.portKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-port"     "remoteRef" (dict "key" $cachePath "property" "port")) }}
            {{- end }}
            {{- if $vm.cache.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-password" "remoteRef" (dict "key" "gentian-os/kernel/cache/redis" "property" "auth_password")) }}
            {{- end }}
            {{- end }}

            {{- if $vm.smtp }}
            {{- $smtpPath := printf "gentian-os/tenants/%s/apps/%s/smtp" $tenant $app }}
            {{- if $vm.smtp.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-host"     "remoteRef" (dict "key" $smtpPath "property" "host")) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-port"     "remoteRef" (dict "key" $smtpPath "property" "port")) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-user"     "remoteRef" (dict "key" $smtpPath "property" "user")) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-password" "remoteRef" (dict "key" $smtpPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $esData = append $esData (dict "secretKey" (printf "internal-%s" $s.name)
                "remoteRef" (dict "key" (printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name) "property" "value")) }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit OpenBao KV seeders for each app-internal secret ──────── */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $safeName := $s.name | replace "_" "-" }}
            {{- $seedName := printf "%s-%s-seed" $xrName $safeName }}
            {{- $kvPath   := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $seedVal  := sha256sum (printf "%s:%s:%s" $xrName $app $s.name) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-seed-secret
              name: {{ $seedName }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $seedName }}
                    namespace: crossplane-system
                  type: Opaque
                  stringData:
                    data.json: '{"value":"{{ $seedVal }}"}'  
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kv.vault.upbound.io/v1alpha1
            kind: SecretV2
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-kv
              name: {{ $seedName }}-kv
            spec:
              deletionPolicy: Orphan
              managementPolicies:
                - Observe
                - Create
              forProvider:
                mount: secret
                name: {{ $kvPath }}
                dataJsonSecretRef:
                  name: {{ $seedName }}
                  namespace: crossplane-system
                  key: data.json
              providerConfigRef:
                name: openbao
            {{- end }}
            {{- end }}

            {{- /* ── Build Release set[] entries ──────────────────────────────── */}}
            {{- $secretName := printf "%s-sensitive-values" $app }}
            {{- $relSet := list }}

            {{- if $vm.oidc }}
            {{- if $vm.oidc.issuerKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.issuerKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-issuer"))) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientIdKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-id"))) }}
            {{- end }}
            {{- end }}
            {{- /* oidc.clientSecretKey uses com\.openexchange\. escaped-dot path – handled via valuesFrom YAML, not set[] */}}

            {{- if $vm.database }}
            {{- if $vm.database.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-host"))) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-port"))) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.nameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.readNameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.readNameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.readUserKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.readUserKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.cache }}
            {{- if $vm.cache.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-host"))) }}
            {{- end }}
            {{- if $vm.cache.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-port"))) }}
            {{- end }}
            {{- if $vm.cache.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.smtp }}
            {{- if $vm.smtp.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-host"))) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-port"))) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-user"))) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-password"))) }}
            {{- end }}
            {{- end }}

            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $relSet = append $relSet (dict "name" $s.valuePath
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- end }}
            {{- end }}

            {{- $extraVals := dict }}
            {{- if $pSpec.extraValues }}
            {{- /* Load kernel service endpoints from the fetched ConfigMap */}}
            {{- $ksRes := dig "kernelServices" list $extraRes }}
            {{- $ksCM  := default dict (index $ksRes 0) }}
            {{- $ksCMData := dig "data" dict $ksCM }}
            {{- $kernelDomain := dig "KERNEL_DOMAIN" "" $ksCMData }}
            {{- $s3Endpoint := dig "S3_ENDPOINT"  "" $ksCMData }}
            {{- $mysqlHost  := dig "MYSQL_HOST"   "" $ksCMData }}
            {{- $redisHost  := dig "REDIS_HOST"   "" $ksCMData }}
            {{- $smtpHost   := "" }}
            {{- $ccSmtpHost := dig "mail.smtpHost" "" $ccData }}
            {{- if $ccSmtpHost }}{{- $smtpHost = $ccSmtpHost }}{{- end }}
            {{- if not $smtpHost }}{{- $smtpHost = dig "SMTP_HOST" "" $ksCMData }}{{- end }}
            {{- $raw := $pSpec.extraValues | toJson }}
            {{- $raw = $raw | replace "${TENANT_DOMAIN}" $domain }}
            {{- $raw = $raw | replace "${TENANT_NAMESPACE}" $ns }}
            {{- $raw = $raw | replace "${TENANT_ID}" $tenant }}
            {{- if $kernelDomain }}{{ $raw = $raw | replace "${KERNEL_DOMAIN}" $kernelDomain }}{{ end }}
            {{- if $s3Endpoint }}{{ $raw = $raw | replace "${S3_ENDPOINT}" $s3Endpoint }}{{ end }}
            {{- if $mysqlHost  }}{{ $raw = $raw | replace "${MYSQL_HOST}"  $mysqlHost  }}{{ end }}
            {{- if $redisHost  }}{{ $raw = $raw | replace "${REDIS_HOST}"  $redisHost  }}{{ end }}
            {{- $raw = $raw | replace "${SMTP_HOST}"    $smtpHost }}
            {{- $raw = $raw | replace "${IMAP_HOST}"    $imapHost }}
            {{- $extraVals = $raw | fromJson }}
            {{- end }}
            {{- if and $spec.config $spec.config.extraValues }}
            {{- $extraVals = mergeOverwrite $extraVals $spec.config.extraValues }}
            {{- end }}
            {{- if and $spec.config $spec.config.replicas }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "replicaCount" $spec.config.replicas) }}
            {{- end }}

            {{- /* ── Emit Keycloak Client CR ──────────────────────────────────── */}}
            {{- /* When kernelRequirements.identity.oidc is set, the composition   */}}
            {{- /* registers the app as an OIDC client in the tenant's own realm.  */}}
            {{- /* New apps only need to declare their oidc block in the AppProfile */}}
            {{- /* to get automatic per-tenant Keycloak client registration.        */}}
            {{- $kr       := default dict $pSpec.kernelRequirements }}
            {{- $identity := default dict $kr.identity }}
            {{- $oidcCl   := default dict $identity.oidc }}
            {{- if $oidcCl.clientId }}
            {{- $redirects  := list }}
            {{- range $uri := (default list $oidcCl.redirectUris) }}
            {{- $redirects = append $redirects ($uri | replace "${TENANT_DOMAIN}" $domain) }}
            {{- end }}
            {{- $postLogout := list }}
            {{- range $uri := (default list $oidcCl.postLogoutRedirectUris) }}
            {{- $postLogout = append $postLogout ($uri | replace "${TENANT_DOMAIN}" $domain) }}
            {{- end }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-keycloak-client
              name: {{ $tenant }}-{{ $app }}-keycloak-client
            spec:
              deletionPolicy: Delete
              forProvider:
                clientId: {{ $oidcCl.clientId | quote }}
                name: {{ default $oidcCl.clientId $oidcCl.name | quote }}
                realmId: {{ $tenant }}
                accessType: {{ default "PUBLIC" $oidcCl.accessType | quote }}
                standardFlowEnabled: true
                directAccessGrantsEnabled: {{ default false $oidcCl.directAccessGrantsEnabled }}
                serviceAccountsEnabled: false
                {{- if $redirects }}
                validRedirectUris:
                  {{ toYaml $redirects | nindent 18 }}
                {{- end }}
                webOrigins:
                  - "+"
                {{- if $postLogout }}
                validPostLogoutRedirectUris:
                  {{ toYaml $postLogout | nindent 18 }}
                {{- end }}
                {{- if and $oidcCl.backchannelLogoutUrl (ne $oidcCl.backchannelLogoutUrl "") }}
                backchannelLogoutUrl: {{ $oidcCl.backchannelLogoutUrl | replace "${TENANT_DOMAIN}" $domain | quote }}
                backchannelLogoutSessionRequired: true
                {{- end }}
                {{- if eq (default "PUBLIC" $oidcCl.accessType) "CONFIDENTIAL" }}
                clientSecretSecretRef:
                  name: {{ $xrName }}-oidc-client-creds
                  namespace: crossplane-system
                  key: client-secret
                {{- end }}
              providerConfigRef:
                name: keycloak
            {{- end }}

            {{- /* ── OX appsuite.properties ExternalSecret ──────────────────── */}}
            {{- /* Fetches the same OpenBao paths as the standard ES but renders  */}}
            {{- /* them into a Java .properties file format. The Release mounts    */}}
            {{- /* this Secret as a valuesFrom configMapKeyRef substitute.         */}}
            {{- $oxSecretName := printf "%s-appsuite-props" $app }}
            {{- if gt (len $esData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-ox-props-es
              name: {{ $xrName }}-ox-props
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $oxSecretName }}
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $oxSecretName }}
                      creationPolicy: Owner
                      deletionPolicy: Retain
                      template:
                        engineVersion: v2
                        data:
                          appsuite.properties: |
                            appsuite:
                              core-mw:
                                {{- if $vm.oidc.clientSecretKey }}
                                properties:
                                  com.openexchange.oidc.clientSecret: {{ "{{ index . \"oidc-client-secret\" }}" }}
                                {{- end }}
                                  {{- if $vm.s3.secretKeyKey }}
                                  /opt/open-xchange/etc/filestore-s3.properties:
                                    com.openexchange.filestore.s3.ox-filestore-s3.secretKey: {{ "{{ index . \"s3-secret-key\" }}" }}
                                  {{- end }}
                                {{- end }}
                    data:
                      {{ toYaml $esData | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Standard ExternalSecret for --set entries ─────────────── */}}
            {{- if gt (len $esData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-externalsecret
              name: {{ $xrName }}-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $secretName }}
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $secretName }}
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      {{ toYaml $esData | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── ox-connector-provisioning-api ExternalSecret ─────────────── */}}
            {{- /* Nubus provisioning API consumer registration + connector auth. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-connector-provisioning-es
              name: {{ $xrName }}-connector-provisioning-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: ox-connector-provisioning-api
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: ox-connector-provisioning-api
                      creationPolicy: Owner
                      deletionPolicy: Retain
                      template:
                        engineVersion: v2
                        data:
                          password: '{{ "{{ index . \"connector_password\" }}" }}'
                          registration: |
                            {
                              "name": "ox-connector",
                              "realms_topics": [
                                {"realm": "udm", "topic": "users/user"},
                                {"realm": "udm", "topic": "groups/group"}
                              ],
                              "request_prefill": true,
                              "password": "{{ "{{ index . \"connector_password\" }}" }}"
                            }
                    data:
                      - secretKey: connector_password
                        remoteRef:
                          key: gentian-os/tenants/{{ $tenant }}/apps/{{ $app }}/internal/connector_provisioning_api_password
                          property: value
              providerConfigRef:
                name: kubernetes

            {{- /* ── Helm Release ──────────────────────────────────────────── */}}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-release
              name: {{ $xrName }}-release
            spec:
              forProvider:
                chart:
                  repository: {{ $chart.repository }}
                  name: {{ $chart.name }}
                  version: {{ $chart.version | quote }}
                namespace: {{ $ns }}
                wait: true
                {{- if gt (len $esData) 0 }}
                valuesFrom:
                  - secretKeyRef:
                      name: {{ $oxSecretName }}
                      namespace: {{ $ns }}
                      key: appsuite.properties
                      optional: false
                {{- end }}
                {{- if gt (len $extraVals) 0 }}
                values:
                  {{ toYaml $extraVals | nindent 18 }}
                {{- end }}
                {{- if gt (len $relSet) 0 }}
                set:
                  {{ toYaml $relSet | nindent 18 }}
                {{- end }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Observed Helm release readiness ─────────────────────────── */}}
            {{- /* function-sequencer does not treat provider-helm Release CRs as */}}
            {{- /* ready; gate bootstrap/connector on observed Ready conditions. */}}
            {{- $obsRes := default dict .observed.resources }}
            {{- $appSuiteReady := false }}
            {{- with (index $obsRes (printf "%s-release" $app)) }}
            {{- range (dig "resource" "status" "conditions" list .) }}
            {{- if and (eq .type "Ready") (eq .status "True") }}
            {{- $appSuiteReady = true }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $bootstrapReady := false }}
            {{- with (index $obsRes (printf "%s-bootstrap-job" $app)) }}
            {{- if ge (int (default 0 (dig "resource" "status" "atProvider" "manifest" "status" "succeeded" 0 .))) 1 }}
            {{- $bootstrapReady = true }}
            {{- else if dig "resource" "status" "atProvider" "manifest" "status" "completionTime" "" . }}
            {{- $bootstrapReady = true }}
            {{- end }}
            {{- end }}
            {{- $registerReady := false }}
            {{- with (index $obsRes (printf "%s-connector-register-job" $app)) }}
            {{- if ge (int (default 0 (dig "resource" "status" "atProvider" "manifest" "status" "succeeded" 0 .))) 1 }}
            {{- $registerReady = true }}
            {{- else if dig "resource" "status" "atProvider" "manifest" "status" "completionTime" "" . }}
            {{- $registerReady = true }}
            {{- end }}
            {{- end }}

            {{- if $appSuiteReady }}
            {{- /* ── OX bootstrap Job (replaces upstream chart) ──────────────── */}}
            {{- /* Upstream bootstrap swallows errors (|| echo) and skips -i on   */}}
            {{- /* initconfigdb, so reinstall leaves an empty MariaDB without OX   */}}
            {{- /* schema and SOAP admin never registers OXSecondaryAccountService. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-bootstrap-role
              name: {{ $xrName }}-bootstrap-role
            spec:
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: Role
                  metadata:
                    name: {{ $app }}-bootstrap
                    namespace: {{ $ns }}
                  rules:
                    - apiGroups: [""]
                      resources: ["pods"]
                      verbs: ["get", "list"]
                    - apiGroups: [""]
                      resources: ["pods/exec"]
                      verbs: ["create"]
                    - apiGroups: [""]
                      resources: ["secrets"]
                      resourceNames: [{{ $secretName | quote }}]
                      verbs: ["get"]
                    - apiGroups: ["apps"]
                      resources: ["deployments", "statefulsets"]
                      verbs: ["get", "list", "patch"]
                    - apiGroups: ["apps"]
                      resources: ["deployments/status", "statefulsets/status"]
                      verbs: ["get"]
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-bootstrap-rb
              name: {{ $xrName }}-bootstrap-rb
            spec:
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: {{ $app }}-bootstrap
                    namespace: {{ $ns }}
                  subjects:
                    - kind: ServiceAccount
                      name: {{ $app }}-bootstrap
                      namespace: {{ $ns }}
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: Role
                    name: {{ $app }}-bootstrap
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-bootstrap-sa
              name: {{ $xrName }}-bootstrap-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: {{ $app }}-bootstrap
                    namespace: {{ $ns }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-bootstrap-cm
              name: {{ $xrName }}-bootstrap-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-bootstrap
                    namespace: {{ $ns }}
                  data:
                    bootstrap.sh: |
                      #!/bin/bash
                      set -euo pipefail

                      context_admin_pw() {
                        printf '%s' "${MASTER_ADMIN_PW}:1:ox-context" | sha256sum | awk '{print substr($1,1,32)}'
                      }

                      admin_pod() {
                        kubectl get pod -n "${NAMESPACE}" -l "${ADMIN_SELECTOR}" \
                          --field-selector=status.phase=Running \
                          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true
                      }

                      mw_owner_kind() {
                        local pod
                        pod="$(admin_pod)"
                        [ -n "${pod}" ] || return 1
                        kubectl get pod -n "${NAMESPACE}" "${pod}" \
                          -o jsonpath='{.metadata.ownerReferences[0].kind}' 2>/dev/null || true
                      }

                      exec_mw() {
                        local pod
                        pod="$(admin_pod)"
                        [ -n "${pod}" ] || return 1
                        kubectl exec --namespace="${NAMESPACE}" "${pod}" -c core-mw -- bash -c "$1"
                      }

                      wait_mw_ready() {
                        local label="${1:-core-mw}"
                        until exec_mw 'echo core-mw running...' >/dev/null 2>&1; do
                          echo "[ox-bootstrap] waiting for ${label}..."
                          sleep 2
                        done
                      }

                      restart_mw() {
                        echo "[ox-bootstrap] restarting core-mw (${SELECTOR})..."
                        kubectl --namespace="${NAMESPACE}" rollout restart "${MW_TYPE}" --selector="${SELECTOR}"
                        kubectl --namespace="${NAMESPACE}" rollout status "${MW_TYPE}" --selector="${SELECTOR}" --timeout=900s
                        wait_mw_ready "core-mw after restart"
                      }

                      wait_soap() {
                        local svc="$1"
                        until exec_mw "curl -sf -o /dev/null http://127.0.0.1:8009/webservices/${svc}?wsdl"; do
                          echo "[ox-bootstrap] waiting for ${svc} WSDL..."
                          sleep 5
                        done
                        echo "[ox-bootstrap] ${svc} WSDL ready"
                      }

                      wait_admin_rmi() {
                        local out
                        echo "[ox-bootstrap] waiting for admin RMI service (OXUtil_V2)..."
                        while true; do
                          if out="$(exec_mw "/opt/open-xchange/sbin/listserver -A ${MASTER_ADMIN_USER} -P ${MASTER_ADMIN_PW}" 2>&1)"; then
                            echo "[ox-bootstrap] admin RMI ready"
                            return 0
                          fi
                          if echo "${out}" | grep -q 'OXUtil_V2" is not available'; then
                            echo "[ox-bootstrap] OXUtil_V2 not ready yet..."
                            sleep 5
                            continue
                          fi
                          echo "[ox-bootstrap] admin RMI accepting connections"
                          return 0
                        done
                      }

                      register_required() {
                        local step="$1"
                        shift
                        local out attempt=1 max=120
                        while [ "${attempt}" -le "${max}" ]; do
                          if out="$(exec_mw "$@" 2>&1)"; then
                            echo "[ox-bootstrap] ${step} ok"
                            return 0
                          fi
                          if echo "${out}" | grep -q 'OXUtil_V2" is not available'; then
                            echo "[ox-bootstrap] ${step} waiting for admin RMI (${attempt}/${max})..."
                            sleep 5
                            attempt=$((attempt + 1))
                            continue
                          fi
                          if echo "${out}" | grep -qiE 'already registered|already exists|duplicate'; then
                            echo "[ox-bootstrap] ${step} skipped (already registered)"
                            return 0
                          fi
                          echo "${out}" >&2
                          return 1
                        done
                        echo "[ox-bootstrap] ${step} timed out waiting for admin RMI" >&2
                        return 1
                      }

                      context_list() {
                        exec_mw "/opt/open-xchange/sbin/listcontext -A ${MASTER_ADMIN_USER} -P ${MASTER_ADMIN_PW}" 2>&1
                      }

                      context_exists() {
                        local out="$1"
                        echo "${out}" | awk 'NR>1 && $1==1 {found=1} END {exit !found}'
                      }

                      create_context_cmd() {
                        CONTEXT_ADMIN_PW="$(context_admin_pw)"
                        CONTEXT_ADMIN_EMAIL="oxadmin@${DOMAIN}"
                        exec_mw "/opt/open-xchange/sbin/createcontext \
                          -A ${MASTER_ADMIN_USER} -P ${MASTER_ADMIN_PW} \
                          -c 1 -N ${TENANT} -q -1 \
                          -u oxadmin -d 'OX Admin' -g OX -s Admin \
                          -p ${CONTEXT_ADMIN_PW} -e ${CONTEXT_ADMIN_EMAIL} \
                          -l de_DE -t Europe/Berlin \
                          -L 1,context1,${TENANT} \
                          --access-combination-name all"
                      }

                      drop_orphan_context_schema() {
                        local err="$1"
                        local db
                        db="$(echo "${err}" | sed -n 's/.*Database "\([^"]*\)" already exists.*/\1/p')"
                        [ -n "${db}" ] || return 1
                        echo "[ox-bootstrap] dropping orphaned schema ${db}..."
                        exec_mw "mariadb --skip-ssl -h \"\${MYSQL_HOST}\" -u \"\${MYSQL_USER}\" -p\"\${MYSQL_PASSWORD}\" \
                          -e 'DROP DATABASE IF EXISTS \`${db}\`;'"
                      }

                      ensure_context() {
                        local out create_err attempt=1
                        out="$(context_list)" || true
                        if context_exists "${out}"; then
                          echo "[ox-bootstrap] context 1 already present"
                          return 0
                        fi
                        echo "[ox-bootstrap] creating default context 1..."
                        while [ "${attempt}" -le 2 ]; do
                          if out="$(create_context_cmd 2>&1)"; then
                            echo "[ox-bootstrap] createcontext ok"
                            break
                          fi
                          create_err="${out}"
                          out="$(context_list)" || true
                          if context_exists "${out}"; then
                            echo "[ox-bootstrap] createcontext ok (context 1 visible after create)"
                            break
                          fi
                          if [ "${attempt}" -eq 1 ] && echo "${create_err}" | grep -q 'Database .* already exists'; then
                            drop_orphan_context_schema "${create_err}" || true
                            attempt=$((attempt + 1))
                            continue
                          fi
                          echo "${create_err}" >&2
                          return 1
                        done
                        out="$(context_list)" || true
                        if context_exists "${out}"; then
                          echo "[ox-bootstrap] context 1 verified"
                          return 0
                        fi
                        echo "[ox-bootstrap] createcontext finished but context 1 is missing" >&2
                        return 1
                      }

                      echo "[ox-bootstrap] locating admin pod..."
                      until ADMIN_POD="$(admin_pod)" && [ -n "${ADMIN_POD}" ]; do
                        sleep 2
                      done
                      MW_KIND="$(mw_owner_kind)"
                      [ "${MW_KIND}" = "StatefulSet" ] && MW_TYPE="statefulset" || MW_TYPE="deployment"
                      echo "[ox-bootstrap] using ${MW_TYPE} pod ${ADMIN_POD}"

                      wait_mw_ready "core-mw container"

                      echo "[ox-bootstrap] initializing configDB..."
                      if ! out="$(exec_mw '/opt/open-xchange/sbin/initconfigdb \
                        --mysql-args "--skip-ssl-verify-server-cert" \
                        --configdb-user "${MYSQL_USER}" \
                        --configdb-pass "${MYSQL_PASSWORD}" \
                        --configdb-host "${MYSQL_HOST}" \
                        --mysql-root-passwd "${MYSQL_PASSWORD}" \
                        --configdb-dbname "${MYSQL_DATABASE}"' 2>&1)"; then
                        if echo "${out}" | grep -q 'exists, use the -i switch'; then
                          echo "[ox-bootstrap] configDB already initialized"
                        else
                          echo "${out}" >&2
                          exit 1
                        fi
                      else
                        echo "[ox-bootstrap] configDB initialized"
                      fi

                      restart_mw

                      wait_soap OXUtilService
                      wait_admin_rmi

                      echo "[ox-bootstrap] registering filestore..."
                      register_required "registerfilestore" "/opt/open-xchange/sbin/registerfilestore \
                        -A ${MASTER_ADMIN_USER} -P ${MASTER_ADMIN_PW} \
                        -t s3://ox-filestore-s3 -s 10000 --if-nonexistent"

                      echo "[ox-bootstrap] registering server..."
                      register_required "registerserver" "/opt/open-xchange/sbin/registerserver \
                        -A ${MASTER_ADMIN_USER} -P ${MASTER_ADMIN_PW} \
                        -n oxserver"

                      echo "[ox-bootstrap] registering database..."
                      register_required "registerdatabase" '/opt/open-xchange/sbin/registerdatabase \
                        -A '"${MASTER_ADMIN_USER}"' -P '"${MASTER_ADMIN_PW}"' \
                        --name PRIMARYDB \
                        --hostname "${MYSQL_HOST}" \
                        --dbuser "${MYSQL_USER}" \
                        --dbpasswd "${MYSQL_PASSWORD}" \
                        --master true'

                      ensure_context

                      restart_mw

                      for svc in OXUtilService OXUserService OXContextService OXSecondaryAccountService; do
                        wait_soap "${svc}"
                      done

                      echo "[ox-bootstrap] bootstrap complete"
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-bootstrap-job
              name: {{ $xrName }}-bootstrap-job
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $app }}-bootstrap
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                  spec:
                    ttlSecondsAfterFinished: 600
                    backoffLimit: 6
                    activeDeadlineSeconds: 1800
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/managed-by: gentian-os
                          gentianos.io/tenant: {{ $tenant }}
                          gentianos.io/app: {{ $app }}
                      spec:
                        serviceAccountName: {{ $app }}-bootstrap
                        restartPolicy: OnFailure
                        volumes:
                          - name: scripts
                            configMap:
                              name: {{ $app }}-bootstrap
                        containers:
                          - name: bootstrap
                            image: docker.io/alpine/k8s:1.27.4
                            command:
                              - /bin/bash
                              - /scripts/bootstrap.sh
                            volumeMounts:
                              - name: scripts
                                mountPath: /scripts
                            env:
                              - name: NAMESPACE
                                value: {{ $ns | quote }}
                              - name: ADMIN_SELECTOR
                                value: "roles.middleware.open-xchange.com/admin=true"
                              - name: SELECTOR
                                value: {{ $coreMwSelector | quote }}
                              - name: MASTER_ADMIN_USER
                                value: "admin"
                              - name: MASTER_ADMIN_PW
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $secretName }}
                                    key: internal-ox_admin_password
                              - name: TENANT
                                value: {{ $tenant | quote }}
                              - name: DOMAIN
                                value: {{ $domain | quote }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Register ox-connector with Nubus provisioning API ───────── */}}
            {{- /* Per-tenant consumer (kernel nubus chart intentionally omits OX). */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-connector-register-role
              name: {{ $xrName }}-connector-register-role
            spec:
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: Role
                  metadata:
                    name: {{ $app }}-read-provisioning-api-admin
                    namespace: {{ $servicesNs }}
                  rules:
                    - apiGroups: [""]
                      resources: ["secrets"]
                      resourceNames: [{{ $provisioningAdminSecret | quote }}]
                      verbs: ["get"]
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-connector-register-rb
              name: {{ $xrName }}-connector-register-rb
            spec:
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: {{ $app }}-read-provisioning-api-admin
                    namespace: {{ $servicesNs }}
                  subjects:
                    - kind: ServiceAccount
                      name: app-init
                      namespace: {{ $ns }}
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: Role
                    name: {{ $app }}-read-provisioning-api-admin
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-connector-register-cm
              name: {{ $xrName }}-connector-register-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-connector-register
                    namespace: {{ $ns }}
                  data:
                    register.sh: |
                      #!/bin/sh
                      set -eu
                      echo "[ox-consumer-register] waiting for provisioning API..."
                      until code=$(curl -s -o /dev/null -w '%{http_code}' "${PROVISIONING_API_SUBSCRIPTIONS}"); \
                        [ "${code}" != "000" ] && [ "${code}" != "502" ] && [ "${code}" != "503" ]; do
                        sleep 5
                      done
                      TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                      ADMIN_PW=$(curl -sf \
                        --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                        -H "Authorization: Bearer ${TOKEN}" \
                        "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/api/v1/namespaces/${SERVICES_NS}/secrets/${PROVISIONING_ADMIN_SECRET}" \
                        | jq -r '.data.password' | base64 -d)
                      HTTP=$(curl -s -o /tmp/resp -w '%{http_code}' \
                        -u "admin:${ADMIN_PW}" \
                        -H 'Content-Type: application/json' \
                        -d @/secrets/registration \
                        "${PROVISIONING_API_SUBSCRIPTIONS}" || echo "000")
                      case "${HTTP}" in
                        201) echo "[ox-consumer-register] consumer registered" ;;
                        200|409)
                          echo "[ox-consumer-register] consumer already registered — re-registering to trigger prefill"
                          DEL=$(curl -s -o /tmp/resp -w '%{http_code}' \
                            -u "admin:${ADMIN_PW}" \
                            -X DELETE \
                            "${PROVISIONING_API_SUBSCRIPTIONS}/ox-connector" || echo "000")
                          case "${DEL}" in
                            200|204|404) ;;
                            *) echo "[ox-consumer-register] ERROR: DELETE HTTP ${DEL}"; cat /tmp/resp; exit 1 ;;
                          esac
                          HTTP=$(curl -s -o /tmp/resp -w '%{http_code}' \
                            -u "admin:${ADMIN_PW}" \
                            -H 'Content-Type: application/json' \
                            -d @/secrets/registration \
                            "${PROVISIONING_API_SUBSCRIPTIONS}" || echo "000")
                          case "${HTTP}" in
                            201|200) echo "[ox-consumer-register] consumer re-registered (prefill requested)" ;;
                            *) echo "[ox-consumer-register] ERROR: HTTP ${HTTP}"; cat /tmp/resp; exit 1 ;;
                          esac
                          ;;
                        *) echo "[ox-consumer-register] ERROR: HTTP ${HTTP}"; cat /tmp/resp; exit 1 ;;
                      esac
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-connector-register-job
              name: {{ $xrName }}-connector-register-job
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $app }}-connector-register
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                  spec:
                    ttlSecondsAfterFinished: 600
                    backoffLimit: 10
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/managed-by: gentian-os
                          gentianos.io/tenant: {{ $tenant }}
                          gentianos.io/app: {{ $app }}
                      spec:
                        serviceAccountName: app-init
                        restartPolicy: OnFailure
                        volumes:
                          - name: scripts
                            configMap:
                              name: {{ $app }}-connector-register
                          - name: consumer-secret
                            secret:
                              secretName: ox-connector-provisioning-api
                              optional: false
                        containers:
                          - name: register
                            image: {{ $appInitImage | quote }}
                            command:
                              - /bin/sh
                              - /scripts/register.sh
                            volumeMounts:
                              - name: scripts
                                mountPath: /scripts
                              - name: consumer-secret
                                mountPath: /secrets
                                readOnly: true
                            env:
                              - name: SERVICES_NS
                                value: {{ $servicesNs | quote }}
                              - name: PROVISIONING_ADMIN_SECRET
                                value: {{ $provisioningAdminSecret | quote }}
                              - name: PROVISIONING_API_BASE
                                value: {{ $provisioningApiBase | quote }}
                              - name: PROVISIONING_API_SUBSCRIPTIONS
                                value: {{ $provisioningApiSubscriptions | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- if and $bootstrapReady $registerReady }}
            {{- /* ── Release 3: ox-connector (Nubus provisioning API → OX user sync) */}}
            {{- /* Sync ox-contexts.json on every pod start: upstream entrypoint only */}}
            {{- /* seeds master creds when the PVC file is missing, so reinstalls */}}
            {{- /* leave stale SOAP passwords on the connector PVC. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-connector-entrypoint-cm
              name: {{ $xrName }}-connector-entrypoint-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-connector-entrypoint-sync
                    namespace: {{ $ns }}
                  data:
                    sync-ox-credentials.sh: |
                      #!/bin/bash
                      set -euo pipefail
                      export OX_CREDENTIALS_FILE="${OX_CREDENTIALS_FILE:-/etc/ox-secrets/ox-contexts.json}"
                      mkdir -p /etc/ox-secrets
                      CONTEXT_ADMIN_PW="$(printf '%s' "${OX_MASTER_PASSWORD}:${DEFAULT_CONTEXT}:ox-context" | sha256sum | awk '{print substr($1,1,32)}')"
                      if [[ ! -f "${OX_CREDENTIALS_FILE}" ]]; then
                        jq --null-input \
                          --arg user "${OX_MASTER_ADMIN}" \
                          --arg pass "${OX_MASTER_PASSWORD}" \
                          '{"master": {adminuser: $user, adminpass: $pass}}' \
                          > "${OX_CREDENTIALS_FILE}"
                      fi
                      tmp="${OX_CREDENTIALS_FILE}.tmp"
                      jq \
                        --arg user "${OX_MASTER_ADMIN}" \
                        --arg pass "${OX_MASTER_PASSWORD}" \
                        --arg ctx "${DEFAULT_CONTEXT}" \
                        --arg cuser "oxadmin" \
                        --arg cpass "${CONTEXT_ADMIN_PW}" \
                        '.master.adminuser = $user
                         | .master.adminpass = $pass
                         | .[$ctx] = {adminuser: $cuser, adminpass: $cpass}' \
                        "${OX_CREDENTIALS_FILE}" > "${tmp}"
                      mv "${tmp}" "${OX_CREDENTIALS_FILE}"
                      chmod 600 "${OX_CREDENTIALS_FILE}"
              providerConfigRef:
                name: kubernetes
            {{- $connectorVals := dict
                "openXchange" (dict
                  "domainName" $domain
                  "auth" (dict
                    "username" "admin"
                    "existingSecret" (dict
                      "name" $secretName
                      "keyMapping" (dict "password" "internal-ox_admin_password")
                    )
                  )
                  "oxDefaultContext" "1"
                  "oxSoapServer" $oxSoapServer
                  "oxLocalTimezone" "Europe/Berlin"
                  "oxLanguage" "de_DE"
                  "oxSmtpServer" (printf "smtp://%s" $smtpHost)
                  "oxImapServer" (printf "imap://%s" $imapHost)
                )
                "provisioningApi" (dict
                  "connection" (dict "baseUrl" $provisioningApiBase)
                  "auth" (dict
                    "username" "ox-connector"
                    "existingSecret" (dict
                      "name" "ox-connector-provisioning-api"
                      "keyMapping" (dict "password" "password")
                    )
                  )
                )
                "extraVolumes" (list
                  (dict
                    "name" "connector-entrypoint-sync"
                    "configMap" (dict
                      "name" (printf "%s-connector-entrypoint-sync" $app)
                      "defaultMode" 493
                    )
                  )
                )
                "extraVolumeMounts" (list
                  (dict
                    "name" "connector-entrypoint-sync"
                    "mountPath" "/entrypoint.d/80-sync-ox-credentials.sh"
                    "subPath" "sync-ox-credentials.sh"
                  )
                )
                "replicaCount" 1
            }}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-connector-release
              name: {{ $xrName }}-connector-release
            spec:
              forProvider:
                chart:
                  repository: oci://registry.opencode.de/bmi/opendesk/components/supplier/univention/charts-mirror
                  name: ox-connector
                  version: "0.34.0"
                namespace: {{ $ns }}
                wait: true
                values:
                  {{ toYaml $connectorVals | nindent 18 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit stable service alias ─────────────────────────────────── */}}
            {{- /* OX umbrella chart creates release-prefixed subchart services      */}}
            {{- /* (e.g. …-core-ui-middleware) even when fullnameOverride is set.  */}}
            {{- /* AppProfile ingress.serviceName must route to core-ui-middleware.  */}}
            {{- $ingressSpec   := default dict $pSpec.ingress }}
            {{- $stableSvcName := dig "serviceName" "" $ingressSpec }}
            {{- if $stableSvcName }}
            {{- $svcPort := default 80 (dig "servicePort" 0 $ingressSpec | int) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-stable-svc
              name: {{ $xrName }}-stable-svc
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $stableSvcName }}
                    namespace: {{ $ns }}
                  spec:
                    selector:
                      app.kubernetes.io/instance: {{ $xrName }}-release
                      app.kubernetes.io/name: core-ui-middleware
                    ports:
                    - name: http
                      port: {{ $svcPort }}
                      targetPort: http
                      protocol: TCP
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* Stable alias for core-mw http-api (UI middleware does not proxy API). */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-api-stable-svc
              name: {{ $xrName }}-api-stable-svc
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: appsuite-api
                    namespace: {{ $ns }}
                  spec:
                    selector:
                      app.kubernetes.io/instance: {{ $xrName }}-release
                      app.kubernetes.io/name: core-mw
                      roles.middleware.open-xchange.com/http-api: "true"
                    ports:
                    - name: http
                      port: 80
                      targetPort: http
                      protocol: TCP
              providerConfigRef:
                name: kubernetes

            {{- /* ── Emit S3-init resources (when AppProfile requires storage.s3.bucketPerTenant) */}}
            {{- $storageReqs := default dict $kr.storage }}
            {{- $s3Reqs      := default dict $storageReqs.s3 }}
            {{- if and $s3Reqs.bucketPerTenant $minioEndpoint }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-s3-init-sa
              name: {{ $xrName }}-s3-init-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: app-init
                    namespace: {{ $ns }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-s3-init-cm
              name: {{ $xrName }}-s3-init-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-s3-init
                    namespace: {{ $ns }}
                  data:
                    init.sh: |
                      #!/bin/sh
                      set -eu
                      MC=mc
                      command -v "${MC}" >/dev/null 2>&1 || MC=mcli
                      JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                      BAO_TOKEN=$(curl -sf "${BAO_ADDR}/v1/auth/kubernetes/login" \
                        -H 'Content-Type: application/json' \
                        -d "{\"role\":\"app-init\",\"jwt\":\"${JWT}\"}" \
                        | jq -r '.auth.client_token')
                      ACCESS_KEY="${TENANT}-${APP}"
                      BUCKET="${TENANT}-${APP}"
                      MINIO=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/storage/minio")
                      ROOT_USER=$(echo "${MINIO}" | jq -r '.data.data.root_user')
                      ROOT_PASS=$(echo "${MINIO}" | jq -r '.data.data.root_password')
                      ${MC} alias set minio "${MINIO_ENDPOINT}" "${ROOT_USER}" "${ROOT_PASS}" >/dev/null
                      EXISTING=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/s3" \
                        2>/dev/null || echo '{}')
                      if echo "${EXISTING}" | jq -e '.data.data."secret-key"' >/dev/null 2>&1; then
                        EXISTING_ACCESS=$(echo "${EXISTING}" | jq -r '.data.data."access-key" // empty')
                        SECRET_KEY=$(echo "${EXISTING}" | jq -r '.data.data."secret-key"')
                        if [ "${EXISTING_ACCESS}" = "${ACCESS_KEY}" ] && ${MC} admin user info minio "${ACCESS_KEY}" >/dev/null 2>&1; then
                          ${MC} mb --ignore-existing "minio/${BUCKET}"
                          echo "[s3-init] credential and MinIO user already present for ${TENANT}/${APP} — skipping"
                          exit 0
                        fi
                        if [ "${EXISTING_ACCESS}" != "${ACCESS_KEY}" ]; then
                          echo "[s3-init] OpenBao access-key mismatch (got ${EXISTING_ACCESS}, want ${ACCESS_KEY}) — re-provisioning"
                          SECRET_KEY=""
                        else
                          echo "[s3-init] OpenBao credential present but MinIO user ${ACCESS_KEY} missing — re-provisioning"
                        fi
                      fi
                      if [ -z "${SECRET_KEY:-}" ]; then
                        if [ "${SECRET_MODE}" = "random" ]; then
                          SECRET_KEY=$(openssl rand -hex 32)
                        else
                          MASTER=$(curl -sf \
                            -H "X-Vault-Token: ${BAO_TOKEN}" \
                            "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/internal/master-password" \
                            | jq -r '.data.data.value')
                          SECRET_KEY=$(printf '%s:%s:s3' "${TENANT}" "${APP}" \
                            | openssl dgst -sha256 -hmac "${MASTER}" | awk '{print $2}')
                        fi
                      fi
                      ${MC} mb --ignore-existing "minio/${BUCKET}"
                      echo "[s3-init] bucket ${BUCKET} ensured"
                      ${MC} admin user remove minio "${ACCESS_KEY}" >/dev/null 2>&1 || true
                      ${MC} admin user add minio "${ACCESS_KEY}" "${SECRET_KEY}"
                      echo "[s3-init] MinIO user ${ACCESS_KEY} created"
                      printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["arn:aws:iam:::user/%s"]},"Action":["s3:*"],"Resource":["arn:aws:s3:::%s","arn:aws:s3:::%s/*"]}]}' \
                        "${ACCESS_KEY}" "${BUCKET}" "${BUCKET}" > /tmp/policy.json
                      ${MC} admin policy rm minio "${ACCESS_KEY}-policy" >/dev/null 2>&1 || true
                      ${MC} admin policy create minio "${ACCESS_KEY}-policy" /tmp/policy.json
                      ${MC} admin policy attach minio "${ACCESS_KEY}-policy" --user "${ACCESS_KEY}"
                      echo "[s3-init] bucket policy attached"
                      curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        -H 'Content-Type: application/json' \
                        -X POST \
                        -d "{\"data\":{\"endpoint\":\"${MINIO_ENDPOINT}\",\"bucket\":\"${BUCKET}\",\"access-key\":\"${ACCESS_KEY}\",\"secret-key\":\"${SECRET_KEY}\",\"region\":\"us-east-1\"}}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/s3"
                      echo "[s3-init] OpenBao credential written for ${TENANT}/${APP}"
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-s3-init-job
              name: {{ $xrName }}-s3-init-job
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $app }}-s3-init
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                  spec:
                    ttlSecondsAfterFinished: 600
                    backoffLimit: 10
                    template:
                      spec:
                        serviceAccountName: app-init
                        restartPolicy: OnFailure
                        volumes:
                          - name: scripts
                            configMap:
                              name: {{ $app }}-s3-init
                        containers:
                          - name: s3-init
                            image: {{ $appInitImage | quote }}
                            command:
                              - /bin/sh
                              - /scripts/init.sh
                            volumeMounts:
                              - name: scripts
                                mountPath: /scripts
                            env:
                              - name: TENANT
                                value: {{ $tenant }}
                              - name: APP
                                value: {{ $app }}
                              - name: BAO_ADDR
                                value: "http://openbao.openbao.svc.cluster.local:8200"
                              - name: MINIO_ENDPOINT
                                value: {{ $minioEndpoint | quote }}
                              - name: SECRET_MODE
                                value: {{ $secretMode | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit database-init resources (when AppProfile requires database.databasePerTenant */}}
            {{- $dbRequirements := default dict $kr.database }}
            {{- if and $dbRequirements.databasePerTenant (eq (default "" $dbRequirements.engine) "postgresql") $cnpgHost }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-sa
              name: {{ $xrName }}-db-init-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: app-init
                    namespace: {{ $ns }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-cm
              name: {{ $xrName }}-db-init-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-db-init
                    namespace: {{ $ns }}
                  data:
                    init.sh: |
                      #!/bin/sh
                      set -eu
                      JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                      BAO_TOKEN=$(curl -sf "${BAO_ADDR}/v1/auth/kubernetes/login" \
                        -H 'Content-Type: application/json' \
                        -d "{\"role\":\"app-init\",\"jwt\":\"${JWT}\"}" \
                        | jq -r '.auth.client_token')
                      EXISTING=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/database" \
                        2>/dev/null || echo '{}')
                      CNPG=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/database/cnpg")
                      SU_USER=$(echo "${CNPG}" | jq -r '.data.data.superuser_username')
                      SU_PASS=$(echo "${CNPG}" | jq -r '.data.data.superuser_password')
                      ROLE=$(printf '%s_%s' "${TENANT}" "${APP}" | tr '-' '_')
                      DBNAME="${ROLE}"
                      export PGPASSWORD="${SU_PASS}"
                      SKIP_BAO_WRITE=false
                      if echo "${EXISTING}" | jq -e '.data.data.password' >/dev/null 2>&1; then
                        PASSWORD=$(echo "${EXISTING}" | jq -r '.data.data.password')
                        ROLE_EXISTS=$(psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '${ROLE}'" 2>/dev/null || echo "")
                        if [ "${ROLE_EXISTS}" = "1" ]; then
                          echo "[db-init] credential and Postgres role present for ${TENANT}/${APP} — skipping"
                          exit 0
                        fi
                        echo "[db-init] OpenBao credential present but Postgres role missing — reconciling"
                        SKIP_BAO_WRITE=true
                      elif [ "${SECRET_MODE}" = "random" ]; then
                        PASSWORD=$(openssl rand -hex 32)
                      else
                        MASTER=$(curl -sf \
                          -H "X-Vault-Token: ${BAO_TOKEN}" \
                          "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/internal/master-password" \
                          | jq -r '.data.data.value')
                        PASSWORD=$(printf '%s:%s:database' "${TENANT}" "${APP}" \
                          | openssl dgst -sha256 -hmac "${MASTER}" | awk '{print $2}')
                      fi
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 <<SQL
                      DO \$\$
                      BEGIN
                        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${ROLE}') THEN
                          CREATE ROLE "${ROLE}" WITH LOGIN PASSWORD '${PASSWORD}';
                        ELSE
                          ALTER ROLE "${ROLE}" WITH PASSWORD '${PASSWORD}';
                        END IF;
                      END \$\$;
                      SQL
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 \
                        -c "SELECT 'CREATE DATABASE \"${DBNAME}\" OWNER \"${ROLE}\"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${DBNAME}')" \
                        | grep -q 'CREATE DATABASE' \
                        && psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres \
                             -c "CREATE DATABASE \"${DBNAME}\" OWNER \"${ROLE}\"" || true
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d "${DBNAME}" -v ON_ERROR_STOP=1 \
                        -c "CREATE SCHEMA IF NOT EXISTS \"${DBNAME}\" AUTHORIZATION \"${ROLE}\";"
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d "${DBNAME}" -v ON_ERROR_STOP=1 \
                        -c "GRANT ALL ON SCHEMA \"${DBNAME}\" TO \"${ROLE}\";"
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 \
                        -c "ALTER ROLE \"${ROLE}\" SET search_path TO \"${DBNAME}\", public;"
                      echo "[db-init] role ${ROLE}, database ${DBNAME}, and schema ${DBNAME} ensured"
                      if [ "${SKIP_BAO_WRITE}" != "true" ]; then
                        curl -sf \
                          -H "X-Vault-Token: ${BAO_TOKEN}" \
                          -H 'Content-Type: application/json' \
                          -X POST \
                          -d "{\"data\":{\"host\":\"${CNPG_HOST}\",\"port\":\"5432\",\"name\":\"${DBNAME}\",\"user\":\"${ROLE}\",\"password\":\"${PASSWORD}\"}}" \
                          "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/database"
                        echo "[db-init] OpenBao credential written for ${TENANT}/${APP}"
                      fi
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-job
              name: {{ $xrName }}-db-init-job
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $app }}-db-init
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                  spec:
                    ttlSecondsAfterFinished: 600
                    backoffLimit: 10
                    template:
                      spec:
                        serviceAccountName: app-init
                        restartPolicy: OnFailure
                        volumes:
                          - name: scripts
                            configMap:
                              name: {{ $app }}-db-init
                        containers:
                          - name: database-init
                            image: {{ $appInitImage | quote }}
                            command:
                              - /bin/sh
                              - /scripts/init.sh
                            volumeMounts:
                              - name: scripts
                                mountPath: /scripts
                            env:
                              - name: TENANT
                                value: {{ $tenant }}
                              - name: APP
                                value: {{ $app }}
                              - name: BAO_ADDR
                                value: "http://openbao.openbao.svc.cluster.local:8200"
                              - name: CNPG_HOST
                                value: {{ $cnpgHost | quote }}
                              - name: SECRET_MODE
                                value: {{ $secretMode | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

    # ── Step 3: Mark XR Ready when all composed resources are Ready ───────────
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
