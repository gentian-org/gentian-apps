# SPDX-License-Identifier: AGPL-3.0-only
# ComponentProfile — Synapse (Matrix homeserver)
#
# Source: the upstream chart ananace/matrix-synapse, installed unmodified.
#
# Nobody opens it. It has no tile and is not offered in the store: it comes
# with Element (element-ce), whose pages and whose people's Matrix apps call
# it on matrix.<tenant domain> with Synapse's own access token.
#
# ── The way in ───────────────────────────────────────────────────────────────
# A Matrix client sends Synapse's token in the Authorization header, from
# element.<tenant domain> in a browser and from apps on phones and desktops,
# none of which holds the platform's session. So the entry is a perimeter
# entry of authMode app: the tenant's perimeter approver publishes it, and
# Synapse's own sign-in -- through the tenant's realm, client gentian-synapse
# -- is what decides who gets a token. Password login is off: an account
# exists only through that sign-in.
#
# Synapse keeps the state of that sign-in in cookies of its own
# (oidc_session, oidc_session_no_samesite) between the redirect and the
# callback. The entry names them (signInCookies), so they pass on those
# paths alone, and the approver approves the entry with them
# (publicAppSignIn). Everywhere else on the entry no cookie passes.
#
# Federation is off: no other homeserver is admitted, and its paths are not
# published.
#
# Secret inventory:
#   Platform-provided:
#     OIDC issuer, client id and client secret (valueMapping.oidc)
#     database host/port/name/user/password (valueMapping.database)
#     SMTP password (valueMapping.smtp)
#   Generated:
#     registration_shared_secret -> config.registrationSharedSecret
#     redis_password             -> redis.auth.password
#   Generated by the chart: the signing key, by its own Job, into a Secret of
#   the release.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: synapse-ce
  labels:
    gentianos.io/profile-name: synapse-ce
    gentianos.io/profile-family: synapse
    gentianos.io/profile-edition: ce
  annotations:
    # Not offered: it comes with Element.
    gentianos.io/store-listed: "false"
spec:
  classes:
    - app
  trustTier: experimental
  version: "0.1.3-dev"
  launch: none
  package:
    chart:
      repository: "https://ananace.gitlab.io/charts"
      name: "matrix-synapse"
      version: "3.12.30"

    valueMapping:
      # The one provider's settings are written below (extraValues); the
      # platform fills in where to sign in and as which client.
      oidc:
        issuerKey: "extraSecrets.oidc_providers[0].issuer"
        clientIdKey: "extraSecrets.oidc_providers[0].client_id"
        clientSecretKey: "extraSecrets.oidc_providers[0].client_secret"
      database:
        hostKey: "externalPostgresql.host"
        portKey: "externalPostgresql.port"
        nameKey: "externalPostgresql.database"
        userKey: "externalPostgresql.username"
        passwordKey: "externalPostgresql.password"
      smtp:
        passwordKey: "extraConfig.email.smtp_pass"

    extraValues:
      # The Service the matrix entry routes to: synapse-web:8008.
      fullnameOverride: "synapse-web"
      serverName: "${TENANT_DOMAIN}"
      publicServerName: "matrix.${TENANT_DOMAIN}"
      # The platform routes the host; the chart's own Ingress would be a
      # second way in.
      ingress:
        enabled: false
      wellknown:
        enabled: false
      postgresql:
        enabled: false
      externalPostgresql:
        existingSecret: "synapse-ce-sensitive-values"
        existingSecretPasswordKey: "db-password"
      # The chart always configures Synapse with Redis. Nothing is kept in
      # it; the password is generated per install (secrets.generated).
      redis:
        enabled: true
      synapse:
        # The media disk is ReadWriteOnce: a rolling update starts the new
        # pod beside the old one, and on another node it waits for the disk
        # for ever. The old pod stops first instead.
        strategy:
          type: Recreate
        podSecurityContext:
          fsGroup: 666
          runAsGroup: 666
          runAsUser: 666
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 666
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 2Gi
      signingkey:
        job:
          enabled: true
          # The chart applies podSecurityContext to the Job's containers and
          # securityContext to its pod, the other way round from its main
          # pod.
          podSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 666
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            fsGroup: 666
            runAsGroup: 666
            runAsUser: 666
            seccompProfile:
              type: RuntimeDefault
      extraConfig:
        # Accounts come from the tenant's realm only.
        password_config:
          enabled: false
        # No other homeserver is admitted.
        federation_domain_whitelist: []
        # The tenant's own Element gets the login token straight back after
        # the sign-in. Any other address still gets Synapse's confirmation
        # page, which may not be shown in a frame: Element opens inside the
        # desktop, so its own address must not need it.
        sso:
          client_whitelist:
            - "https://element.${TENANT_DOMAIN}/"
        email:
          enable_notifs: true
          require_transport_security: true
          notif_from: "matrix@${TENANT_DOMAIN}"
          smtp_host: "smtp.${KERNEL_DOMAIN}"
          smtp_port: 587
          smtp_user: "matrix@${TENANT_DOMAIN}"
      extraSecrets:
        oidc_providers:
          - idp_id: keycloak
            idp_name: "Workspace"
            discover: true
            scopes: ["openid", "profile", "email"]
            user_mapping_provider:
              config:
                subject_claim: sub
                # The realm's username is an email address: the Matrix ID
                # takes the part before the @ (a number is added on a clash).
                localpart_template: "{{ user.preferred_username | localpart_from_email }}"
                display_name_template: "{{ user.name }}"
                email_template: "{{ user.email }}"

  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
    services:
      identity:
        oidc:
          clientId: "gentian-synapse"
          name: "Element (Synapse)"
          accessType: CONFIDENTIAL
          redirectUris:
            - "https://matrix.${TENANT_DOMAIN}/_synapse/client/oidc/callback"
          postLogoutRedirectUris:
            - "https://element.${TENANT_DOMAIN}/*"
            - "https://desktop.${TENANT_DOMAIN}/*"
        # No backchannelLogout: a sign-out at the platform does not end the
        # session Synapse holds for Element. Synapse answers
        # /_synapse/client/oidc/backchannel_logout only when its provider
        # carries backchannel_logout_enabled: true, and the address the realm
        # would call has not been run.
      database:
        engine: postgresql
      mail:
        smtp: {}

  provides:
    - name: chat
      protocol: matrix

  backup:
    restore:
      # Synapse writes the server name -- the tenant's domain -- into every
      # user, room and event id it stores, and refuses to start under
      # another. A restore onto another domain leaves its data out and
      # leaves the app as it is installed there; on the same domain it is
      # restored as any app is.
      domainBound: true

  secrets:
    generated:
      - name: registration_shared_secret
        valuePath: "config.registrationSharedSecret"
      - name: redis_password
        valuePath: "redis.auth.password"

  expose:
    - name: matrix
      surface: perimeter
      authMode: app
      subDomain: matrix
      # The client API, media, and Synapse's own sign-in pages. Not the
      # admin API (/_synapse/admin), which is under neither.
      paths:
        - /_matrix
        - /_synapse/client
      denyPaths:
        - /_matrix/federation
        - /_matrix/key
      # Synapse's sign-in through the realm: the redirect sets the cookies,
      # the callback reads them.
      signInCookies:
        names: [oidc_session, oidc_session_no_samesite]
        paths:
          - /_matrix/client/v3/login/sso
          - /_matrix/client/r0/login/sso
          - /_synapse/client/oidc
      backend:
        service: synapse-web
        port: 8008

  customization:
    grade: B
    rubricScore: 6
    supportedRungs: [L0, L1, L3, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/synapse/synapse-ce/customization.md
    configure:
      hotReload: false
    dropIns:
      - name: synapse-config
        path: /data/conf.d
        format: yaml
        source: configMap
        maxBytes: 262144
        upstreamDocumented: true
        tenantEditable: false
    extension:
      mechanism: synapse-module
      delivery: [image-layer]
      apiStability: evolving
      apiDocs: https://element-hq.github.io/synapse/latest/modules/index.html
      perTenantAddons: false
      testMatrix: ["1.155"]
    publishes:
      apis:
        - contract: chat
          protocol: matrix
          path: /_matrix/client
          auth: matrix-access-token
    repackage:
      chartOwnership: upstream
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
