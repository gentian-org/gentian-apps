apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: open-webui
  labels:
    gentianos.io/profile-name: open-webui
  annotations:
    # OpenWebUI needs network access to the platform-kernel namespace where LiteLLM resides
    gentianos.io/kernel-egress-namespaces: platform-kernel
    gentianos.io/standard-image-pull-secrets: "true"
spec:
  displayName: "AI Chat"
  description: "User-friendly chat interface for LLMs, configured to route through the central LiteLLM proxy."
  family: open-webui
  catalogueVersion: "1.0.0"
  edition: full
  trustTier: certified
  license: MIT
  tile:
    icon: chat

  provides:
    - name: webui
      protocol: http-html

  portalTiles:
    - name: open-webui
      displayName:
        de_DE: "AI Chat"
        en_US: "AI Chat"
      linkTarget: embedded
      allowedGroup: "App Users"

  chart:
    repository: "https://helm.openwebui.com"
    name: open-webui
    version: "15.2.0"

  deploymentMethod: crossplane

  ingress:
    subDomain: "chat"
    serviceName: "open-webui"
    servicePort: 8080
    tlsEnabled: true

  extraValues:
    fullnameOverride: "open-webui"
    ingress:
      enabled: false

    image:
      tag: "0.10.2-slim"

    persistence:
      enabled: true
      size: "2Gi"

    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

    extraEnvFrom:
      - secretRef:
          name: llm-credentials-open-webui

    copyAppData:
      command: ["sh", "-c", "cp -R -n /app/backend/data/. /tmp/app-data/ || true"]

    # Disable local Ollama, pipelines, and redis sub-deployments
    ollama:
      enabled: false
    pipelines:
      enabled: false
    websocket:
      manager: ""
      redis:
        enabled: false

    # Kyverno baseline security policies compliance
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
