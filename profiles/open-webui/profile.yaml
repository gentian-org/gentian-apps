apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: open-webui
  labels:
    gentianos.io/profile-name: open-webui
  annotations:
    # OpenWebUI needs network access to the platform-kernel namespace where LiteLLM resides
    gentianos.io/kernel-egress-namespaces: platform-kernel,envoy-gateway-system
    gentianos.io/standard-image-pull-secrets: "true"
spec:
  displayName: "AI Chat"
  description: "User-friendly chat interface for LLMs, configured to route through the central LiteLLM proxy."
  family: open-webui
  catalogueVersion: "1.0.0"
  edition: full
  trustTier: certified
  license: MIT
  tile:
    icon: chat

  kernelRequirements:
    identity:
      oidc:
        clientId: "gentian-open-webui"
        name: "AI Chat"
        accessType: CONFIDENTIAL
        redirectUris:
          - "https://ai-chat.${TENANT_DOMAIN}/oauth/oidc/callback"

  provides:
    - name: webui
      protocol: http-html

  portalTiles:
    - name: open-webui
      displayName:
        de_DE: "AI Chat"
        en_US: "AI Chat"
      linkTarget: embedded
      allowedGroup: "App Users"

  chart:
    repository: "https://helm.openwebui.com"
    name: open-webui
    version: "15.2.0"

  deploymentMethod: crossplane

  valueMapping:
    oidc:
      clientSecretKey: "dummyOidcSecret"

  ingress:
    subDomain: "ai-chat"
    serviceName: "open-webui"
    servicePort: 80
    tlsEnabled: true
  extraValues:
    fullnameOverride: "open-webui"
    extraEnvVars:
      - name: OFFLINE_MODE
        value: "true"
      - name: HF_HUB_OFFLINE
        value: "1"
      - name: ENABLE_OAUTH_SIGNUP
        value: "true"
      - name: OAUTH_CLIENT_ID
        value: "gentian-open-webui"
      - name: OAUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: open-webui-sensitive-values
            key: oidc-client-secret
      - name: OPENID_PROVIDER_URL
        value: "http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080/auth/realms/${TENANT_ID}/.well-known/openid-configuration"
      - name: OAUTH_PROVIDER_NAME
        value: "Gentian SSO"
      - name: OAUTH_SCOPES
        value: "openid email profile"
      - name: WEBUI_URL
        value: "https://ai-chat.${TENANT_DOMAIN}"
      - name: REDIRECT_URI
        value: "https://ai-chat.${TENANT_DOMAIN}/oauth/oidc/callback"
      - name: ENABLE_LOGIN_FORM
        value: "false"
      - name: OAUTH_AUTO_REDIRECT
        value: "true"
      - name: WEBUI_SESSION_COOKIE_SECURE
        value: "true"
    # The chart's own openai* values keys template literal env: entries,
    # which win over extraEnvFrom's llm-credentials-open-webui Secret for
    # the same names (chart's own docs: "extraEnvVars will take precedence
    # over the value from extraEnvFrom") — without these, the chart's
    # default openaiBaseApiUrl/openaiApiKey (real https://api.openai.com/v1
    # + a placeholder key) silently win instead, and Open WebUI's model
    # list request to that default times out reaching the public internet.
    # extraEnvFrom stays wired for WEBUI_SECRET_KEY, which has no
    # dedicated values key.
    openaiBaseApiUrl: "http://litellm-proxy.platform-kernel.svc.cluster.local:4000/v1"
    openaiApiKeyExistingSecret: "llm-credentials-open-webui"
    openaiApiKeyExistingSecretKey: "OPENAI_API_KEY"
    ingress:
      enabled: false

    image:
      tag: "0.10.2-slim"

    persistence:
      enabled: true
      size: "2Gi"

    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

    extraEnvFrom:
      - secretRef:
          name: llm-credentials-open-webui

    copyAppData:
      command: ["sh", "-c", "cp -R -n /app/backend/data/. /tmp/app-data/ || true"]

    # Disable local Ollama, pipelines, and redis sub-deployments
    ollama:
      enabled: false
    pipelines:
      enabled: false
    websocket:
      manager: ""
      redis:
        enabled: false

    # Kyverno baseline security policies compliance
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
