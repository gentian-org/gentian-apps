# SPDX-License-Identifier: LicenseRef-Open-WebUI
# ComponentProfile — Open WebUI ("AI Chat")
#
# The platform places this app in every tenant while the cluster serves models
# (spec.llm.enabled), and removes it when the cluster stops: the index says
# placedWith: llm, from requires-capability below. It is the AI widget's app,
# not one a tenant installs, so the App Store does not offer it. A maintained
# edition named -ce like the community edition it packages; the chart's own
# names (fullnameOverride open-webui: its Service and volume) are unchanged.
#
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: open-webui-ce
  labels:
    gentianos.io/profile-name: open-webui-ce
    gentianos.io/profile-family: open-webui
    gentianos.io/profile-edition: me
  annotations:
    # The App Store's listing of open-webui goes with the new name.
    gentianos.io/renamed-from: open-webui
    gentianos.io/platform-app: "true"
    # Comes with the cluster serving models: the platform places it in every
    # tenant then, and only then (placedWith: llm in the catalog's index).
    gentianos.io/requires-capability: "llm"
    # Placed, not offered.
    gentianos.io/store-listed: "false"
    gentianos.io/standard-image-pull-secrets: "true"
    # The portal opens this app hidden at desktop mount. The AI widget queries it
    # in the background, and a cold app answers with a login redirect instead of a
    # reply. The need is declared here rather than known by the shell: gentian-ui
    # used to find it by the literal app id "open-webui-open-webui", which is the
    # kind of app-specific knowledge the platform must not carry.
    gentianos.io/portal-preopen: "true"
spec:
  classes:
    - app
  trustTier: certified
  version: "0.5.1-dev.6"
  package:
    chart:
      repository: "https://helm.openwebui.com"
      name: open-webui
      version: "15.2.0"

    valueMapping:
      oidc:
        clientSecretKey: "dummyOidcSecret"
    # This chart does not use the extraVolumes/extraVolumeMounts convention, so
    # the platform is told where to put a volume it has to mount (the staging CA
    # trust bundle). It used to special-case the app name in app-default.
      volumes:
        volumesPath: volumes
        volumeMountsPath: volumeMounts.container

  # Session-signing key, delivered in the credentials Secret this app consumes
  # with envFrom. Declared here because the operator previously hardcoded
  # `if appName == "open-webui"`; the value derivation is unchanged, so existing
  # sessions stay valid.
    extraValues:
      fullnameOverride: "open-webui"
      extraEnvVars:
        - name: OFFLINE_MODE
          value: "true"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: ENABLE_OAUTH_SIGNUP
          value: "true"
        - name: OAUTH_CLIENT_ID
          value: "gentian-open-webui"
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: open-webui-ce-sensitive-values
              key: oidc-client-secret
        - name: OPENID_PROVIDER_URL
          value: "http://gentian-idp-keycloak-keycloakx-http.kernel-authentication.svc.cluster.local:8080/auth/realms/${TENANT_ID}/.well-known/openid-configuration"
        - name: OAUTH_PROVIDER_NAME
          value: "Gentian SSO"
        - name: OAUTH_SCOPES
          value: "openid email profile"
        - name: WEBUI_URL
          value: "https://ai-chat.${TENANT_DOMAIN}"
        - name: REDIRECT_URI
          value: "https://ai-chat.${TENANT_DOMAIN}/oauth/oidc/callback"
        - name: ENABLE_LOGIN_FORM
          value: "false"
      # Permits exactly one signup: the first, when the user table is empty.
      #
      # Open WebUI refuses /auths/signup outright once the login form is off,
      # and from 0.10 that refusal covers the initial admin too unless this is
      # set. The post-install Job seeds that admin over the same endpoint, so
      # without this the Job cannot do the one thing it exists for, and a fresh
      # instance stays in onboarding — the state whose only exit is a sign-in
      # that onboarding itself blocks.
      #
      # It does not reopen signup afterwards: with any user present Open WebUI
      # takes the other branch and refuses again, because the login form is
      # still off. Nothing here grants a way in — the seeded account is reached
      # through SSO, and its password is random and discarded.
        - name: ENABLE_INITIAL_ADMIN_SIGNUP
          value: "true"
        - name: OAUTH_AUTO_REDIRECT
          value: "true"
        - name: WEBUI_SESSION_COOKIE_SECURE
          value: "true"
      # Let ordinary members see the models the tenant is entitled to.
      #
      # Open WebUI keeps a per-user access list for models, and a model found on
      # a connection rather than created in the UI is admin-only until someone
      # shares it. Nobody ever does, so every member signed in successfully and
      # found an empty model picker: "No results found", while an admin saw the
      # same instance offering the model perfectly well.
      #
      # The entitlement boundary is already drawn twice before this point, and
      # both are stronger than this list. A member reaches this app at all only
      # by holding gentian:tenant:<t>:app:open-webui-ce, and the LiteLLM key this
      # instance carries is scoped to the tenant's own team, so the models on
      # offer are the tenant's models. A third check that defaults to denying
      # everyone adds no boundary, only an empty dropdown.
        - name: BYPASS_MODEL_ACCESS_CONTROL
          value: "true"
        - name: ENABLE_OAUTH_ROLE_MANAGEMENT
          value: "true"
      # The post-install job seeds the tenant administrator's account so the
      # instance is not stuck in onboarding (see postInstallJob below). This is
      # what hands that account to its owner: the first SSO sign-in with the
      # same address adopts it instead of creating a second, non-admin user.
      # Safe here because Keycloak is the only provider and the address is
      # derived by the platform, not typed by a user.
        - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
          value: "true"
        - name: OAUTH_ROLES_CLAIM
          value: "groups"
      # Who may enter, and who arrives as an admin.
      #
      # With ENABLE_OAUTH_ROLE_MANAGEMENT on, Open WebUI refuses anyone whose
      # roles claim matches neither list, and OAUTH_ALLOWED_ROLES defaults to
      # "user,admin" — names this platform never issues. Every tenant member was
      # therefore turned away at the callback with "You do not have permission to
      # access this resource", after signing in successfully.
      #
      # The allowed role is the app's own entitlement group, which is what that
      # group is for: installing the app creates it, and a member holds it only
      # if the tenant administrator granted this app. Admitting
      # gentian:tenant:<t>:members instead would let every member of the tenant
      # in regardless of entitlement, which is the check rather than a detail of
      # it.
        - name: OAUTH_ALLOWED_ROLES
          value: "gentian:tenant:${TENANT_ID}:app:open-webui-ce"
      # The tenant administrators group, whose real name carries the tenant.
      # This read "gentian:tenant:admin", which exists in no realm, so nobody
      # was ever promoted — invisible while the allowed list refused everyone
      # anyway.
        - name: OAUTH_ADMIN_ROLES
          value: "gentian:tenant:${TENANT_ID}:admins"
      # Whose request it is, told to the model gateway with every completion,
      # so it holds each person to the cluster's budget per person
      # (spec.llm.personBudget). x-litellm-end-user-id is the header the
      # gateway always reads; the value is this instance's own id of the
      # person, which is unique and names no address.
        - name: ENABLE_FORWARD_USER_INFO_HEADERS
          value: "true"
        - name: FORWARD_USER_INFO_HEADER_USER_ID
          value: "x-litellm-end-user-id"
    # Where the model gateway is and the key for it come from the Secret the
    # platform writes for this app, llm-credentials-open-webui-ce
    # (OPENAI_API_BASE_URL, OPENAI_API_KEY), through extraEnvFrom below.
    #
    # The chart's own openaiBaseApiUrl templates a literal env: entry, and a
    # literal wins over extraEnvFrom for the same name -- its default is
    # https://api.openai.com/v1, which the model list request then times out
    # trying to reach. Emptied, the chart emits neither OPENAI_API_BASE_URL nor
    # OPENAI_API_KEY and the Secret's two are the only ones. The address used to
    # be written here instead, and named the namespace the gateway ran in before
    # the kernel was split up.
      openaiBaseApiUrl: ""
      ingress:
        enabled: false

      image:
        tag: "0.10.2-slim"

      persistence:
        enabled: true
        size: "2Gi"

      resources:
        requests:
          cpu: "100m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

      extraEnvFrom:
        - secretRef:
            name: llm-credentials-open-webui-ce

      copyAppData:
        command: ["sh", "-c", "cp -R -n /app/backend/data/. /tmp/app-data/ || true"]

    # Disable local Ollama, pipelines, and redis sub-deployments
      ollama:
        enabled: false
      pipelines:
        enabled: false
      websocket:
        manager: ""
        redis:
          enabled: false

    # Kyverno baseline security policies compliance
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault

  # Not yet characterized against the customization ladder.
  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
    services:
      # Every completion goes to the platform's model gateway. Declaring it is
      # what gives this app its key there, the Secret llm-credentials-open-webui-ce
      # and a path to the gateway's port -- that port only, not the gateway's
      # database and cache beside it.
      llm: {}
      identity:
        oidc:
          clientId: "gentian-open-webui"
          name: "AI Chat"
          accessType: CONFIDENTIAL
          redirectUris:
            - "https://ai-chat.${TENANT_DOMAIN}/oauth/oidc/callback"
        # Signing out of the portal has to sign out of here too.
        #
        # This app keeps its own session cookie, so without a way to be told
        # otherwise it goes on serving the previous person: sign out, sign in as
        # somebody else, open the app, and it is still the first account. On a
        # shared machine "log out" does not.
        #
        # Backchannel rather than frontchannel deliberately. Keycloak drives
        # frontchannel logout through hidden iframes, which makes it a
        # third-party context — the same context whose cookies browsers now
        # withhold, and the reason sign-in itself had to be moved out of a frame.
        # A server-to-server POST does not care about any of that.
        #
        # The realm posts to this path at the Service and port of the entry
        # "web", inside the cluster.
        #
        # NOT IN EFFECT. Open WebUI 0.10.2 answers this path only with
        # ENABLE_OAUTH_BACKCHANNEL_LOGOUT=true, which this profile does not
        # set -- and setting it would not be enough. Open WebUI checks the
        # logout token properly (signature against the realm's keys, issuer,
        # audience, the event), but its session is a signed token of its own
        # that it can only refuse again through Redis: without one it deletes
        # its OAuth session rows, answers 200, and goes on accepting the
        # browser's cookie until that expires (utils/oauth.py,
        # handle_backchannel_logout). This profile runs it without Redis. So
        # until the profile gives it one (requires.services.cache, and the
        # app's REDIS_URL) and the switch, a sign-out leaves this app's
        # session as it is, and the realm's notice is answered with an error.
          backchannelLogout:
            exposure: web
            path: /oauth/backchannel-logout
        # Where a logout initiated from this app is allowed to return to. Without
        # it Keycloak refuses the post_logout_redirect_uri and leaves the user on
        # an error page after an otherwise successful logout.
          postLogoutRedirectUris:
            - "https://ai-chat.${TENANT_DOMAIN}/"
            - "https://${TENANT_DOMAIN}/"

  provides:
    - name: webui
      protocol: http-html

  secrets:
    derived:
      - key: WEBUI_SECRET_KEY

  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: "ai-chat"
      backend: &id001
        service: "open-webui"
        port: 80
      tile:
        displayName: "AI Chat"
        logo: data:image/png;base64,
        image: assets/tile.png
        relation: can_launch
    - name: open-webui-admin
      surface: gateway
      authMode: oidc
      subDomain: "ai-chat"
      backend: *id001
      tile:
        displayName: "AI Config"
        logo: data:image/png;base64,
        image: assets/tile-admin.png
        # Open WebUI's settings: for the tenant's administrators only.
        relation: can_administer
        object: tenant
  hooks:

  # Open WebUI seeds its OpenAI connection settings into its own persisted
  # SQLite DB on first boot only — later pod restarts do NOT re-sync from
  # extraEnvFrom/openaiBaseApiUrl above, so a wrong/absent first-boot value
  # (e.g. before this profile set the LiteLLM URL) stays stuck until fixed
  # via Open WebUI's own admin API. This job mints a short-lived admin JWT
  # itself (HS256, signed with WEBUI_SECRET_KEY, the same secret Open WebUI
  # verifies incoming tokens with) and POSTs the correct config — idempotent,
  # and a no-op once the persisted config already matches. See
  # app-profile-guide.md, "Post-install bootstrap jobs".
  #
  # "Matches" means the address and the key, both. The platform can replace
  # this app's key at the gateway, and the old one stops authenticating there;
  # an instance that went on presenting the key it stored on first boot would
  # get 401 for every model. The Job is deleted when it finishes and created
  # again by the platform, so it runs repeatedly, each time with the Secret's
  # current values, and a replaced key is written into the app by the next
  # run. Open WebUI reads the connection from its database per request, so
  # nothing has to restart. ENABLE_PERSISTENT_CONFIG=false is not used for
  # this: it covers every setting, not these two, so whatever an administrator
  # changed in the app would be gone at the next restart, and the environment
  # is only read when the process starts.
  # NOTE: uses python:3.12-alpine, not alpine+apk-installed curl/sqlite/jq/
  # openssl -- the tenant namespace's NetworkPolicy blocks general internet
  # egress by default (only same-namespace and explicitly kernel-egress-
  # annotated traffic is allowed), so a runtime `apk add` hangs until the
  # Job's backoff eventually kills it. Python's stdlib (sqlite3, hmac,
  # urllib) needs no runtime package install, so it needs no egress beyond
  # the same-namespace call to open-webui's own Service.
    postInstall:
      image: python:3.12-alpine
      envFrom:
        - llm-credentials-open-webui-ce
      readOnlyPVC:
        claimName: open-webui
        mountPath: /data
      script: |
        #!/bin/sh
        set -eu
        exec python3 - <<'PYEOF'
        import base64, hashlib, hmac, json, os, secrets, shutil, sqlite3, sys
        import tempfile, time
        import urllib.error, urllib.request

        DB = "/data/webui.db"
        base = "http://open-webui"

        def http_json(url, method="GET", data=None, headers=None, timeout=10):
            req = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                return json.loads(resp.read())

        def describe(e):
            # str(HTTPError) is the status line and nothing else, so a refusal
            # arrives as "HTTP Error 403: Forbidden" with no hint as to which of
            # the several conditions behind that status was the one that fired.
            # The body carries open-webui's own detail; print it.
            if isinstance(e, urllib.error.HTTPError):
                try:
                    detail = json.loads(e.read()).get("detail")
                except Exception:
                    detail = None
                if detail:
                    return f"{e}: {detail}"
            return str(e)

        def admin_id():
            """Return the id of an existing admin account, or None.

            Read from a private copy rather than from /data directly. Open WebUI
            keeps the database in WAL mode, and /data is mounted read-only, so
            SQLite cannot create the -shm file a normal read-only WAL connection
            needs. immutable=1 is the only way it will open the file at all -- and
            immutable=1 tells it to ignore the WAL completely and answer from the
            main file, which is a snapshot from before every write still pending
            in the log. An account created minutes ago is invisible in exactly
            that window, which is the window this Job runs in.

            Copying the three files somewhere writable lets SQLite replay the WAL
            and answer for the present. The originals are never opened for write.
            """
            tmp = tempfile.mkdtemp()
            try:
                for suffix in ("", "-wal", "-shm"):
                    if os.path.exists(DB + suffix):
                        shutil.copy(DB + suffix, os.path.join(tmp, "webui.db" + suffix))
                conn = sqlite3.connect(os.path.join(tmp, "webui.db"))
                try:
                    row = conn.execute(
                        "SELECT id FROM user WHERE role='admin' LIMIT 1").fetchone()
                finally:
                    conn.close()
                return row[0] if row else None
            finally:
                shutil.rmtree(tmp, ignore_errors=True)

        if not os.path.exists(DB):
            print("[open-webui post-install] webui.db not present yet -- will retry")
            sys.exit(1)

        try:
            config = http_json(f"{base}/api/config")
        except (urllib.error.URLError, TimeoutError) as e:
            print(f"[open-webui post-install] open-webui is not answering yet: {describe(e)}")
            sys.exit(1)

        # /api/config needs no token and reports onboarding only while the
        # instance has no users at all. That is the one state in which signup can
        # succeed here: this profile sets ENABLE_LOGIN_FORM=false, and open-webui
        # refuses signup outright once any user exists -- whatever ENABLE_SIGNUP
        # says, and regardless of whether that user is an admin.
        #
        # Asking first is the whole difference between seeding an empty instance
        # and posting a request that can only ever be refused. Without the check
        # this Job read a stale database, concluded there was no admin, and
        # crash-looped against a permanent 403 until its backoffLimit ran out.
        onboarding = config.get("onboarding", False)
        admin = admin_id()

        token = None
        if onboarding:
            # No accounts at all, so open-webui is sitting on its onboarding
            # screen, and onboarding is a dead end for this profile: the sign-in
            # page only auto-redirects to SSO when an account already exists, and
            # ENABLE_LOGIN_FORM=false leaves nothing else on the page. The tab
            # renders the logo and stops, which is what the tenant sees -- and no
            # one can sign in to clear it, because signing in is what it is
            # blocking.
            #
            # So create the account the tenant is going to use. The first one
            # Open WebUI is given becomes the admin, which clears onboarding; the
            # address is the tenant administrator's, so their first SSO sign-in
            # adopts this account (OAUTH_MERGE_ACCOUNTS_BY_EMAIL) rather than
            # arriving as a second, non-admin user.
            #
            # The password is random and deliberately discarded. Nothing signs in
            # with it -- the sign-in form is disabled and the account is reached
            # through SSO -- so keeping it, or deriving it from the master
            # password, would only create a credential nobody needs.
            signup = json.dumps({
                "name": "Tenant Administrator",
                "email": "admin@${TENANT_DOMAIN}",
                "password": secrets.token_urlsafe(32),
            }).encode()
            try:
                created = http_json(f"{base}/api/v1/auths/signup", method="POST",
                                    data=signup, headers={"Content-Type": "application/json"})
            except (urllib.error.URLError, TimeoutError) as e:
                # Also the path a lost race takes: whoever won created the account,
                # and the next attempt finds it instead of onboarding.
                print(f"[open-webui post-install] could not seed the admin account: {describe(e)}")
                sys.exit(1)
            token = created.get("token")
            if token is None:
                print("[open-webui post-install] signup returned no token -- will retry")
                sys.exit(1)
            print("[open-webui post-install] seeded admin account admin@${TENANT_DOMAIN}")
        elif admin is None:
            # Accounts exist but none of them is an admin, so there is no identity
            # to act as and no way to make one -- signup is refused and the
            # database is read-only. This resolves itself: OAUTH_ADMIN_ROLES
            # promotes the tenant administrator on their first SSO sign-in. Retry
            # rather than pass, so the LLM connection below is not left unset.
            print("[open-webui post-install] open-webui has accounts but no admin yet -- "
                  "waiting for a sign-in OAUTH_ADMIN_ROLES promotes, will retry")
            sys.exit(1)

        if token is None:
            def b64url(data):
                return base64.urlsafe_b64encode(data).rstrip(b"=")

            secret = os.environ["WEBUI_SECRET_KEY"].encode()
            header = b64url(json.dumps({"alg": "HS256", "typ": "JWT"}, separators=(",", ":")).encode())
            payload = b64url(json.dumps({"id": admin, "exp": int(time.time()) + 300}, separators=(",", ":")).encode())
            signing_input = header + b"." + payload
            sig = b64url(hmac.new(secret, signing_input, hashlib.sha256).digest())
            token = (signing_input + b"." + sig).decode()

        headers = {"Authorization": f"Bearer {token}"}

        try:
            current = http_json(f"{base}/openai/config", headers=headers)
        except (urllib.error.URLError, TimeoutError) as e:
            print(f"[open-webui post-install] failed to read current config: {describe(e)}")
            sys.exit(1)

        # The connection the platform hands this app, compared with the one
        # the app has stored: the address AND the key. Comparing the address
        # alone left a replaced key unnoticed.
        #
        # Only the platform's own connection is touched -- the entry that
        # already names the gateway, or the first one. Connections and
        # per-connection settings an administrator added stay as they are:
        # this runs against live instances now, not just a fresh one.
        want_url = os.environ["OPENAI_API_BASE_URL"].rstrip("/")
        want_key = os.environ["OPENAI_API_KEY"]
        if not want_url or not want_key:
            print("[open-webui post-install] the platform's Secret carries no gateway address or no key")
            sys.exit(1)

        have_urls = [str(u) for u in (current.get("OPENAI_API_BASE_URLS") or [])]
        have_keys = [str(k) for k in (current.get("OPENAI_API_KEYS") or [])]
        have_keys = (have_keys + [""] * len(have_urls))[:len(have_urls)]

        urls, keys = list(have_urls), list(have_keys)
        if not urls:
            urls, keys = [want_url], [want_key]
        else:
            idx = urls.index(want_url) if want_url in urls else 0
            urls[idx], keys[idx] = want_url, want_key

        url_differs = urls != have_urls
        key_differs = keys != have_keys
        if current.get("ENABLE_OPENAI_API") is True and not url_differs and not key_differs:
            print("[open-webui post-install] openai address and key already correct -- skipping")
            sys.exit(0)

        def redact(text):
            # A refusal can quote the request back. No key, the stored ones
            # included, is ever printed.
            for k in set(keys + have_keys):
                if k:
                    text = text.replace(k, "***")
            return text

        update = {
            "ENABLE_OPENAI_API": True,
            "OPENAI_API_BASE_URLS": urls,
            "OPENAI_API_KEYS": keys,
            "OPENAI_API_CONFIGS": current.get("OPENAI_API_CONFIGS") or {},
        }
        req_headers = dict(headers)
        req_headers["Content-Type"] = "application/json"
        try:
            stored = http_json(f"{base}/openai/config/update", method="POST",
                               data=json.dumps(update).encode(), headers=req_headers)
        except (urllib.error.URLError, TimeoutError) as e:
            print(f"[open-webui post-install] update failed: {redact(describe(e))}")
            sys.exit(1)

        # The reply is what open-webui stored. Anything else is not a write.
        if (not isinstance(stored, dict)
                or stored.get("ENABLE_OPENAI_API") is not True
                or stored.get("OPENAI_API_BASE_URLS") != urls
                or stored.get("OPENAI_API_KEYS") != keys):
            print("[open-webui post-install] update was accepted but open-webui did not store "
                  "the address and key it was sent")
            sys.exit(1)

        changed = [what for what, differs in (("address", url_differs), ("key", key_differs)) if differs]
        print("[open-webui post-install] openai config updated: "
              + (" and ".join(changed) if changed else "connection enabled"))
        PYEOF
  # How this app is put back. The default capture (scale to zero, archive the
  # data volume, where its SQLite database is) is right; only the restore adds
  # to it.
  backup:
    quiesce:
      # Where the command below runs.
      container: open-webui
    restore:
      # Open WebUI stores its settings in its database at first start and
      # prefers them to the environment from then on (oauth.* aside, which it
      # always reads from the environment). Restored from another cluster or
      # domain, webui.url names the old address, where it sends a person after
      # signing in, and the gateway connection the old address and key. Set
      # from this pod's environment; idempotent. It runs once the app is
      # resumed, which reads its settings per request.
      post:
        - - python3
          - -c
          - |
            import json, os, re, sqlite3, time

            db = sqlite3.connect(os.path.join(os.environ.get("DATA_DIR") or "/app/backend/data", "webui.db"), timeout=60)
            # A JSON column has numeric affinity in SQLite: a number comes back as one.
            rows = {k: json.loads(v) if isinstance(v, (str, bytes)) else v
                    for k, v in db.execute("SELECT key, value FROM config")}
            new = {}

            # Where it is served, which it sends a person back to after signing in.
            if os.environ.get("WEBUI_URL"):
                new["webui.url"] = os.environ["WEBUI_URL"]

            # The platform's connection to the model gateway: the entry that names the
            # gateway, or the first, as the post-install Job keeps it. A connection an
            # administrator added stays as it is.
            want_url = (os.environ.get("OPENAI_API_BASE_URL") or "").rstrip("/")
            want_key = os.environ.get("OPENAI_API_KEY") or ""
            urls = [str(u) for u in rows.get("openai.api_base_urls") or []]
            if want_url and want_key and urls:
                keys = ([str(k) for k in rows.get("openai.api_keys") or []] + [""] * len(urls))[:len(urls)]
                i = urls.index(want_url) if want_url in urls else 0
                urls[i], keys[i] = want_url, want_key
                new["openai.api_base_urls"], new["openai.api_keys"] = urls, keys

            # Every other address on the old domain.
            src = os.environ.get("GENTIAN_RESTORE_SOURCE_DOMAIN", "").strip().lower()
            dst = os.environ.get("GENTIAN_RESTORE_TARGET_DOMAIN", "").strip().lower()
            if src and dst and src != dst:
                url = re.compile(r"(https?://)((?:[a-z0-9-]+\.)*)" + re.escape(src) + r"(?![a-z0-9-]|\.[a-z0-9])", re.I)

                def rehost(v):
                    if isinstance(v, str):
                        return url.sub(lambda m: m.group(1) + m.group(2) + dst, v)
                    if isinstance(v, list):
                        return [rehost(x) for x in v]
                    if isinstance(v, dict):
                        return {k: rehost(x) for k, x in v.items()}
                    return v

                for key, value in rows.items():
                    if key not in new and rehost(value) != value:
                        new[key] = rehost(value)

            changed = [k for k, v in new.items() if k in rows and rows[k] != v]
            for key in changed:
                db.execute("UPDATE config SET value = ?, updated_at = ? WHERE key = ?",
                           (json.dumps(new[key]), int(time.time()), key))
            db.commit()
            # Names only: two of these hold a key.
            print("gentian-restore: " + (", ".join(changed) + " rewritten" if changed else "settings already name this domain and gateway"))
