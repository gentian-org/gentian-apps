profile: open-webui
displayName: "Open WebUI"
summary: "A self-hosted chat interface for AI models, with document search, web search and tools, for local or cloud LLMs."
description: |
  Open WebUI is a self-hosted, extensible interface for chatting with large language models, working with local models via Ollama and with any OpenAI-compatible API. People use it for everyday AI chat, asking questions about their own documents (RAG), web search, and tool and plugin calls. It can run entirely offline; in this platform it is configured to route model requests through the central LiteLLM proxy.
