apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-cb-mrp
  labels:
    gentianos.io/profile-name: odoo-cb-mrp
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: module
    gentianos.io/requires-profile: odoo-cb-base
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["mrp"],"gentianOdooGroupRoles":["mrp.group_mrp_user","stock.group_stock_user"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Manufacturing"
  description: "Manufacturing and Bill of Materials (BoM) recipe management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: standard
  trustTier: platform
  license: LGPL-3.0
  tile:
    icon: tasks

  portalTiles:
    - name: odoo-mrp
      displayName:
        en_US: "Odoo Manufacturing"
        de_DE: "Odoo Fertigung"
      linkSuffix: "/web?gentian_embed=1&action=mrp.mrp_production_action"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: http://192.168.0.100:8089
    name: odoo
    version: "0.1.3"
  extraValues:
    odoo:
      module: mrp
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
