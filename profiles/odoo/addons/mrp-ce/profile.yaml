apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-mrp-ce
  labels:
    gentianos.io/profile-name: odoo-mrp-ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["mrp"],"gentianOdooGroupRoles":["mrp.group_mrp_user","stock.group_stock_user"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Manufacturing"
  description: "Manufacturing and Bill of Materials (BoM) recipe management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: platform
  license: LGPL-3.0
  author: OCA
  tile:
    icon: tasks

  portalTiles:
    - name: odoo-mrp
      displayName:
        en_US: "Odoo Manufacturing"
        de_DE: "Odoo Fertigung"
      linkSuffix: "/odoo/action-mrp.mrp_production_action?gentian_embed=1"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.15"
  # Odoo calls its addons "modules" — this maps the Gentian profile onto that name.
  customization:
    addon:
      id: mrp
      of: odoo-base-ce
  extraValues:
    odoo:
      module: mrp
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
