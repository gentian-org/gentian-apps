# SPDX-License-Identifier: LGPL-3.0
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: odoo-mrp-ce
  labels:
    gentianos.io/profile-name: odoo-mrp-ce
    gentianos.io/profile-family: odoo
    gentianos.io/profile-edition: ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/keycloak-group-attributes: '{"gentianOdooAdminRoles":["mrp.group_mrp_manager"],"gentianOdooGroupRoles":["mrp.group_mrp_user","stock.group_stock_user"],"gentianOdooModules":["mrp"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  classes:
    - app
  trustTier: platform
  version: "0.5.1-dev.1"
  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
  package:
    extraValues:
      odoo:
        module: mrp
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
    addon:
      id: mrp
      of: odoo-base-ce
  expose:
    - name: odoo-mrp
      surface: gateway
      authMode: oidc
      subDomain: odoo
      backend:
        component: odoo-base-ce
        service: odoo
        port: 8069
      tile:
        displayName: "Odoo Manufacturing"
        displayNames:
          de_DE: "Odoo Fertigung"
        logo: data:image/png;base64,
        image: assets/tile.png
        path: /odoo/action-mrp.mrp_production_action?gentian_embed=1
        relation: can_launch
  launch: tile
