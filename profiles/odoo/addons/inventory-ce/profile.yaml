# SPDX-License-Identifier: LGPL-3.0
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: odoo-inventory-ce
  labels:
    gentianos.io/profile-name: odoo-inventory-ce
    gentianos.io/profile-family: odoo
    gentianos.io/profile-edition: ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/keycloak-group-attributes: '{"gentianOdooAdminRoles":["stock.group_stock_manager"],"gentianOdooGroupRoles":["stock.group_stock_user"],"gentianOdooModules":["stock"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  classes:
    - app
  trustTier: platform
  version: "0.5.1-dev"
  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
  package:
    extraValues:
      odoo:
        module: stock
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
    addon:
      id: stock
      of: odoo-base-ce
  expose:
    - name: odoo-inventory
      surface: gateway
      authMode: oidc
      subDomain: odoo
      backend:
        component: odoo-base-ce
        service: odoo
        port: 8069
      tile:
        displayName: "Odoo Inventory"
        displayNames:
          de_DE: "Odoo Inventar"
        logo: data:image/png;base64,
        image: assets/tile.png
        path: /odoo/action-stock.stock_picking_type_action?gentian_embed=1
        relation: can_launch
  launch: tile
