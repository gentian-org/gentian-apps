profile: odoo-inventory-ce
displayName: "Inventory"
summary: "Track stock levels, receipts, deliveries and internal transfers across warehouses and locations."
description: |
  Odoo Inventory records every stock move as a transfer between locations, using double-entry stock management. It handles receipts, deliveries, internal transfers, multiple warehouses, reordering rules and lot/serial tracking. The dedicated Barcode app is part of Odoo Enterprise.
categories: [operations, erp-finance]
