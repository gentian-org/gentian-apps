apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: odoo-employees-ce
  labels:
    gentianos.io/profile-name: odoo-employees-ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/keycloak-group-attributes: '{"gentianOdooAdminRoles":["hr.group_hr_manager"],"gentianOdooGroupRoles":["hr.group_hr_user"],"gentianOdooModules":["hr"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  classes:
    - app
  trustTier: platform
  version: "1.0.0"
  package:
    extraValues:
      odoo:
        module: hr
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
    addon:
      id: hr
      of: odoo-base-ce
  expose:
    - name: odoo-employees
      surface: gateway
      authMode: oidc
      subDomain: erp
      backend:
        component: odoo-base-ce
        service: odoo
        port: 8069
      tile:
        displayName: "Odoo Employees"
        displayNames:
          de_DE: "Odoo Mitarbeiter"
        logo: data:image/svg+xml;base64,
        image: assets/tile.svg
        path: /odoo/action-hr.open_view_employee_list_my?gentian_embed=1
        relation: can_launch
  launch: tile
