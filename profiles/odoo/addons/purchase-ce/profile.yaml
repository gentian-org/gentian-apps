apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: odoo-purchase-ce
  labels:
    gentianos.io/profile-name: odoo-purchase-ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/keycloak-group-attributes: '{"gentianOdooAdminRoles":["purchase.group_purchase_manager"],"gentianOdooGroupRoles":["purchase.group_purchase_user","stock.group_stock_user"],"gentianOdooModules":["purchase"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  classes:
    - app
  trustTier: platform
  version: "1.0.0"
  package:
    extraValues:
      odoo:
        module: purchase
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
    addon:
      id: purchase
      of: odoo-base-ce
  expose:
    - name: odoo-purchase
      surface: gateway
      authMode: oidc
      subDomain: erp
      backend:
        component: odoo-base-ce
        service: odoo
        port: 8069
      tile:
        displayName: "Odoo Purchase"
        displayNames:
          de_DE: "Odoo Einkauf"
        logo: data:image/svg+xml;base64,
        image: assets/tile.svg
        path: /odoo/action-purchase.purchase_form_action?gentian_embed=1
        relation: can_launch
  launch: tile
