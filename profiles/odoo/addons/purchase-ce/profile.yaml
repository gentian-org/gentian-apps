apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-purchase-ce
  labels:
    gentianos.io/profile-name: odoo-purchase-ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/requires-profile: odoo-base-ce
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["purchase"],"gentianOdooGroupRoles":["purchase.group_purchase_user","stock.group_stock_user"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Purchase"
  description: "Purchase and vendor management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: platform
  license: LGPL-3.0
  author: OCA
  tile:
    icon: spreadsheet

  portalTiles:
    - name: odoo-purchase
      displayName:
        en_US: "Odoo Purchase"
        de_DE: "Odoo Einkauf"
      linkSuffix: "/web?gentian_embed=1&action=purchase.purchase_form_action"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.15"
  # Odoo calls its addons "modules" — this maps the Gentian profile onto that name.
  customization:
    addon:
      id: purchase
      of: odoo-base-ce
  extraValues:
    odoo:
      module: purchase
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
