profile: odoo-purchase-ce
displayName: "Purchase"
summary: "Send requests for quotation and purchase orders to vendors, then match receipts and vendor bills."
description: |
  Odoo Purchase manages buying from vendors: requests for quotation, purchase orders, vendor prices and purchase agreements. It links to Inventory for receiving goods and to Invoicing for checking vendor bills against what was ordered and received.
categories: [operations, erp-finance]
links:
