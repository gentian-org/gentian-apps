apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: odoo-sales-ce
  labels:
    gentianos.io/profile-name: odoo-sales-ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    # Read from addons/sales_team/security/sales_team_security.xml, not from
    # sale_management, which defines only the Quotation Templates feature group:
    # group_sale_salesman is "User: Own Documents Only" and group_sale_manager is
    # "Administrator". The manager group implies group_sale_salesman_all_leads,
    # which implies the salesman, so the admin tier subsumes the member tier.
    # These are the same roles odoo-crm-ce grants -- both apps share one Sales
    # privilege in Odoo.
    gentianos.io/keycloak-group-attributes: '{"gentianOdooAdminRoles":["sales_team.group_sale_manager"],"gentianOdooGroupRoles":["sales_team.group_sale_salesman"],"gentianOdooModules":["sale_management"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  classes:
    - app
  trustTier: platform
  version: "1.0.0"
  package:
    extraValues:
      odoo:
        module: sale_management
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
    addon:
      id: sale_management
      of: odoo-base-ce
  expose:
    - name: odoo-sales
      surface: gateway
      authMode: oidc
      subDomain: erp
      backend:
        component: odoo-base-ce
        service: odoo
        port: 8069
      tile:
        displayName: "Odoo Sales"
        displayNames:
          de_DE: "Odoo Verkauf"
        logo: data:image/svg+xml;base64,
        image: assets/tile.svg
        path: /odoo/action-sale.action_quotations_with_onboarding?gentian_embed=1
        relation: can_launch
  launch: tile
