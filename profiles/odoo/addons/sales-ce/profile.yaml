apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-sales-ce
  labels:
    gentianos.io/profile-name: odoo-sales-ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    # Read from addons/sales_team/security/sales_team_security.xml, not from
    # sale_management, which defines only the Quotation Templates feature group:
    # group_sale_salesman is "User: Own Documents Only" and group_sale_manager is
    # "Administrator". The manager group implies group_sale_salesman_all_leads,
    # which implies the salesman, so the admin tier subsumes the member tier.
    # These are the same roles odoo-crm-ce grants -- both apps share one Sales
    # privilege in Odoo.
    gentianos.io/keycloak-group-attributes: '{"gentianOdooAdminRoles":["sales_team.group_sale_manager"],"gentianOdooGroupRoles":["sales_team.group_sale_salesman"],"gentianOdooModules":["sale_management"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Sales"
  description: "Quotations, sales orders and invoicing, in Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: platform
  license: LGPL-3.0
  author: OCA
  tile:
    # Odoo's own icon for the module this profile installs, set inside the
    # catalogue's 52x52 frame so it sits with the other tiles.
    image: assets/tile.svg
    logo: data:image/svg+xml;base64,

  portalTiles:
    - name: odoo-sales
      displayName:
        en_US: "Odoo Sales"
        de_DE: "Odoo Verkauf"
      # What Odoo's own Sales icon opens: sale_menu_root -> sale_order_menu ->
      # menu_sale_quotations at sequence 10. An act_window on sale.order.
      #
      # The action lives in sale, not sale_management, and so does the root
      # menu -- sale ships sale.sale_menu_root inactive and sale_management only
      # switches it on. gentian_os places the tile by the action's module, so
      # sale.* resolves to sale.sale_menu_root without a gentian_app hint.
      linkSuffix: "/odoo/action-sale.action_quotations_with_onboarding?gentian_embed=1"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.15"
  # Odoo calls its addons "modules" — this maps the Gentian profile onto that name.
  # sale_management rather than sale: sale alone is the engine other modules
  # (crm quotations, website_sale, pos) pull in, with its menu root inactive.
  # sale_management is the "Sales" application that makes it an app.
  customization:
    addon:
      id: sale_management
      of: odoo-base-ce
  extraValues:
    odoo:
      module: sale_management
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
