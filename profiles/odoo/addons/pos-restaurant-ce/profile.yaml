# SPDX-License-Identifier: LGPL-3.0
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: odoo-pos-restaurant-ce
  labels:
    gentianos.io/profile-name: odoo-pos-restaurant-ce
    gentianos.io/profile-family: odoo
    gentianos.io/profile-edition: ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/keycloak-group-attributes: '{"gentianOdooAdminRoles":["point_of_sale.group_pos_manager"],"gentianOdooGroupRoles":["point_of_sale.group_pos_user","point_of_sale.group_pos_manager","stock.group_stock_user","account.group_account_invoice"],"gentianOdooModules":["pos_restaurant"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  classes:
    - app
  trustTier: platform
  version: "0.5.1-dev"
  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
  package:
    extraValues:
      odoo:
        module: pos_restaurant
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
    addon:
      id: pos_restaurant
      of: odoo-base-ce
  expose:
    - name: odoo-pos-restaurant
      surface: gateway
      authMode: oidc
      subDomain: odoo
      backend:
        component: odoo-base-ce
        service: odoo
        port: 8069
      tile:
        displayName: "Odoo Restaurant"
        logo: data:image/png;base64,
        image: assets/tile.png
        path: /odoo/action-point_of_sale.action_pos_config_kanban?gentian_embed=1
        relation: can_launch
  launch: tile
