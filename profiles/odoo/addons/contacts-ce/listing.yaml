profile: odoo-contacts-ce
displayName: "Contacts"
summary: "Keep one shared address book of customers, vendors and other companies and people used across all Odoo apps."
description: |
  Odoo's central directory of companies and individuals: customers, vendors and other contacts with addresses, tags and related people. Every other Odoo app (sales, invoicing, purchase, CRM) reads from the same records, so a contact is entered once.
categories: [crm-sales, office]
