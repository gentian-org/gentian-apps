apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-contacts-ce
  labels:
    gentianos.io/profile-name: odoo-contacts-ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["contacts"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Contacts"
  description: "Contact management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: platform
  license: LGPL-3.0
  author: OCA
  tile:
    # Odoo's own icon for the module this profile installs, set inside the
    # catalogue's 52x52 frame so it sits with the other tiles.
    image: assets/tile.svg
    logo: data:image/svg+xml;base64,

  portalTiles:
    - name: odoo-contacts
      displayName:
        en_US: "Odoo Contacts"
        de_DE: "Odoo Kontakte"
      linkSuffix: "/odoo/action-contacts.action_contacts?gentian_embed=1"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.15"
  # Odoo calls its addons "modules" — this maps the Gentian profile onto that name.
  customization:
    addon:
      id: contacts
      of: odoo-base-ce
  extraValues:
    odoo:
      module: contacts
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
