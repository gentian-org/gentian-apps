apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-inventory-ce
  labels:
    gentianos.io/profile-name: odoo-inventory-ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/requires-profile: odoo-base-ce
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["inventory"],"gentianOdooGroupRoles":["stock.group_stock_user"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Inventory"
  description: "Inventory and warehouse management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: platform
  license: LGPL-3.0
  author: OCA
  tile:
    icon: database

  portalTiles:
    - name: odoo-inventory
      displayName:
        en_US: "Odoo Inventory"
        de_DE: "Odoo Inventar"
      linkSuffix: "/web?gentian_embed=1&action=stock.stock_picking_type_action"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.12"
  extraValues:
    odoo:
      module: stock
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
