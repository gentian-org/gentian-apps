profile: odoo-pos-ce
displayName: "Point of Sale"
summary: "Browser-based checkout for shops: sell, take payments and print receipts, online or offline, with stock and invoicing kept in Odoo."
description: |
  Odoo Point of Sale (`point_of_sale`) is a browser-based till for shops: it scans products, takes cash and card payments, prints receipts and keeps working offline, while sales update stock and invoicing in Odoo. For restaurants and bars, install **Restaurant** instead, which adds tables, split bills and kitchen printing.
categories: [commerce, crm-sales]
