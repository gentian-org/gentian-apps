apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-pos-ce
  labels:
    gentianos.io/profile-name: odoo-pos-ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["pos_restaurant"],"gentianOdooGroupRoles":["point_of_sale.group_pos_user","point_of_sale.group_pos_manager","stock.group_stock_user","account.group_account_invoice"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Point of Sale"
  description: "Point of Sale and Restaurant/Bar management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: platform
  license: LGPL-3.0
  author: OCA
  tile:
    # Odoo's own icon, set inside the catalogue's 52x52 frame so it sits with
    # the other tiles. point_of_sale's, not pos_restaurant's: this profile
    # installs the restaurant extension, but the tile says Point of Sale and
    # pos_restaurant's icon is the extension's own generic mark.
    image: assets/tile.svg
    logo: data:image/svg+xml;base64,

  portalTiles:
    - name: odoo-pos
      displayName:
        en_US: "Odoo Point of Sale"
        de_DE: "Odoo Point of Sale"
      linkSuffix: "/odoo/action-point_of_sale.action_pos_config_kanban?gentian_embed=1"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.15"
  # Odoo calls its addons "modules" — this maps the Gentian profile onto that name.
  customization:
    addon:
      id: pos_restaurant
      of: odoo-base-ce
  extraValues:
    odoo:
      module: pos_restaurant
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
