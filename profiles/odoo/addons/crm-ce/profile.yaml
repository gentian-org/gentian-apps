# SPDX-License-Identifier: LGPL-3.0
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: odoo-crm-ce
  labels:
    gentianos.io/profile-name: odoo-crm-ce
    gentianos.io/profile-family: odoo
    gentianos.io/profile-edition: ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/keycloak-group-attributes: '{"gentianOdooAdminRoles":["sales_team.group_sale_manager"],"gentianOdooGroupRoles":["sales_team.group_sale_salesman"],"gentianOdooModules":["crm"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  classes:
    - app
  trustTier: platform
  version: "0.5.1-dev"
  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
  package:
    extraValues:
      odoo:
        module: crm
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
    addon:
      id: crm
      of: odoo-base-ce
  expose:
    - name: odoo-crm
      surface: gateway
      authMode: oidc
      subDomain: odoo
      backend:
        component: odoo-base-ce
        service: odoo
        port: 8069
      tile:
        displayName: "Odoo CRM"
        logo: data:image/png;base64,
        image: assets/tile.png
        path: /odoo/action-crm.action_your_pipeline?gentian_embed=1
        relation: can_launch
  launch: tile
