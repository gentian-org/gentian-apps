apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-crm-ce
  labels:
    gentianos.io/profile-name: odoo-crm-ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["crm"],"gentianOdooGroupRoles":["sales_team.group_sale_salesman"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo CRM"
  description: "Customer Relationship Management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: platform
  license: LGPL-3.0
  author: OCA
  tile:
    # Odoo's own icon for the module this profile installs, set inside the
    # catalogue's 52x52 frame so it sits with the other tiles.
    image: assets/tile.svg
    logo: data:image/svg+xml;base64,

  portalTiles:
    - name: odoo-crm
      displayName:
        en_US: "Odoo CRM"
        de_DE: "Odoo CRM"
      # crm.action_your_pipeline, not the raw crm.crm_lead_action_pipeline
      # view it wraps. That view has no ir.ui.menu record pointing at it
      # (upstream reaches it only via this server action) and no path,
      # so the web client's app-resolution never finds an owner for it and
      # falls back to sessionStorage's last-visited app -- shared by every
      # Gentian Odoo tile open in the browser, since they are same-origin
      # iframes in one tab. Whichever tile the user opened right before
      # CRM would win, so CRM's own top bar showed that tile's menu
      # sections instead of CRM's.
      #
      # action_your_pipeline is what Odoo's own CRM icon actually opens: a
      # thin, read-only server action (crm.crm_team's
      # action_your_pipeline/_action_update_to_pipeline, checked against
      # the addon source -- .check_access("read") plus a context/help-text
      # computation, no writes) that resolves the user's own sales team and
      # then returns this exact pipeline view. It has both a menu (CRM /
      # Configuration, id 309) and a path ("crm"), so the web client
      # resolves CRM's app directly from the action every time, regardless
      # of what else is open. Every other Gentian Odoo tile already points
      # at an action with its own menu and path; this brings CRM in line
      # with the rest rather than teaching the web client something new.
      linkSuffix: "/odoo/action-crm.action_your_pipeline?gentian_embed=1"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.15"
  # Odoo calls its addons "modules" — this maps the Gentian profile onto that name.
  customization:
    addon:
      id: crm
      of: odoo-base-ce
  extraValues:
    odoo:
      module: crm
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
