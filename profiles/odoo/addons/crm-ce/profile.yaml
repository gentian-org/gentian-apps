apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-crm-ce
  labels:
    gentianos.io/profile-name: odoo-crm-ce
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: addon
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["crm"],"gentianOdooGroupRoles":["sales_team.group_sale_salesman"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo CRM"
  description: "Customer Relationship Management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: platform
  license: LGPL-3.0
  author: OCA
  tile:
    # Odoo's own icon for the module this profile installs, set inside the
    # catalogue's 52x52 frame so it sits with the other tiles.
    image: assets/tile.svg
    logo: data:image/svg+xml;base64,

  portalTiles:
    - name: odoo-crm
      displayName:
        en_US: "Odoo CRM"
        de_DE: "Odoo CRM"
      # gentian_app names the app this tile belongs to, by ir.ui.menu xml
      # id. gentian_os reads it (embed_mode.js) and selects that app
      # directly, instead of leaving the web client to infer one.
      #
      # It has to be told, because for this tile Odoo's data cannot say.
      # WebClient.loadRouterState looks for an ir.ui.menu owning the
      # action; nothing points at crm.crm_lead_action_pipeline and it has
      # no path, so both attempts miss and it falls back to
      # sessionStorage's last-visited app. Same-origin iframes share one
      # sessionStorage, and every Gentian Odoo tile is one, so that means
      # "whichever tile was opened most recently, in any window" -- CRM's
      # top bar showed Employees' or Invoicing's sections.
      #
      # action_your_pipeline stays because it is what Odoo's own CRM icon
      # opens -- a read-only server action (crm.crm_team, checked against
      # the addon source: check_access("read") plus a context and
      # help-text computation, no writes) that scopes the pipeline to the
      # user's own sales team. It does not fix the top bar on its own:
      # ActionService._executeServerAction runs it and recurses into what
      # it returns, which is that same menu-less action, so the wrapper's
      # menu and path are discarded before anything reads them. That was
      # tried first and did not work.
      linkSuffix: "/odoo/action-crm.action_your_pipeline?gentian_embed=1&gentian_app=crm.crm_menu_root"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.15"
  # Odoo calls its addons "modules" — this maps the Gentian profile onto that name.
  customization:
    addon:
      id: crm
      of: odoo-base-ce
  extraValues:
    odoo:
      module: crm
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
