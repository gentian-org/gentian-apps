# AppProfile — Odoo Community base runtime (odoo-base-ce)
#
# Deploys one Odoo OCB instance per tenant. Module profiles (odoo-crm, …) install
# Odoo CE modules via app-odoo Jobs in a later phase. OIDC uses app-default Client MR.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-base-ce
  labels:
    gentianos.io/profile-name: odoo-base-ce
  annotations:
    gentianos.io/deployment-role: base
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Community Backport"
  description: "Odoo Community ERP runtime — required base for Odoo module apps."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: ce
  trustTier: platform
  license: LGPL-3.0
  author: OCA
  tile:
    icon: erp
  compositionRef: app-odoo

  kernelRequirements:
    identity:
      oidc:
        clientId: odoo-cb
        name: Odoo
        accessType: CONFIDENTIAL
        redirectUris:
          - "https://erp.${TENANT_DOMAIN}/auth_oauth/signin"
    database:
      engine: postgresql
      databasePerTenant: true
      allowDynamicDatabaseCreation: false
    mail:
      smtp:
        auth: plain
        port: 587

  optionalIntegrations:
    - contract: file-store
      provider: nextcloud
      capabilities: [webdav:read, webdav:write]
    - contract: central-navigation
      provider: portal
      capabilities: [navigation:register]

  provides:
    - name: erp-core
      protocol: http-json

  portalTiles:
    - name: odoo-admin
      displayName:
        en_US: "Odoo Settings"
        de_DE: "Odoo Einstellungen"
      tile:
        icon: settings
      linkSuffix: "/web?gentian_embed=1&action=base_setup.action_general_configuration"
      linkTarget: newwindow
      allowedGroup: "App Admins"

  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.15"

  deploymentMethod: crossplane

  valueMapping:
    oidc:
      issuerKey: "oidc.issuer"
      clientIdKey: "oidc.clientId"
      clientSecretKey: "oidc.clientSecret"
    database:
      hostKey: "database.host"
      portKey: "database.port"
      nameKey: "database.name"
      userKey: "database.user"
      passwordKey: "database.password"
    smtp:
      passwordKey: "smtp.password"

  appSecrets:
    - name: admin_password
      valuePath: "odoo.adminPassword"

  security:
    egress:
      - to:
          - ipBlock:
              cidr: 192.168.0.100/32
        ports:
          - protocol: TCP
            port: 9418
      - ports:
          - protocol: TCP
            port: 443

  sidecars:
    - name: git-modules
      chart:
        repository: oci://ghcr.io/gentian-org/charts
        name: gentian-sidecar-git-modules
        version: "0.1.7"
      extraValues:
        podLabels:
          gentianos.io/app: odoo-base-ce
        persistence:
          enabled: true
          size: 1Gi
          storageClass: nfs-csi
        git:
          # Sync from GitHub rather than a git daemon on a developer workstation.
          # The daemon existed to work around two things: the namespace egress block
          # and private-repo auth. Neither applies — odoo-modules and its three
          # submodules are public, and app-egress-odoo-base-ce already permits
          # TCP/443 to anywhere, while the 9418 rule is pinned to one host's /32.
          # A tenant workload should not depend on someone's laptop being up.
          repoUrl: "https://github.com/gentian-org/odoo-modules.git"
          branch: "develop"
        # This sidecar writes the modules volume that Odoo reads, so the two have to
        # agree on a group. Odoo runs 999:999 and creates the directory root:999 with
        # the setgid bit; the sidecar chart defaults to gid 1000, which lands in
        # "other" (r-x) and fails the initial clone with "Permission denied" on
        # .git — the pod then crash-loops while Odoo itself looks perfectly healthy.
        #
        # The group belongs here rather than in the chart: the chart is generic and
        # the correct gid is a property of the app it is paired with.
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 999
          fsGroup: 999
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault

  extraValues:
    fullnameOverride: odoo
    tenantId: "${TENANT_ID}"
    extraVolumes:
      - name: custom-addons
        persistentVolumeClaim:
          claimName: "${TENANT_ID}-odoo-base-ce-git-modules-pvc"
    extraVolumeMounts:
      - name: custom-addons
        mountPath: /opt/odoo/custom-addons
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2
        memory: 4Gi
    existingSecret:
      name: odoo-base-ce-sensitive-values
    ingress:
      enabled: false
    gentian:
      initModules: "base,web,gentian_os,account"
      modulesPath: /opt/odoo/custom-addons
      git:
        enabled: false

  ingress:
    subDomain: erp
    serviceName: odoo
    servicePort: 8069
    tlsEnabled: true
    clusterIssuer: letsencrypt-http01

  # Customization ladder — see customization.md and
  # gentian-os/docs/app-customization.md
  customization:
    grade: A
    rubricScore: 8
    supportedRungs: [L0, L1, L3, L4, L5, L6]   # L2 is always available, never listed
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/odoo/odoo-base-ce/customization.md

    configure:
      valuesSchema: charts/odoo/values.schema.json
      hotReload: false

    dropIns:
      - name: odoo-conf
        path: /etc/odoo-conf-fragments
        format: ini
        source: configMap
        maxBytes: 262144
        # Odoo has no native conf.d — this is a Gentian-built mechanism (an init
        # container merges fragments into odoo.conf before start), not an upstream
        # promise about the path. See charts/odoo/templates/deployment.yaml.
        upstreamDocumented: false
        tenantEditable: false
      - name: branding
        path: /opt/odoo/custom-branding
        format: files
        source: configMap
        upstreamDocumented: false
        tenantEditable: true
        maxBytes: 262144

    extension:
      mechanism: odoo-addon
      delivery: [git-sidecar, addon-profile, image-layer]
      registry: https://github.com/gentian-org/odoo-modules
      addonPath: /opt/odoo/custom-addons
      apiStability: stable
      apiDocs: https://www.odoo.com/documentation/18.0/developer.html
      perTenantAddons: true      # one Odoo per tenant namespace — see framework §2.4
      testMatrix: ["18.0"]

    publishes:
      apis:
        - contract: erp-core
          protocol: http-json
          spec: openapi
          path: /api
          auth: oidc-token-exchange

    repackage:
      chartOwnership: gentian-owned
      compositionRef: app-odoo

    patch:
      allowed: true
      buildRepo: https://github.com/gentian-org/ocb
      seriesPath: patches/series
      requiresApproval: platform-team

    fork:
      allowed: true
      repo: https://github.com/gentian-org/ocb
      upstream: https://github.com/odoo/odoo
      owner: platform-erp
      cveWatch: true
