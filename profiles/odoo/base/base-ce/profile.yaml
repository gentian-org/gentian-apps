# ComponentProfile — Odoo Community base runtime (odoo-base-ce)
#
# Deploys one Odoo OCB instance per tenant. Module profiles (odoo-crm, …) install
# Odoo CE modules via app-odoo-base-ce Jobs in a later phase. OIDC uses app-default Client MR.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: odoo-base-ce
  labels:
    gentianos.io/profile-name: odoo-base-ce
  annotations:
    # No kernel-egress-namespaces. Odoo validates tokens against the in-cluster
    # Keycloak Service (extraValues.gentian.oidc.internalIssuer), so nothing it
    # does at sign-in leaves the cluster and it has no reason to reach the
    # gateway. It briefly carried envoy-gateway-system, copied from nextcloud,
    # which did not need it either.
    gentianos.io/deployment-role: base
    gentianos.io/portal-auth-mode: oidc
spec:
  classes:
    - app
  trustTier: platform
  version: "1.0.0"
  package:
    # The Composition that renders this chart AND the objects that have to
    # exist beside it. A chart and a composition are the one legal pair in
    # the package union: the chart is what is installed, the composition is
    # what else is created.
    composition: app-odoo-base-ce
    chart:
      repository: oci://ghcr.io/gentian-org/charts
      name: odoo
      version: "0.1.24"

    valueMapping:
      oidc:
        issuerKey: "oidc.issuer"
        clientIdKey: "oidc.clientId"
        clientSecretKey: "oidc.clientSecret"
      database:
        hostKey: "database.host"
        portKey: "database.port"
        nameKey: "database.name"
        userKey: "database.user"
        passwordKey: "database.password"
      smtp:
        passwordKey: "smtp.password"

    extraValues:
      fullnameOverride: odoo
      tenantId: "${TENANT_ID}"
    # No extraVolumes here: the chart defaults extra-addons to an emptyDir and
    # mounts it at modulesPath, which is exactly what the in-pod git-sync writes
    # to. This used to point the volume at the shared RWX PVC.
    #
    # The profile is not the only writer, though. On a staging-issuer cluster the
    # composition adds the kernel trust anchor to extraVolumes/extraVolumeMounts,
    # and chart <=0.1.18 read a non-empty list as "replace the addons volume" —
    # so the git-sync containers mounted a volume nobody defined and every Helm
    # upgrade failed, freezing Odoo on its last good spec. 0.1.19 defines
    # extra-addons unless an entry of that name replaces it, and appends the rest.
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2
          memory: 4Gi
      existingSecret:
        name: odoo-base-ce-sensitive-values
      ingress:
        enabled: false
      gentian:
        initModules: "base,web,gentian_os,account"
        modulesPath: /opt/odoo/custom-addons
      # Where this tenant's Odoo is actually served — the subDomain from
      # spec.ingress above. Odoo keeps this in ir_config_parameter and builds
      # its OAuth redirect_uri from it; left at Odoo's http://localhost:8069
      # default it hands the identity provider a redirect that matches none of
      # the redirectUris registered under kernelRequirements.identity, and every
      # login fails with oauth_error=3 — which on a website-enabled database
      # surfaces as a 500, because the login page itself cannot then render.
        baseUrl: "https://erp.${TENANT_DOMAIN}"
        oidc:
        # Where the pod validates a token. The browser still goes to the public
        # issuer; only auth_oauth's server-side userinfo call moves in-cluster,
        # so signing in no longer depends on a tenant pod being able to reach
        # the kernel gateway. ${TENANT_ID} is the realm, which matches the
        # public issuer's realm segment.
          internalIssuer: "http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080/auth/realms/${TENANT_ID}"
      # The chart's own git-sync, running in Odoo's pod: an init container that
      # clones once before Odoo starts, and a sidecar that re-syncs on the
      # interval. Both are upstream git-sync at 999:999, writing the emptyDir
      # the chart already mounts at modulesPath, and configmap.yaml appends
      # <modulesPath>/<name>/current to addons_path.
      #
      # This replaces a standalone gentian-sidecar-git-modules Deployment that
      # wrote the same content to a ReadWriteMany PVC three pods shared. The
      # content is 2.3MB of public, reproducible git -- there is nothing to
      # share. Sharing it cost an RWX StorageClass the platform does not
      # install, and on any cluster without one the PVC stayed Pending and
      # every pod mounting it was unschedulable.
      #
      # It also removes what the split cost us: the gid 999/1000 mismatch that
      # crash-looped the clone 60 times, and the Job's five-minute wait racing
      # a clone in another pod. One pod, one fsGroup, ordered by initContainer.
        git:
          enabled: true
          repo: "https://github.com/gentian-org/odoo-modules.git"
          branch: "develop"
          syncInterval: 60

  requires:
    services:
      identity:
        oidc:
          clientId: odoo-cb
          name: Odoo
          accessType: CONFIDENTIAL
          redirectUris:
            - "https://erp.${TENANT_DOMAIN}/auth_oauth/signin"
        # No backchannelLogoutUrl: Odoo signs in through auth_oauth, an OAuth2
        # module rather than an OIDC relying party, so there is nothing to send a
        # logout_token to. Its session ends on its own timeout. Recorded rather
        # than left blank, so the absence reads as a limit of the app.
      database:
        engine: postgresql
        databasePerTenant: true
        allowDynamicDatabaseCreation: false
      mail:
        smtp: {}
    privileges:
      egress:
        - name: egress-1
          rule:
            to:
              - ipBlock:
                  cidr: 192.168.0.100/32
            ports:
              - protocol: TCP
                port: 9418
          reason: 'REVIEW: say what this component reaches and why'
        - name: egress-2
          rule:
            ports:
              - protocol: TCP
                port: 443

  # No sidecars. git-modules used to be declared here as a standalone
  # Deployment with its own ReadWriteMany PVC; it is now two containers inside
  # Odoo's own pod, configured by extraValues.gentian.git above.
          reason: 'REVIEW: say what this component reaches and why'
  provides:
    - name: erp-core
      protocol: http-json


  integrations:
    - contract: file-store
      provider: nextcloud
      capabilities: [webdav:read, webdav:write]
    - contract: central-navigation
      provider: portal
      capabilities: [navigation:register]

  secrets:
    generated:
      - name: admin_password
        valuePath: "odoo.adminPassword"

  expose:
    # Odoo's SSO callback exceeds Envoy's 15s default route timeout, so the
    # sign-in that gets a user into the app is the request that gets cut:
    #
    #   504  UT  15000ms  /auth_oauth/signin?state=...
    #
    # /auth_oauth/signin is where Odoo takes the Keycloak callback, links or
    # creates the user, and loads the web client for the first time -- which
    # compiles the JS/CSS asset bundles. That is minutes of work on a small
    # node, once, and every unauthenticated path is served in well under a
    # second. A default meant for ordinary requests is simply the wrong budget
    # for it.
    #
    # nextcloud already declares the same annotations for the same reason. 600s
    # rather than its 3600s: nothing here is a multi-hour upload, and a hung
    # backend should still surface within ten minutes rather than hold the
    # connection for an hour.
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: erp
      backend:
        service: odoo
        port: 8069
      tile:
        displayName: "Odoo Settings"
        displayNames:
          de_DE: "Odoo Einstellungen"
        logo: data:image/svg+xml;base64,
        image: assets/settings-tile.svg
        path: /odoo/action-base_setup.action_general_configuration?gentian_embed=1
        relation: can_launch
  customization:
    grade: A
    rubricScore: 8
    supportedRungs: [L0, L1, L3, L4, L5, L6]   # L2 is always available, never listed
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/odoo/odoo-base-ce/customization.md

    configure:
      valuesSchema: charts/odoo/values.schema.json
      hotReload: false

    dropIns:
      - name: odoo-conf
        path: /etc/odoo-conf-fragments
        format: ini
        source: configMap
        maxBytes: 262144
        # Odoo has no native conf.d — this is a Gentian-built mechanism (an init
        # container merges fragments into odoo.conf before start), not an upstream
        # promise about the path. See charts/odoo/templates/deployment.yaml.
        upstreamDocumented: false
        tenantEditable: false
      - name: branding
        path: /opt/odoo/custom-branding
        format: files
        source: configMap
        upstreamDocumented: false
        tenantEditable: true
        maxBytes: 262144

    extension:
      mechanism: odoo-addon
      delivery: [git-sidecar, addon-profile, image-layer]
      registry: https://github.com/gentian-org/odoo-modules
      addonPath: /opt/odoo/custom-addons
      apiStability: stable
      apiDocs: https://www.odoo.com/documentation/18.0/developer.html
      perTenantAddons: true      # one Odoo per tenant namespace — see framework §2.4
      testMatrix: ["18.0"]

    publishes:
      apis:
        - contract: erp-core
          protocol: http-json
          spec: openapi
          path: /api
          auth: oidc-token-exchange

    repackage:
      chartOwnership: gentian-owned
      compositionRef: app-odoo-base-ce

    patch:
      allowed: true
      buildRepo: https://github.com/gentian-org/ocb
      seriesPath: patches/series
      requiresApproval: platform-team

    fork:
      allowed: true
      repo: https://github.com/gentian-org/ocb
      # OCA/OCB, not odoo/odoo: ocb's Dockerfile clones OCA/OCB branch 19.0 and
      # strips Enterprise references from it. OCB is itself a community fork of
      # odoo/odoo, so naming the grand-upstream here pointed CVE watch and the
      # upstream-first check at a tree this fork does not track.
      upstream: https://github.com/OCA/OCB
      owner: platform-erp
      cveWatch: true
  launch: tile
