profile: odoo-base-ce
displayName: "Odoo"
summary: "Open-source business suite runtime that the Odoo apps (sales, invoicing, inventory, HR and more) install into."
description: |
  Odoo is a modular, open-source suite of business applications built on one shared database, so sales, purchasing, stock and invoicing records link to each other. This install runs **OCB**, the Odoo Community Association's backport branch of Odoo Community (19.0), and provides the settings, users and companies that the Odoo add-on apps build on. Each business app is installed separately as an add-on.
categories: [erp-finance, operations]
