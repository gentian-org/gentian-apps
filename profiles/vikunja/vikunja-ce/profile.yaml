# SPDX-License-Identifier: AGPL-3.0-or-later
# ComponentProfile — Vikunja (tasks, lists, boards and Gantt charts)
#
# Source: charts/vikunja, a first-party chart wrapping the official
#   docker.io/vikunja/vikunja image unmodified (one Go binary serving the API
#   and the web app, FROM scratch, uid 1000, read-only root filesystem).
#   Upstream's own chart wraps a library chart under a "vikunja:" key, where
#   the platform's podLabels would never reach the pod; the chart's
#   values.yaml says more.
#
# ── Sign-in: the tenant's realm, through Vikunja's OpenID Connect ───────────
# Vikunja signs people in with its own OIDC client at the tenant's realm and
# makes an account at a person's first sign-in. Its password sign-in and its
# registration are switched off in the chart, so the realm is the only way
# in, and with one provider and no password form the sign-in page goes
# straight to it.
#
# Vikunja's web app then calls the API with a token of Vikunja's own, in the
# Authorization header. The front door removes that header on every app route
# unless the entry says the header is the app's: hence
# clientAuthorization: app below. It is a request. Until the tenant's
# perimeter approver has approved it, the header is removed and every call of
# the web app is refused with 401: the page loads and shows nothing. Approved,
# a person still has to hold the tenant's session and the right to open this
# app (can_launch) to reach Vikunja at all.
#
# ── Who administers Vikunja ─────────────────────────────────────────────────
# Nobody, inside Vikunja. Its instance administrator role
# (`vikunja user set-admin`) is a Vikunja Pro feature and needs a license key,
# which this edition does not configure. So there is no
# hooks.provisioning: the platform's App Admin role has nothing to apply to.
# Everything a person does is on their own projects and the ones shared with
# them; a team's owner manages the team. What the platform administers is
# who may open the app at all.
#
# ── What is switched off ────────────────────────────────────────────────────
# Account deletion by the person (accounts are the realm's), CalDAV (its
# clients authenticate with basic auth, which no program gets through a front
# door that asks for a browser session), webhooks (outbound by design, and
# egress is closed), Sentry, Unsplash backgrounds and the Todoist, Trello and
# Microsoft To Do importers (each calls out). Avatars are initials, never
# Gravatar. The license check calls out only when a license key is set,
# and none is.
#
# Secret inventory:
#   Platform-provided:
#     database host/port/name/user/password (valueMapping.database)
#     s3 endpoint/bucket/region/access key/secret key (valueMapping.s3)
#     OIDC issuer and client secret (valueMapping.oidc)
#     smtp host/port/user/password (valueMapping.smtp)
#   Generated (1), secrets.generated:
#     service_secret → secret: the key Vikunja signs its tokens with; pinned,
#                      or every session dies at each restart
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: vikunja-ce
  labels:
    gentianos.io/profile-name: vikunja-ce
    gentianos.io/profile-family: vikunja
    gentianos.io/profile-edition: ce
spec:
  classes:
    - app
  trustTier: certified
  version: "0.1.1"
  package:
    chart:
      repository: "oci://ghcr.io/gentian-org/charts"
      name: vikunja
      # On develop a -develop.<sha7> build of the chart (docs/releasing.md).
      version: "0.1.0"

    valueMapping:
      oidc:
        # The realm's issuer; Vikunja discovers the endpoints from it,
        # server-side, and checks the tokens against it.
        issuerKey: "oidc.issuer"
        clientSecretKey: "oidc.clientSecret"
      database:
        hostKey: "database.host"
        portKey: "database.port"
        nameKey: "database.name"
        userKey: "database.user"
        passwordKey: "database.password"
      s3:
        endpointKey: "s3.endpoint"
        bucketKey: "s3.bucket"
        accessKeyKey: "s3.accessKeyId"
        regionKey: "s3.region"
        secretKeyKey: "s3.secretAccessKey"
      smtp:
        hostKey: "smtp.host"
        portKey: "smtp.port"
        userKey: "smtp.user"
        passwordKey: "smtp.password"
      platform:
        # The server's time zone; each person can set their own.
        timeZoneKey: "timeZone"

    extraValues:
      fullnameOverride: "vikunja-ce"
      appUrl: "https://vikunja.${TENANT_DOMAIN}"

      oidc:
        enabled: true
        providerId: "gentian"
        name: "Gentian"
        clientId: "gentian-vikunja"

      s3:
        forcePathStyle: true

      smtp:
        fromAddress: "gentian-system@${TENANT_DOMAIN}"

      ingress:
        enabled: false

      podAnnotations:
        secret.reloader.stakater.com/reload: vikunja-ce-sensitive-values

  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
    services:
      identity:
        oidc:
          clientId: "gentian-vikunja"
          name: "Vikunja"
          accessType: CONFIDENTIAL
          # The web app's return address: /auth/openid/<provider id>, the
          # provider id being extraValues.oidc.providerId.
          redirectUris:
            - "https://vikunja.${TENANT_DOMAIN}/auth/openid/gentian"
          postLogoutRedirectUris:
            - "https://vikunja.${TENANT_DOMAIN}/"
            - "https://desktop.${TENANT_DOMAIN}/"
        # No backchannelLogout: Vikunja has no endpoint that receives a
        # logout_token (its OIDC module knows a logout redirect, nothing
        # more). Signing out of the platform therefore leaves the web app's
        # own token valid until it runs out (service.jwtttl, three days);
        # the front door still refuses a person without a session.
      database:
        engine: postgresql
      # Attachments, project backgrounds and uploaded avatars. The pod keeps
      # no data of its own.
      storage:
        s3: {}
      # Task reminders and the daily mail of overdue tasks.
      mail:
        smtp: {}
    # No cache: Vikunja's key-value store is in memory, in its one pod.

  provides:
    - name: task-management
      protocol: http-html

  integrations:
    - contract: central-navigation
      provider: portal
      capabilities:
        - navigation:register

  secrets:
    generated:
      - name: service_secret
        valuePath: "secret"

  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: "vikunja"
      # The web app sends Vikunja's own token in this header; see the header
      # comment for what that asks of the tenant's perimeter approver.
      clientAuthorization: app
      backend:
        service: "vikunja-ce"
        port: 3456
      tile:
        displayName: "Vikunja"
        description: "Tasks, lists and boards"
        image: assets/tile.png
        logo: data:image/png;base64,
        relation: can_launch

  # The default -- scale to zero, dump the database, copy the bucket -- is
  # right: Vikunja keeps nothing else. Only the check after a restore is
  # declared: Vikunja's own diagnosis, which reaches the database, writes to
  # the bucket and asks the realm, and exits non-zero when any of it fails.
  backup:
    quiesce:
      container: vikunja
    restore:
      verify:
        - /app/vikunja/vikunja
        - doctor

  # Customization ladder — see customization.md
  customization:
    grade: C
    rubricScore: 4
    supportedRungs: [L0, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/vikunja/vikunja-ce/customization.md
    configure:
      hotReload: false
    publishes:
      apis:
        - contract: tasks-api
          protocol: http-json
          path: /api/v1/
          # A token of a Vikunja account (the web app's, or an API token a
          # person makes in Vikunja's settings); not the realm's tokens.
          auth: vikunja-token
    repackage:
      chartOwnership: gentian-owned
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
  launch: tile
