# OIDC pack for OpenProject (clientId: opendesk-openproject).
apiVersion: gentianos.io/v1alpha1
kind: OIDCPackCatalog
metadata:
  name: openproject-oidc
  labels:
    gentianos.io/oidc-catalog: openproject
    gentianos.io/profile-name: od-openproject
spec:
  mapperTemplates:
    opendesk_useruuid:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: entryUUID
        claim.name: opendesk_useruuid
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    opendesk_username:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: uid
        claim.name: opendesk_username
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    email:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: email
        claim.name: email
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    given_name:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: firstName
        claim.name: given_name
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    family_name:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: lastName
        claim.name: family_name
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    openproject_admin:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: opendeskProjectmanagementAdmin
        claim.name: openproject_admin
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
  packs:
    opendesk-openproject:
      scopeName: opendesk-openproject-scope
      scopeDescription: "Scope for OpenProject OIDC clients."
      clientRole: opendesk-openproject-access-control
      entitlementGroup: managed-by-attribute-Projectmanagement
      publicClient: false
      fullScopeAllowed: false
      defaultScopes:
        - profile
        - email
        - roles
        - web-origins
        - acr
      mappers:
        - opendesk_useruuid
        - opendesk_username
        - openproject_admin
        - email
        - given_name
        - family_name
