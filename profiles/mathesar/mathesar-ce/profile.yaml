# ComponentProfile — Mathesar (self-hosted, spreadsheet-like Postgres data explorer)
#
# Source: no upstream Helm chart exists for Mathesar (docker-compose only), so
#   this profile is backed by a first-party Gentian chart: charts/mathesar/
#   (same pattern as charts/odoo — see docs/app-profile-guide.md §0
#   Consequence 3). The chart wraps the official image unmodified.
#
# Docker image: docker.io/mathesar/mathesar:0.12.0 — upstream's "production"
#   Dockerfile target (the only one they publish). The chart pins it to the
#   kernel-provisioned Postgres and drops the entrypoint's inbuilt-db fallback
#   flag, so it never silently starts the Postgres bundled in that image.
#   No Caddy: Gentian's gateway/Gateway API replaces its reverse-proxy role,
#   and whitenoise inside the app serves the static assets Caddy would have.
#
# Secret inventory:
#   Kernel-provided:
#     oidc_client_secret → oidc.clientSecret (embedded inline in the
#                          SSO_CONFIG_DICT JSON env var — Mathesar has no
#                          separate secret-file option, see chart deployment.yaml)
#     pg_*               → existingSecret keys db-host/db-port/db-name/db-user/
#                          db-password (mathesar-ce-sensitive-values)
#   App-internal (2) → appSecrets:
#     secret_key              → Django SECRET_KEY (existingSecret key
#                                internal-secret_key). Must be pinned
#                                explicitly: pods are ephemeral, and Mathesar
#                                auto-generates (and forgets) a SECRET_KEY
#                                when none is set, invalidating all sessions
#                                on every restart.
#     bootstrap_admin_password → password for the technical Mathesar
#                                superuser "gentian-bootstrap-admin"
#                                (existingSecret key
#                                internal-bootstrap_admin_password). Consumed
#                                by spec.postInstallJob (creates the account)
#                                and by spec.provisioning.syncJob below, which
#                                authenticates as it to call Mathesar's users.*
#                                RPC. Never surfaced to any human; nobody is
#                                meant to log in as it.
#
# Bootstrap: fully automated, no manual wizard. Upstream Mathesar's own
#   first-run wizard is gated purely on "does any is_superuser=True user
#   exist" (mathesar/views/installation/decorators.py) and OIDC never grants
#   is_superuser on its own (mathesar/sso.py always creates plain SSO logins
#   as regular users) — so spec.postInstallJob below creates exactly one
#   technical superuser ("gentian-bootstrap-admin") via `manage.py shell`,
#   idempotently (no-op once any superuser exists). Real human admins never
#   use that account directly: spec.provisioning.syncJob uses it to call
#   Mathesar's users.add/users.patch_other RPC (HTTP Basic Auth — the only auth
#   mode those methods accept, see mathesar/rpc/decorators.py upstream) and
#   keeps every gentian:tenant:<t>:app-admins member's is_superuser flag in sync,
#   pre-provisioning the account by email when needed so their eventual first
#   SSO login links to it instead of creating a fresh non-admin one (see
#   mathesar/sso.py's save_user). Password login stays enabled
#   (REQUIRE_SSO_LOGIN=false) only because Mathesar requires it to exist as a
#   toggle — app-admins members are expected to use SSO like everyone else.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: mathesar-ce
  labels:
    gentianos.io/profile-name: mathesar-ce
spec:
  classes:
    - app
  trustTier: certified
  version: "1.0.0"
  package:
    chart:
      repository: "oci://ghcr.io/gentian-org/charts"
      name: mathesar
      version: "0.1.3"

    valueMapping:
      oidc:
        # The issuer the platform seeded for this tenant's realm, the same
        # string the client is registered under. Taken from there rather than
        # spelled here from ${KERNEL_DOMAIN} and ${TENANT_ID}: a tenant's realm
        # is not always called what the tenant is, and an issuer that differs
        # from the seeded one fails token validation on the claim.
        issuerKey: "oidc.serverUrl"
        clientSecretKey: "oidc.clientSecret"
      database:
        hostKey: "database.host"
        portKey: "database.port"
        nameKey: "database.name"
        userKey: "database.user"
        passwordKey: "database.password"

    extraValues:
      fullnameOverride: "mathesar-ce"

      allowedHosts: ".${TENANT_DOMAIN}"
      instanceName: "Mathesar"

      oidc:
        enabled: true
        providerKey: keycloak
        clientId: "gentian-mathesar"
      # No serverUrl here: it arrives through valueMapping.oidc.issuerKey as
      # https://id.<kernel>/auth/realms/<realm>. allauth runs its discovery
      # server-side against that same public issuer (it has one server_url), so
      # the request leaves the pod for the edge gateway. The path there, and
      # the trust anchor a cluster without a public certificate needs for it,
      # both follow from requires.services.identity below; nothing in this
      # profile names a namespace.

      ingress:
        enabled: false

      persistence:
        enabled: true
        size: "5Gi"

      podAnnotations:
        secret.reloader.stakater.com/reload: mathesar-ce-sensitive-values

  # Customization ladder — see customization.md
  requires:
    services:
      identity:
        oidc:
          clientId: "gentian-mathesar"
          name: "Mathesar"
          accessType: CONFIDENTIAL
        # Provider key "keycloak" must match extraValues.oidc.providerKey below —
        # Mathesar builds this path from the SSO_CONFIG_DICT provider key.
          redirectUris:
            - "https://data.${TENANT_DOMAIN}/auth/oidc/keycloak/login/callback/"
          postLogoutRedirectUris:
            - "https://data.${TENANT_DOMAIN}/"
        # No backchannelLogout: this app signs in through django-allauth,
        # whose OpenID Connect provider implements no endpoint for receiving a
        # logout_token. Signing out of the portal therefore leaves this app's own
        # session running until it expires on its own. Recorded rather than left
        # blank, so the absence reads as a limit of the app and not as an
        # oversight to be filled in.
      database:
        engine: postgresql
        databasePerTenant: true
      # Mathesar exists to explore Postgres data, and its "create a database"
      # flow issues CREATE DATABASE on this same server as the app role — so
      # without this the app installs successfully and is then unusable, with
      # "No Databases Connected" and a button that fails. The provisioned
      # database below is Mathesar's own internal store (Django tables); user
      # data belongs in databases the tenant creates.
      #
      # Safe to purge: everything the role creates is owned by it, and
      # `gtnctl apps uninstall --purge` drops every database that role owns.
        allowDynamicDatabaseCreation: true

  provides:
    - name: data-explorer
      protocol: http-html

  integrations:
    - contract: central-navigation
      provider: portal
      capabilities:
        - navigation:register

  secrets:
    generated:
      - name: secret_key
        valuePath: "secretKey"
      - name: bootstrap_admin_password
        valuePath: "bootstrapAdminPassword" # not consumed by the chart itself —
        # only via existingSecret key internal-bootstrap_admin_password, by
        # spec.postInstallJob and spec.provisioning.syncJob.

  # Maps gentian:tenant:<t>:app-admins members to Mathesar is_superuser —
  # never the portalTiles allowedGroup above, which only gates the tile/OIDC
  # entitlement.
  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: "data"
      backend:
        service: "mathesar-ce"
        port: 8000
      tile:
        displayName: "Mathesar"
        logo: data:image/svg+xml;base64,
        image: assets/tile.svg
        path: /auth/oidc/keycloak/login/
        relation: can_launch
  hooks:
    postInstall:
      image: docker.io/mathesar/mathesar:0.12.0
      script: |
        #!/bin/sh
        set -eu
        export DJANGO_SETTINGS_MODULE=config.settings.production
        export POSTGRES_HOST="$DB_HOST"
        export POSTGRES_PORT="$DB_PORT"
        export POSTGRES_DB="$DB_NAME"
        export POSTGRES_USER="$DB_USER"
        export POSTGRES_PASSWORD="$DB_PASSWORD"

        # Idempotent: mirrors installation_incomplete's own gate
        # (mathesar/views/installation/decorators.py) — a no-op once any
        # superuser exists, so re-running this Job on every tenant reconcile is
        # safe. The password never touches the Python source (os.environ, not
        # string interpolation) so it can't break out of the quoted literal.
        python3 manage.py shell -c "
        import os
        from django.contrib.auth import get_user_model
        User = get_user_model()
        if not User.objects.filter(is_superuser=True).exists():
            User.objects.create_superuser(
                username='gentian-bootstrap-admin',
                email='gentian-bootstrap-admin@internal.invalid',
                password=os.environ['BOOTSTRAP_ADMIN_PASSWORD'],
            )
            print('created bootstrap superuser')
        else:
            print('a superuser already exists; nothing to do')
        "

    provisioning:
      privilegedRole:
        kind: group
      # Mathesar's privilege model is the boolean is_superuser, not a named
      # group, so this is descriptive only — the script below is what decides
      # what it means.
        name: superuser

    # How this app applies that role. The platform resolves app-admins
    # membership, publishes it as JSON and runs this Job; everything below is
    # Mathesar's own protocol and stays in Mathesar's catalogue entry, because
    # the kernel must not know any application's admin API (app-profile-guide.md,
    # "Platform boundary").
    #
    # Runs on the app's own image, which already has Python and requests.
    # Idempotent by construction: it converges Mathesar to exactly the
    # membership it is handed rather than applying a delta, so re-running it is
    # always safe.
      syncJob:
        image: docker.io/mathesar/mathesar:0.12.0
      # Bound key by key, not envFrom: the Secret's keys are hyphenated and
      # Kubernetes drops those from envFrom without a word, so the variable
      # would simply never appear.
        env:
          - name: BOOTSTRAP_ADMIN_PASSWORD
            secretKeyRef:
              name: mathesar-ce-sensitive-values
              key: internal-bootstrap_admin_password
        script: |
          #!/bin/sh
          set -eu
          exec python3 - <<'PY'
          import json, os, sys, urllib.request, base64

          # HTTP Basic Auth as the technical bootstrap superuser: the only auth
          # mode users.* accepts (mathesar/rpc/decorators.py upstream). That
          # account is created by spec.postInstallJob and is never a human.
          USER = "gentian-bootstrap-admin"
          PASSWORD = os.environ["BOOTSTRAP_ADMIN_PASSWORD"]
          APP = os.environ["GENTIAN_APP"]
          URL = "http://%s:8000/api/rpc/v0/" % APP

          def rpc(method, params=None):
              body = json.dumps({
                  "jsonrpc": "2.0", "method": method,
                  "params": params or {}, "id": 1,
              }).encode()
              token = base64.b64encode(("%s:%s" % (USER, PASSWORD)).encode()).decode()
              req = urllib.request.Request(URL, data=body, headers={
                  "Content-Type": "application/json",
                  "Authorization": "Basic " + token,
                  # ALLOWED_HOSTS covers the Service name; without a matching Host
                  # Django answers 400 DisallowedHost.
                  "Host": APP,
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.load(resp)
              if payload.get("error"):
                  raise SystemExit("mathesar rpc %s failed: %s" % (method, payload["error"]))
              return payload.get("result")

          with open(os.environ["GENTIAN_APP_ADMINS_FILE"]) as fh:
              members = json.load(fh)
          want = {m["email"].lower(): m for m in members if m.get("email")}

          existing = {u["email"].lower(): u for u in rpc("users.list") if u.get("email")}

          for email, member in want.items():
              user = existing.get(email)
              if user is None:
                  # Pre-provision so the member's first SSO login links to this
                  # account instead of creating a fresh non-admin one
                  # (mathesar/sso.py save_user). The password is throwaway: the
                  # account is claimed via SSO, never by password login.
                  rpc("users.add", {"user_def": {
                      "username": member.get("username") or email,
                      "password": base64.urlsafe_b64encode(os.urandom(24)).decode(),
                      "is_superuser": True,
                      "email": email,
                  }})
                  print("provisioned %s" % email)
              elif not user.get("is_superuser"):
                  rpc("users.patch_other", {
                      "user_id": user["id"], "username": user["username"],
                      "is_superuser": True, "email": user.get("email", ""),
                      "full_name": user.get("full_name", ""),
                      "display_language": user.get("display_language", "en"),
                  })
                  print("promoted %s" % email)

          # Demote anyone who lost membership. The bootstrap account is matched by
          # username, not membership — it is what authenticates this very call and
          # must never lock itself out.
          for email, user in existing.items():
              if user["username"] == USER or not user.get("is_superuser") or email in want:
                  continue
              rpc("users.patch_other", {
                  "user_id": user["id"], "username": user["username"],
                  "is_superuser": False, "email": user.get("email", ""),
                  "full_name": user.get("full_name", ""),
                  "display_language": user.get("display_language", "en"),
              })
              print("demoted %s" % email)

          print("app administrators synchronised: %d" % len(want))
          PY

  customization:
    grade: C
    rubricScore: 3
    supportedRungs: [L0, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/mathesar/mathesar-ce/customization.md
    configure:
      hotReload: false
    publishes:
      apis:
        - contract: data-explorer
          protocol: jsonrpc
          path: /api/rpc/v0/
          # HTTP Basic Auth against an existing Mathesar account — the only
          # auth mode users.* methods accept (mathesar/rpc/decorators.py
          # upstream). Not OIDC/bearer; a companion needs real Mathesar
          # credentials, e.g. the bootstrap superuser this profile already
          # maintains (see spec.provisioning.privilegedRole).
          auth: http-basic-superuser
    repackage:
      chartOwnership: gentian-owned
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
  launch: tile
