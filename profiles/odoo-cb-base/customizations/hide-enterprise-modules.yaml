# Customization record — see gentian-os/docs/app-customization.md §5
#
# Written before the code: this record is the design review. It states which rung
# was chosen, why every cheaper rung was rejected, whether upstream was offered the
# change, and when the deviation must be reconsidered.
apiVersion: gentianos.io/v1alpha1
kind: Customization
metadata:
  name: hide-enterprise-modules
  namespace: gentian-catalogue
spec:
  summary: "Hide Odoo Enterprise-only modules from the apps list"

  target:
    family: odoo
    profile: odoo-cb-base
    appVersion: "18.0"
    chartVersion: "0.1.14"

  rung: L3
  scope: profile

  rungJustification:
    L0: "no configuration flag suppresses the Enterprise upsell entries"
    L1: "the module list is generated from installed manifests, not from a config file"
    L2: "the change must alter what the Odoo apps list itself renders; a companion app cannot reach it"

  upstreamFirst:
    attempted: true
    forwarded: not-needed
    reason: >-
      Upstream ships the Enterprise upsell deliberately. This is a distribution
      choice for a Community-only catalogue, not a defect upstream would accept.

  artifacts:
    - repo: gentian-org/odoo-modules
      path: hide_enterprise_modules
      version: "1.0.0"
  delivery: git-sidecar

  origin:
    authorship: gentian
    repoOwnership: gentian
    reviewedBy: platform-erp
    supportContract: none

  owner: platform-erp
  created: 2026-08-06
  reviewBy: 2027-08-06
  exitCriteria: >-
    Drop if Odoo adds a supported flag to suppress Enterprise-only entries, or if
    the catalogue starts offering an Enterprise edition.
  upgradeRisk: low
  testedAgainst: ["18.0"]

  security:
    macWaivers: []
    newEgress: []
    handlesPersonalData: false

  licensing:
    effect: none
    notes: >-
      Presentation-only. Does not unlock, bypass or circumvent any licensed
      capability — it only removes advertising for modules the deployment cannot use.
