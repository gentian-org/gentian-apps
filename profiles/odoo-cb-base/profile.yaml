# AppProfile — Odoo Community base runtime (odoo-cb-base)
#
# Deploys one Odoo OCB instance per tenant. Module profiles (odoo-crm, …) install
# Odoo CE modules via app-odoo Jobs in a later phase. OIDC uses app-default Client MR.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-cb-base
  labels:
    gentianos.io/profile-name: odoo-cb-base
  annotations:
    gentianos.io/platform-app: "true"
    gentianos.io/deployment-role: base
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Community Backport"
  description: "Odoo Community ERP runtime — required base for Odoo module apps."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: full
  trustTier: platform
  license: LGPL-3.0
  tile:
    icon: erp
  compositionRef: app-odoo

  kernelRequirements:
    identity:
      oidc:
        clientId: odoo-cb
        name: Odoo
        accessType: CONFIDENTIAL
        redirectUris:
          - "https://erp.${TENANT_DOMAIN}/auth_oauth/signin"
    database:
      engine: postgresql
      databasePerTenant: true
    mail:
      smtp:
        auth: plain
        port: 587

  optionalIntegrations:
    - contract: file-store
      provider: nextcloud
      capabilities: [webdav:read, webdav:write]
    - contract: central-navigation
      provider: portal
      capabilities: [navigation:register]

  provides:
    - name: erp-core
      protocol: http-json

  portalTiles:
    - name: odoo-admin
      displayName:
        en_US: "Odoo Settings"
        de_DE: "Odoo Einstellungen"
      tile:
        icon: settings
      linkSuffix: "/web?gentian_embed=1&action=base_setup.action_general_configuration"
      linkTarget: newwindow
      allowedGroup: "Tenant Admins"

  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.13"

  deploymentMethod: crossplane

  valueMapping:
    oidc:
      issuerKey: "oidc.issuer"
      clientIdKey: "oidc.clientId"
      clientSecretKey: "oidc.clientSecret"
    database:
      hostKey: "database.host"
      portKey: "database.port"
      nameKey: "database.name"
      userKey: "database.user"
      passwordKey: "database.password"
    smtp:
      passwordKey: "smtp.password"

  appSecrets:
    - name: admin_password
      valuePath: "odoo.adminPassword"

  security:
    egress:
      - to:
          - ipBlock:
              cidr: 192.168.0.100/32
        ports:
          - protocol: TCP
            port: 9418
      - ports:
          - protocol: TCP
            port: 443

  sidecars:
    - name: git-modules
      chart:
        repository: oci://ghcr.io/gentian-org/charts
        name: gentian-sidecar-git-modules
        version: "0.1.6"
      extraValues:
        podLabels:
          gentianos.io/app: odoo-cb-base
        persistence:
          enabled: true
          size: 1Gi
          storageClass: nfs-csi
        git:
          repoUrl: "git://192.168.0.100:9418/odoo-modules"
          branch: "develop"

  extraValues:
    fullnameOverride: odoo
    tenantId: "${TENANT_ID}"
    extraVolumes:
      - name: custom-addons
        persistentVolumeClaim:
          claimName: "${TENANT_ID}-odoo-cb-base-git-modules-pvc"
    extraVolumeMounts:
      - name: custom-addons
        mountPath: /opt/odoo/custom-addons
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2
        memory: 4Gi
    existingSecret:
      name: odoo-cb-base-sensitive-values
    ingress:
      enabled: false
    gentian:
      initModules: "base,web,gentian_os,account"
      modulesPath: /opt/odoo/custom-addons
      git:
        enabled: false

  ingress:
    subDomain: erp
    serviceName: odoo
    servicePort: 8069
    tlsEnabled: true
