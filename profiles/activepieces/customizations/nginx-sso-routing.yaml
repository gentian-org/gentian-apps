# Customization record — see gentian-os/docs/app-customization.md §5
#
# Covers the Gentian runtime shipped in charts/activepieces/files/: the nginx
# config that fronts the app, the entrypoint that starts it, and the two startup
# patches that entrypoint applies.
apiVersion: gentianos.io/v1alpha1
kind: Customization
metadata:
  name: nginx-sso-routing
  namespace: gentian-system
spec:
  summary: "Front Activepieces with a Gentian nginx config that routes SAML to the sso-saml sidecar"

  target:
    family: activepieces
    profile: activepieces
    appVersion: "0.28.0"
    chartVersion: "0.4.0"

  rung: L4
  scope: profile

  rungJustification:
    L0: >-
      The image's own nginx config cannot be reconfigured by value; the app serves
      it from a path it owns and rebuilds on every release.
    L1: >-
      Upstream exposes no conf.d drop-in directory, and the change overrides existing
      location blocks rather than adding new ones — L1 requires an upstream-promised path.
    L2: >-
      The SAML gateway itself is a companion (gentian-sidecar-sso-saml) and is recorded
      separately. What is left here is edge routing inside the app's own pod, which a
      side-by-side deployable cannot express.
    L3: >-
      Activepieces pieces extend flows, not HTTP routing or process startup. There is
      no in-app extension point for either.

  upstreamFirst:
    attempted: true
    forwarded: "no"
    reason: >-
      Split by change. The SAML route interception and the session-restore shim are
      Gentian-specific integration glue for our IdP topology; upstream would rightly
      refuse them (equivalent to forwarded: not-needed). The three generic chart
      defects carried in the vendored copy — no command/args passthrough, the redis
      username read via secretKeyRef instead of a plain value, and two nindent bugs
      on volumes/volumeMounts — are genuine upstream bugs and are NOT yet filed
      against adnoctem/helm. Filing them is this record's main exit path: if they
      land, the 152-file vendored copy collapses to a wrapper chart with upstream as
      a dependency (§2.5 option (c) rather than (d)).

  artifacts:
    - repo: gentian-org/gentian-apps
      path: charts/activepieces/files/nginx.conf
      version: "0.4.0"
    - repo: gentian-org/gentian-apps
      path: charts/activepieces/files/entrypoint.sh
      version: "0.4.0"
  delivery: chart

  origin:
    authorship: gentian
    repoOwnership: gentian
    reviewedBy: platform-team
    supportContract: none

  owner: platform-team
  created: 2026-08-06
  reviewBy: 2027-02-06
  exitCriteria: >-
    Two independent exits. (1) The entrypoint's two startup patches are the L5
    residue and should go first: injectSessionScript is replaceable by an nginx
    sub_filter injecting the same script into <head> once ngx_http_sub_module is
    confirmed in the image, and disableUpgradeBanner is replaceable by denying
    egress to raw.githubusercontent.com, since the fetch it patches is already
    wrapped in a try/catch returning "0.0.0". Both are values today
    (gentian.startup.*) so each can be switched off independently and verified.
    (2) The vendored chart drops to a wrapper chart if the generic fixes above are
    accepted upstream.
  upgradeRisk: medium
  testedAgainst: ["0.28.0"]

  security:
    macWaivers:
      - gentian-restrict-capabilities
      - gentian-require-non-root
    newEgress: []
    handlesPersonalData: false

  licensing:
    effect: none
    notes: >-
      Activepieces runs Community Edition here — no AP_EDITION, no AP_LICENSE_KEY.
      SAML is terminated by the sso-saml sidecar, which authenticates against
      Keycloak and then creates an ordinary CE user row and signs a session JWT
      with the instance's own secret; the app's licensed SSO code path is never
      invoked, and nginx routes /api/v1/authn/saml/{login,acs} to the sidecar
      rather than to the backend. The startup license patch and the placeholder
      AP_LICENSE_KEY were removed in c5b0d4f, which also added the absolute
      prohibition to docs/app-profile-guide.md. The postInstallJob seeds the
      platform row with every enterprise gate off.
