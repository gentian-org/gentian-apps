apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: activepieces
  labels:
    gentianos.io/profile-name: activepieces
spec:
  displayName: Automation
  description: Open-source workflow automation with 200+ integrations, webhook triggers,
    and visual flow builder.
  family: activepieces
  catalogueVersion: 1.0.0
  edition: full
  trustTier: certified
  license: MIT
  tile:
    icon: analytics
  deploymentMethod: crossplane
  kernelRequirements:
    identity:
      saml:
        entityId: Activepieces
        acsUrl: https://auto.${TENANT_DOMAIN}/api/v1/authn/saml/acs
    database:
      engine: postgresql
      databasePerTenant: true
    cache:
      engine: redis
  portalTiles:
  - name: activepieces
    displayName:
      de_DE: Automatisierung
      en_US: Automation
    linkTarget: embedded
    allowedGroup: App Users
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: activepieces
    version: 0.3.21
  valueMapping:
    database:
      hostKey: activepieces.postgresql.host
      portKey: activepieces.postgresql.port
      nameKey: activepieces.postgresql.database
      userKey: activepieces.postgresql.username
      passwordKey: activepieces.postgresql.password
    cache:
      hostKey: activepieces.redis.host
      portKey: activepieces.redis.port
      passwordKey: activepieces.redis.password
  appSecrets:
  - name: encryption_key
    valuePath: activepieces.encryption.connection
  - name: jwt_secret
    valuePath: activepieces.encryption.jwt
  ingress:
    subDomain: auto
    serviceName: activepieces
    servicePort: 8080
    tlsEnabled: true
  security:
    egress:
    - ports:
      - port: 443
        protocol: TCP
  extraValues:
    fullnameOverride: activepieces
    extraEnvVars:
    - name: AP_TELEMETRY_ENABLED
      value: 'false'
    - name: AP_TEMPLATES_SOURCE_URL
      value: http://localhost:3000/v1/flow-templates
    ingress:
      enabled: false
      tls:
      - hosts:
        - auto.${TENANT_DOMAIN}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 512Mi
    podLabels:
      mac-waiver.gentianos.io/gentian-restrict-capabilities: approved
      mac-waiver.gentianos.io/gentian-require-non-root: approved
    extraVolumes:
    - name: nginx-log
      emptyDir: {}
    - name: nginx-lib
      emptyDir: {}
    - name: nginx-run
      emptyDir: {}
    - name: nginx-config
      configMap:
        name: activepieces-nginx-config
    extraVolumeMounts:
    - mountPath: /var/log/nginx
      name: nginx-log
    - mountPath: /var/lib/nginx
      name: nginx-lib
    - mountPath: /run
      name: nginx-run
    - name: nginx-config
      mountPath: /etc/nginx/nginx.conf
      subPath: nginx.conf
    postgresql:
      enabled: false
    redis:
      enabled: false
    activepieces:
      domain: auto.${TENANT_DOMAIN}
      database: postgres
      queue:
        mode: redis
      redis:
        username: ${TENANT_ID}-activepieces
      sandbox:
        executionMode: SANDBOXED
      telemetry: false
      templateSourceURL: ''
      data:
        pvc:
          storageClass: nfs-csi
    podSecurityContext:
      fsGroup: 1000
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
        add:
        - NET_BIND_SERVICE
        - CHOWN
        - SETUID
        - SETGID
        - DAC_OVERRIDE
      seccompProfile:
        type: RuntimeDefault
  postInstallJob:
    image: ghcr.io/cloudnative-pg/postgresql:17.2
    envFrom:
    - activepieces-postgresql-credentials
    script: |
      set -eu

      # Resolve environment variables using python
      python3 -c '
      import urllib.request, re, os
      with open("/var/run/secrets/kubernetes.io/serviceaccount/namespace", "r") as f:
          ns = f.read().strip()
      tenant_id = ns.replace("tenant-", "")
      url = f"http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080/auth/realms/{tenant_id}/protocol/saml/descriptor"
      xml = urllib.request.urlopen(url).read().decode("utf-8")
      match = re.search(r"https://id\.([^/\"]+)", xml)
      kernel_domain = match.group(1) if match else "gentian.org"
      tenant_domain = f"{tenant_id}.{kernel_domain}"

      with open("/tmp/env.sh", "w") as f:
          f.write(f"export TENANT_ID={tenant_id}\n")
          f.write(f"export KERNEL_DOMAIN={kernel_domain}\n")
          f.write(f"export TENANT_DOMAIN={tenant_domain}\n")
      '
      . /tmp/env.sh

      echo "Waiting for database..."
      until pg_isready -h postgres-rw.platform-kernel.svc.cluster.local -p 5432; do
        sleep 2
      done

      # Check if required tables exist
      TABLES_COUNT=$(PGPASSWORD="$password" psql -h postgres-rw.platform-kernel.svc.cluster.local -p 5432 -U "$username" -d "${TENANT_ID}_activepieces" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('platform', 'project', 'user');")
      if [ "$TABLES_COUNT" -ne 3 ]; then
        echo "Activepieces migrations are not complete yet (found $TABLES_COUNT/3 required tables)."
        exit 1
      fi

      PLATFORM_COUNT=$(PGPASSWORD="$password" psql -h postgres-rw.platform-kernel.svc.cluster.local -p 5432 -U "$username" -d "${TENANT_ID}_activepieces" -tAc "SELECT count(*) FROM platform;")
      if [ "$PLATFORM_COUNT" -eq 0 ]; then
        echo "Seeding Activepieces database..."

        # Download Keycloak metadata XML
        python3 -c '
      import urllib.request, os
      with open("/var/run/secrets/kubernetes.io/serviceaccount/namespace", "r") as f:
          ns = f.read().strip()
      tenant_id = ns.replace("tenant-", "")
      url = f"http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080/auth/realms/{tenant_id}/protocol/saml/descriptor"
      xml = urllib.request.urlopen(url).read().decode("utf-8")
      print(xml)
      ' > /tmp/idp-metadata.xml

        XML_CONTENT=$(cat /tmp/idp-metadata.xml | sed 's/WantAuthnRequestsSigned="true"/WantAuthnRequestsSigned="false"/g')
        CERT_VAL=$(echo "$XML_CONTENT" | sed -n 's/.*<ds:X509Certificate>\(.*\)<\/ds:X509Certificate>.*/\1/p')

        printf "%s\n" \
          'INSERT INTO "user" (id, created, updated, email, "firstName", "lastName", password, status, verified, "platformRole")' \
          "VALUES ('usrActivepiecesAdmin1', now(), now(), 'admin-${TENANT_ID}@${KERNEL_DOMAIN}', 'Admin', '${TENANT_ID}', '\$2b\$10\$EPY9LjgjhWG./xyzxyzxyzxyzxyzxyzxyzxyzxyzxyzxy', 'ACTIVE', true, 'ADMIN');" \
          'INSERT INTO platform (id, created, updated, "ownerId", name, "primaryColor", "logoIconUrl", "fullLogoUrl", "favIconUrl", "filteredPieceNames", "filteredPieceBehavior", "showPoweredBy", "cloudAuthEnabled", "defaultLocale", "embeddingEnabled", "gitSyncEnabled", "allowedAuthDomains", "enforceAllowedAuthDomains", "ssoEnabled", "federatedAuthProviders", "emailAuthEnabled", "auditLogEnabled", "customDomainsEnabled", "customAppearanceEnabled", "manageProjectsEnabled", "managePiecesEnabled", "manageTemplatesEnabled", "apiKeysEnabled", "projectRolesEnabled", "flowIssuesEnabled", "alertsEnabled", "premiumPieces")' \
          "VALUES ('plaActivepiecesPlatf1', now(), now(), 'usrActivepiecesAdmin1', 'Gentian', '#000000', '', '', '', '{}', 'ALLOWED', false, true, 'en', true, true, '{}', false, true, jsonb_build_object('saml', jsonb_build_object('idpMetadata', :'xml_val', 'idpCertificate', concat('-----BEGIN CERTIFICATE-----', chr(10), :'cert_val', chr(10), '-----END CERTIFICATE-----'))), true, true, true, true, true, true, true, true, true, true, true, '{}');" \
          'INSERT INTO project (id, created, updated, "ownerId", "displayName", "notifyStatus", "platformId")' \
          "VALUES ('prjActivepiecesProje1', now(), now(), 'usrActivepiecesAdmin1', 'Default Project', 'ALWAYS', 'plaActivepiecesPlatf1');" \
          | PGPASSWORD="$password" psql -v ON_ERROR_STOP=1 -h postgres-rw.platform-kernel.svc.cluster.local -p 5432 -U "$username" -d "${TENANT_ID}_activepieces" -v xml_val="$XML_CONTENT" -v cert_val="$CERT_VAL"
        echo "Database seeded successfully."
      else
        echo "Database already seeded."
      fi
