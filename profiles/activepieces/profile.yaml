apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: activepieces
  labels:
    gentianos.io/profile-name: activepieces
spec:
  displayName: "Automation"
  description: "Open-source workflow automation with 200+ integrations, webhook triggers, and visual flow builder."
  family: activepieces
  catalogueVersion: "1.0.0"
  edition: full
  trustTier: certified
  license: MIT
  tile:
    icon: analytics
  deploymentMethod: crossplane

  kernelRequirements:
    identity:
      saml:
        entityId: "gentian-activepieces"
        acsUrl: "https://auto.${TENANT_DOMAIN}/api/v1/authn/saml/callback"
    database:
      engine: postgresql
      databasePerTenant: true
    cache:
      engine: redis

  portalTiles:
    - name: activepieces
      displayName:
        de_DE: "Automatisierung"
        en_US: "Automation"
      linkTarget: embedded
      allowedGroup: "App Users"

  chart:
    repository: "http://192.168.0.100:8089"
    name: activepieces
    version: "0.3.3"

  valueMapping:
    database:
      hostKey: "activepieces.postgresql.host"
      portKey: "activepieces.postgresql.port"
      nameKey: "activepieces.postgresql.database"
      userKey: "activepieces.postgresql.username"
      passwordKey: "activepieces.postgresql.password"
    cache:
      hostKey: "activepieces.redis.host"
      portKey: "activepieces.redis.port"
      passwordKey: "activepieces.redis.password"

  appSecrets:
    - name: encryption_key
      valuePath: "activepieces.encryption.connection"
    - name: jwt_secret
      valuePath: "activepieces.encryption.jwt"

  ingress:
    subDomain: "auto"
    serviceName: "activepieces"
    servicePort: 80
    tlsEnabled: true

  extraValues:
    fullnameOverride: "activepieces"
    ingress:
      enabled: false

    podLabels:
      mac-waiver.gentianos.io/gentian-restrict-capabilities: "approved"

    extraVolumes:
      - name: nginx-log
        emptyDir: {}
      - name: nginx-lib
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}

    extraVolumeMounts:
      - mountPath: /var/log/nginx
        name: nginx-log
      - mountPath: /var/lib/nginx
        name: nginx-lib
      - mountPath: /run
        name: nginx-run

    postgresql:
      enabled: false
    redis:
      enabled: false

    activepieces:
      domain: "auto.${TENANT_DOMAIN}"
      database: postgres
      queue:
        mode: redis
      redis:
        username: "${TENANT_ID}-activepieces"
      sandbox:
        executionMode: SANDBOXED
      telemetry: false
      templateSourceURL: ""
      data:
        pvc:
          storageClass: "nfs-csi"

    podSecurityContext:
      fsGroup: 1000

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["NET_BIND_SERVICE"]
      seccompProfile:
        type: RuntimeDefault
