apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: activepieces
  labels:
    gentianos.io/profile-name: activepieces
spec:
  displayName: Automation
  description: Open-source workflow automation with 200+ integrations, webhook triggers,
    and visual flow builder.
  family: activepieces
  catalogueVersion: 1.0.0
  edition: full
  trustTier: certified
  license: MIT
  author: Activepieces
  tile:
    icon: analytics
  deploymentMethod: crossplane
  kernelRequirements:
    identity:
      saml:
        entityId: Activepieces
        acsUrl: https://auto.${TENANT_DOMAIN}/api/v1/authn/saml/acs
    database:
      engine: postgresql
      databasePerTenant: true
      allowDynamicDatabaseCreation: false
    cache:
      engine: redis
  portalTiles:
  - name: activepieces
    displayName:
      de_DE: Automatisierung
      en_US: Automation
    linkTarget: embedded
    allowedGroup: App Users
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: activepieces
    version: 0.3.23
  valueMapping:
    database:
      hostKey: activepieces.postgresql.host
      portKey: activepieces.postgresql.port
      nameKey: activepieces.postgresql.database
      userKey: activepieces.postgresql.username
      passwordKey: activepieces.postgresql.password
    cache:
      hostKey: activepieces.redis.host
      portKey: activepieces.redis.port
      passwordKey: activepieces.redis.password
  appSecrets:
  - name: encryption_key
    valuePath: activepieces.encryption.connection
  - name: jwt_secret
    valuePath: activepieces.encryption.jwt
  ingress:
    subDomain: auto
    serviceName: activepieces
    servicePort: 8080
    tlsEnabled: true
    clusterIssuer: letsencrypt-http01
  security:
    egress:
    - ports:
      - port: 443
        protocol: TCP
    - ports:
      - port: 9418
        protocol: TCP
      to:
      - ipBlock:
          cidr: 192.168.0.100/32
  extraValues:
    fullnameOverride: activepieces
    extraEnvVars:
    - name: AP_TELEMETRY_ENABLED
      value: 'false'
    - name: AP_TEMPLATES_SOURCE_URL
      value: http://127.0.0.1/custom-content/templates.json
    ingress:
      enabled: false
      tls:
      - hosts:
        - auto.${TENANT_DOMAIN}
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi
    podLabels:
      mac-waiver.gentianos.io/gentian-restrict-capabilities: approved
      mac-waiver.gentianos.io/gentian-require-non-root: approved
    extraVolumes:
    - name: nginx-log
      emptyDir: {}
    - name: nginx-lib
      emptyDir: {}
    - name: nginx-run
      emptyDir: {}
    - name: custom-content
      persistentVolumeClaim:
        claimName: ${TENANT_ID}-activepieces-git-content-pvc
    extraVolumeMounts:
    - mountPath: /var/log/nginx
      name: nginx-log
    - mountPath: /var/lib/nginx
      name: nginx-lib
    - mountPath: /run
      name: nginx-run
    - name: custom-content
      mountPath: /usr/share/nginx/html/custom-content
    postgresql:
      enabled: false
    redis:
      enabled: false
    activepieces:
      domain: auto.${TENANT_DOMAIN}
      database: postgres
      queue:
        mode: redis
      redis:
        username: ${TENANT_ID}-activepieces
      sandbox:
        executionMode: SANDBOXED
      telemetry: false
      templateSourceURL: ''
      pieces:
        source: FILE
        syncMode: NONE
      data:
        pvc:
          storageClass: nfs-csi
    podSecurityContext:
      fsGroup: 1000
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
        add:
        - NET_BIND_SERVICE
        - CHOWN
        - SETUID
        - SETGID
        - DAC_OVERRIDE
      seccompProfile:
        type: RuntimeDefault
    command:
    - /bin/sh
    - -c
    - "# 1. Patch all index.html files with cookie sync and history interceptor\n\
      node -e \"\nconst fs = require('fs');\nconst root = '/usr/share/nginx/html';\n\
      const files = ['/usr/share/nginx/html/index.html'];\ntry {\n    fs.readdirSync(root).forEach(dir\
      \ => {\n        files.push(root + '/' + dir + '/index.html');\n    });\n} catch\
      \ (e) {}\n\nfiles.forEach(file => {\n    if (fs.existsSync(file) && !fs.lstatSync(file).isDirectory())\
      \ {\n        let html = fs.readFileSync(file, 'utf8');\n        if (!html.includes('ap_token'))\
      \ {\n            const script = '<script>(function(){const loginUrl=\\'/api/v1/authn/saml/login\\\
      ';if(!localStorage.getItem(\\'token\\')){const mT=document.cookie.match(/ap_token=([^;]+)/);const\
      \ mU=document.cookie.match(/ap_user=([^;]+)/);if(mT&&mU){localStorage.setItem(\\\
      'token\\',mT[1]);localStorage.setItem(\\'currentUser\\',decodeURIComponent(mU[1]));window.location.reload();}else{window.location.href=loginUrl;}}const\
      \ intercept=function(url){if(url&&(url.includes(\\'sign-in\\')||url.includes(\\\
      'sign-up\\'))){if(!localStorage.getItem(\\'token\\')){window.location.href=loginUrl;return\
      \ true;}}return false;};const originalPush=window.history.pushState;window.history.pushState=function(state,title,url){if(intercept(url))return;return\
      \ originalPush.apply(this,arguments);};const originalReplace=window.history.replaceState;window.history.replaceState=function(state,title,url){if(intercept(url))return;return\
      \ originalReplace.apply(this,arguments);};})();</script>';\n            html\
      \ = html.replace('<head>', '<head>' + script);\n            fs.writeFileSync(file,\
      \ html, 'utf8');\n            console.log('Injected token sync and history interceptor\
      \ script into ' + file);\n        }\n    }\n});\n\"\n\n# 2. Patch main.js to\
      \ disable upgrade banner by redirecting getLatestRelease to getCurrentRelease\n\
      cat << 'EOF' > /tmp/patch_banner.py\nimport os\nfile = \"/usr/src/app/dist/packages/server/api/main.js\"\
      \nif os.path.exists(file):\n    with open(file, \"r\") as f:\n        c = f.read()\n\
      \    old = 'try{return(yield n.default.get(\"https://raw.githubusercontent.com/activepieces/activepieces/main/package.json\"\
      )).data.version}catch(e){return\"0.0.0\"}'\n    new = 'try{return yield this.getCurrentRelease()}catch(e){return\"\
      0.0.0\"}'\n    if old in c:\n        c = c.replace(old, new)\n        with open(file,\
      \ \"w\") as f:\n            f.write(c)\n        print(\"Patched main.js successfully\
      \ to disable upgrade banner\")\nEOF\npython3 /tmp/patch_banner.py\n\n# 3. Write\
      \ custom nginx.conf\ncat << 'EOF' > /tmp/nginx.conf\nevents{}\nhttp {\n    include\
      \ /etc/nginx/mime.types;\n    client_max_body_size 4m;\n\n    map $http_accept_language\
      \ $accept_language {\n        ~*^en en;\n        ~*^fr fr;\n        ~*^it it;\n\
      \        ~*^de de;\n        ~*^nl nl;\n        ~*^ja ja;\n        ~*^es es;\n\
      \        ~*^id id;\n        ~*^vi vi;\n        ~*^zh zh;\n        ~*^pt pt;\n\
      \        ~*^hu hu;\n        ~*^uk uk;\n        ~*^bg bg;\n    }\n\n    map $arg_token\
      \ $auth_cookie {\n        default \"\";\n        ~.+ \"ap_logged_in=true; Path=/;\
      \ Secure; SameSite=Lax\";\n    }\n\n    server_tokens off;\n\n    add_header\
      \ Strict-Transport-Security \"max-age=31536000; includeSubDomains; preload\"\
      \ always;\n    add_header X-Content-Type-Options \"nosniff\" always;\n\n   \
      \ server {\n        listen 80;\n        server_name localhost;\n        root\
      \ /usr/share/nginx/html;\n        index index.html;\n\n        add_header Set-Cookie\
      \ $auth_cookie always;\n\n        # Server-level cookie auth check (safe from\
      \ try_files side effects)\n        set $should_redirect \"no\";\n        if\
      \ ($request_uri ~* \"^/(fr|de|it|pt|nl|ja|es|zh|vi|id|hu|uk|bg)?/?($|flows|connections|sign-in|sign-up|redirect)\"\
      ) {\n            set $should_redirect \"yes\";\n        }\n        if ($http_cookie\
      \ ~* \"ap_token=\") {\n            set $should_redirect \"no\";\n        }\n\
      \        if ($should_redirect = \"yes\") {\n            return 302 https://$host/api/v1/authn/saml/login;\n\
      \        }\n\n        error_page 404 /404.html;\n        location = /404.html\
      \ {\n            root /usr/share/nginx/html;\n            try_files $uri $uri/\
      \ /index.html;\n        }\n\n        location /socket.io {\n            proxy_pass\
      \ http://localhost:3000/socket.io;\n            proxy_http_version 1.1;\n  \
      \          proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header\
      \ Connection \"Upgrade\";\n            proxy_set_header Host $host;\n      \
      \  }\n\n        location /custom-content {\n            alias /usr/share/nginx/html/custom-content;\n\
      \            autoindex on;\n            add_header Access-Control-Allow-Origin\
      \ *;\n        }\n\n        location = /api/v1/authn/saml/login {\n            proxy_pass http://SSO_IP_PLACEHOLDER:8081/sso/login;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n      \
      \      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n      \
      \      proxy_set_header X-Forwarded-Proto https;\n        }\n\n        location = /api/v1/authn/saml/acs {\n            proxy_pass http://SSO_IP_PLACEHOLDER:8081/sso/acs;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto https;\n        }\n\n      \
      \  location /api/ {\n            proxy_pass http://localhost:3000/;\n      \
      \      proxy_http_version 1.1;\n            proxy_set_header Upgrade $http_upgrade;\n\
      \            proxy_set_header Connection \"Upgrade\";\n            proxy_set_header\
      \ Host $host;\n            proxy_redirect http:// https://;\n        }\n\n \
      \       if ($accept_language ~ \"^$\") {\n            set $accept_language \"\
      en\";\n        }\n\n        location /assets/img/custom {\n            alias\
      \ /usr/share/nginx/html/en/assets/img/custom;\n        }\n\n        location\
      \ = / {\n            root /usr/share/nginx/html/en;\n            try_files $uri\
      \ $uri/ /index.html?$args;\n        }\n\n        location = /sign-in {\n   \
      \         return 302 https://$host/api/v1/authn/saml/login;\n        }\n\n \
      \       location = /sign-up {\n            return 302 https://$host/api/v1/authn/saml/login;\n\
      \        }\n\n        location /redirect {\n            root /usr/share/nginx/html/en;\n\
      \            try_files $uri $uri/ /index.html?$args;\n        }\n\n        location\
      \ ~ ^/(fr|de|it|pt|nl|ja|es|zh|pt|vi|id|hu|uk|bg) {\n            root /usr/share/nginx/html;\n\
      \            try_files $uri $uri/ /$1/index.html;\n        }\n\n        location\
      \ ~ ^/(fr|de|it|pt|nl|ja|es|zh|pt|vi|id|hu|uk|bg)$ {\n           rewrite ^/(fr|de|it|pt|nl|ja|es|zh|pt|vi|id|hu|uk|bg)$\
      \ /$1/ permanent;\n        }\n\n        location ~* \\.(css|js|jpg|jpeg|png|gif|ico|svg)$\
      \ {\n            root /usr/share/nginx/html/en;\n            add_header Pragma\
      \ \"no-cache\";\n            add_header Expires \"0\";\n            add_header\
      \ Cache-Control \"public, max-age=31536000, immutable\";\n        }\n\n    \
      \    location / {\n           root /usr/share/nginx/html/en;\n           try_files\
      \ $uri $uri/ /index.html?$args;\n        }\n\n        location /not-found {\n\
      \           root /usr/share/nginx/html/en;\n           try_files $uri $uri/\
      \ /index.html?$args =404;\n        }\n    }\n}\nEOF\nSSO_IP=$(env | grep \"_SSO_SAML_SERVICE_HOST=\" | cut -d= -f2 | head -n 1)\nsed -i \"s/SSO_IP_PLACEHOLDER/${SSO_IP}/g\" /tmp/nginx.conf\n\n# 6. Start Nginx with custom config path\nnginx\
      \ -c /tmp/nginx.conf -g \"daemon off;\" &\n\n# 7. Start backend server\nexec\
      \ node --enable-source-maps /usr/src/app/dist/packages/server/api/main.js\n"
  postInstallJob:
    image: ghcr.io/cloudnative-pg/postgresql:17.2
    envFrom:
    - activepieces-postgresql-credentials
    script: "set -eu\n\n# Resolve environment variables using python\npython3 -c '\n\
      import urllib.request, re, os\nwith open(\"/var/run/secrets/kubernetes.io/serviceaccount/namespace\"\
      , \"r\") as f:\n    ns = f.read().strip()\ntenant_id = ns.replace(\"tenant-\"\
      , \"\")\nurl = f\"http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080/auth/realms/{tenant_id}/protocol/saml/descriptor\"\
      \nxml = urllib.request.urlopen(url).read().decode(\"utf-8\")\nmatch = re.search(r\"\
      https://id\\.([^/\\\"]+)\", xml)\nkernel_domain = match.group(1) if match else\
      \ \"gentian.org\"\ntenant_domain = f\"{tenant_id}.{kernel_domain}\"\n\nwith\
      \ open(\"/tmp/env.sh\", \"w\") as f:\n    f.write(f\"export TENANT_ID={tenant_id}\\\
      n\")\n    f.write(f\"export KERNEL_DOMAIN={kernel_domain}\\n\")\n    f.write(f\"\
      export TENANT_DOMAIN={tenant_domain}\\n\")\n'\n. /tmp/env.sh\n\necho \"Waiting\
      \ for database...\"\nuntil pg_isready -h postgres-rw.platform-kernel.svc.cluster.local\
      \ -p 5432; do\n  sleep 2\ndone\n\n# Check if required tables exist\nTABLES_COUNT=$(PGPASSWORD=\"\
      $password\" psql -h postgres-rw.platform-kernel.svc.cluster.local -p 5432 -U\
      \ \"$username\" -d \"${TENANT_ID}_activepieces\" -tAc \"SELECT count(*) FROM\
      \ information_schema.tables WHERE table_schema = 'public' AND table_name IN\
      \ ('platform', 'project', 'user');\")\nif [ \"$TABLES_COUNT\" -ne 3 ]; then\n\
      \  echo \"Activepieces migrations are not complete yet (found $TABLES_COUNT/3\
      \ required tables).\"\n  exit 1\nfi\n\nPLATFORM_COUNT=$(PGPASSWORD=\"$password\"\
      \ psql -h postgres-rw.platform-kernel.svc.cluster.local -p 5432 -U \"$username\"\
      \ -d \"${TENANT_ID}_activepieces\" -tAc \"SELECT count(*) FROM platform;\")\n\
      if [ \"$PLATFORM_COUNT\" -eq 0 ]; then\n  echo \"Seeding Activepieces database...\"\
      \n\n  # Download Keycloak metadata XML\n  python3 -c '\nimport urllib.request,\
      \ os\nwith open(\"/var/run/secrets/kubernetes.io/serviceaccount/namespace\"\
      , \"r\") as f:\n    ns = f.read().strip()\ntenant_id = ns.replace(\"tenant-\"\
      , \"\")\nurl = f\"http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080/auth/realms/{tenant_id}/protocol/saml/descriptor\"\
      \nxml = urllib.request.urlopen(url).read().decode(\"utf-8\")\nprint(xml)\n'\
      \ > /tmp/idp-metadata.xml\n\n  XML_CONTENT=$(cat /tmp/idp-metadata.xml | sed\
      \ 's/WantAuthnRequestsSigned=\"true\"/WantAuthnRequestsSigned=\"false\"/g')\n\
      \  CERT_VAL=$(echo \"$XML_CONTENT\" | sed -n 's/.*<ds:X509Certificate>\\(.*\\\
      )<\\/ds:X509Certificate>.*/\\1/p')\n\n  printf \"%s\\n\" \\\n    'INSERT INTO\
      \ \"user\" (id, created, updated, email, \"firstName\", \"lastName\", password,\
      \ status, verified, \"platformRole\")' \\\n    \"VALUES ('usrActivepiecesAdmin1',\
      \ now(), now(), 'admin-${TENANT_ID}@${KERNEL_DOMAIN}', 'Admin', '${TENANT_ID}',\
      \ '\\$2b\\$10\\$EPY9LjgjhWG./xyzxyzxyzxyzxyzxyzxyzxyzxyzxyzxy', 'ACTIVE', true,\
      \ 'ADMIN');\" \\\n    'INSERT INTO platform (id, created, updated, \"ownerId\"\
      , name, \"primaryColor\", \"logoIconUrl\", \"fullLogoUrl\", \"favIconUrl\",\
      \ \"filteredPieceNames\", \"filteredPieceBehavior\", \"showPoweredBy\", \"cloudAuthEnabled\"\
      , \"defaultLocale\", \"embeddingEnabled\", \"gitSyncEnabled\", \"allowedAuthDomains\"\
      , \"enforceAllowedAuthDomains\", \"ssoEnabled\", \"federatedAuthProviders\"\
      , \"emailAuthEnabled\", \"auditLogEnabled\", \"customDomainsEnabled\", \"customAppearanceEnabled\"\
      , \"manageProjectsEnabled\", \"managePiecesEnabled\", \"manageTemplatesEnabled\"\
      , \"apiKeysEnabled\", \"projectRolesEnabled\", \"flowIssuesEnabled\", \"alertsEnabled\"\
      , \"premiumPieces\")' \\\n    \"VALUES ('plaActivepiecesPlatf1', now(), now(),\
      \ 'usrActivepiecesAdmin1', 'Gentian', '#000000', '', '', '', '{}', 'ALLOWED',\
      \ false, true, 'en', true, true, '{}', false, true, jsonb_build_object('saml',\
      \ jsonb_build_object('idpMetadata', :'xml_val', 'idpCertificate', concat('-----BEGIN\
      \ CERTIFICATE-----', chr(10), :'cert_val', chr(10), '-----END CERTIFICATE-----'))),\
      \ true, true, true, true, true, true, true, true, true, true, true, '{}');\"\
      \ \\\n    'INSERT INTO project (id, created, updated, \"ownerId\", \"displayName\"\
      , \"notifyStatus\", \"platformId\")' \\\n    \"VALUES ('prjActivepiecesProje1',\
      \ now(), now(), 'usrActivepiecesAdmin1', 'Default Project', 'ALWAYS', 'plaActivepiecesPlatf1');\"\
      \ \\\n    | PGPASSWORD=\"$password\" psql -v ON_ERROR_STOP=1 -h postgres-rw.platform-kernel.svc.cluster.local\
      \ -p 5432 -U \"$username\" -d \"${TENANT_ID}_activepieces\" -v xml_val=\"$XML_CONTENT\"\
      \ -v cert_val=\"$CERT_VAL\"\n  echo \"Database seeded successfully.\"\nelse\n\
      \  echo \"Database already seeded.\"\nfi\n"
  sidecars:
  - name: sso
    chart:
      repository: oci://ghcr.io/gentian-org/charts
      name: gentian-sidecar-sso-saml
      version: 0.1.4
    extraValues:
      podLabels:
        gentianos.io/app: activepieces
      podAnnotations:
        gentianos.io/restart-reason: encryption-keys-secret-stabilized-2026-07-18
      sso:
        tenantId: ${TENANT_ID}
        kernelDomain: ${KERNEL_DOMAIN}
        issuer: Activepieces
      handlerScript: "const { Client } = require('pg');\nconst jwt = require('jsonwebtoken');\n\
        \nasync function upsertUserAndProject(email, firstName, lastName) {\n    const\
        \ client = new Client({\n        host: process.env.AP_POSTGRES_HOST,\n   \
        \     port: parseInt(process.env.AP_POSTGRES_PORT || '5432'),\n        user:\
        \ process.env.AP_POSTGRES_USERNAME,\n        password: process.env.AP_POSTGRES_PASSWORD\
        \ || process.env.password,\n        database: process.env.AP_POSTGRES_DATABASE,\n\
        \    });\n    \n    await client.connect();\n    try {\n        const resUser\
        \ = await client.query('SELECT id FROM \"user\" WHERE email = $1', [email]);\n\
        \        let userId;\n        \n        if (resUser.rows.length > 0) {\n \
        \           userId = resUser.rows[0].id;\n        } else {\n            userId\
        \ = 'usr_' + Math.random().toString(36).substring(2, 15).substring(0, 17);\n\
        \            await client.query(\n                'INSERT INTO \"user\" (id,\
        \ created, updated, email, \"firstName\", \"lastName\", password, status,\
        \ verified, \"platformRole\", \"platformId\") VALUES ($1, now(), now(), $2,\
        \ $3, $4, $5, $6, $7, $8, $9)',\n                [userId, email, firstName\
        \ || 'SSO', lastName || 'User', '', 'ACTIVE', true, 'ADMIN', 'plaActivepiecesPlatf1']\n\
        \            );\n            console.log(`User created: ${userId} (${email})`);\n\
        \        }\n        \n        const resProj = await client.query('SELECT id\
        \ FROM project WHERE \"ownerId\" = $1', [userId]);\n        let projectId;\n\
        \        \n        if (resProj.rows.length > 0) {\n            projectId =\
        \ resProj.rows[0].id;\n        } else {\n            projectId = 'prj_' +\
        \ Math.random().toString(36).substring(2, 15).substring(0, 17);\n        \
        \    await client.query(\n                'INSERT INTO project (id, created,\
        \ updated, \"ownerId\", \"displayName\", \"notifyStatus\", \"platformId\"\
        ) VALUES ($1, now(), now(), $2, $3, $4, $5)',\n                [projectId,\
        \ userId, 'Default Project', 'ALWAYS', 'plaActivepiecesPlatf1']\n        \
        \    );\n            console.log(`Project created: ${projectId} for user ${userId}`);\n\
        \        }\n        \n        return { userId, projectId };\n    } finally\
        \ {\n        await client.end();\n    }\n}\n\nfunction signJwt(userId, email,\
        \ firstName, lastName, projectId) {\n    const payload = {\n        id: userId,\n\
        \        type: 'USER',\n        projectId: projectId,\n        platform: {\n\
        \            id: 'plaActivepiecesPlatf1'\n        }\n    };\n    \n    const secret = process.env.jwt;\n    return jwt.sign(payload, secret, { \n        algorithm: 'HS256',\n        issuer: 'activepieces',\n        expiresIn: '7d' \n    });\n}\n\n\
        module.exports = {\n    onLogin: async (profile, req, res) => {\n        const\
        \ { email, firstName, lastName } = profile;\n        const { userId, projectId\
        \ } = await upsertUserAndProject(email, firstName, lastName);\n        const\
        \ token = signJwt(userId, email, firstName, lastName, projectId);\n      \
        \  \n        const userObj = {\n            id: userId,\n            email:\
        \ email,\n            firstName: firstName || 'SSO',\n            lastName:\
        \ lastName || 'User',\n            status: 'ACTIVE',\n            verified:\
        \ true,\n            platformRole: 'ADMIN'\n        };\n        \n       \
        \ res.writeHead(200, { \n            'Content-Type': 'text/html',\n      \
        \      'Set-Cookie': [\n                `ap_token=${token}; Path=/; Secure;\
        \ SameSite=Lax; Max-Age=604800`,\n                `ap_user=${encodeURIComponent(JSON.stringify(userObj))};\
        \ Path=/; Secure; SameSite=Lax; Max-Age=604800`,\n                `ap_logged_in=true;\
        \ Path=/; Secure; SameSite=Lax; Max-Age=604800`\n            ]\n        });\n\
        \        res.end(`<!DOCTYPE html>\n<html>\n<head>\n    <title>Logging in...</title>\n\
        </head>\n<body>\n    <script>\n        localStorage.setItem('token', '${token}');\n\
        \        localStorage.setItem('currentUser', '${JSON.stringify(userObj)}');\n\
        \        window.location.href = '/';\n    </script>\n</body>\n</html>`);\n\
        \    }\n};\n"
      envFrom:
      - secretRef:
          name: activepieces-postgresql-credentials
      - secretRef:
          name: activepieces-encryption-keys
      extraEnvVars:
      - name: AP_POSTGRES_HOST
        value: postgres-rw.platform-kernel.svc.cluster.local
      - name: AP_POSTGRES_PORT
        value: '5432'
      - name: AP_POSTGRES_USERNAME
        value: ${TENANT_ID}_activepieces
      - name: AP_POSTGRES_DATABASE
        value: ${TENANT_ID}_activepieces
  - name: git-sync
    chart:
      repository: oci://ghcr.io/gentian-org/charts
      name: gentian-sidecar-git-modules
      version: 0.1.7
    extraValues:
      podLabels:
        gentianos.io/app: activepieces
      git:
        repoUrl: git://192.168.0.100:9418/gentian-pieces
        branch: main
        mountPath: /usr/src/app/custom-content
      persistence:
        enabled: true
        storageClass: nfs-csi
        size: 2Gi
        accessMode: ReadWriteMany
        pvcName: ${TENANT_ID}-activepieces-git-content-pvc

  # Customization ladder — see customization.md
  customization:
    grade: A
    rubricScore: 7
    supportedRungs: [L0, L1, L3, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/activepieces/customization.md
    configure:
      hotReload: false
    dropIns:
      - name: branding
        path: /usr/src/app/branding
        format: files
        source: configMap
        upstreamDocumented: false
        tenantEditable: true
        maxBytes: 262144
    extension:
      mechanism: activepieces-piece
      delivery: [git-sidecar, image-layer]
      modulePath: /usr/src/app/modules
      apiStability: stable
      apiDocs: https://www.activepieces.com/docs/developers/building-pieces/overview
      perTenantModules: true
      testMatrix: ["0.68"]
    publishes:
      apis:
        - contract: automation
          protocol: http-json
          spec: openapi
          path: /api/v1
          auth: oidc-token-exchange
    repackage:
      chartOwnership: patched
    patch:
      allowed: false      # enterprise features are licence-gated; never patch to unlock
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
