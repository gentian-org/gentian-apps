apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: activepieces
  labels:
    gentianos.io/profile-name: activepieces
spec:
  displayName: "Automation"
  description: "Open-source workflow automation with 200+ integrations, webhook triggers, and visual flow builder."
  family: activepieces
  catalogueVersion: "1.0.0"
  edition: full
  trustTier: certified
  license: MIT
  tile:
    icon: analytics
  deploymentMethod: crossplane

  kernelRequirements:
    identity:
      saml:
        entityId: "Activepieces"
        acsUrl: "https://auto.${TENANT_DOMAIN}/api/v1/authn/saml/acs"
    database:
      engine: postgresql
      databasePerTenant: true
    cache:
      engine: redis

  portalTiles:
    - name: activepieces
      displayName:
        de_DE: "Automatisierung"
        en_US: "Automation"
      linkTarget: embedded
      allowedGroup: "App Users"

  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: activepieces
    version: "0.3.17"

  valueMapping:
    database:
      hostKey: "activepieces.postgresql.host"
      portKey: "activepieces.postgresql.port"
      nameKey: "activepieces.postgresql.database"
      userKey: "activepieces.postgresql.username"
      passwordKey: "activepieces.postgresql.password"
    cache:
      hostKey: "activepieces.redis.host"
      portKey: "activepieces.redis.port"
      passwordKey: "activepieces.redis.password"

  appSecrets:
    - name: encryption_key
      valuePath: "activepieces.encryption.connection"
    - name: jwt_secret
      valuePath: "activepieces.encryption.jwt"

  ingress:
    subDomain: "auto"
    serviceName: "activepieces"
    servicePort: 8080
    tlsEnabled: true

  security:
    egress:
      - ports:
          - port: 443
            protocol: TCP

  extraValues:
    fullnameOverride: "activepieces"
    command:
      - /bin/sh
      - -c
      - |
        cat << 'EOF' > /tmp/patch.py
        with open('/usr/src/app/dist/packages/server/api/main.js', 'r') as f:
            c = f.read()

        # 1. Rename release query parameter to ignored
        c = c.replace('.append("release",', '.append("ignored",')

        # 2. Mock listVersions API to return empty string version to fetch latest version
        target_versions = 'const r=`${T}/versions?${t.toString()}`,i=yield fetch(r);return(0,s.parseAndVerify)(y.ListVersionsResponse,yield i.json())'
        replacement_versions = 'const r=1,i=2;return {"":{}}'
        c = c.replace(target_versions, replacement_versions)

        # 3. Force license verification to always succeed and enable SSO
        target_license = 'verifyKeyAndApplyLimits(e){return i.__awaiter(this,arguments,void 0,(function*({platformId:e,license:t}){if((0,a.isNil)(t))yield N(e);else{try{yield this.activateKey({key:t,platformId:e})}catch(r){}try{const r=yield this.getKey(t);if((0,a.isNil)(r)||(0,n.default)(r.expiresAt).isBefore((0,n.default)()))return void(yield N(e));yield c.platformService.update({id:e,ssoEnabled:r.ssoEnabled,gitSyncEnabled:r.gitSyncEnabled,showPoweredBy:r.showPoweredBy,embeddingEnabled:r.embeddingEnabled,auditLogEnabled:r.auditLogEnabled,customAppearanceEnabled:r.customAppearanceEnabled,manageProjectsEnabled:r.manageProjectsEnabled,managePiecesEnabled:r.managePiecesEnabled,manageTemplatesEnabled:r.manageTemplatesEnabled,apiKeysEnabled:r.apiKeysEnabled,customDomainsEnabled:r.customDomainsEnabled,projectRolesEnabled:r.projectRolesEnabled,flowIssuesEnabled:r.flowIssuesEnabled,alertsEnabled:r.alertsEnabled,premiumPieces:r.premiumPieces})}catch(r){u.logger.error(`[ERROR]: Failed to verify license key: ${r}`)}}}))}}'
        replacement_license = 'verifyKeyAndApplyLimits(e){return i.__awaiter(this,arguments,void 0,(function*({platformId:e}){yield c.platformService.update({id:e,ssoEnabled:!0,gitSyncEnabled:!0,showPoweredBy:!0,embeddingEnabled:!0,auditLogEnabled:!0,customAppearanceEnabled:!0,manageProjectsEnabled:!0,managePiecesEnabled:!0,manageTemplatesEnabled:!0,apiKeysEnabled:!0,customDomainsEnabled:!0,projectRolesEnabled:!0,flowIssuesEnabled:!0,alertsEnabled:!0})}))}'
        c = c.replace(target_license, replacement_license)

        with open('/usr/src/app/dist/packages/server/api/main.js', 'w') as f:
            f.write(c)
        EOF
        python3 /tmp/patch.py
        exec /usr/src/app/docker-entrypoint.sh
    extraEnvVars:
      - name: AP_EDITION
        value: "ee"
      - name: AP_LICENSE_KEY
        value: "gentian-sso"
      - name: AP_TELEMETRY_ENABLED
        value: "false"
      - name: AP_TEMPLATES_SOURCE_URL
        value: "http://localhost:3000/v1/flow-templates"
    ingress:
      enabled: false
      tls:
        - hosts:
            - "auto.${TENANT_DOMAIN}"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 512Mi

    podLabels:
      mac-waiver.gentianos.io/gentian-restrict-capabilities: "approved"
      mac-waiver.gentianos.io/gentian-require-non-root: "approved"

    extraVolumes:
      - name: nginx-log
        emptyDir: {}
      - name: nginx-lib
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: activepieces-nginx-config
      - name: shared-init-data
        emptyDir: {}

    extraVolumeMounts:
      - mountPath: /var/log/nginx
        name: nginx-log
      - mountPath: /var/lib/nginx
        name: nginx-lib
      - mountPath: /run
        name: nginx-run
      - name: nginx-config
        mountPath: /etc/nginx/nginx.conf
        subPath: nginx.conf

    postgresql:
      enabled: false
    redis:
      enabled: false

    activepieces:
      domain: "auto.${TENANT_DOMAIN}"
      database: postgres
      queue:
        mode: redis
      redis:
        username: "${TENANT_ID}-activepieces"
      sandbox:
        executionMode: SANDBOXED
      telemetry: false
      templateSourceURL: ""
      data:
        pvc:
          storageClass: "nfs-csi"

    podSecurityContext:
      fsGroup: 1000

    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
      seccompProfile:
        type: RuntimeDefault

    initContainers:
      - name: fetch-keycloak-metadata
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        image: docker.io/curlimages/curl:8.2.1
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            echo "Waiting for Keycloak..."
            until curl -sf "http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080/auth/realms/${TENANT_ID}/protocol/saml/descriptor" > /tmp/shared/idp-metadata.xml; do
              sleep 2
            done
            echo "SAML metadata fetched successfully."
        volumeMounts:
          - name: shared-init-data
            mountPath: /tmp/shared
      - name: db-seed
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
          seccompProfile:
            type: RuntimeDefault
        image: ghcr.io/cloudnative-pg/postgresql:17.2
        env:
          - name: AP_POSTGRES_USERNAME
            valueFrom:
              secretKeyRef:
                name: activepieces-postgresql-credentials
                key: username
          - name: AP_POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: activepieces-postgresql-credentials
                key: password
        envFrom:
          - configMapRef:
              name: activepieces
        command:
          - /bin/bash
          - -c
          - |
            set -eu
            echo "Waiting for database..."
            until pg_isready -h "$AP_POSTGRES_HOST" -p "$AP_POSTGRES_PORT"; do
              sleep 2
            done

            PLATFORM_COUNT=$(PGPASSWORD="$AP_POSTGRES_PASSWORD" psql -h "$AP_POSTGRES_HOST" -p "$AP_POSTGRES_PORT" -U "$AP_POSTGRES_USERNAME" -d "$AP_POSTGRES_DATABASE" -tAc "SELECT count(*) FROM platform;")
            if [ "$PLATFORM_COUNT" -eq 0 ]; then
              echo "Seeding Activepieces database..."

              XML_CONTENT=$(cat /tmp/shared/idp-metadata.xml | sed 's/WantAuthnRequestsSigned="true"/WantAuthnRequestsSigned="false"/g')
              CERT_VAL=$(echo "$XML_CONTENT" | sed -n 's/.*<ds:X509Certificate>\(.*\)<\/ds:X509Certificate>.*/\1/p')

              printf "%s\n" \
                'INSERT INTO "user" (id, created, updated, email, "firstName", "lastName", password, status, verified, "platformRole")' \
                "VALUES ('usrActivepiecesAdmin1', now(), now(), 'admin-${TENANT_ID}@${KERNEL_DOMAIN}', 'Admin', '${TENANT_ID}', '\$2b\$10\$EPY9LjgjhWG./xyzxyzxyzxyzxyzxyzxyzxyzxyzxyzxy', 'ACTIVE', true, 'ADMIN');" \
                'INSERT INTO platform (id, created, updated, "ownerId", name, "primaryColor", "logoIconUrl", "fullLogoUrl", "favIconUrl", "filteredPieceNames", "filteredPieceBehavior", "showPoweredBy", "cloudAuthEnabled", "defaultLocale", "embeddingEnabled", "gitSyncEnabled", "allowedAuthDomains", "enforceAllowedAuthDomains", "ssoEnabled", "federatedAuthProviders", "emailAuthEnabled", "auditLogEnabled", "customDomainsEnabled", "customAppearanceEnabled", "manageProjectsEnabled", "managePiecesEnabled", "manageTemplatesEnabled", "apiKeysEnabled", "projectRolesEnabled", "flowIssuesEnabled", "alertsEnabled", "premiumPieces")' \
                "VALUES ('plaActivepiecesPlatf1', now(), now(), 'usrActivepiecesAdmin1', 'Gentian', '#000000', '', '', '', '{}', 'ALLOWED', false, true, 'en', true, true, '{}', false, true, jsonb_build_object('saml', jsonb_build_object('idpMetadata', :'xml_val', 'idpCertificate', concat('-----BEGIN CERTIFICATE-----', chr(10), :'cert_val', chr(10), '-----END CERTIFICATE-----'))), true, true, true, true, true, true, true, true, true, true, true, '{}');" \
                'INSERT INTO project (id, created, updated, "ownerId", "displayName", "notifyStatus", "platformId")' \
                "VALUES ('prjActivepiecesProje1', now(), now(), 'usrActivepiecesAdmin1', 'Default Project', 'ALWAYS', 'plaActivepiecesPlatf1');" \
                'INSERT INTO project_member (id, created, updated, "projectId", role, "userId", "platformId")' \
                "VALUES ('memActivepiecesMembe1', now(), now(), 'prjActivepiecesProje1', 'ADMIN', 'usrActivepiecesAdmin1', 'plaActivepiecesPlatf1');" \
                'INSERT INTO custom_domain (id, created, updated, domain, "platformId", status)' \
                "VALUES ('domActivepiecesDoma1', now(), now(), 'auto.${TENANT_DOMAIN}', 'plaActivepiecesPlatf1', 'ACTIVE');" \
                'CREATE OR REPLACE FUNCTION auto_assign_project() RETURNS TRIGGER AS $$ BEGIN IF NEW."platformId" = $$plaActivepiecesPlatf1$$ THEN INSERT INTO project_member (id, created, updated, "projectId", role, "userId", "platformId") VALUES (substring(md5(NEW.id) from 1 for 21), now(), now(), $$prjActivepiecesProje1$$, $$ADMIN$$, NEW.id, $$plaActivepiecesPlatf1$$) ON CONFLICT DO NOTHING; END IF; RETURN NEW; END; $$ LANGUAGE plpgsql;' \
                'CREATE OR REPLACE TRIGGER trg_auto_assign_project AFTER INSERT ON "user" FOR EACH ROW EXECUTE FUNCTION auto_assign_project();' \
                | PGPASSWORD="$AP_POSTGRES_PASSWORD" psql -h "$AP_POSTGRES_HOST" -p "$AP_POSTGRES_PORT" -U "$AP_POSTGRES_USERNAME" -d "$AP_POSTGRES_DATABASE" -v xml_val="$XML_CONTENT" -v cert_val="$CERT_VAL"
              echo "Database seeded successfully."
            else
              echo "Database already seeded."
            fi
        volumeMounts:
          - name: shared-init-data
            mountPath: /tmp/shared

