profile: activepieces-me
displayName: "Activepieces"
summary: "Build automated workflows and AI agents that connect your team's apps, triggered by events, schedules or webhooks."
description: |
  Activepieces is an open-source automation platform with a visual, no-code flow builder. Teams use it to take repetitive work off their hands, such as triaging support tickets, routing leads, processing invoices and generating reports. Integrations are called *pieces* (several hundred are available), and it exposes an MCP server so AI assistants can run the flows you build.
