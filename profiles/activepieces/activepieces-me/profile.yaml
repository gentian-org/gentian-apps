# SPDX-License-Identifier: MIT
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: activepieces-me
  labels:
    gentianos.io/profile-name: activepieces-me
    gentianos.io/profile-family: activepieces
    gentianos.io/profile-edition: me
spec:
  classes:
    - app
  trustTier: certified
  version: "0.5.1-dev"
  package:
    chart:
      repository: oci://ghcr.io/gentian-org/charts
      name: activepieces
      version: 0.3.28-develop.6da5d99
    valueMapping:
      database:
        hostKey: activepieces.postgresql.host
        portKey: activepieces.postgresql.port
        nameKey: activepieces.postgresql.database
        userKey: activepieces.postgresql.username
        passwordKey: activepieces.postgresql.password
      cache:
        hostKey: activepieces.redis.host
        portKey: activepieces.redis.port
        passwordKey: activepieces.redis.password
    extraValues:
      fullnameOverride: activepieces-me
      extraEnvVars:
        - name: AP_TELEMETRY_ENABLED
          value: 'false'
        - name: AP_TEMPLATES_SOURCE_URL
          value: http://127.0.0.1/custom-content/templates.json
      ingress:
        enabled: false
        tls:
          - hosts:
              - activepieces.${TENANT_DOMAIN}
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          cpu: 1
          memory: 2Gi
      podLabels:
        mac-waiver.gentianos.io/gentian-restrict-capabilities: approved
        mac-waiver.gentianos.io/gentian-require-non-root: approved
      extraVolumes:
        - name: nginx-log
          emptyDir: {}
        - name: nginx-lib
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
    # emptyDir, filled by the git-sync init container and kept current by the
    # git-sync sidecar below -- both in this pod. It was a ReadWriteMany PVC
    # written by a standalone Deployment, which made an RWX StorageClass a hard
    # requirement for serving a few MB of public, reproducible git.
        - name: custom-content
          emptyDir: {}
    # git-sync in this pod, replacing the standalone Deployment that wrote a
    # ReadWriteMany PVC. The content is public, reproducible git -- nothing to
    # share, and sharing it made an RWX StorageClass a hard requirement.
    #
    # Runs as 1000 to match fsGroup, so the emptyDir is writable without the
    # cross-pod gid negotiation the shared volume needed.
      extraInitContainers:
        - name: git-sync-init-content
          image: registry.k8s.io/git-sync/git-sync:v4.2.3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - --repo=https://github.com/gentian-org/gentian-pieces.git
            - --branch=main
            - --root=/usr/share/nginx/html/custom-content
            - --dest=current
            - --one-time
          volumeMounts:
            - name: custom-content
              mountPath: /usr/share/nginx/html/custom-content
      extraContainers:
        - name: git-sync-content
          image: registry.k8s.io/git-sync/git-sync:v4.2.3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - --repo=https://github.com/gentian-org/gentian-pieces.git
            - --branch=main
            - --root=/usr/share/nginx/html/custom-content
            - --dest=current
            - --wait=60
            - --stale-worktree-timeout=24h
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 50m, memory: 128Mi}
          volumeMounts:
            - name: custom-content
              mountPath: /usr/share/nginx/html/custom-content
      extraVolumeMounts:
        - mountPath: /var/log/nginx
          name: nginx-log
        - mountPath: /var/lib/nginx
          name: nginx-lib
        - mountPath: /run
          name: nginx-run
        - name: custom-content
          mountPath: /usr/share/nginx/html/custom-content
      postgresql:
        enabled: false
      redis:
        enabled: false
      activepieces:
        domain: activepieces.${TENANT_DOMAIN}
        database: postgres
        queue:
          mode: redis
        redis:
        # Must equal the kernel's redisACLUsername(tenant, app) = "<tenant>-<app>".
        # ${APP_ID} is the claim name, so this survives profile renames.
          username: ${TENANT_ID}-${APP_ID}
        sandbox:
          executionMode: SANDBOXED
        telemetry: false
        templateSourceURL: ''
        pieces:
          source: FILE
          syncMode: NONE
        data:
        # An empty mapping, not an absent one: the chart dereferences
        # .activepieces.data.pvc.existingClaim, so `pvc:` with no keys renders as
        # null and every template using it fails with a nil pointer. Dropping the
        # storageClass line without this left exactly that.
        #
        # No storageClass key: the cluster's default is the cluster's to choose.
          pvc: {}
      podSecurityContext:
        fsGroup: 1000
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - NET_BIND_SERVICE
            - CHOWN
            - SETUID
            - SETGID
            - DAC_OVERRIDE
        seccompProfile:
          type: RuntimeDefault
    # Gentian runtime: the chart owns the nginx config and the entrypoint
    # (patches 0005/0006/0008). This profile passes values only — never a
    # command. See customizations/nginx-sso-routing.yaml.
      gentian:
        enabled: true
        startup:
          disableUpgradeBanner: true
  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
    services:
      identity:
      # Activepieces' own single sign-on needs a licence key and is not used.
      # Its people are signed in by the platform's sidecar, with the handler
      # in assets/sign-in-handler.js. See customizations/sign-in-sidecar.yaml
      # for the review, and for the question about it that is open.
        sidecar:
        # Activepieces' front page and the pages of its own sign-in. Not
        # /flows, where the handler ends.
          entryPaths: ["/", "/sign-in", "/sign-up"]
        # The handler looks the person up and, for a person the app does not
        # know, writes their account and their project.
          database: true
        # The key Activepieces signs session tokens with.
          secrets: [jwt_secret]
        # Activepieces' own first sign-up, which creates the platform, made
        # inside the cluster. The container listens on 80; the Service this
        # profile routes to serves it as 8080.
          appPort: 80
      database:
        engine: postgresql
        databasePerTenant: true
        allowDynamicDatabaseCreation: false
      # Activepieces' TypeORM migrations create tables in public and then query
      # them unqualified, so public has to resolve first. Previously the operator
      # inferred this by matching "activepieces" in the role name.
        schemaPreference: public
      cache:
        engine: redis
    privileges:
      egress:
        - name: egress-1
          rule:
            ports:
              - port: 443
                protocol: TCP
          reason: 'REVIEW: say what this component reaches and why'
  secrets:
    generated:
      - name: encryption_key
        valuePath: activepieces.encryption.connection
      - name: jwt_secret
        valuePath: activepieces.encryption.jwt
  expose:
    - name: web
      surface: gateway
      authMode: oidc
      # The address the app is told it has (activepieces.domain above). The
      # entry named none, so the app was published under the profile's name
      # and told another: links it writes itself led nowhere.
      subDomain: activepieces
      # Activepieces' page keeps its session as a token in localStorage and
      # sends it to its own API in the Authorization header. On an ordinary
      # entry the front door replaces that header and removes it, so every
      # call after sign-in would reach Activepieces with no token. This asks
      # that the header be left as the page sent it. It is a request to the
      # tenant's perimeter approver and takes effect once approved; sign-in
      # and the right to use the app are required either way.
      clientAuthorization: app
      # Activepieces' own ways in, refused at the front door: signing in and
      # up with a password, its one-time codes, and the paid single sign-on's
      # calls. Nobody has a password, so nothing is lost. The handler's one
      # call to the sign-up is made inside the cluster.
      denyPaths:
        - /api/v1/authentication
        - /api/v1/authn
        - /api/v1/otp
      backend:
        service: activepieces-me
        port: 8080
      tile:
        displayName: Automation
        displayNames:
          de_DE: Automatisierung
        logo: data:image/png;base64,
        image: assets/tile.png
        relation: can_launch
  customization:
    grade: A
    rubricScore: 7
    supportedRungs: [L0, L1, L3, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/activepieces/activepieces-me/customization.md
    configure:
      hotReload: false
    dropIns:
      - name: branding
        path: /usr/src/app/branding
        format: files
        source: configMap
        upstreamDocumented: false
        tenantEditable: true
        maxBytes: 262144
    extension:
      mechanism: activepieces-piece
      delivery: [git-sidecar, image-layer]
      addonPath: /usr/src/app/modules
      apiStability: stable
      apiDocs: https://www.activepieces.com/docs/developers/building-pieces/overview
      perTenantAddons: true
      testMatrix: ["0.68"]
    publishes:
      apis:
        - contract: automation
          protocol: http-json
          spec: openapi
          path: /api/v1
          auth: oidc-token-exchange
    repackage:
      chartOwnership: patched
    patch:
      allowed: false      # enterprise features are license-gated; never patch to unlock
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
  launch: tile
