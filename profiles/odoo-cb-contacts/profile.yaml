apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: odoo-cb-contacts
  labels:
    gentianos.io/profile-name: odoo-cb-contacts
  annotations:
    gentianos.io/platform-app: "false"
    gentianos.io/deployment-role: module
    gentianos.io/requires-profile: odoo-cb-base
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["contacts"]}'
    gentianos.io/portal-auth-mode: oidc
spec:
  displayName: "Odoo Contacts"
  description: "Contact management module for Odoo."
  family: odoo
  catalogueVersion: "1.0.0"
  edition: standard
  trustTier: platform
  license: LGPL-3.0
  tile:
    icon: contacts

  portalTiles:
    - name: odoo-contacts
      displayName:
        en_US: "Odoo Contacts"
        de_DE: "Odoo Kontakte"
      linkSuffix: "/web?gentian_embed=1&action=contacts.action_contacts"
      linkTarget: embedded
      allowedGroup: "App Users"

  compositionRef: app-odoo
  deploymentMethod: crossplane
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: odoo
    version: "0.1.11"
  extraValues:
    odoo:
      module: contacts
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
