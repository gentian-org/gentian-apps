apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gentian-app.fullname" . }}
  labels:
    {{- include "gentian-app.labels" . | nindent 4 }}
  annotations:
    {{- include "gentian-app.helm.annotations" . | nindent 4 }}
rules:
  - apiGroups: ["gentianos.io"]
    resources: ["tenants"]
    verbs: ["get", "patch"]
  - apiGroups: ["gentianos.io"]
    resources: ["appcatalogues", "appprofiles"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gentian-app.fullname" . }}
  labels:
    {{- include "gentian-app.labels" . | nindent 4 }}
  annotations:
    {{- include "gentian-app.helm.annotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gentian-app.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-app.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gentian-app.fullname" . }}
rules:
  - apiGroups: ["gentianos.io"]
    resources: ["apps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gentian-app.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gentian-app.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-app.fullname" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gentian-app.fullname" . }}-kernel-purge
  namespace: {{ .Values.gentian.kernelNamespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["create", "get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["databases"]
    verbs: ["delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gentian-app.fullname" . }}-kernel-purge
  namespace: {{ .Values.gentian.kernelNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gentian-app.fullname" . }}-kernel-purge
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-app.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gentian-app.fullname" . }}-openbao-purge
  namespace: openbao
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gentian-app.fullname" . }}-openbao-purge
  namespace: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gentian-app.fullname" . }}-openbao-purge
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-app.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gentian-app.fullname" . }}-operator-token
  namespace: gentian-system
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["gentian-os"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gentian-app.fullname" . }}-operator-token
  namespace: gentian-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gentian-app.fullname" . }}-operator-token
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-app.fullname" . }}
    namespace: {{ .Release.Namespace }}
