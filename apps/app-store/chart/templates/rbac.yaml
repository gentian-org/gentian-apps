apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gentian-app.fullname" . }}
  labels:
    {{- include "gentian-app.labels" . | nindent 4 }}
  annotations:
    {{- include "gentian-app.helm.annotations" . | nindent 4 }}
rules:
  - apiGroups: ["gentianos.io"]
    # apppackages back the bundle presets in the addon window; tenants are read-only.
    resources: ["appcatalogues", "appprofiles", "apppackages", "tenants", "xapps"]
    verbs: ["get", "list", "watch"]
  # Composed resources are read to explain *why* an install is not ready yet — a
  # claim only ever says "waiting for composite resource to become Ready".
  - apiGroups: ["helm.crossplane.io", "kubernetes.crossplane.io", "kv.vault.upbound.io", "keycloak.crossplane.io"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gentian-app.fullname" . }}
  labels:
    {{- include "gentian-app.labels" . | nindent 4 }}
  annotations:
    {{- include "gentian-app.helm.annotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gentian-app.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-app.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gentian-app.fullname" . }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Pods are read to tell a stalled install from a broken one. A claim that is
  # not Ready looks identical either way; the workload's own pods are the only
  # place the actual reason (CrashLoopBackOff, ImagePullBackOff, Unschedulable)
  # exists. Namespaced on purpose — the store only ever explains its own tenant.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # The quota is the ceiling every install is admitted against, and the store
  # header shows what is left of it before an admin adds another app. Read-only
  # and namespaced: the store reports its own tenant's headroom, nothing else.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gentian-app.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gentian-app.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-app.fullname" . }}
