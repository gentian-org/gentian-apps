apiVersion: v1
kind: Service
metadata:
  name: {{ include "gentian-app.fullname" . }}-api
  labels:
    {{- include "gentian-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: {{ include "gentian-app.name" . }}-api
  ports:
    - port: 8000
      targetPort: http
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gentian-app.fullname" . }}-web
  labels:
    {{- include "gentian-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: {{ include "gentian-app.name" . }}-web
  ports:
    - port: {{ .Values.web.port }}
      targetPort: http
      name: http
