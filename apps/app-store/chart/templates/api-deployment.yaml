apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gentian-app.fullname" . }}-api
  labels:
    {{- include "gentian-app.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gentian-app.name" . }}-api
  template:
    metadata:
      labels:
        {{- include "gentian-app.api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gentian-app.fullname" . }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: TENANT_ID
              value: {{ .Values.tenantId | quote }}
            - name: TENANT_NAMESPACE
              value: {{ .Values.tenantNamespace | quote }}
            - name: INSTALL_MODE
              value: {{ .Values.installMode | quote }}
            - name: GENTIAN_LIFECYCLE_URL
              value: {{ .Values.gentian.lifecycleUrl | quote }}
            - name: GENTIAN_LIFECYCLE_BACKEND
              value: {{ .Values.gentian.lifecycleBackend | quote }}
            - name: GENTIAN_APPS_REPO
              value: {{ .Values.gentian.appsRepo | quote }}
            - name: GENTIAN_APPS_BRANCH
              value: {{ .Values.gentian.appsBranch | quote }}
            - name: GENTIAN_DEPLOYMENTS_REPO
              value: {{ .Values.gentian.deploymentsRepo | quote }}
            - name: GENTIAN_DEPLOYMENTS_PATH
              value: {{ .Values.gentian.deploymentsPath | quote }}
            - name: AUTH_DISABLED
              value: {{ ternary "true" "false" .Values.auth.disabled | quote }}
            {{- with .Values.oidc }}
            {{- if .issuer }}
            - name: OIDC_ISSUER
              value: {{ .issuer | quote }}
            {{- end }}
            {{- if .clientId }}
            - name: OIDC_CLIENT_ID
              value: {{ .clientId | quote }}
            {{- end }}
            {{- if .clientSecret }}
            - name: OIDC_CLIENT_SECRET
              value: {{ .clientSecret | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.database }}
            {{- if and .host .user .password .name }}
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:%s@%s:%s/%s" .user .password .host (default "5432" .port) .name | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
          {{- if and .Values.gitOps.enabled (eq .Values.installMode "gitops") }}
          volumeMounts:
            - name: deployments-checkout
              mountPath: {{ .Values.gentian.deploymentsPath }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if and .Values.gitOps.enabled (eq .Values.installMode "gitops") }}
      volumes:
        - name: deployments-checkout
          emptyDir: {}
      initContainers:
        - name: git-clone-deployments
          image: alpine/git:2.45.2
          command:
            - sh
            - -c
            - |
              set -e
              for attempt in 1 2 3 4 5; do
                if [ -d {{ .Values.gentian.deploymentsPath }}/.git ]; then
                  exit 0
                fi
                if git clone "${GENTIAN_DEPLOYMENTS_REPO}" {{ .Values.gentian.deploymentsPath }}; then
                  exit 0
                fi
                echo "git clone attempt ${attempt} failed; retrying..."
                sleep 15
              done
              exit 1
          env:
            - name: GENTIAN_DEPLOYMENTS_REPO
              value: {{ .Values.gentian.deploymentsRepo | quote }}
          volumeMounts:
            - name: deployments-checkout
              mountPath: {{ .Values.gentian.deploymentsPath }}
      {{- end }}
