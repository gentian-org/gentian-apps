apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gentian-app.fullname" . }}-api
  labels:
    {{- include "gentian-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gentian-app.name" . }}-api
  template:
    metadata:
      labels:
        {{- include "gentian-app.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/name: {{ include "gentian-app.name" . }}-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "gentian-app.fullname" . }}
      securityContext:
        {{- include "gentian-app.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default "Always" }}
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            {{- include "gentian-app.containerSecurityContext" . | nindent 12 }}
            {{- with .Values.api.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: TENANT_ID
              value: {{ .Values.tenantId | quote }}
            - name: TENANT_NAMESPACE
              value: {{ .Values.tenantNamespace | quote }}
            - name: INSTALL_MODE
              value: {{ .Values.installMode | quote }}
            - name: GENTIAN_LIFECYCLE_URL
              value: {{ .Values.gentian.lifecycleUrl | quote }}
            - name: GENTIAN_APPS_REPO
              value: {{ .Values.gentian.appsRepo | quote }}
            - name: GENTIAN_APPS_BRANCH
              value: {{ .Values.gentian.appsBranch | quote }}
            - name: TENANT_DOMAIN
              value: {{ .Values.tenantDomain | quote }}
            - name: GENTIAN_COMMERCE_ENABLED
              value: {{ .Values.gentian.commerceEnabled | quote }}
            {{- if .Values.gentian.corpApiUrl }}
            - name: GENTIAN_CORP_API_URL
              value: {{ .Values.gentian.corpApiUrl | quote }}
            {{- end }}
            {{- if .Values.gentian.corpCheckoutUrl }}
            - name: GENTIAN_CORP_CHECKOUT_URL
              value: {{ .Values.gentian.corpCheckoutUrl | quote }}
            {{- end }}
            - name: GENTIAN_DEPLOYMENTS_REPO
              value: {{ .Values.gentian.deploymentsRepo | quote }}
            - name: GENTIAN_DEPLOYMENTS_PATH
              value: {{ .Values.gentian.deploymentsPath | quote }}
            - name: AUTH_DISABLED
              value: {{ ternary "true" "false" .Values.auth.disabled | quote }}
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.openfga.apiUrl }}
            - name: OPENFGA_API_URL
              value: {{ .Values.openfga.apiUrl | quote }}
            {{- end }}
            {{- if .Values.openfga.storeId }}
            - name: OPENFGA_STORE_ID
              value: {{ .Values.openfga.storeId | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret.name }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.gitOps.enabled (eq .Values.installMode "gitops") }}
            - name: deployments-checkout
              mountPath: {{ .Values.gentian.deploymentsPath }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.gitOps.enabled (eq .Values.installMode "gitops") }}
        - name: deployments-checkout
          emptyDir: {}
        {{- end }}
      {{- if and .Values.gitOps.enabled (eq .Values.installMode "gitops") }}
      initContainers:
        - name: git-clone-deployments
          image: alpine/git:2.45.2
          command:
            - sh
            - -c
            - |
              set -e
              for attempt in 1 2 3 4 5; do
                if [ -d {{ .Values.gentian.deploymentsPath }}/.git ]; then
                  exit 0
                fi
                if git clone "${GENTIAN_DEPLOYMENTS_REPO}" {{ .Values.gentian.deploymentsPath }}; then
                  exit 0
                fi
                echo "git clone attempt ${attempt} failed; retrying..."
                sleep 15
              done
              exit 1
          env:
            - name: GENTIAN_DEPLOYMENTS_REPO
              value: {{ .Values.gentian.deploymentsRepo | quote }}
          volumeMounts:
            - name: deployments-checkout
              mountPath: {{ .Values.gentian.deploymentsPath }}
      {{- end }}
