{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gentian-app.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "gentian-app.name" . }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentGatewayName }}
      namespace: {{ .Release.Namespace }}
  hostnames:
    - {{ printf "%s.%s" .Values.gateway.subDomain .Values.tenantDomain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "gentian-app.fullname" . }}-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /oauth
      backendRefs:
        - name: {{ include "gentian-app.fullname" . }}-api
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: {{ include "gentian-app.fullname" . }}-api
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /readyz
      backendRefs:
        - name: {{ include "gentian-app.fullname" . }}-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "gentian-app.fullname" . }}-web
          port: {{ .Values.web.port }}
{{- end }}
