nameOverride: app-store
tenantId: demo
tenantNamespace: tenant-demo

api:
  image:
    repository: ghcr.io/gentian-org/app-store-api
    tag: "0.1.9"
  replicaCount: 1

web:
  image:
    repository: ghcr.io/gentian-org/app-store-web
    tag: "0.1.9"
  replicaCount: 1

ingress:
  enabled: false
  className: nginx
  subDomain: store
  tlsEnabled: true

existingSecret:
  name: app-store-sensitive-values

oidc: {}
database: {}

auth:
  # Embedded in the Gentian portal iframe; portal login gates access (Tenant Admins).
  # Set to false only when exposing the store URL directly with its own OIDC flow.
  disabled: true

installMode: k8s

gentian:
  deploymentsRepo: https://github.com/gentian-org/gentian-deployments
  deploymentsPath: /data/gentian-deployments
  appsRepo: https://github.com/gentian-org/gentian-apps
  appsBranch: main
  kernelNamespace: platform-kernel

gitOps:
  enabled: false
