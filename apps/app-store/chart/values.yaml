nameOverride: app-store
tenantId: demo
tenantNamespace: tenant-demo
tenantDomain: PLACEHOLDER_TENANT_DOMAIN

api:
  image:
    repository: ghcr.io/gentian-org/app-store-api
    tag: "0.3.8"
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext: {}
  env:
    ENVIRONMENT: local

web:
  image:
    repository: ghcr.io/gentian-org/app-store-web
    tag: "0.3.8"
    pullPolicy: Always
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext: {}
  env:
    VITE_AUTH_DISABLED: "true"

gateway:
  enabled: true
  parentGatewayName: tenant-demo-gateway
  subDomain: store

existingSecret:
  name: app-store-sensitive-values

oidc: {}
database: {}

auth:
  # Embedded in the Gentian portal iframe; portal login gates access (Tenant Admins).
  disabled: true

openfga:
  apiUrl: ""
  storeId: ""

rbac:
  create: false

networkPolicy:
  create: false

podSecurity:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

installMode: gitops

gentian:
  deploymentsRepo: https://github.com/gentian-org/gentian-deployments
  deploymentsPath: /data/gentian-deployments
  appsRepo: https://github.com/gentian-org/gentian-apps
  appsBranch: main
  lifecycleUrl: http://gentian-os-lifecycle.gentian-system.svc.cluster.local:8082
  commerceEnabled: false
  corpApiUrl: ""
  corpCheckoutUrl: ""

gitOps:
  enabled: false
