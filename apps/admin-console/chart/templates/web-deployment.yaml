apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "admin-console.fullname" . }}-web
  labels:
    {{- include "admin-console.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "admin-console.name" . }}-web
  template:
    metadata:
      labels:
        {{- include "admin-console.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "admin-console.name" . }}-web
        app.kubernetes.io/component: web
    spec:
      securityContext:
        {{- include "admin-console.podSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: IfNotPresent
          {{- /* Runtime configuration. docker-entrypoint.sh renders these into
               /config.js at container start and index.html loads it before
               the bundle. They are environment and not build arguments
               because Vite freezes VITE_* into the bundle and one image
               serves every cluster; a baked-in issuer can only be right for
               the cluster that built it. Under edge the bundle needs no
               issuer of its own: the Gateway holds the session. */}}
          env:
            - name: AUTH_DISABLED
              value: {{ ternary "true" "false" .Values.auth.disabled | quote }}
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | default "pkce" | quote }}
            {{- with .Values.auth.issuer }}
            - name: OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.clientId }}
            - name: OIDC_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            - name: OIDC_SCOPES
              value: {{ .Values.auth.scopes | default "openid profile email" | quote }}
            {{- with .Values.platform.kernelDomain }}
            - name: KERNEL_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- range $key, $value := .Values.web.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.web.port }}
              name: http
          securityContext:
            {{- include "admin-console.containerSecurityContext" . | nindent 12 }}
            {{- with .Values.web.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            {{- /* The served document root. The entrypoint copies the built
                 assets here and writes config.js beside them, which it
                 cannot do in the image layer because the root filesystem is
                 read-only. The container refuses to start without this mount
                 rather than serve a bundle with no configuration. */}}
            - name: www
              mountPath: /app/www
      volumes:
        - name: www
          emptyDir: {}
