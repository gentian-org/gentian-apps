{{- if .Values.networkPolicy.create }}
{{- /* The edge is selected by the labels its namespace carries, not by its
     name: the name is the cluster's to choose, and the one written here before
     was a namespace the platform no longer has. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gentian-app.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              gentianos.io/tier: kernel
              gentianos.io/function: edge
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              gentianos.io/tier: kernel
              gentianos.io/function: edge
{{- end }}
