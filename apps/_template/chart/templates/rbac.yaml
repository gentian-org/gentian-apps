{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gentian-app.fullname" . }}
rules:
  # Replace with the minimum verbs/resources your app needs.
  - apiGroups: ["gentianos.io"]
    resources: ["appprofiles"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gentian-app.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gentian-app.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-app.fullname" . }}
{{- end }}
