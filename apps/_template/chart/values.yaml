tenantId: demo
tenantNamespace: tenant-demo
# Host suffix for HTTPRoute hostnames: {gateway.subDomain}.{tenantDomain}
tenantDomain: PLACEHOLDER_TENANT_DOMAIN

api:
  image:
    repository: ghcr.io/gentian-org/gentian-app-api
    tag: "0.1.0"
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # securityContext merged into the container (see docs/SECURITY.md)
  securityContext: {}
  env:
    ENVIRONMENT: local
    BACKEND_CORS_ORIGINS: http://localhost:5173

web:
  image:
    repository: ghcr.io/gentian-org/gentian-app-web
    tag: "0.1.0"
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext: {}
  env:
    VITE_AUTH_DISABLED: "false"

gateway:
  enabled: true
  # Tenant Gateway in the release namespace (reconciled by gentian-os)
  parentGatewayName: tenant-demo-gateway
  subDomain: app

existingSecret:
  name: gentian-app-secrets

auth:
  disabled: false

openfga:
  apiUrl: ""
  storeId: ""

# Enable when the app calls the Kubernetes or Gentian APIs (e.g. App Store)
rbac:
  create: false

# Optional supplemental NetworkPolicy (platform provides tenant isolation)
networkPolicy:
  create: false

podSecurity:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
