# The name every object derives from. Left empty it is <release>-<chart>; a
# ComponentProfile pins it in extraValues so that the Services it routes to
# have a name known before the release exists.
fullnameOverride: ""

tenantId: demo
tenantNamespace: tenant-demo
# Host suffix for HTTPRoute hostnames: {gateway.subDomain}.{tenantDomain}
tenantDomain: PLACEHOLDER_TENANT_DOMAIN

api:
  image:
    repository: ghcr.io/gentian-org/gentian-app-api
    tag: "0.1.0"
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # securityContext merged into the container (see docs/SECURITY.md)
  securityContext: {}
  env:
    ENVIRONMENT: local
    BACKEND_CORS_ORIGINS: http://localhost:5173

web:
  image:
    repository: ghcr.io/gentian-org/gentian-app-web
    tag: "0.1.0"
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext: {}
  env:
    VITE_AUTH_DISABLED: "false"

gateway:
  # Off under a ComponentProfile. The component reconciler writes one HTTPRoute
  # and one SecurityPolicy per gateway entry in the profile's spec.expose, on
  # the zone's Gateway, behind the zone's session; a route this chart wrote
  # beside them would be a second, unguarded way in. Turn it on only for a
  # deployment nothing reconciles, such as a developer's own cluster.
  enabled: false
  parentGatewayName: tenant-demo-gateway
  subDomain: app

existingSecret:
  # Pattern A: credentials arrive in a Secret the platform writes, never as
  # chart values. Under a ComponentProfile with a database requirement the
  # operator names this Secret through valueMapping.database.hostKey.
  name: gentian-app-secrets

auth:
  # Local development only; the backend refuses to start with this true in
  # production.
  disabled: false
  # pkce: the bundle runs the code flow as a public client and keeps the
  # token. edge: the platform's Gateway holds the session with the zone's
  # confidential client and forwards the zone's token to the API on routes
  # whose exposure says forwardToken; the bundle runs no code flow, holds no
  # token and no client secret, and what the caller may do is the director's
  # answer. A component behind the platform's edge runs this way, and the
  # operator sets everything below from the profile's platform mapping.
  mode: pkce
  # The issuer the forwarded token is verified against: the zone's realm on
  # the identity provider.
  issuer: ""
  # The client whose tokens the API accepts: the bundle's own under pkce, the
  # zone's under edge.
  clientId: ""
  # The audience the forwarded token must carry under edge: the director's,
  # because that is who the zone's token is minted for. Requiring it is what
  # stops a token the realm signed for some other purpose from being taken for
  # the zone's session.
  audience: ""
  # Scopes the bundle requests under pkce. Only scopes the realm defines.
  scopes: openid profile email

# Facts of the cluster this component runs in. None is chosen here: the
# operator fills each from the profile's valueMapping.platform, and a component
# deployed outside the platform leaves them empty.
platform:
  # The tenant the component runs in. Also the default for tenantId above.
  tenant: ""
  kernelDomain: ""
  # The name of the zone's realm.
  realm: ""
  # "kernel" for the platform's own zone, "tenant" for a customer's. A component
  # whose behaviour differs between the two decides from this.
  zoneKind: ""

# Where the director answers, for a platform-trust component that relays the
# forwarded token to it. An app that does not talk to the director leaves both
# empty; naming director.url in the profile's mapping is also what opens the
# component's egress to the control namespace.
director:
  url: ""
  cluster: ""

openfga:
  apiUrl: ""
  storeId: ""

# Enable when the app calls the Kubernetes or Gentian APIs (e.g. App Store)
rbac:
  create: false

# Optional supplemental NetworkPolicy (platform provides tenant isolation)
networkPolicy:
  create: false

podSecurity:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

# Customization ladder rung L1 (see docs/app-customization.md and
# customization/dropins/README.md). Off by default so a fresh scaffold has no
# extra volumes until the app actually declares a drop-in directory.
dropIns:
  enabled: false
  mountPath: /etc/gentian/app/conf.d
  configMaps: []

# Customization ladder rung L3. Plugins are baked into the image (see
# customization/extensions/); this only sets the entry-point group the loader
# discovers under.
extensions:
  appId: gentian-app
