[project]
name = "gentian-example-plugin"
version = "0.1.0"
description = "Reference plugin for a Gentian app (customization ladder L3)"
requires-python = ">=3.12,<4.0"
dependencies = ["fastapi>=0.115.0"]

# This is what makes the plugin discoverable. The app id in the group name means a
# plugin written for one Gentian app is never loaded by another.
[project.entry-points."gentian.app.gentian-app.plugins"]
example = "gentian_example_plugin:ExamplePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gentian_example_plugin"]
